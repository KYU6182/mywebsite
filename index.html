                </nav>
              </div>
            </div>
          </header>

          <main className="pt-16 md:pt-24 min-h-[80vh]">
            {activeTab === 'adminDashboard' && userRole === 'admin' ? (
              <AdminDashboard idolsData={idolsData} showToast={showToast} />
            ) : activeTab === 'producerMyPage' && userRole !== 'admin' && user && !user.isAnonymous ? (
              <ProducerMyPage user={user} userData={userData} idolsData={idolsData} producersData={producersData} onUpdateProfile={handleUpdateProfile} showToast={showToast} onIdolSelect={openIdolDetail} onNavigate={scrollToSection} />
            ) : activeTab === 'idolMyPage' && userRole !== 'admin' && user && !user.isAnonymous ? (
              <IdolMyPage idolData={idolsData.find(i => String(i.id) === String(userData.idolId))} onUpdateProfile={handleUpdateIdolProfile} showToast={showToast} onPostTimeline={handlePostTimeline} />
            ) : activeTab === 'idolDetail' && selectedIdol ? (
              <IdolDetailView idol={selectedIdol} onBack={handleBackToHome} onVoteClick={() => setShowVoteModal(true)} onOutfitClick={() => setShowOutfitModal(true)} onGiftClick={() => setShowGiftModal(true)} idolsData={idolsData} onIdolSelect={openIdolDetail} onNavigate={scrollToSection} producersData={producersData} postsData={postsData} commentsData={commentsData} onPostComment={(text) => handlePostComment(selectedIdol.id, text)} onLikePost={handleLikePost} onDirectGift={(itemId, votes, actionType) => handleDirectGift(selectedIdol, itemId, votes, actionType)} user={user} />
            ) : activeTab === 'eventDetail' && selectedEvent ? (
              <EventDetailView event={selectedEvent} onBack={handleBackToHome} idolsData={idolsData} onIdolSelect={openIdolDetail} onQuickVote={handleQuickVote} />
            ) : activeTab === 'producerDetail' && selectedProducer ? (
              <ProducerDetailView producer={selectedProducer} onBack={handleBackToHome} />
            ) : activeTab === 'articleDetail' && selectedArticle ? (
              <ArticleDetailView article={selectedArticle} onBack={handleBackToHome} />
            ) : activeTab === 'idolLP' ? (
              <IdolRecruitLP onBack={handleBackToHome} />
            ) : activeTab === 'allIdolsList' ? (
              <AllIdolsView onBack={handleBackToHome} onIdolSelect={openIdolDetail} idols={filteredIdols} idolSearchText={idolSearchText} setIdolSearchText={setIdolSearchText} idolFilterType={idolFilterType} setIdolFilterType={setIdolFilterType} />
            ) : activeTab === 'legal' ? (
              <LegalView type={legalType} onBack={handleBackToHome} onChangeType={setLegalType} />
            ) : (
              <div className="animate-fade-in">
                
                {/* HERO SECTION */}
                <section id="home" className="pt-8 pb-4 max-w-7xl mx-auto px-4 text-center relative">
                  <div className="relative z-10 flex flex-col md:flex-row items-center justify-center gap-6">
                    <div className="text-left flex-1 pl-2 md:pl-12">
                        <p className="text-slate-600 font-serif mb-2 leading-relaxed text-sm md:text-base">あなたの「<span className="text-pink-500 font-bold">好き</span>」が、<br/>誰かの「<span className="text-pink-500 font-bold">推し</span>」になる。</p>
                        <h2 className="text-2xl md:text-4xl font-serif text-slate-800 mb-6 leading-normal tracking-wide">
                          <span className="text-pink-500 font-bold">アイドルデビュー</span>の<br/>第一歩を踏み出そう🤍
                        </h2>
                        
                        <div className="relative inline-block w-full max-w-sm mt-4">
                          {(!user || user.isAnonymous) ? (
                            <>
                              <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-white text-pink-500 text-[10px] md:text-xs font-bold px-4 py-1 rounded-full shadow-sm border border-pink-100 whitespace-nowrap z-10">
                                無料登録で毎日<span className="text-lg mx-1">3</span>票GET！
                              </div>
                              <button onClick={() => setShowAuthModal(true)} className="w-full bg-gradient-to-r from-pink-400 to-pink-500 text-white rounded-full py-4 text-sm md:text-base font-bold shadow-[0_5px_15px_rgba(236,72,153,0.3)] hover:scale-105 transition-transform flex justify-center items-center gap-2">
                                プロデューサー登録 <i className="fa-solid fa-chevron-right text-xs"></i>
                              </button>
                              <p className="text-[9px] text-slate-400 mt-2 text-center font-medium">※登録は無料です。1分で完了します。</p>
                            </>
                          ) : (
                            <div className="bg-white/80 backdrop-blur-sm border border-pink-100 rounded-3xl p-6 shadow-sm text-center">
                              <p className="text-xs text-slate-600 font-bold mb-3">プロデュースありがとうございます！</p>
                              <p className="text-[10px] text-slate-500 mb-4">本日の無料投票券を使って応援しよう🤍</p>
                              <button onClick={() => { setActiveTab('producerMyPage'); window.scrollTo(0,0); }} className="bg-pink-50 text-pink-500 border border-pink-200 hover:bg-pink-100 px-8 py-3 rounded-full text-xs font-bold transition-colors">
                                マイページへ <i className="fa-solid fa-arrow-right-long ml-1"></i>
                              </button>
                            </div>
                          )}
                          <div className="absolute -top-12 -right-4 w-16 h-16 bg-gradient-to-br from-pink-300 to-pink-400 rounded-full flex flex-col items-center justify-center text-white shadow-md transform rotate-12 pointer-events-none">
                             <span className="text-[8px] font-bold">全員必ず</span>
                             <span className="text-lg font-bold leading-none">1P</span>
                             <span className="text-[8px] font-bold">掲載!!</span>
                          </div>
                        </div>
                    </div>
                    <div className="flex-1 w-full relative mt-6 md:mt-0 px-4">
                        <img src="./top.png" className="w-full max-w-sm mx-auto object-contain drop-shadow-xl rounded-3xl" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                        <div style={{display: 'none'}} className="w-full max-w-sm aspect-[4/3] mx-auto bg-pink-100 rounded-[3rem] border border-pink-200 flex items-center justify-center text-pink-400 shadow-inner">
                          <i className="fa-solid fa-image text-4xl opacity-50"></i>
                        </div>
                    </div>
                  </div>
                </section>

                {/* ICON MENU */}
                <div className="max-w-4xl mx-auto px-4 py-6">
                  <div className="bg-white rounded-full shadow-sm border border-pink-50 py-3 px-4 flex justify-between items-center overflow-x-auto hide-scrollbar gap-4">
                    {[
                      {icon: 'fa-crown', label: 'ランキング', id: 'ranking'},
                      {icon: 'fa-heart', label: '推しを探す', id: 'idol-list'},
                      {icon: 'fa-gift', label: 'イベント', id: 'event'},
                      {icon: 'fa-book-open', label: 'マガジン', id: 'moshi-ai-magazine'},
                      {icon: 'fa-medal', label: 'トップP', id: 'producer-ranking'}
                    ].map((item, i) => (
                      <button key={i} onClick={() => scrollToSection(item.id)} className="flex flex-col items-center gap-1.5 min-w-[60px] group shrink-0">
                        <div className="text-pink-400 text-xl group-hover:scale-110 transition-transform bg-pink-50 w-10 h-10 rounded-full flex items-center justify-center"><i className={`fa-solid ${item.icon}`}></i></div>
                        <span className="text-[9px] text-slate-600 font-bold mt-0.5 text-center leading-tight whitespace-nowrap">{item.label}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="max-w-4xl mx-auto px-4 mb-10">
                  <div className="bg-white rounded-full shadow-sm border border-pink-50 flex items-center overflow-hidden cursor-pointer hover:bg-pink-50 transition-colors">
                    <div className="bg-gradient-to-r from-pink-400 to-pink-500 text-white text-[10px] font-bold px-4 py-3 shrink-0">お知らせ</div>
                    <div className="flex-1 px-4 text-xs text-slate-600 truncate font-medium">2026.04.25 もしアイ 新シーズン開幕！エントリー受付中✨</div>
                    <i className="fa-solid fa-chevron-right text-pink-300 pr-4 text-xs"></i>
                  </div>
                </div>

                {/* PICK UP IDOLS */}
                <section id="idol-slider" className="py-12 bg-white/60 backdrop-blur-md rounded-[3rem] mt-4 mb-16 shadow-sm border border-pink-50 max-w-7xl mx-auto">
                  <SectionTitle title="PICK UP" subtitle="注目のミューズたち" isPink={true} />
                  {idolsData.length === 0 ? (
                    <p className="text-center text-sm text-slate-500 font-medium pb-8">現在エントリー中のアイドルはいません。</p>
                  ) : (
                    <div className="flex gap-4 overflow-x-auto hide-scrollbar px-6 pb-8">
                      {idolsData.map((idol) => (
                        <div key={idol.id} onClick={() => openIdolDetail(idol)} className="w-40 md:w-48 shrink-0 relative rounded-2xl overflow-hidden group bg-white border border-pink-50 shadow-sm hover:shadow-md transition-all cursor-pointer p-2">
                          <div className="aspect-[3/4] overflow-hidden relative bg-slate-50 rounded-xl">
                            <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                            {idol.isStreaming && <div className="absolute top-2 right-2 bg-red-500 text-white text-[8px] font-bold px-2 py-1 rounded-full shadow-sm animate-pulse">LIVE</div>}
                          </div>
                          <div className="text-center mt-3 pb-2">
                            <h3 className="font-bold text-slate-700 text-sm truncate">{idol.name}</h3>
                            <p className="text-[9px] bg-pink-50 text-pink-500 px-2 py-0.5 rounded-full inline-block mt-1 font-bold">{idol.style}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                {/* EVENT DASHBOARD & RANKING */}
                <section id="event" className="py-16 max-w-5xl mx-auto px-4 mb-16">
                  <SectionTitle title="CAMPAIGNS" subtitle="開催中のイベントとランキング" isPink={true} />

                  {EVENTS_DATA.map((ev) => {
                    const currentEventTab = eventTabs[ev.id];
                    const currentRankingTab = rankingTabs[ev.id];

                    return (
                      <div key={ev.id} className="mb-20 last:mb-0">
                        <div className="relative rounded-3xl overflow-hidden border border-pink-100 bg-white p-2 shadow-sm mb-12 group cursor-pointer hover:shadow-md transition-all" onClick={() => openEventDetail(ev)}>
                          <div className="aspect-[21/9] overflow-hidden relative bg-slate-50 rounded-2xl">
                            <img src={ev.bannerImg} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105 opacity-90 mix-blend-multiply" onError={handleImgError} />
                          </div>
                        </div>

                        <div className="flex justify-center gap-4 md:gap-8 border-b border-pink-100 mb-8 px-4 overflow-x-auto hide-scrollbar">
                          {[{id: 'ranking', label: 'ランキング'}, {id: 'about', label: '詳細'}, {id: 'benefits', label: '特典'}].map(t => (
                            <button key={t.id} onClick={() => setEventTabs(prev => ({...prev, [ev.id]: t.id}))} className={`pb-3 text-xs md:text-sm font-bold transition-colors relative whitespace-nowrap ${currentEventTab === t.id ? 'text-pink-500' : 'text-slate-400 hover:text-pink-400'}`}>
                              {t.label}
                              {currentEventTab === t.id && <div className="absolute bottom-[-1px] left-0 w-full h-1 bg-pink-500 rounded-t-md"></div>}
                            </button>
                          ))}
                        </div>

                        <div className="min-h-[300px]">
                          {currentEventTab === 'ranking' && (
                            <div className="animate-fade-in">
                              <div className="flex gap-2 overflow-x-auto pb-4 hide-scrollbar justify-start md:justify-center mb-6">
                                {RANKING_TABS.map(tab => (
                                  <button key={tab.id} onClick={() => setRankingTabs(prev => ({...prev, [ev.id]: tab.id}))} className={`px-4 py-2 rounded-full text-[10px] font-bold transition-all shadow-sm shrink-0 ${currentRankingTab === tab.id ? 'bg-pink-500 text-white' : 'bg-white text-slate-500 border border-slate-200 hover:border-pink-300'}`}>{tab.label}</button>
                                ))}
                              </div>

                              {(() => {
                                let currentRankingData = ev.rankingData[currentRankingTab] || [];
                                if (currentRankingTab === 'overall') {
                                  currentRankingData = [...idolsData].sort((a, b) => (b.totalVotes || 0) - (a.totalVotes || 0)).map((idol, index) => {
                                    return { rank: index + 1, idolId: idol.id, name: idol.name, value: `${(idol.totalVotes || 0).toLocaleString()} 票` };
                                  });
                                }

                                const topThree = currentRankingData.slice(0, 3);
                                const others = currentRankingData.slice(3, 6);

                                if(currentRankingData.length === 0) return <p className="text-center text-sm text-slate-500 font-medium py-10">集計データがありません。</p>;

                                return (
                                  <div className="bg-white rounded-3xl p-6 border border-pink-50 shadow-sm">
                                    {/* TOP 3 (簡略化レイアウト) */}
                                    {topThree.length > 0 && (
                                      <div className="flex items-end justify-center gap-3 md:gap-6 mb-10 mt-6 px-2">
                                        {[1, 0, 2].map((idx) => {
                                          const item = topThree[idx];
                                          if(!item) return <div key={idx} className="w-1/3"></div>;
                                          const idolData = idolsData.find(i => String(i.id) === String(item.idolId));
                                          let sizeClass = idx === 0 ? "w-[120px] md:w-[160px] -translate-y-4" : "w-[100px] md:w-[130px]";
                                          let crownColor = idx === 0 ? "text-amber-400" : idx === 1 ? "text-slate-300" : "text-orange-400";
                                          let borderCol = idx === 0 ? "border-amber-200" : idx === 1 ? "border-slate-200" : "border-orange-200";

                                          return (
                                            <div key={idx} onClick={() => { if(idolData) openIdolDetail(idolData) }} className={`flex flex-col items-center cursor-pointer group ${sizeClass} relative`}>
                                              <div className={`absolute -top-6 ${crownColor} text-3xl md:text-4xl drop-shadow-sm z-10`}><i className="fa-solid fa-crown"></i><span className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[10px] md:text-xs text-white font-bold mt-1.5">{idx+1}</span></div>
                                              <div className={`w-full aspect-[4/5] bg-white p-1.5 md:p-2 rounded-2xl shadow-sm border-2 ${borderCol} transition-transform group-hover:-translate-y-1 relative z-0`}>
                                                <div className="w-full h-full rounded-xl overflow-hidden bg-slate-50">
                                                  {idolData && <MediaDisplay src={idolData.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover" />}
                                                </div>
                                              </div>
                                              <div className="text-center mt-3 w-full">
                                                <h4 className="font-bold text-slate-700 text-xs md:text-sm truncate">{item.name}</h4>
                                                <p className="text-[10px] md:text-xs font-bold text-pink-500 mt-1 font-timer">{item.value}</p>
                                                {currentRankingTab !== 'producers' && (
                                                  <button onClick={(e) => { e.stopPropagation(); if(idolData) handleQuickVote(e, idolData); }} className="mt-2 bg-pink-50 text-pink-500 hover:bg-pink-500 hover:text-white px-3 py-1.5 rounded-full text-[8px] md:text-[9px] font-bold transition-colors w-full shadow-sm">
                                                    投票する
                                                  </button>
                                                )}
                                              </div>
                                            </div>
                                          );
                                        })}
                                      </div>
                                    )}

                                    {/* OTHERS */}
                                    {others.length > 0 && (
                                      <div className="space-y-3">
                                        {others.map((item, i) => {
                                          const idolData = idolsData.find(idl => String(idl.id) === String(item.idolId));
                                          return (
                                            <div key={item.rank} onClick={() => { if(idolData) openIdolDetail(idolData) }} className="flex items-center p-3 border border-pink-50 bg-slate-50/50 rounded-2xl cursor-pointer hover:bg-white hover:border-pink-200 transition-all">
                                              <div className="w-8 font-bold text-sm text-slate-400 text-center">{item.rank}</div>
                                              <div className="w-10 h-10 rounded-full overflow-hidden border border-white shadow-sm mx-3 shrink-0">
                                                <MediaDisplay src={idolData?.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover" />
                                              </div>
                                              <div className="flex-1 min-w-0">
                                                <h4 className="font-bold text-slate-700 text-xs truncate">{item.name}</h4>
                                                <p className="font-timer font-bold text-[10px] text-pink-400">{item.value}</p>
                                              </div>
                                              {currentRankingTab !== 'producers' && (
                                                <button onClick={(e) => { e.stopPropagation(); if(idolData) handleQuickVote(e, idolData); }} className="ml-2 w-8 h-8 rounded-full bg-white border border-pink-100 text-pink-400 flex items-center justify-center hover:bg-pink-500 hover:text-white transition-colors shadow-sm shrink-0">
                                                  <i className="fa-solid fa-heart text-[10px]"></i>
                                                </button>
                                              )}
                                            </div>
                                          );
                                        })}
                                      </div>
                                    )}

                                    <div className="text-center mt-6">
                                      <button onClick={() => openEventDetail(ev)} className="text-xs font-bold text-pink-500 underline underline-offset-4 hover:text-pink-600">
                                        すべてのランキングを見る
                                      </button>
                                    </div>
                                  </div>
                                );
                              })()}
                            </div>
                          )}
                          
                          {/* DETAILS & BENEFITS TAB */}
                          {currentEventTab === 'about' && (
                            <div className="bg-white rounded-3xl p-6 md:p-8 border border-pink-50 shadow-sm animate-fade-in text-center">
                              <h3 className="text-lg md:text-xl font-bold text-slate-800 mb-6">{ev.aboutTitle}</h3>
                              <img src={ev.aboutImages[0]} className="w-full max-w-md mx-auto rounded-2xl mb-6 shadow-sm border border-slate-100" onError={handleImgError} />
                              <p className="text-sm text-slate-600 leading-loose font-medium whitespace-pre-wrap mb-8 text-left">{ev.aboutText}</p>
                              <button onClick={() => openEventDetail(ev)} className="bg-pink-50 text-pink-500 border border-pink-200 px-6 py-2.5 rounded-full text-xs font-bold hover:bg-pink-100 transition-colors">詳しく見る</button>
                            </div>
                          )}
                          {currentEventTab === 'benefits' && (
                            <div className="bg-white rounded-3xl p-6 md:p-8 border border-pink-50 shadow-sm animate-fade-in">
                              <div className="space-y-6">
                                {ev.benefits.map((benefit, idx) => (
                                  <div key={idx} className={`p-5 rounded-2xl border ${benefit.type === 'producer' ? 'bg-slate-800 border-slate-700 text-white' : 'bg-pink-50 border-pink-100'}`}>
                                    <h3 className={`text-sm font-bold mb-3 ${benefit.type === 'producer' ? 'text-pink-300' : 'text-pink-500'}`}>{benefit.title}</h3>
                                    <ul className="space-y-2">
                                      {benefit.items.map((item, i) => (
                                        <li key={i} className="flex items-start gap-2">
                                          <i className="fa-solid fa-check text-[10px] mt-1 opacity-70"></i>
                                          <p className={`text-xs leading-relaxed font-medium ${benefit.type === 'producer' ? 'text-slate-200' : 'text-slate-700'}`} dangerouslySetInnerHTML={{__html: item.replace(/\*\*(.*?)\*\*/g, '<strong class="text-pink-500">$1</strong>')}}></p>
                                        </li>
                                      ))}
                                    </ul>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </section>

                {/* IDOL LIST */}
                <section id="idol-list" className="py-16 bg-white/60 backdrop-blur-md rounded-[3rem] mb-16 border border-pink-50 max-w-6xl mx-auto">
                  <SectionTitle title="MUSES" subtitle="あなただけのミューズを見つける" isPink={true} />
                  {filteredIdols.length === 0 ? <p className="text-center text-sm text-slate-500 font-medium">現在エントリー中のアイドルはいません。</p> : (
                    <div className="px-4 md:px-8">
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-10">
                        {filteredIdols.slice(0, 8).map((idol) => (
                          <div key={idol.id} onClick={() => openIdolDetail(idol)} className="group cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-pink-50 hover:shadow-md transition-all">
                            <div className="aspect-[3/4] relative overflow-hidden rounded-xl mb-3 bg-pink-50">
                              <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                              {idol.isStreaming && <div className="absolute top-2 right-2 bg-red-500 text-white text-[8px] font-bold px-2 py-1 rounded-full shadow-sm animate-pulse">LIVE</div>}
                            </div>
                            <div className="text-center px-1 pb-1">
                              <h4 className="font-bold text-slate-700 text-sm group-hover:text-pink-500 transition-colors truncate">{idol.name}</h4>
                              <p className="text-[9px] bg-pink-50 text-pink-500 px-2 py-0.5 rounded-full inline-block mt-1 font-bold">{idol.style}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                      <div className="text-center">
                        <button onClick={() => { scrollPosRef.current = window.scrollY; setActiveTab('allIdolsList'); window.scrollTo(0,0); }} className="bg-white border border-pink-200 text-pink-500 px-10 py-3 rounded-full text-xs font-bold hover:bg-pink-50 transition-colors shadow-sm">
                          すべて見る <i className="fa-solid fa-chevron-right ml-1"></i>
                        </button>
                      </div>
                    </div>
                  )}
                </section>

                {/* LIVE TIMELINE */}
                <LiveTimelineSection posts={postsData} idols={idolsData} user={user} comments={commentsData} onLike={handleLikePost} onComment={handlePostTimelineComment} onLogin={() => setShowAuthModal(true)} producersData={producersData} userRole={userRole} />

                {/* PRODUCER RANKING */}
                <section id="producer-ranking" className="py-16 max-w-5xl mx-auto px-4 mb-16">
                  <SectionTitle title="TOP PATRONS" subtitle="彼女たちを支えるトッププロデューサー" isPink={true} />
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {topProducersList.map((producer, index) => {
                      let oshiName = "未設定";
                      if (producer.votes) {
                        const topOshiId = Object.keys(producer.votes).sort((a,b) => producer.votes[b] - producer.votes[a])[0];
                        const oshiIdol = idolsData.find(i => String(i.id) === topOshiId);
                        if (oshiIdol) oshiName = oshiIdol.name;
                      }
                      const titles = ["👑 筆頭プロデューサー", "✨ 敏腕プロデューサー", "🌟 敏腕プロデューサー"];

                      return (
                        <div key={producer.id} onClick={() => openProducerDetail(producer)} className="bg-white p-6 rounded-3xl border border-pink-50 shadow-sm cursor-pointer group hover:shadow-md transition-shadow text-center relative overflow-hidden">
                          <div className={`absolute top-0 left-0 w-full h-2 bg-gradient-to-r ${index===0?'from-amber-200 to-amber-400':index===1?'from-slate-200 to-slate-400':'from-orange-200 to-orange-400'}`}></div>
                          <div className="text-[10px] text-slate-400 font-bold mb-4 uppercase">Rank 0{index + 1}</div>
                          <div className={`w-16 h-16 rounded-full mb-4 mx-auto flex items-center justify-center bg-gradient-to-tr ${producer.iconColor || 'from-pink-100 to-pink-200'} shadow-inner overflow-hidden border-2 border-white`}>
                            {producer.profileImage ? <img src={producer.profileImage} className="w-full h-full object-cover"/> : <i className="fa-solid fa-user-tie text-xl text-white"></i>}
                          </div>
                          <div className="text-pink-500 text-[9px] font-bold mb-2">{titles[index] || "プロデューサー"}</div>
                          <h4 className="font-bold text-slate-800 text-base mb-1 truncate px-2">{producer.name}</h4>
                          <p className="text-[10px] text-slate-500 font-medium mb-4">推し: <span className="font-bold text-slate-700">{oshiName}</span></p>
                          <div className="bg-slate-50 rounded-xl py-2">
                            <p className="text-[9px] text-slate-400 font-bold mb-0.5">累計投票数</p>
                            <p className="text-lg font-timer font-bold text-pink-500">{(producer.totalVotes || 0).toLocaleString()}</p>
                          </div>
                        </div>
                      );
                    })}
                    {topProducersList.length === 0 && <p className="col-span-3 text-center text-sm text-slate-400 font-medium py-10">データがありません。</p>}
                  </div>
                </section>

                {/* MAGAZINE ARCHIVE */}
                <section id="magazine" className="py-16 relative overflow-hidden max-w-6xl mx-auto px-4 mb-16">
                  <SectionTitle title="ARCHIVE" subtitle="過去の誌面コレクション" isPink={true} />
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-6 md:gap-10 relative z-10">
                    {MAGAZINES.map((mag) => (
                      <div key={mag.id} className="flex flex-col items-center group cursor-pointer">
                        <div className="w-full aspect-[3/4] bg-white border border-pink-50 p-2 md:p-3 rounded-2xl shadow-sm transition-all duration-300 group-hover:-translate-y-2 group-hover:shadow-md relative">
                          <div className="w-full h-full rounded-xl overflow-hidden bg-slate-50 border border-slate-100">
                            <img src={`./mag${mag.id}.png`} alt={mag.title} className="w-full h-full object-cover" onError={handleImgError} />
                          </div>
                          <div className="absolute -left-2 top-4 bg-pink-500 text-white text-[9px] font-bold tracking-widest py-1 px-3 rounded-full shadow-sm shadow-pink-200">Vol.{mag.id}</div>
                        </div>
                        <div className="text-center mt-4">
                          <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full ${mag.status === '発売中' ? 'bg-slate-100 text-slate-500' : 'bg-pink-100 text-pink-500'}`}>{mag.status}</span>
                          <h4 className="font-bold text-xs md:text-sm text-slate-800 mt-2 line-clamp-2">{mag.title}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                <OffMeltyCatalogSection catalog={OFF_MELTY_CATALOG} idols={idolsData} />
                <MoshiAiMagazineSection articles={WEB_MAGAZINE_ARTICLES} categories={MAG_CATEGORIES} onArticleSelect={openArticleDetail} />
              </div>
            )}
          </main>

          <footer className="mt-16 pt-16 pb-24 md:pb-8 bg-white border-t border-pink-100 relative">
            <div className="max-w-6xl mx-auto px-6 flex flex-col items-center text-center">
              <div className="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12 mb-12">
                <img src="./logo.png" className="h-12 md:h-16 object-contain" alt="もしアイ" onError={(e)=>e.target.style.display='none'} />
                <div className="h-px w-16 md:w-px md:h-10 bg-pink-100"></div>
                <img src="./off_melty_logo.png" className="h-6 md:h-8 object-contain opacity-70" alt="Off-Melty" onError={handleImgError} />
              </div>
              
              <div className="flex gap-6 mb-10">
                 <a href="#" className="w-10 h-10 bg-pink-50 rounded-full flex items-center justify-center text-pink-400 hover:bg-pink-500 hover:text-white transition-colors"><i className="fa-brands fa-instagram text-lg"></i></a>
                 <a href="#" className="w-10 h-10 bg-pink-50 rounded-full flex items-center justify-center text-pink-400 hover:bg-pink-500 hover:text-white transition-colors"><i className="fa-brands fa-x-twitter text-lg"></i></a>
                 <a href="#" className="w-10 h-10 bg-pink-50 rounded-full flex items-center justify-center text-pink-400 hover:bg-[#06C755] hover:text-white transition-colors"><i className="fa-brands fa-line text-lg"></i></a>
              </div>

              <div className="flex flex-wrap justify-center gap-4 text-[10px] font-bold text-slate-500 mb-8">
                <button onClick={() => openLegal('terms')} className="hover:text-pink-500">利用規約</button>
                <button onClick={() => openLegal('privacy')} className="hover:text-pink-500">プライバシーポリシー</button>
                <button onClick={() => openLegal('law')} className="hover:text-pink-500">特定商取引法</button>
                <button onClick={() => openLegal('fund')} className="hover:text-pink-500">資金決済法</button>
              </div>

              <p className="text-[9px] text-slate-400 font-bold tracking-widest mb-4">&copy; 2026 Moshi-Ai Project.</p>
              <button onClick={() => setShowAdminModal(true)} className="text-[8px] text-slate-300 hover:text-slate-500">Admin Login</button>
            </div>
          </footer>

          {/* モバイル用ボトムナビゲーション */}
          {(activeTab === 'home' || activeTab === 'allIdolsList') && (
            <nav className="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-pink-100 flex justify-around items-center pt-2 pb-safe z-[300] md:hidden shadow-[0_-5px_20px_rgba(244,114,182,0.1)] rounded-t-[2rem]">
              <button onClick={() => { setActiveTab('home'); window.scrollTo(0,0); }} className="flex flex-col items-center text-pink-500 w-16 pt-1"><i className="fa-solid fa-house text-xl"></i><span className="text-[8px] mt-1 font-bold">ホーム</span></button>
              <button onClick={() => scrollToSection('ranking')} className="flex flex-col items-center text-slate-400 hover:text-pink-400 w-16 pt-1 transition-colors"><i className="fa-solid fa-crown text-xl"></i><span className="text-[8px] mt-1 font-bold">ランキング</span></button>
              <div className="relative w-16 flex justify-center -mt-6">
                <button onClick={() => { if(!user || user.isAnonymous) setShowAuthModal(true); else scrollToSection('idol-list'); }} className="absolute bottom-1 flex flex-col items-center text-white bg-gradient-to-r from-pink-400 to-pink-500 w-14 h-14 rounded-full shadow-lg shadow-pink-200 flex justify-center hover:scale-105 transition-transform border-[3px] border-white">
                  <i className="fa-solid fa-heart text-2xl mt-0.5"></i>
                </button>
              </div>
              <button onClick={() => scrollToSection('live-timeline')} className="flex flex-col items-center text-slate-400 hover:text-pink-400 w-16 pt-1 transition-colors"><i className="fa-regular fa-clock text-xl"></i><span className="text-[8px] mt-1 font-bold">タイムライン</span></button>
              <button onClick={() => { if(!user || user.isAnonymous) setShowAuthModal(true); else { setActiveTab(userRole==='idol'?'idolMyPage':userRole==='admin'?'adminDashboard':'producerMyPage'); window.scrollTo(0,0); } }} className="flex flex-col items-center text-slate-400 hover:text-pink-400 w-16 pt-1 transition-colors"><i className="fa-regular fa-user text-xl"></i><span className="text-[8px] mt-1 font-bold">マイページ</span></button>
            </nav>
          )}

          {/* PC用 フローティングエントリーボタン */}
          {(activeTab === 'home' || activeTab === 'allIdolsList') && (
            <div className="fixed bottom-8 right-8 z-[100] hidden md:block animate-fade-in-up">
              <a href="https://moshiailp.pages.dev/" target="_blank" rel="noopener noreferrer" className="block hover:-translate-y-2 transition-transform duration-300 drop-shadow-[0_10px_20px_rgba(244,114,182,0.3)] w-48">
                <img src="./line_btn.png" alt="LINEで無料エントリー！" className="w-full h-auto object-contain" onError={(e) => e.target.style.display='none'} />
              </a>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
