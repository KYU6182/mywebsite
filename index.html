      const [copySuccess, setCopySuccess] = useState(false);
      
      const relatedArticles = useMemo(() => {
        return TOPICS_DATA.filter(topic => topic.title.includes(idol.name));
      }, [idol.name]);

      const handleCopyTemplate = () => {
        const templateText = `私がプロデュースしている【${idol.name}】ちゃん！\n"${idol.catchphrase}"\n\n『もしも私が、アイドルになったら。』\nみんなもプロデューサーになって一緒に応援してね✨\n\n#もしアイ #アイドルオーディション #${idol.name}\nhttps://moshi-ai.example.com`;
        const textArea = document.createElement("textarea");
        textArea.value = templateText;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 2500);
        } catch (err) { console.error('コピーに失敗しました', err); }
        document.body.removeChild(textArea);
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-6 animate-fade-in-up pb-32">
          <button onClick={onBack} className="mb-6 text-pink-500 font-bold flex items-center gap-2 hover:bg-pink-50 px-4 py-2 rounded-full transition-colors bg-white/80 backdrop-blur-sm shadow-sm border border-pink-100">
            <i className="fa-solid fa-arrow-left"></i> 前の画面に戻る
          </button>
          
          <div className="bg-white/90 backdrop-blur-md rounded-[2.5rem] p-3 shadow-xl border border-pink-100 mb-8 relative text-center">
            <div className="relative rounded-[2rem] overflow-hidden border-8 border-pink-50 bg-gray-100 aspect-[3/4] sm:aspect-[4/5] mx-auto">
              {idol.titleBadge && (
                <div className="absolute top-3 right-3 bg-gradient-to-br from-yellow-300 to-amber-500 text-white text-[11px] md:text-xs font-bold px-3 py-1.5 rounded-full shadow-lg transform rotate-6 border-2 border-white z-20 flex items-center gap-1">
                  <i className="fa-solid fa-crown text-[10px]"></i> {idol.titleBadge}
                </div>
              )}
              {idol.videoUrl ? (
                <video src={idol.videoUrl} className="w-full h-full object-cover" autoPlay muted loop playsInline></video>
              ) : (
                <img src={`./idol${idol.id}.png`} className="w-full h-full object-cover" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='flex'; }} />
              )}
              <div style={{display: 'none'}} className="w-full h-full flex items-center justify-center bg-pink-100 text-pink-300"><i className="fa-solid fa-camera text-4xl"></i></div>
              <div className="absolute top-4 left-4 flex flex-col gap-1.5 z-10 text-left">
                <span className="bg-black/60 backdrop-blur-sm text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">{idol.type}</span>
              </div>
            </div>
            <div className="flex justify-around items-center mt-6 mb-2">
              <div className="text-center"><p className="text-[10px] text-gray-500 font-bold">順位</p><p className="text-xl md:text-2xl font-bold text-pink-500 font-serif">12位</p></div>
              <div className="text-center"><p className="text-[10px] text-gray-500 font-bold">ポイント</p><p className="text-xl md:text-2xl font-bold text-purple-500 font-serif">12,450pt</p></div>
              <div className="text-center"><p className="text-[10px] text-gray-500 font-bold">プロデューサー</p><p className="text-xl md:text-2xl font-bold text-blue-500 font-serif">{idol.producerCount}人</p></div>
            </div>
          </div>

          <div className="text-center mb-6 px-4">
            <h1 className="text-3xl font-bold text-gray-800 mb-2 font-serif">{idol.name}</h1>
            <p className="text-pink-600 font-bold text-sm bg-white/80 backdrop-blur-sm inline-block px-4 py-1.5 rounded-full mb-4 shadow-sm border border-pink-100">"{idol.catchphrase}"</p>
          </div>

          <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-6">
            <h3 className="text-lg font-bold text-gray-800 mb-4 border-l-4 border-pink-500 pl-3">Profile</h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="bg-pink-50/50 p-3 rounded-2xl flex flex-col items-center">
                <i className="fa-solid fa-cake-candles text-pink-400 mb-1"></i>
                <p className="text-[10px] text-gray-400 font-bold">生年月日</p>
                <p className="text-xs font-bold text-gray-700">{idol.birthday}</p>
              </div>
              <div className="bg-pink-50/50 p-3 rounded-2xl flex flex-col items-center">
                <i className="fa-solid fa-map-pin text-pink-400 mb-1"></i>
                <p className="text-[10px] text-gray-400 font-bold">出身地</p>
                <p className="text-xs font-bold text-gray-700">{idol.hometown}</p>
              </div>
              <div className="bg-pink-50/50 p-3 rounded-2xl flex flex-col items-center">
                <i className="fa-solid fa-star text-pink-400 mb-1"></i>
                <p className="text-[10px] text-gray-400 font-bold">特技</p>
                <p className="text-xs font-bold text-gray-700">{idol.specialSkill}</p>
              </div>
            </div>
          </div>

          <div className="mb-6 relative px-2">
            <button onClick={handleCopyTemplate} className="w-full bg-gradient-to-r from-purple-600 via-pink-500 to-rose-400 text-white py-3.5 rounded-2xl shadow-md flex items-center justify-center gap-3 font-bold hover:opacity-90 transition-all transform hover:-translate-y-1">
              <div className="flex gap-1.5"><i className="fa-brands fa-instagram text-xl"></i><i className="fa-brands fa-tiktok text-xl"></i></div>
              <span>拡散用テンプレートをコピー</span>
            </button>
            {copySuccess && (
              <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs font-bold px-4 py-2 rounded-lg animate-fade-in shadow-xl whitespace-nowrap z-50 flex items-center gap-2">
                <i className="fa-solid fa-check text-green-400"></i> コピーしました！
              </div>
            )}
          </div>

          <div className="grid grid-cols-3 gap-2 mb-8 px-2">
            <button className="flex-1 bg-pink-500 text-white py-3 rounded-2xl shadow-lg flex flex-col items-center hover:scale-105 active:scale-95 transition-transform"><i className="fa-solid fa-heart mb-1"></i><span className="text-[10px] font-bold">投票</span></button>
            <button className="flex-1 bg-amber-400 text-white py-3 rounded-2xl shadow-lg flex flex-col items-center hover:scale-105 active:scale-95 transition-transform"><i className="fa-solid fa-gift mb-1"></i><span className="text-[10px] font-bold">ギフト</span></button>
            <button className="flex-1 bg-blue-400 text-white py-3 rounded-2xl shadow-lg flex flex-col items-center hover:scale-105 active:scale-95 transition-transform"><i className="fa-solid fa-share-nodes mb-1"></i><span className="text-[10px] font-bold">シェア</span></button>
          </div>

          <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-8">
            <h3 className="text-lg font-bold text-gray-800 mb-3 border-l-4 border-pink-500 pl-3">私の物語</h3>
            <p className="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap bg-pink-50/30 p-4 rounded-2xl border border-pink-50">{idol.story}</p>
          </div>

          {relatedArticles.length > 0 && (
            <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-8">
              <h3 className="text-lg font-bold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">{idol.name} の関連記事</h3>
              <div className="space-y-3">
                {relatedArticles.map(topic => (
                  <div key={topic.id} className="flex gap-3 items-center p-3 hover:bg-blue-50 rounded-2xl cursor-pointer transition-colors border border-transparent hover:border-blue-100 group">
                    <div className="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-blue-500 flex-shrink-0">
                      <i className="fa-solid fa-newspaper text-xl"></i>
                    </div>
                    <div className="flex-1">
                      <p className="text-[10px] text-gray-400 font-bold mb-0.5">{topic.date} | <span className="text-blue-500">{topic.label}</span></p>
                      <h4 className="text-xs font-bold text-gray-800 group-hover:text-blue-600 transition-colors line-clamp-1">{topic.title}</h4>
                    </div>
                    <i className="fa-solid fa-chevron-right text-gray-200 group-hover:text-blue-400 text-xs"></i>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-10">
            <div className="flex justify-between items-end mb-4 border-b border-pink-100 pb-2">
              <h3 className="text-lg font-bold text-gray-800 border-l-4 border-amber-500 pl-3">プロデューサー陣</h3>
              <span className="text-xs font-bold bg-blue-50 text-blue-600 px-3 py-1 rounded-full border border-blue-200 shadow-sm">パトロン総数: {idol.producerCount} 人</span>
            </div>
            <div className="space-y-3">
              {idol.topProducers.map((p, index) => (
                <div key={index} className="flex items-center justify-between bg-gradient-to-r from-amber-50/30 to-transparent p-3 rounded-2xl border border-amber-50/50">
                  <div className="flex items-center gap-3">
                    <div className={`w-9 h-9 rounded-full flex items-center justify-center text-white shadow-sm font-bold text-sm border-2 border-white ${index === 0 ? 'bg-gradient-to-br from-yellow-300 to-yellow-500' : index === 1 ? 'bg-gradient-to-br from-gray-300 to-gray-500' : 'bg-gradient-to-br from-orange-300 to-orange-500'}`}>
                      {index === 0 ? <i className="fa-solid fa-crown text-xs"></i> : index + 1}
                    </div>
                    <div>
                      <p className="text-[9px] font-bold text-gray-500 leading-none mb-1">{index === 0 ? 'エグゼクティブ・プロデューサー' : 'トップ・プロデューサー'}</p>
                      <span className="font-bold text-gray-800 text-sm">{p.name}</span>
                    </div>
                  </div>
                  <span className="text-sm font-mono font-bold text-blue-600 bg-white px-2 py-1 rounded-lg shadow-sm border border-blue-100">{p.pt}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- プロデューサー詳細 ---
    const ProducerDetailView = ({ producer, onBack }) => (
      <div className="max-w-2xl mx-auto px-4 py-6 animate-fade-in-up">
        <button onClick={onBack} className="mb-6 text-pink-500 font-bold flex items-center gap-2 hover:bg-pink-50 px-4 py-2 rounded-full bg-white/80 shadow-sm"><i className="fa-solid fa-arrow-left"></i> 戻る</button>
        <div className="bg-white/90 rounded-3xl p-6 shadow-sm border text-center relative overflow-hidden">
          <div className="absolute top-0 left-0 w-full h-24 bg-gray-900"></div>
          <div className={`w-24 h-24 mx-auto rounded-full mb-4 shadow-inner flex items-center justify-center bg-gradient-to-br ${producer.iconColor} border-4 border-white relative z-10`}><i className="fa-solid fa-user-tie text-4xl text-white"></i></div>
          <div className="inline-block bg-yellow-50 border border-yellow-200 text-yellow-700 text-xs font-bold px-3 py-1 rounded-full mb-2">{producer.title}</div>
          <h2 className="text-2xl font-bold text-gray-800">{producer.name}</h2>
          <p className="text-gray-500 text-sm mb-4">推しメン: <span className="font-bold text-pink-500">{producer.oshi}</span></p>
          <div className="bg-gray-50/80 rounded-2xl p-4 inline-block min-w-[200px]"><p className="text-xs font-bold mb-1">累計応援ポイント</p><p className="text-2xl font-bold text-purple-500 font-serif">{producer.value}</p></div>
        </div>
      </div>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('home'); 
      const [selectedIdol, setSelectedIdol] = useState(null);
      const [selectedProducer, setSelectedProducer] = useState(null);
      const [activeEventId, setActiveEventId] = useState('main'); // 新規追加: 企画タブ
      const [eventTab, setEventTab] = useState('ranking'); 
      const [activeRankingTab, setActiveRankingTab] = useState('overall');
      const [idolSearchText, setIdolSearchText] = useState('');
      const [idolFilterType, setIdolFilterType] = useState('all'); 
      const [idolFilterPref, setIdolFilterPref] = useState('東京'); 
      const [idolFilterStyle, setIdolFilterStyle] = useState('王道キュート'); 

      const uniquePrefs = useMemo(() => [...new Set(IDOLS.map(i => i.pref))], []);
      const uniqueStyles = useMemo(() => [...new Set(IDOLS.map(i => i.style))], []);

      const filteredIdols = useMemo(() => {
        return IDOLS.filter(idol => {
          if (idolSearchText && !idol.name.includes(idolSearchText)) return false;
          if (idolFilterType === 'rookie' && !idol.isRookie) return false;
          if (idolFilterType === 'pref' && idol.pref !== idolFilterPref) return false;
          if (idolFilterType === 'style' && idol.style !== idolFilterStyle) return false;
          return true;
        });
      }, [idolSearchText, idolFilterType, idolFilterPref, idolFilterStyle]);

      const openIdolDetail = (idol) => { setSelectedIdol(idol); setActiveTab('idolDetail'); window.scrollTo(0,0); };
      const openProducerDetail = (producer) => { setSelectedProducer(producer); setActiveTab('producerDetail'); window.scrollTo(0,0); };
      const scrollToSection = (id) => { if(activeTab !== 'home') setActiveTab('home'); setTimeout(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); }, 100); };

      return (
        <div className="pb-24">
          <header className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md shadow-sm py-2">
            <div className="max-w-6xl mx-auto px-4 flex justify-between items-center">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => {setActiveTab('home'); window.scrollTo(0,0);}}>
                <img src="./logo.png" alt="もしアイ" className="h-14 md:h-20 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                <span style={{display: 'none'}} className="text-xl font-bold text-pink-500 font-serif">もしアイ</span>
              </div>
              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-gray-700">
                {['HOME', 'RANKING', 'IDOL LIST', 'MAGAZINE'].map((item) => (
                  <button key={item} onClick={() => {
                    if(item === 'MAGAZINE') scrollToSection('magazine');
                    else scrollToSection(item.toLowerCase().replace(' ', '-'));
                  }} className="hover:text-pink-500 transition-colors uppercase font-bold tracking-wider">{item}</button>
                ))}
              </nav>
            </div>
          </header>

          <main className="pt-24">
            {activeTab === 'idolDetail' && selectedIdol ? (
              <IdolDetailView idol={selectedIdol} onBack={() => setActiveTab('home')} />
            ) : activeTab === 'allIdolsList' ? (
              <AllIdolsView onBack={() => setActiveTab('home')} onIdolSelect={openIdolDetail} />
            ) : activeTab === 'producerDetail' && selectedProducer ? (
              <ProducerDetailView producer={selectedProducer} onBack={() => setActiveTab('home')} />
            ) : (
              <div className="animate-fade-in">
                
                {/* HERO SECTION */}
                <section id="home" className="py-8 md:py-12 max-w-6xl mx-auto px-4 text-center">
                  <div className="flex flex-col items-center">
                    <img src="./catchphrase.png" className="h-10 md:h-14 object-contain mb-4 drop-shadow-sm" onError={(e) => e.target.style.display='none'} />
                    <img src="./top.png" className="w-full max-w-2xl object-contain drop-shadow-md mb-10" onError={(e) => e.target.style.display='none'} />
                    <div className="w-full max-w-6xl overflow-hidden relative group">
                       <div className="flex gap-6 overflow-x-auto hide-scrollbar snap-x snap-mandatory px-4 pb-10">
                         {BANNERS.map(banner => (
                           <div key={banner.id} className="flex-shrink-0 w-[85%] md:w-[45%] snap-center">
                             <div className="relative aspect-[16/9] w-full rounded-[2rem] overflow-hidden shadow-lg border-4 border-white mb-4 transition-transform hover:scale-[1.02]">
                               <img src={banner.image} className="w-full h-full object-cover" onError={(e) => { e.target.src = 'https://via.placeholder.com/800x450/fdf2f8/db2777?text=Banner+Image'; }} />
                               <div className="absolute top-4 left-4">
                                 <span className="bg-black/50 backdrop-blur-md text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">{banner.label}</span>
                               </div>
                             </div>
                             <div className="text-left px-4">
                               <h3 className="text-lg md:text-xl font-bold text-gray-800 leading-tight mb-1">{banner.title}</h3>
                               <p className="text-xs md:text-sm text-gray-500 font-medium mb-3">{banner.subtitle}</p>
                               <button className="flex items-center gap-1.5 text-pink-500 font-bold text-xs hover:gap-3 transition-all">
                                 {banner.linkText} <i className="fa-solid fa-arrow-right-long"></i>
                               </button>
                             </div>
                           </div>
                         ))}
                       </div>
                    </div>
                  </div>
                </section>

                {/* IDOL CARD SLIDER */}
                <section id="idol-slider" className="py-8 bg-white/20 backdrop-blur-sm border-y border-white/50 mb-10">
                  <div className="max-w-6xl mx-auto">
                    <div className="flex items-center gap-2 px-6 mb-4">
                      <i className="fa-solid fa-wand-magic-sparkles text-pink-500"></i>
                      <h2 className="text-lg font-bold text-gray-800 font-serif uppercase tracking-widest">Pick Up Idols</h2>
                    </div>
                    <div className="flex gap-4 overflow-x-auto hide-scrollbar px-6 pb-4">
                      {IDOLS.map((idol, i) => (
                        <div key={idol.id} className="w-48 shrink-0 relative rounded-3xl overflow-hidden shadow-lg group bg-white border border-white">
                          {idol.titleBadge && (
                            <div className="absolute top-2 right-2 bg-gradient-to-br from-yellow-300 to-amber-500 text-white text-[8px] font-bold px-2 py-1 rounded-full shadow-lg transform rotate-6 border border-white z-20">
                              <i className="fa-solid fa-crown"></i>
                            </div>
                          )}
                          <div className="aspect-[2/3] overflow-hidden relative">
                            {idol.videoUrl ? (
                              <video src={idol.videoUrl} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" autoPlay muted loop playsInline></video>
                            ) : (
                              <img src={`./idol${idol.id}.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                            )}
                          </div>
                          <div className="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
                            <h3 className="font-bold text-base mb-1">{idol.name}</h3>
                            <p className="text-[10px] opacity-90 line-clamp-1 mb-3">"{idol.catchphrase}"</p>
                            <button onClick={() => openIdolDetail(idol)} className="w-full py-1.5 bg-pink-500 rounded-full text-[10px] font-bold flex items-center justify-center gap-1 shadow-inner">
                              <i className="fa-solid fa-heart"></i> プロデュースする
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                {/* TOPICS SECTION */}
                <section id="topics" className="py-12 max-w-6xl mx-auto px-4">
                  <div className="text-center mb-10"><h2 className="text-4xl font-serif text-gray-800 uppercase tracking-widest drop-shadow-sm">Topics</h2></div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    {TOPICS_DATA.map((topic) => (
                      <div key={topic.id} className="group cursor-pointer">
                        <div className="relative overflow-hidden rounded-2xl mb-4 shadow-sm bg-white/80 aspect-[16/10] border border-white p-1">
                          <img src={`./topic${topic.id}.png`} className="w-full h-full object-cover rounded-xl transition-transform duration-500 group-hover:scale-105" onError={(e)=>e.target.src='https://via.placeholder.com/400x250/fdf2f8/db2777?text=NEWS'} />
                        </div>
                        <div className="px-1 text-[10px] font-bold text-gray-400 mb-1">{topic.date} | <span className="text-pink-500 font-bold">{topic.label}</span></div>
                        <h3 className="font-bold text-gray-800 text-sm md:text-base leading-tight group-hover:text-pink-500 transition-colors">{topic.title}</h3>
                      </div>
                    ))}
                  </div>
                </section>

                {/* EVENT DASHBOARD - 更新版 */}
                <section id="ranking" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="EVENT DASHBOARD" subtitle="最新の戦況とイベント詳細を確認" iconClass="fa-solid fa-trophy" />
                  
                  <div className="flex flex-col md:flex-row gap-4 justify-center mb-10">
                    <button onClick={() => { setActiveEventId('main'); setEventTab('ranking'); }} className={`px-6 py-4 rounded-full font-bold shadow-md transition-all flex items-center justify-center gap-3 border-2 ${activeEventId === 'main' ? 'bg-pink-500 text-white border-pink-500 scale-105' : 'bg-white text-gray-500 border-pink-100 hover:bg-pink-50'}`}>
                      <i className="fa-solid fa-crown text-xl"></i> 表紙＆巻頭特集 争奪戦！
                    </button>
                    <button onClick={() => { setActiveEventId('off_melty'); setEventTab('ranking'); }} className={`px-6 py-4 rounded-full font-bold shadow-md transition-all flex items-center justify-center gap-3 border-2 ${activeEventId === 'off_melty' ? 'bg-purple-600 text-white border-purple-600 scale-105' : 'bg-white text-gray-500 border-purple-100 hover:bg-purple-50'}`}>
                      <i className="fa-solid fa-shirt text-xl"></i> Off-Melty アンバサダー
                    </button>
                  </div>

                  {(() => {
                    const ev = EVENTS_DATA.find(e => e.id === activeEventId);
                    const isMain = ev.id === 'main';
                    const themeBg = isMain ? 'bg-pink-500' : 'bg-purple-600';
                    const themeText = isMain ? 'text-pink-500' : 'text-purple-600';
                    const themeHover = isMain ? 'hover:text-pink-500' : 'hover:text-purple-600';

                    return (
                      <div className="bg-white/60 backdrop-blur-md rounded-[2.5rem] p-4 md:p-8 border border-white shadow-xl animate-fade-in relative overflow-hidden">
                        {/* 背景の装飾 */}
                        <div className={`absolute top-0 right-0 w-64 h-64 opacity-20 blur-[80px] pointer-events-none rounded-full ${isMain ? 'bg-pink-400' : 'bg-purple-400'}`}></div>

                        <div className="relative rounded-3xl overflow-hidden mb-8 shadow-md border-4 border-white aspect-[16/9] md:aspect-[21/9] group">
                          <img src={ev.bannerImg} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onError={(e) => { e.target.src = isMain ? 'https://via.placeholder.com/1200x500/fdf2f8/db2777?text=MAIN+EVENT' : 'https://via.placeholder.com/1200x500/f3e8ff/9333ea?text=OFF-MELTY'; }} />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent flex flex-col justify-end p-6 md:p-10 pointer-events-none">
                            <h3 className="text-white text-2xl md:text-4xl font-bold font-serif mb-2 drop-shadow-lg leading-tight">{ev.title}</h3>
                            <p className="text-white/90 text-sm md:text-lg font-bold drop-shadow-md">{ev.subtitle}</p>
                          </div>
                        </div>

                        <div className="flex bg-white/90 backdrop-blur-sm rounded-2xl p-1.5 mb-10 shadow-sm border border-gray-100 max-w-lg mx-auto relative z-10">
                          {[
                            {id: 'ranking', label: 'いまの順位', icon: 'fa-list-ol'},
                            {id: 'about', label: '概要', icon: 'fa-circle-info'},
                            {id: 'benefits', label: '特典', icon: 'fa-gift'}
                          ].map(t => (
                            <button key={t.id} onClick={() => setEventTab(t.id)} className={`flex-1 py-3 px-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all ${eventTab === t.id ? `${themeBg} text-white shadow-md` : `text-gray-500 ${themeHover}`}`}>
                              <i className={`fa-solid ${t.icon}`}></i> {t.label}
                            </button>
                          ))}
                        </div>

                        <div className="animate-fade-in min-h-[400px] relative z-10">
                          {eventTab === 'ranking' && (
                            <div className="space-y-8 animate-fade-in-up">
                              <div className="flex gap-2 overflow-x-auto pb-4 hide-scrollbar justify-center">
                                {RANKING_TABS.map(tab => (
                                  <button key={tab.id} onClick={() => setActiveRankingTab(tab.id)} className={`px-4 py-2 rounded-full font-bold text-xs whitespace-nowrap transition-all border-2 ${activeRankingTab === tab.id ? `${themeBg} text-white border-transparent shadow-sm transform scale-105` : `bg-white/80 text-gray-500 border-white ${isMain ? 'hover:border-pink-200' : 'hover:border-purple-200'}`}`}>
                                    <i className={`fa-solid ${tab.icon} mr-2`}></i>{tab.label}
                                  </button>
                                ))}
                              </div>
                              <div className="grid grid-cols-1 md:grid-cols-3 gap-12" key={`${activeEventId}-${activeRankingTab}`}>
                                {(ev.rankingData[activeRankingTab] || []).map((item, index) => (
                                  <div key={index} onClick={() => {const idol=IDOLS.find(i=>i.id===item.idolId); if(idol) openIdolDetail(idol)}} className={`relative cursor-pointer group transition-transform hover:-translate-y-2 flex flex-col items-center ${index === 0 ? 'md:-translate-y-4' : ''}`}>
                                    <div className={`absolute -top-4 left-1/2 -translate-x-1/2 w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl text-white shadow-lg z-30 border-2 border-white ${index === 0 ? 'bg-gradient-to-br from-yellow-300 to-yellow-500' : index === 1 ? 'bg-gradient-to-br from-gray-300 to-gray-400' : 'bg-gradient-to-br from-orange-300 to-orange-500'}`}>
                                       {index === 0 ? <i className="fa-solid fa-crown"></i> : item.rank}
                                    </div>
                                    <div className={`relative w-4/5 md:w-full aspect-[3/4] rounded-2xl overflow-hidden shadow-xl backdrop-blur-sm p-1.5 border border-white ${isMain ? 'bg-white/80' : 'bg-purple-50/80'}`}>
                                      <img src={isMain ? "./rank_frame.png" : "./rank_frame_purple.png"} className="absolute inset-0 w-full h-full object-fill z-0 pointer-events-none" onError={(e) => { e.target.style.display='none'; }} />
                                      <div className={`absolute inset-1.5 overflow-hidden rounded-xl z-10 ${isMain ? 'bg-pink-50' : 'bg-purple-50'}`}>
                                        <img src={`./profile${item.rank}.png`} className="w-full h-full object-cover animate-slow-zoom" onError={(e)=>{
                                           e.target.src = `https://via.placeholder.com/300x400/${isMain ? 'fdf2f8/db2777' : 'f3e8ff/9333ea'}?text=RANK+${item.rank}`;
                                        }} />
                                      </div>
                                    </div>
                                    <div className="text-center mt-5">
                                       <h4 className="font-bold text-xl text-gray-800 mb-1.5 drop-shadow-sm">{item.name}</h4>
                                       <span className={`inline-block px-3 py-1 rounded-full font-mono font-bold text-sm shadow-sm ${isMain ? 'bg-pink-50 text-pink-600 border border-pink-100' : 'bg-purple-50 text-purple-600 border border-purple-100'}`}>{item.value}</span>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}

                          {eventTab === 'about' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-fade-in-up">
                              <div className="bg-white/90 backdrop-blur-md p-8 md:p-10 rounded-[2.5rem] border border-white shadow-sm">
                                <h3 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-3 border-b pb-4">
                                  <span className={`${themeBg} text-white w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-md`}>
                                    <i className="fa-solid fa-circle-info"></i>
                                  </span>
                                  企画概要
                                </h3>
                                <p className="text-gray-700 leading-relaxed font-medium text-lg mb-0 whitespace-pre-wrap">
                                  {ev.about}
                                </p>
                              </div>
                            </div>
                          )}

                          {eventTab === 'benefits' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-fade-in-up">
                              {ev.benefits.map((benefit, idx) => (
                                <div key={idx} className={`p-8 md:p-10 rounded-[2.5rem] border shadow-md relative overflow-hidden transition-transform hover:-translate-y-1 ${
                                  benefit.type === 'grand' ? (isMain ? 'bg-gradient-to-br from-amber-50 via-yellow-100 to-amber-200 border-amber-300' : 'bg-gradient-to-br from-purple-50 via-fuchsia-100 to-pink-100 border-purple-300') : 
                                  benefit.type === 'producer' ? 'bg-gray-800 text-white border-gray-700' : 
                                  'bg-white/90 border-gray-200'
                                }`}>
                                  {benefit.type === 'grand' && <div className={`absolute -right-4 -top-4 text-[12rem] rotate-12 opacity-10 ${isMain ? 'text-amber-500' : 'text-purple-500'}`}><i className="fa-solid fa-crown"></i></div>}
                                  {benefit.type === 'producer' && <div className="absolute right-0 bottom-0 text-[10rem] opacity-5 text-white"><i className="fa-solid fa-handshake"></i></div>}
                                  
                                  <h3 className={`text-xl md:text-2xl font-bold mb-6 flex items-center gap-3 relative z-10 ${benefit.type === 'producer' ? 'text-amber-400' : (benefit.type === 'grand' ? (isMain ? 'text-amber-900' : 'text-purple-900') : 'text-gray-800')}`}>
                                     {benefit.title}
                                  </h3>
                                  <ul className="space-y-4 relative z-10">
                                    {benefit.items.map((item, i) => (
                                      <li key={i} className={`flex items-start gap-4 p-4 rounded-2xl ${benefit.type === 'producer' ? 'bg-gray-700/50' : 'bg-white/60 shadow-sm'}`}>
                                        <i className={`fa-solid mt-1 text-lg ${benefit.type === 'producer' ? 'fa-medal text-amber-400' : (isMain ? 'fa-star text-pink-500' : 'fa-gem text-purple-500')}`}></i>
                                        <p className={`text-sm md:text-base font-bold ${benefit.type === 'producer' ? 'text-gray-100' : 'text-gray-800'} leading-relaxed`}>
                                          {item.includes('Supported by') || item.includes('Outfit Provided by') ? (
                                            <span dangerouslySetInnerHTML={{__html: item.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-500 text-lg">$1</strong>')}} />
                                          ) : item}
                                        </p>
                                      </li>
                                    ))}
                                  </ul>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })()}
                </section>

                {/* IDOL LIST */}
                <section id="idol-list" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="IDOL LIST" subtitle="あなただけの原石（推し）を見つけよう！" iconClass="fa-solid fa-users" />
                  <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-4 md:p-6 shadow-sm border border-white mb-8 max-w-4xl mx-auto">
                    <div className="relative mb-6">
                      <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i className="fa-solid fa-magnifying-glass text-gray-400"></i></div>
                      <input type="text" placeholder="名前で検索..." value={idolSearchText} onChange={(e) => setIdolSearchText(e.target.value)} className="w-full pl-11 py-3 bg-white/50 border border-gray-200 rounded-full focus:outline-none ring-pink-300 font-medium shadow-sm" />
                    </div>
                    <div className="flex flex-wrap gap-2 mb-4">
                       {['all', 'rookie', 'pref', 'style'].map(type => (
                         <button 
                           key={type} 
                           onClick={() => setIdolFilterType(type)} 
                           className={`px-4 py-2 rounded-full text-xs font-bold border transition-colors shadow-sm ${idolFilterType === type ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-gray-600 border-gray-200 hover:bg-pink-50'}`}
                         >
                           {type === 'all' ? 'すべて' : type === 'rookie' ? '新人' : type === 'pref' ? '都道府県別' : '系統別'}
                         </button>
                       ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-6 mb-12">
                    {filteredIdols.slice(0, 6).map((idol) => (
                      <div key={idol.id} onClick={() => openIdolDetail(idol)} className="group cursor-pointer">
                        <div className="relative overflow-hidden rounded-3xl mb-3 shadow-md bg-white/90 p-1 border border-white">
                          <img src={`./idol${idol.id}.png`} className="w-full aspect-[4/5] object-cover rounded-2xl transition-transform duration-500 group-hover:scale-105" onError={(e)=>e.target.src='https://via.placeholder.com/300x400/fdf2f8/db2777?text=IDOL'} />
                        </div>
                        <div className="px-2 text-center md:text-left">
                          <h4 className="font-bold text-gray-800 text-lg group-hover:text-pink-500 transition-colors drop-shadow-sm">{idol.name}</h4>
                          <p className="text-xs text-gray-700 line-clamp-1 font-medium drop-shadow-sm italic">"{idol.catchphrase}"</p>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="text-center">
                    <button 
                      onClick={() => { setActiveTab('allIdolsList'); window.scrollTo(0,0); }} 
                      className="bg-white/80 backdrop-blur-sm border-2 border-pink-200 text-pink-500 px-10 py-4 rounded-full font-bold shadow-lg hover:bg-pink-500 hover:text-white hover:border-pink-500 transition-all flex items-center justify-center gap-3 mx-auto group"
                    >
                      <i className="fa-solid fa-users-viewfinder group-hover:scale-125 transition-transform"></i>
                      すべてのアイドルを見る（五十音順）
                    </button>
                  </div>
                </section>
                
                {/* PRODUCER RANKING */}
                <section id="producer-ranking" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="PRODUCER RANKING" subtitle="トッププロデューサーたち！" iconClass="fa-solid fa-user-tie" />
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {PRODUCERS.map((producer, index) => (
                      <div key={index} onClick={() => openProducerDetail(producer)} className="bg-white/90 backdrop-blur-sm rounded-3xl p-5 shadow-md border-2 border-white cursor-pointer group transition-transform hover:-translate-y-2 text-center">
                        <div className={`w-20 h-20 rounded-full mb-3 mx-auto shadow-inner flex items-center justify-center bg-gradient-to-br ${producer.iconColor} border-2 border-white transition-transform group-hover:scale-105`}><i className="fa-solid fa-user-tie text-3xl text-white opacity-80"></i></div>
                        <div className="bg-yellow-50 text-yellow-700 text-[10px] font-bold px-2 py-0.5 rounded-full mb-2">{producer.title}</div>
                        <h4 className="font-bold text-base group-hover:text-blue-500 transition-colors">{producer.name}</h4>
                        <p className="text-xs text-gray-500 font-mono font-bold">{producer.value}</p>
                      </div>
                    ))}
                  </div>
                </section>

                <section id="magazine" className="py-16 bg-white/40 backdrop-blur-md rounded-[3rem] p-4 md:p-10 border border-white shadow-xl my-10 relative overflow-hidden max-w-6xl mx-auto">
                  <SectionTitle title="MAGAZINE ARCHIVE" subtitle="あなたが主役の誌面体験。過去の表紙をチェック" iconClass="fa-solid fa-book-open" />
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 relative z-10">
                    {MAGAZINES.map((mag) => (
                      <div key={mag.id} className="flex flex-col items-center group">
                        <div className="relative w-4/5 md:w-full aspect-[3/4] bg-white/80 rounded-md shadow-lg border-l-4 border-white p-2 transition-transform group-hover:-translate-y-2">
                          <img src={`./mag${mag.id}.png`} alt={mag.title} className="w-full h-full object-cover rounded shadow-inner" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                          <div className="absolute top-4 left-0 bg-pink-500 text-white text-[10px] font-bold py-1 px-3 rounded-r-full shadow-md">{mag.issue}</div>
                        </div>
                        <div className="text-center mt-6 px-2">
                          <span className={`text-[10px] font-bold px-2 py-1 rounded-full shadow-sm border border-white ${mag.status === '発売中' ? 'bg-white text-gray-600' : 'bg-pink-100 text-pink-600'}`}>{mag.status}</span>
                          <h4 className="font-bold text-base mt-2 text-gray-800 line-clamp-1">{mag.title}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}
          </main>

          <footer className="mt-20 bg-gradient-to-b from-pink-50 to-white border-t border-pink-100 py-20 relative overflow-hidden">
            <div className="absolute top-0 left-1/4 w-96 h-96 bg-pink-200/20 blur-[100px] pointer-events-none rounded-full"></div>
            <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-200/20 blur-[100px] pointer-events-none rounded-full"></div>
            <div className="max-w-4xl mx-auto px-6 flex flex-col items-center text-center space-y-12 relative z-10">
              <div className="flex flex-col md:flex-row items-center justify-center gap-10 md:gap-20 w-full animate-fade-in">
                <img src="./logo.png" className="h-28 md:h-44 object-contain drop-shadow-sm transition-transform hover:scale-105" alt="もしアイ ロゴ" onError={(e)=>e.target.style.display='none'} />
                <div className="h-16 w-px bg-pink-200 hidden md:block opacity-50"></div>
                <img src="./off_melty_logo.png" className="h-16 md:h-28 object-contain opacity-80 hover:opacity-100 transition-opacity" alt="Off-Melty ロゴ" onError={(e)=>e.target.src='https://via.placeholder.com/200x80/fdf2f8/db2777?text=Off-Melty'} />
              </div>
              <div className="space-y-6">
                <div className="relative inline-block">
                  <p className="text-xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-purple-600 font-serif tracking-widest px-4">もしアイの最新ニュースを配信中！</p>
                  <div className="absolute -bottom-3 left-0 w-full h-1 bg-gradient-to-r from-transparent via-pink-300 to-transparent rounded-full"></div>
                </div>
                <div className="pt-6">
                  <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="group relative inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 rounded-2xl p-0.5 shadow-lg transform transition-all hover:scale-110 active:scale-95">
                    <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
                      <i className="fa-brands fa-instagram text-4xl bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 bg-clip-text text-transparent group-hover:scale-110 transition-transform"></i>
                    </div>
                  </a>
                  <p className="text-[10px] font-bold text-pink-400 mt-4 tracking-[0.2em] uppercase">Follow us on Instagram</p>
                </div>
              </div>
            </div>
            <div className="mt-20 bg-gray-900/95 backdrop-blur-sm text-white py-10">
              <div className="max-w-6xl mx-auto px-6 text-center">
                <div className="flex justify-center gap-8 text-xs mb-6 font-medium text-gray-400">
                  <a href="#" className="hover:text-pink-400 transition-colors">利用規約</a>
                  <a href="#" className="hover:text-pink-400 transition-colors">プライバシーポリシー</a>
                  <a href="#" className="hover:text-pink-400 transition-colors">お問い合わせ</a>
                </div>
                <p className="text-[10px] opacity-40 tracking-[0.15em]">&copy; 2026 もしも私が、アイドルになったら。 Project All Rights Reserved.</p>
              </div>
            </div>
          </footer>

          {(activeTab === 'home' || activeTab === 'idolDetail' || activeTab === 'allIdolsList') && (
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-transparent z-[100] md:flex md:justify-center animate-fade-in-up">
              <div className="max-w-md w-full mx-auto md:mx-0 flex items-center gap-3 p-2">
                <div className="hidden md:block text-sm font-bold text-gray-700 ml-4 mr-2 drop-shadow-sm">次世代アイドル<br/>エントリー受付中！</div>
                <div className="flex-1 animate-float">
                  <a href="https://line.me" target="_blank" rel="noreferrer">
                    <img src="./line_btn.png" alt="LINEで無料エントリー！" className="w-full max-h-20 object-contain cursor-pointer transition-transform transform hover:scale-110 drop-shadow-xl mx-auto" />
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
