        </tbody></table>

    const TermsModal = ({ onClose }) => ( <LegalModal title="利用規約" onClose={onClose}><p>本規約は、運営者が提供するサービスの利用条件を定めるものです。法令違反、出会い目的の利用、その他迷惑行為を禁止とし、違反時はアカウント停止等を行います。</p></LegalModal> );
    const PrivacyPolicyModal = ({ onClose }) => ( <LegalModal title="プライバシーポリシー" onClose={onClose}><p>当サイトは、ユーザーの個人情報を適切に管理します。決済情報はStripe社で処理され、当サイトではクレジットカード番号を保持しません。</p></LegalModal> );

    const CrossNavSection = ({ idolsData, currentIdolId, onIdolSelect, onNavigate }) => {

        <div className="w-full bg-slate-50/50 border-t border-slate-200 mt-16 pt-20 pb-20"><div className="max-w-6xl mx-auto px-6"><SectionTitle title="Discover More" subtitle="さらに広がる「もしアイ」の世界" /><div className="grid grid-cols-1 lg:grid-cols-2 gap-16"><div><div className="flex items-center gap-3 mb-8"><span className="w-8 h-px bg-pink-300"></span><h3 className="text-sm font-light text-slate-600 tracking-[0.2em] uppercase">Featured Muses</h3></div><div className="grid grid-cols-2 gap-x-6 gap-y-8">{recommendIdols.map((idol) => (<div key={idol.id} onClick={() => onIdolSelect(idol)} className="group cursor-pointer"><div className="aspect-[3/4] relative overflow-hidden bg-white mb-4 shadow-sm group-hover:shadow-md transition-all"><MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />{idol.isStreaming && <div className="absolute top-3 right-3 bg-red-500/90 text-white text-[8px] font-medium tracking-widest px-2 py-1 uppercase shadow-sm animate-pulse">On Air</div>}</div><div className="text-center px-2"><h4 className="font-light text-slate-800 text-sm group-hover:text-pink-600 transition-colors">{idol.name}</h4></div></div>))}</div></div><div><div className="flex items-center gap-3 mb-8"><span className="w-8 h-px bg-pink-300"></span><h3 className="text-sm font-light text-slate-600 tracking-[0.2em] uppercase">Hot Campaigns</h3></div><div className="space-y-6">{EVENTS_DATA.map(ev => (<div key={ev.id} onClick={() => onNavigate('ranking')} className="cursor-pointer group relative overflow-hidden border border-slate-200 bg-white flex flex-col sm:flex-row hover:shadow-md transition-all"><div className="sm:w-2/5 aspect-[4/3] bg-slate-50"><img src={ev.bannerImg} className="w-full h-full object-cover group-hover:scale-105 transition-transform" /></div><div className="p-5 sm:w-3/5"><p className="text-[9px] text-pink-500 mb-2">Event</p><h4 className="text-sm text-slate-800">{ev.title}</h4></div></div>))}</div></div></div></div></div>

    const AuthModal = ({ onClose, onAuthSubmit, isAdminOnly = false }) => {

      );

      const handleAddIdol = async (e) => { e.preventDefault(); if(!newIdol.name || !newIdol.loginEmail) return; try { await window.FirebaseHelper.addDoc(window.FirebaseHelper.collection(window.FirebaseDbRef, 'artifacts', 'default-app-id', 'public', 'data', 'idols'), { ...newIdol, type: "新規エントリー", totalVotes: 0, createdAt: new Date().toISOString() }); showToast("追加完了"); setNewIdol({ name: '', loginEmail: '', profileImage: '', catchphrase: '', pref: '', style: '', birthday: '' }); } catch(err) {} };
      return ( <div className="max-w-6xl mx-auto px-4 py-12 pt-32"><SectionTitle title="ADMIN" /><div className="bg-white p-8 mb-12"><form onSubmit={handleAddIdol} className="grid grid-cols-2 gap-6"><div><label>名前</label><input type="text" value={newIdol.name} onChange={e=>setNewIdol({...newIdol,name:e.target.value})} className="w-full border-b py-2" required/></div><div><label>Email</label><input type="email" value={newIdol.loginEmail} onChange={e=>setNewIdol({...newIdol,loginEmail:e.target.value})} className="w-full border-b py-2" required/></div><div><label>画像</label><input type="file" onChange={handleFileChange} /></div></form><div className="mt-6 text-right"><button onClick={handleAddIdol} className="bg-slate-900 text-white px-8 py-3">追加</button></div></div><div className="bg-white p-8"><h3 className="mb-6">登録済みアイドル</h3>{idolsData.map(idol => <div key={idol.id} className="flex gap-4 mb-4"><img src={idol.profileImage} className="w-12 h-12 rounded-full" /><div>{idol.name}</div></div>)}</div></div> );

      const handleVote = (amount) => { if (userData.freeTickets >= amount) { updateTickets(-amount, 0); onSuccess(amount, '無料投票'); onClose(); } else showToast("無料票が不足しています。"); };

      const handleBuy = (name, price, votes) => { onSuccess(votes, `ギフト購入(${name})`); onClose(); };

    };

    const OutfitModal = ({ onClose, idol, user, userData, updateTickets, showToast, onLogin, onSuccess }) => {
      if (!user || user.isAnonymous) return ( <div className="fixed inset-0 bg-slate-900/60 z-[200] flex items-center justify-center"><div className="bg-white p-10 w-full max-w-sm text-center"><button onClick={onLogin} className="w-full bg-slate-900 text-white py-4 mb-4">REGISTER</button><button onClick={onClose}>CANCEL</button></div></div> );
      return ( <div className="fixed inset-0 bg-slate-900/80 z-[200] flex items-center justify-center p-4"><div className="bg-white w-full max-w-4xl"><div className="p-6 border-b text-center"><button onClick={onClose} className="absolute right-6"><i className="fa-solid fa-xmark"></i></button><h3>OUTFIT CATALOG</h3></div><div className="p-6 max-h-[70vh] overflow-y-auto"><div className="grid grid-cols-2 md:grid-cols-4 gap-6">{OFF_MELTY_CATALOG.map(item => { const isRec = idol.receivedGifts?.find(g=>g.itemId===item.id); return ( <div key={item.id} className="border p-2 text-center"><img src={item.img} className={isRec ? 'opacity-50 grayscale' : ''} />{!isRec && <button onClick={()=>{onSuccess(item.votes, '衣装提供', item.id); onClose();}} className="mt-2 bg-slate-900 text-white w-full py-2 text-[10px]">SELECT</button>}</div> ); })}</div></div></div></div> );

    };

    const ProducerDetailView = ({ producer, onBack }) => ( <div className="max-w-2xl mx-auto py-16 px-4"><button onClick={onBack} className="mb-10 text-xs"><i className="fa-solid fa-arrow-left-long"></i> BACK</button><div className="bg-white p-10 text-center"><img src={producer.profileImage || './default_idol.png'} className="w-24 h-24 rounded-full mx-auto mb-6 object-cover" /><h2>{producer.name}</h2><p>Total Votes: {producer.totalVotes || 0}</p></div></div> );

    // ✂️✂️✂️ ここからコピー（後半） ✂️✂️✂️

    const IdolDetailView = ({ idol, onBack, onVoteClick, onOutfitClick, onGiftClick, idolsData, onIdolSelect, onNavigate, producersData, postsData, commentsData, onPostComment, onLikePost, onDirectGift, user }) => {
      const sortedIdols = [...idolsData].sort((a, b) => (b.totalVotes || 0) - (a.totalVotes || 0));

      const top3Ids = idolProducers.slice(0, 3).map(p => p.id);

      return (
        <div className="animate-fade-in-up pb-0">
          <div className="max-w-4xl mx-auto px-4 py-10 pb-20">

              <div className="flex flex-col justify-center">

                  {idol.wishlist.map(itemId => {
                    const item = OFF_MELTY_CATALOG.find(c => c.id === itemId); if(!item) return null;
                    const isRec = idol.receivedGifts?.find(g => g.itemId === itemId);

                  <div className="space-y-4 max-h-64 overflow-y-auto">{commentsData.filter(c=>c.idolId===idol.id).map(c=>(<div key={c.id} className="flex gap-2"><img src={c.userIcon || './default_idol.png'} className="w-6 h-6 rounded-full" /><div><span className="text-[10px] font-medium mr-2">{c.userName}</span><p className="text-xs font-light">{c.text}</p></div></div>))}</div>
                </div>
                <div className="bg-white p-8 border shadow-sm"><h3 className="text-sm mb-6">Official P</h3>
                  {idolProducers.slice(0,3).map((p,i)=>(<div key={i} className="flex items-center gap-3 mb-4"><div className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs font-timer">{i+1}</div><img src={p.profileImage || './default_idol.png'} className="w-8 h-8 rounded-full" /><div><p className="text-xs truncate max-w-[100px]">{p.name}</p><p className="text-[9px] text-pink-500">{(p.votes[idol.id]||0).toLocaleString()} 票</p></div></div>))}
                </div>
              </div>
            </div>
          </div>
          <CrossNavSection idolsData={idolsData} currentIdolId={idol.id} onIdolSelect={onIdolSelect} onNavigate={onNavigate} />
        </div>
      );
    };

    const ProducerMyPage = ({ user, userData, idolsData, producersData, onUpdateProfile, showToast, onIdolSelect, onNavigate }) => {
      const [name, setName] = useState(userData.name || "ゲスト プロデューサー"); const [profileImage, setProfileImage] = useState(userData.profileImage || ""); const [oshiId, setOshiId] = useState(userData.oshiId || "");
      const handleSave = async (e) => { e.preventDefault(); await onUpdateProfile({ name, profileImage, oshiId }); showToast("保存しました。"); };
      const myBadges = getProducerBadges(user.uid, producersData, idolsData, userData);
      return (
        <div className="max-w-5xl mx-auto px-4 py-12"><SectionTitle title="MY PAGE" />
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div className="bg-white p-8 border text-center"><img src={profileImage||'./default_idol.png'} className="w-24 h-24 mx-auto rounded-full mb-4 object-cover" /><h3 className="font-serif text-lg mb-4">{name}</h3><div className="flex flex-wrap justify-center gap-2">{myBadges.map((b,i)=><span key={i} className={`${b.bg} text-white px-2 py-1 text-[9px]`}><i className={`fa-solid ${b.icon}`}></i> {b.name}</span>)}</div></div>
            <div className="md:col-span-2 space-y-8">
              <div className="bg-white p-8 border flex justify-around text-center"><div><p className="text-[9px] text-slate-400 mb-2">Free Votes</p><p className="text-3xl font-timer">{userData.freeTickets}</p></div><div><p className="text-[9px] text-slate-400 mb-2">Total Votes</p><p className="text-3xl font-timer text-pink-500">{userData.totalPts||0}</p></div></div>
              <div className="bg-white p-8 border"><h3 className="text-xs mb-6">Profile Settings</h3><form onSubmit={handleSave} className="space-y-4"><div><label className="text-[9px] block mb-1">Name</label><input type="text" value={name} onChange={e=>setName(e.target.value)} className="border-b w-full py-2 text-sm focus:outline-none"/></div><button className="bg-slate-900 text-white px-8 py-3 text-[10px]">SAVE</button></form></div>
            </div>
          </div>
        </div>
      );
    };

    const IdolMyPage = ({ idolData, onUpdateProfile, showToast, onPostTimeline }) => {
      const [story, setStory] = useState(idolData?.story || ""); const [text, setText] = useState("");
      if(!idolData) return null;
      return (
        <div className="max-w-5xl mx-auto px-4 py-12"><SectionTitle title="STUDIO" />
          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div className="bg-white p-8 border text-center"><img src={idolData.profileImage} className="w-24 h-24 mx-auto rounded-full mb-4 object-cover" /><h3 className="font-serif text-lg mb-2">{idolData.name}</h3><p className="text-[10px] font-timer bg-pink-50 inline-block px-3 py-1">{idolData.totalVotes||0} 票</p></div>
            <div className="md:col-span-2 space-y-8">
              <div className="bg-white p-8 border"><h3 className="text-xs mb-4">New Post</h3><textarea value={text} onChange={e=>setText(e.target.value)} className="w-full border p-3 text-sm focus:outline-none focus:border-pink-300 min-h-[100px]" placeholder="活動報告..."></textarea><button onClick={()=>{if(!text)return; onPostTimeline({idolId:idolData.id, text}); setText(""); showToast("投稿完了");}} className="mt-4 bg-pink-500 text-white px-8 py-3 text-[10px]">POST</button></div>
            </div>
          </div>
        </div>
      );
    };

    const IdolRecruitLP = ({ onBack }) => ( <div className="max-w-3xl mx-auto py-24 px-4 text-center"><button onClick={onBack} className="mb-10 text-xs"><i className="fa-solid fa-arrow-left-long"></i> BACK</button><h1 className="text-3xl font-serif mb-8">あなたの夢、ここから始まる。</h1><a href="https://line.me" target="_blank" className="bg-[#06C755] text-white px-10 py-4 rounded-full font-bold">LINEで無料エントリー</a></div> );
    const AllIdolsView = ({ onBack, onIdolSelect, idols, idolSearchText, setIdolSearchText, idolFilterType, setIdolFilterType }) => (
      <div className="max-w-6xl mx-auto py-12 px-4"><button onClick={onBack} className="mb-8 text-xs"><i className="fa-solid fa-arrow-left-long"></i> BACK</button><SectionTitle title="ALL IDOLS" /><div className="grid grid-cols-2 md:grid-cols-4 gap-6">{idols.map(idol => ( <div key={idol.id} onClick={()=>onIdolSelect(idol)} className="cursor-pointer group bg-white border p-3"><img src={idol.profileImage} className="w-full aspect-[3/4] object-cover mb-3 group-hover:opacity-80" /><div className="text-center"><h4 className="text-sm">{idol.name}</h4></div></div> ))}</div></div>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('home'); 
      const [selectedIdol, setSelectedIdol] = useState(null);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [idolsData, setIdolsData] = useState(INITIAL_IDOLS); 
      const idolsDataRef = useRef(idolsData);
      const [selectedProducer, setSelectedProducer] = useState(null);
      const [selectedArticle, setSelectedArticle] = useState(null);
      
      const [idolSearchText, setIdolSearchText] = useState('');
      const [idolFilterType, setIdolFilterType] = useState('all'); 
      
      const [showAuthModal, setShowAuthModal] = useState(false); 
      const [showAdminModal, setShowAdminModal] = useState(false); 
      const [showVoteModal, setShowVoteModal] = useState(false);
      const [showOutfitModal, setShowOutfitModal] = useState(false);
      const [showGiftModal, setShowGiftModal] = useState(false);
      const [successModalData, setSuccessModalData] = useState(null); 
      const [globalEvent, setGlobalEvent] = useState(null);
      const [toastMessage, setToastMessage] = useState("");
      
      const [showSCTLModal, setShowSCTLModal] = useState(false);
      const [showTermsModal, setShowTermsModal] = useState(false);
      const [showPrivacyModal, setShowPrivacyModal] = useState(false);
      const [showAboutModal, setShowAboutModal] = useState(false);
      const [showContactModal, setShowContactModal] = useState(false);
      
      const [firebaseLoaded, setFirebaseLoaded] = useState(false);
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState('guest'); 
      const [userData, setUserData] = useState({ freeTickets: 0, paidTickets: 0, totalPts: 0 });
      
      const [postsData, setPostsData] = useState([]);
      const [commentsData, setCommentsData] = useState([]);
      const [producersData, setProducersData] = useState([]);

      const authRef = useRef(null); const dbRef = useRef(null);
      const ADMIN_EMAIL = 'admin@moshiai.com'; 

      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(""), 3500); };

      useEffect(() => { idolsDataRef.current = idolsData; }, [idolsData]);

      useEffect(() => {
        let attempts = 0;
        const loadFirebase = () => {
          if (window.FirebaseHelper) {
            try {
              const { initializeApp, getAuth, getFirestore } = window.FirebaseHelper;
              const customFirebaseConfig = { apiKey: "AIzaSyB0xE7nrbyOgLxpSWskTaT0G5FDyVWSDQc", authDomain: "moshiai-5735b.firebaseapp.com", projectId: "moshiai-5735b", storageBucket: "moshiai-5735b.firebasestorage.app", messagingSenderId: "347806317602", appId: "1:347806317602:web:d25481c7dd1376aa20de7b" };
              const app = initializeApp(customFirebaseConfig);
              authRef.current = getAuth(app); dbRef.current = getFirestore(app); window.FirebaseDbRef = dbRef.current;
              setFirebaseLoaded(true);
            } catch (e) {}
          } else if (attempts < 100) { attempts++; setTimeout(loadFirebase, 50); }
        };
        loadFirebase();
      }, []);

      useEffect(() => {
        if (!firebaseLoaded || !authRef.current) return;
        const { signInAnonymously, onAuthStateChanged } = window.FirebaseHelper;
        signInAnonymously(authRef.current).catch(()=>{});
        const unsubscribe = onAuthStateChanged(authRef.current, (u) => { setUser(u); if (!u || u.isAnonymous) { setUserRole('guest'); setUserData({ freeTickets: 0, paidTickets: 0, totalPts: 0 }); } });
        return () => unsubscribe();
      }, [firebaseLoaded]);

      useEffect(() => {
        if (!user || !firebaseLoaded || !dbRef.current) return;
        const { collection, onSnapshot } = window.FirebaseHelper; const db = dbRef.current; const appId = 'default-app-id';
        const unsubIdols = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'idols'), (s) => { const arr = []; s.forEach(d => arr.push({id: d.id, ...d.data()})); setIdolsData(arr); });
        const unsubPosts = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (s) => { const arr = []; s.forEach(d => arr.push({id: d.id, ...d.data()})); setPostsData(arr); });
        const unsubComments = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'comments'), (s) => { const arr = []; s.forEach(d => arr.push({id: d.id, ...d.data()})); setCommentsData(arr); });
        const unsubProducers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'producers'), (s) => { const arr = []; s.forEach(d => arr.push({id: d.id, ...d.data()})); setProducersData(arr); });
        return () => { unsubIdols(); unsubPosts(); unsubComments(); unsubProducers(); };
      }, [user, firebaseLoaded]);

      useEffect(() => {
        if (!user || user.isAnonymous || !firebaseLoaded || !dbRef.current) return;
        const { doc, getDoc, setDoc, updateDoc } = window.FirebaseHelper;
        const fetchUser = async () => {
            const docRef = doc(dbRef.current, 'artifacts', 'default-app-id', 'users', user.uid, 'profile', 'data');
            try {
               const docSnap = await getDoc(docRef); const today = new Date().toISOString().split('T')[0];
               const currentRole = user.email === ADMIN_EMAIL ? 'admin' : (idolsDataRef.current.find(i=>i.loginEmail===user.email) ? 'idol' : 'producer');
               if (docSnap.exists()) {
                 const data = docSnap.data(); setUserRole(currentRole);
                 if (currentRole === 'producer' && data.lastLoginDate !== today) {
                   const updates = { lastLoginDate: today, freeTickets: (data.freeTickets||0) + 3 };
                   await updateDoc(docRef, updates); setUserData({...data, ...updates});
                   setTimeout(() => showToast("ログインボーナス(3票)追加！"), 1000);
                 } else setUserData(data);
               } else {
                 const initData = { role: currentRole, email: user.email, freeTickets: 3, paidTickets: 0, totalPts: 0, lastLoginDate: today, createdAt: new Date().toISOString() };
                 await setDoc(docRef, initData); setUserRole(currentRole); setUserData(initData);
               }
            } catch(e) {}
        };
        fetchUser();
      }, [user, firebaseLoaded, activeTab]);

      const handleUpdateProfile = async (newProfile) => {
        const updatedData = { ...userData, ...newProfile }; setUserData(updatedData);
        if (user && !user.isAnonymous && firebaseLoaded) {
          const { doc, updateDoc, setDoc } = window.FirebaseHelper; const docRef = doc(dbRef.current, 'artifacts', 'default-app-id', 'users', user.uid, 'profile', 'data');
          try { await updateDoc(docRef, newProfile); return {success:true}; } catch(e) { try{await setDoc(docRef, updatedData); return {success:true};}catch(e2){return {success:false};} }
        }
        return { success: true };
      };

      const handleAuthSubmit = async (email, password, isLogin) => {
        if (!firebaseLoaded) return showToast("エラー: Firebase未設定");
        const { signInWithEmailAndPassword, createUserWithEmailAndPassword, doc, setDoc } = window.FirebaseHelper;
        try {
          if (isLogin) { await signInWithEmailAndPassword(authRef.current, email, password); setShowAuthModal(false); setShowAdminModal(false); showToast("ログイン成功"); } 
          else {
            const cred = await createUserWithEmailAndPassword(authRef.current, email, password);
            const initData = { role: email===ADMIN_EMAIL?'admin':'producer', email: email, freeTickets: 3, paidTickets: 0, totalPts: 0, lastLoginDate: new Date().toISOString().split('T')[0], createdAt: new Date().toISOString() };
            try { await setDoc(doc(dbRef.current, 'artifacts', 'default-app-id', 'users', cred.user.uid, 'profile', 'data'), initData); } catch(e){}
            setShowAuthModal(false); setShowAdminModal(false); showToast("登録完了！");
          }
        } catch (e) { showToast("エラー: " + e.message); }
      };

      const handleLogout = async () => { if (firebaseLoaded) await window.FirebaseHelper.signOut(authRef.current); setUser(null); setUserRole('guest'); setActiveTab('home'); showToast("ログアウトしました"); };

      const updateTickets = async (fDelta, pDelta, ptDelta=0) => {
        const newFree = Math.max(0, userData.freeTickets + fDelta); const newPts = (userData.totalPts||0) + ptDelta;
        setUserData({...userData, freeTickets: newFree, totalPts: newPts});
        if(user && !user.isAnonymous && firebaseLoaded) { try{ await window.FirebaseHelper.updateDoc(window.FirebaseHelper.doc(dbRef.current, 'artifacts', 'default-app-id', 'users', user.uid, 'profile', 'data'), {freeTickets: newFree, totalPts: newPts}); }catch(e){} }
      };

      const handleVoteForIdol = async (idolId, amount, actionType, itemId=null) => {
        if (!user || user.isAnonymous) return setShowAuthModal(true);
        const { doc, setDoc, increment } = window.FirebaseHelper;
        const prodRef = doc(dbRef.current, 'artifacts', 'default-app-id', 'public', 'data', 'producers', user.uid);
        const pData = producersData.find(p=>p.id===user.uid) || {votes:{}, totalVotes:0};
        await setDoc(prodRef, { id: user.uid, name: userData.name||"名無しP", iconColor: pData.iconColor||"from-pink-200 to-pink-500", profileImage: userData.profileImage||"", votes: {...pData.votes, [idolId]: (pData.votes[idolId]||0)+amount}, totalVotes: pData.totalVotes+amount }, {merge:true});
        const idolRef = doc(dbRef.current, 'artifacts', 'default-app-id', 'public', 'data', 'idols', String(idolId));
        await setDoc(idolRef, {totalVotes: increment(amount)}, {merge:true});
      };

      const scrollPosRef = useRef(0);
      const navigate = (tab) => { scrollPosRef.current = window.scrollY; setActiveTab(tab); window.scrollTo(0,0); };
      const goBack = () => { setActiveTab('home'); setTimeout(()=>window.scrollTo({top:scrollPosRef.current, behavior:'instant'}), 50); };

      const filteredIdols = idolsData.filter(i => idolFilterType==='rookie' ? i.isRookie : true);

      return (
        <div className="pb-24">
          <Toast message={toastMessage} />
          {showAuthModal && <AuthModal onClose={() => setShowAuthModal(false)} onAuthSubmit={handleAuthSubmit} />}
          {showAdminModal && <AuthModal onClose={() => setShowAdminModal(false)} onAuthSubmit={handleAuthSubmit} isAdminOnly={true} />}
          {showVoteModal && selectedIdol && <VoteModal onClose={() => setShowVoteModal(false)} idol={selectedIdol} user={user} userData={userData} updateTickets={updateTickets} showToast={showToast} onLogin={() => {setShowVoteModal(false); setShowAuthModal(true);}} onSuccess={(amount, type) => { handleVoteForIdol(selectedIdol.id, amount, type); setSuccessModalData({ idolName: selectedIdol.name, amount, actionType: type }); }} />}
          {showOutfitModal && selectedIdol && <OutfitModal onClose={() => setShowOutfitModal(false)} idol={selectedIdol} user={user} userData={userData} updateTickets={updateTickets} showToast={showToast} onLogin={() => {setShowOutfitModal(false); setShowAuthModal(true);}} onSuccess={(amount, type, itemId) => { handleVoteForIdol(selectedIdol.id, amount, type, itemId); setSuccessModalData({ idolName: selectedIdol.name, amount, actionType: type }); }} />}
          {showGiftModal && selectedIdol && <GiftModal onClose={() => setShowGiftModal(false)} idol={selectedIdol} user={user} updateTickets={updateTickets} showToast={showToast} onLogin={() => {setShowGiftModal(false); setShowAuthModal(true);}} onSuccess={(amount, type) => { handleVoteForIdol(selectedIdol.id, amount, type); setSuccessModalData({ idolName: selectedIdol.name, amount, actionType: type }); }} />}
          {successModalData && <SuccessModal data={successModalData} onClose={() => setSuccessModalData(null)} idol={idolsData.find(i => i.name === successModalData.idolName)} />}

          {showSCTLModal && <SCTLModal onClose={() => setShowSCTLModal(false)} />}
          {showTermsModal && <TermsModal onClose={() => setShowTermsModal(false)} />}
          {showPrivacyModal && <PrivacyPolicyModal onClose={() => setShowPrivacyModal(false)} />}
          {showAboutModal && <AboutServiceModal onClose={() => setShowAboutModal(false)} />}
          {showContactModal && <ContactForm onClose={() => setShowContactModal(false)} showToast={showToast} />}

          <header className="absolute top-0 w-full z-50 py-8 pointer-events-none">
            <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
              <div className="w-[120px] md:w-[180px] pointer-events-auto cursor-pointer" onClick={() => navigate('home')}><img src="./logo.png" className="w-full h-auto" onError={(e) => { e.target.style.display='none'; }} /></div>
              <div className="pointer-events-auto flex items-center gap-4">
                {user && !user.isAnonymous ? (
                  <div className="flex gap-2">
                    {userRole === 'admin' ? <button onClick={() => navigate('adminDashboard')} className="bg-slate-800 text-white text-[10px] px-3 py-1.5"><i className="fa-solid fa-gear"></i> Admin</button>
                    : <button onClick={() => navigate(userRole === 'idol' ? 'idolMyPage' : 'producerMyPage')} className="bg-white border text-slate-800 text-[10px] px-3 py-1.5"><i className="fa-regular fa-user"></i> My Page</button>}
                    <button onClick={handleLogout} className="bg-slate-900 text-white text-[10px] px-3 py-1.5">Logout</button>
                  </div>
                ) : <button onClick={() => setShowAuthModal(true)} className="border border-slate-800 text-slate-800 px-4 py-1.5 text-[10px] uppercase">Login</button>}
              </div>
            </div>
          </header>

          <main className="pt-32 min-h-[80vh]">
            {activeTab === 'adminDashboard' && userRole === 'admin' ? <AdminDashboard idolsData={idolsData} showToast={showToast} />
            : activeTab === 'producerMyPage' && userRole !== 'admin' && user && !user.isAnonymous ? <ProducerMyPage user={user} userData={userData} idolsData={idolsData} producersData={producersData} onUpdateProfile={handleUpdateProfile} showToast={showToast} onIdolSelect={(i)=>navigate('idolDetail')} />
            : activeTab === 'idolMyPage' && userRole !== 'admin' && user && !user.isAnonymous ? <IdolMyPage idolData={idolsData.find(i => String(i.id) === String(userData.idolId))} onUpdateProfile={(d)=>{}} showToast={showToast} onPostTimeline={(d)=>{}} />
            : activeTab === 'idolDetail' && selectedIdol ? <IdolDetailView idol={selectedIdol} onBack={goBack} onVoteClick={() => setShowVoteModal(true)} onOutfitClick={() => setShowOutfitModal(true)} onGiftClick={() => setShowGiftModal(true)} idolsData={idolsData} onIdolSelect={(i)=>{setSelectedIdol(i)}} producersData={producersData} postsData={postsData} commentsData={commentsData} onPostComment={(txt)=>{}} onLikePost={(id)=>{}} onDirectGift={(id,v,t)=>{}} user={user} />
            : activeTab === 'eventDetail' && selectedEvent ? <EventDetailView event={selectedEvent} onBack={goBack} idolsData={idolsData} onIdolSelect={(i)=>{setSelectedIdol(i); setActiveTab('idolDetail')}} onQuickVote={(e,i)=>{}} />
            : activeTab === 'producerDetail' && selectedProducer ? <ProducerDetailView producer={selectedProducer} onBack={goBack} />
            : activeTab === 'articleDetail' && selectedArticle ? <ArticleDetailView article={selectedArticle} onBack={goBack} />
            : activeTab === 'idolLP' ? <IdolRecruitLP onBack={goBack} />
            : activeTab === 'allIdolsList' ? <AllIdolsView onBack={goBack} onIdolSelect={(i)=>{setSelectedIdol(i); setActiveTab('idolDetail')}} idols={filteredIdols} idolSearchText={idolSearchText} setIdolSearchText={setIdolSearchText} idolFilterType={idolFilterType} setIdolFilterType={setIdolFilterType} />
            : (
              <div className="animate-fade-in">
                <section className="pb-16 pt-10 text-center relative max-w-4xl mx-auto px-4"><img src="./top.png" className="w-full relative z-10" onError={e=>e.target.style.display='none'} /><a href="#" onClick={(e)=>{e.preventDefault();navigate('idolLP')}} className="block w-[80%] mx-auto -mt-16 relative z-20 hover:-translate-y-2 transition-transform"><img src="./line_entry_banner.png" className="w-full" onError={e=>e.target.style.display='none'}/></a></section>
                <section className="py-16 bg-white/40 mb-20 max-w-7xl mx-auto"><div className="px-6 mb-8"><span className="text-sm tracking-widest text-slate-500 uppercase">Featured Muses</span></div>
                  <div className="flex gap-4 overflow-x-auto px-6 pb-4">{idolsData.slice(0,6).map(idol => (<div key={idol.id} onClick={()=>{setSelectedIdol(idol); setActiveTab('idolDetail'); window.scrollTo(0,0)}} className="w-48 shrink-0 bg-white border cursor-pointer group"><img src={idol.profileImage} className="w-full aspect-[3/4] object-cover group-hover:opacity-80 transition-opacity"/><div className="p-3 text-center"><h3 className="text-sm font-serif">{idol.name}</h3></div></div>))}</div>
                </section>
                <section className="py-20 bg-slate-50 border-y mb-20">
                  <div className="max-w-6xl mx-auto px-4 text-center"><h2 className="text-3xl font-serif mb-12">Campaigns</h2>
                    <div className="grid md:grid-cols-2 gap-8">{EVENTS_DATA.map(ev => (<div key={ev.id} onClick={()=>{setSelectedEvent(ev); setActiveTab('eventDetail'); window.scrollTo(0,0)}} className="bg-white border cursor-pointer hover:shadow-lg transition-shadow"><img src={ev.bannerImg} className="w-full aspect-[21/9] object-cover"/><div className="p-6"><h3 className="font-serif">{ev.title}</h3></div></div>))}</div>
                  </div>
                </section>
              </div>
            )}
          </main>

          <footer className="mt-32 pt-16 border-t border-slate-200 bg-white">
            <div className="bg-slate-900 text-white/70 py-10">
              <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
                <p className="text-[10px] tracking-widest uppercase">&copy; 2026 Moshi-Ai Project.</p>
                <div className="flex gap-6 text-[10px] uppercase tracking-widest">
                  <button onClick={() => setShowTermsModal(true)} className="hover:text-white">Terms</button>
                  <button onClick={() => setShowPrivacyModal(true)} className="hover:text-white">Privacy</button>
                  <button onClick={() => setShowSCTLModal(true)} className="hover:text-white">SCTL</button>
                  <button onClick={() => setShowAboutModal(true)} className="hover:text-white">About</button>
                  <button onClick={() => setShowContactModal(true)} className="hover:text-white">Contact</button>
                </div>
                <button onClick={() => setShowAdminModal(true)} className="text-[10px] text-slate-500 hover:text-white uppercase">Admin</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
