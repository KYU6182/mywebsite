          <div className="bg-gray-50/80 rounded-2xl p-4 inline-block min-w-[200px]"><p className="text-xs font-bold mb-1">累計応援ポイント</p><p className="text-2xl font-bold text-purple-500 font-serif">{producer.value}</p></div>
        </div>
      </div>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('home'); 
      const [selectedIdol, setSelectedIdol] = useState(null);
      const [selectedProducer, setSelectedProducer] = useState(null);
      const [eventTab, setEventTab] = useState('ranking'); 
      const [activeRankingTab, setActiveRankingTab] = useState('overall');
      const [idolSearchText, setIdolSearchText] = useState('');
      const [idolFilterType, setIdolFilterType] = useState('all'); 
      const [idolFilterPref, setIdolFilterPref] = useState('東京'); 
      const [idolFilterStyle, setIdolFilterStyle] = useState('王道キュート'); 

      const uniquePrefs = useMemo(() => [...new Set(IDOLS.map(i => i.pref))], []);
      const uniqueStyles = useMemo(() => [...new Set(IDOLS.map(i => i.style))], []);

      const filteredIdols = useMemo(() => {
        return IDOLS.filter(idol => {
          if (idolSearchText && !idol.name.includes(idolSearchText)) return false;
          if (idolFilterType === 'rookie' && !idol.isRookie) return false;
          if (idolFilterType === 'pref' && idol.pref !== idolFilterPref) return false;
          if (idolFilterType === 'style' && idol.style !== idolFilterStyle) return false;
          return true;
        });
      }, [idolSearchText, idolFilterType, idolFilterPref, idolFilterStyle]);

      const openIdolDetail = (idol) => { setSelectedIdol(idol); setActiveTab('idolDetail'); window.scrollTo(0,0); };
      const openProducerDetail = (producer) => { setSelectedProducer(producer); setActiveTab('producerDetail'); window.scrollTo(0,0); };
      const scrollToSection = (id) => { if(activeTab !== 'home') setActiveTab('home'); setTimeout(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); }, 100); };

      return (
        <div className="pb-24">
          <header className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md shadow-sm py-2">
            <div className="max-w-6xl mx-auto px-4 flex justify-between items-center">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => {setActiveTab('home'); window.scrollTo(0,0);}}>
                <img src="./logo.png" alt="もしアイ" className="h-14 md:h-20 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                <span style={{display: 'none'}} className="text-xl font-bold text-pink-500 font-serif">もしアイ</span>
              </div>
              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-gray-700">
                {['HOME', 'RANKING', 'IDOL LIST', 'MAGAZINE'].map((item) => (
                  <button key={item} onClick={() => {
                    if(item === 'MAGAZINE') scrollToSection('magazine');
                    else scrollToSection(item.toLowerCase().replace(' ', '-'));
                  }} className="hover:text-pink-500 transition-colors uppercase font-bold tracking-wider">{item}</button>
                ))}
              </nav>
            </div>
          </header>

          <main className="pt-24">
            {activeTab === 'idolDetail' && selectedIdol ? (
              <IdolDetailView idol={selectedIdol} onBack={() => setActiveTab('home')} />
            ) : activeTab === 'producerDetail' && selectedProducer ? (
              <ProducerDetailView producer={selectedProducer} onBack={() => setActiveTab('home')} />
            ) : (
              <div className="animate-fade-in">
                
                {/* HERO SECTION (top.png復活 & 中央寄せ) */}
                <section id="home" className="py-8 md:py-12 max-w-6xl mx-auto px-4 text-center">
                  <div className="flex flex-col items-center">
                    <img src="./catchphrase.png" className="h-10 md:h-14 object-contain mb-4 drop-shadow-sm" onError={(e) => e.target.style.display='none'} />
                    
                    {/* メインロゴ・タイトル画像 */}
                    <img src="./top.png" className="w-full max-w-2xl object-contain drop-shadow-md mb-10" onError={(e) => e.target.style.display='none'} />
                    
                    {/* バナーギャラリー (修正版: 画像の下にテキスト) */}
                    <div className="w-full max-w-6xl overflow-hidden relative group">
                       <div className="flex gap-6 overflow-x-auto hide-scrollbar snap-x snap-mandatory px-4 pb-10">
                         {BANNERS.map(banner => (
                           <div key={banner.id} className="flex-shrink-0 w-[85%] md:w-[45%] snap-center">
                             {/* バナー画像 */}
                             <div className="relative aspect-[16/9] w-full rounded-[2rem] overflow-hidden shadow-lg border-4 border-white mb-4 transition-transform hover:scale-[1.02]">
                               <img src={banner.image} className="w-full h-full object-cover" onError={(e) => { e.target.src = 'https://via.placeholder.com/800x450/fdf2f8/db2777?text=Banner+Image'; }} />
                               <div className="absolute top-4 left-4">
                                 <span className="bg-black/50 backdrop-blur-md text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">{banner.label}</span>
                               </div>
                             </div>
                             {/* バナー情報テキスト (画像の下) */}
                             <div className="text-left px-4">
                               <h3 className="text-lg md:text-xl font-bold text-gray-800 leading-tight mb-1">{banner.title}</h3>
                               <p className="text-xs md:text-sm text-gray-500 font-medium mb-3">{banner.subtitle}</p>
                               <button className="flex items-center gap-1.5 text-pink-500 font-bold text-xs hover:gap-3 transition-all">
                                 {banner.linkText} <i className="fa-solid fa-arrow-right-long"></i>
                               </button>
                             </div>
                           </div>
                         ))}
                       </div>
                       
                       {/* ガイドアイコン (ドット) */}
                       <div className="flex justify-center gap-2 -mt-4">
                         {BANNERS.map((_, i) => (
                           <div key={i} className={`w-2 h-2 rounded-full transition-colors ${i === 0 ? 'bg-pink-500' : 'bg-pink-200'}`}></div>
                         ))}
                       </div>
                    </div>
                  </div>
                </section>

                {/* IDOL CARD SLIDER */}
                <section id="idol-slider" className="py-8 bg-white/20 backdrop-blur-sm border-y border-white/50 mb-10">
                  <div className="max-w-6xl mx-auto">
                    <div className="flex items-center gap-2 px-6 mb-4">
                      <i className="fa-solid fa-wand-magic-sparkles text-pink-500"></i>
                      <h2 className="text-lg font-bold text-gray-800 font-serif uppercase tracking-widest">Pick Up Idols</h2>
                    </div>
                    <div className="flex gap-4 overflow-x-auto hide-scrollbar px-6 pb-4">
                      {IDOLS.map((idol, i) => (
                        <div key={idol.id} className="w-48 shrink-0 relative rounded-3xl overflow-hidden shadow-lg group bg-white border border-white">
                          {idol.titleBadge && (
                            <div className="absolute top-2 right-2 bg-gradient-to-br from-yellow-300 to-amber-500 text-white text-[8px] font-bold px-2 py-1 rounded-full shadow-lg transform rotate-6 border border-white z-20">
                              <i className="fa-solid fa-crown"></i>
                            </div>
                          )}
                          <div className="aspect-[2/3] overflow-hidden relative">
                            {idol.videoUrl ? (
                              <video src={idol.videoUrl} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" autoPlay muted loop playsInline></video>
                            ) : (
                              <img src={`./idol${idol.id}.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                            )}
                            {idol.videoUrl && (
                                <div className="absolute bottom-2 right-2 text-white/50 text-xs"><i className="fa-solid fa-play"></i></div>
                            )}
                          </div>
                          <div className="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
                            <h3 className="font-bold text-base mb-1">{idol.name}</h3>
                            <p className="text-[10px] opacity-90 line-clamp-1 mb-3">"{idol.catchphrase}"</p>
                            <button onClick={() => openIdolDetail(idol)} className="w-full py-1.5 bg-pink-500 rounded-full text-[10px] font-bold flex items-center justify-center gap-1 shadow-inner">
                              <i className="fa-solid fa-heart"></i> プロデュースする
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                {/* TOPICS SECTION */}
                <section id="topics" className="py-12 max-w-6xl mx-auto px-4">
                  <div className="text-center mb-10"><h2 className="text-4xl font-serif text-gray-800 uppercase tracking-widest drop-shadow-sm">Topics</h2></div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    {TOPICS_DATA.map((topic) => (
                      <div key={topic.id} className="group cursor-pointer">
                        <div className="relative overflow-hidden rounded-2xl mb-4 shadow-sm bg-white/80 aspect-[16/10] border border-white p-1">
                          <img src={`./topic${topic.id}.png`} className="w-full h-full object-cover rounded-xl transition-transform duration-500 group-hover:scale-105" onError={(e)=>e.target.src='https://via.placeholder.com/400x250/fdf2f8/db2777?text=NEWS'} />
                        </div>
                        <div className="px-1 text-[10px] font-bold text-gray-400 mb-1">{topic.date} | <span className="text-pink-500 font-bold">{topic.label}</span></div>
                        <h3 className="font-bold text-gray-800 text-sm md:text-base leading-tight group-hover:text-pink-500 transition-colors">{topic.title}</h3>
                      </div>
                    ))}
                  </div>
                </section>

                {/* EVENT DASHBOARD */}
                <section id="ranking" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="EVENT DASHBOARD" subtitle="最新の戦況とイベント詳細を確認" iconClass="fa-solid fa-trophy" />
                  <div className="flex bg-white/80 backdrop-blur-sm rounded-2xl p-1 mb-10 shadow-sm border border-white max-w-lg mx-auto">
                    {[{id:'ranking',label:'ランキング',icon:'fa-list-ol'},{id:'about',label:'概要',icon:'fa-circle-info'},{id:'benefits',label:'特典',icon:'fa-gift'}].map(t=>(
                      <button key={t.id} onClick={()=>setEventTab(t.id)} className={`flex-1 py-3 px-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all ${eventTab===t.id?'bg-pink-500 text-white shadow-md':'text-gray-500 hover:text-pink-500'}`}>
                        <i className={`fa-solid ${t.icon}`}></i> {t.label}
                      </button>
                    ))}
                  </div>
                  <div className="animate-fade-in min-h-[400px]">
                    {eventTab === 'ranking' && (
                      <div className="space-y-8 animate-fade-in-up">
                        <div className="flex gap-2 overflow-x-auto pb-4 hide-scrollbar justify-center">
                          {RANKING_TABS.map(tab => (
                            <button key={tab.id} onClick={() => setActiveRankingTab(tab.id)} className={`px-4 py-2 rounded-full font-bold text-xs whitespace-nowrap transition-all border-2 ${activeRankingTab === tab.id ? 'bg-pink-500 text-white border-pink-500 shadow-sm transform scale-105' : 'bg-white/80 text-gray-500 border-white hover:border-pink-200'}`}>
                              <i className={`fa-solid ${tab.icon} mr-2`}></i>{tab.label}
                            </button>
                          ))}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-12" key={activeRankingTab}>
                          {(RANKING_DATA[activeRankingTab] || []).map((item, index) => (
                              <div key={index} onClick={() => {const idol=IDOLS.find(i=>i.id===item.idolId); if(idol) openIdolDetail(idol)}} className={`relative cursor-pointer group transition-transform hover:-translate-y-2 flex flex-col items-center ${index === 0 ? 'md:-translate-y-4' : ''}`}>
                                <div className={`absolute -top-4 left-1/2 -translate-x-1/2 w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg text-white shadow-md z-30 ${index === 0 ? 'bg-yellow-400' : index === 1 ? 'bg-gray-300' : 'bg-orange-300'}`}>{item.rank}</div>
                                <div className="relative w-4/5 md:w-full aspect-[3/4] rounded-lg overflow-hidden shadow-lg bg-white/30 backdrop-blur-sm p-1">
                                  <img src="./rank_frame.png" className="absolute inset-0 w-full h-full object-fill z-0 pointer-events-none" onError={(e) => { e.target.src = './rank_frame.jpg'; }} />
                                  <div className="absolute inset-[13.5%] overflow-hidden z-10 flex items-center justify-center bg-pink-50/50">
                                      <img src={`./profile${item.rank}.png`} className="w-full h-full object-cover animate-slow-zoom" onError={(e)=>e.target.src='https://via.placeholder.com/300x400/fdf2f8/db2777?text=PHOTO'} />
                                  </div>
                                </div>
                                <div className="text-center mt-4"><h4 className="font-bold text-lg text-gray-800 mb-1 drop-shadow-sm">{item.name}</h4><p className="text-pink-600 font-mono font-bold text-sm">{item.value}</p></div>
                              </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </section>

                {/* IDOL LIST */}
                <section id="idol-list" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="IDOL LIST" subtitle="あなただけの原石（推し）を見つけよう！" iconClass="fa-solid fa-users" />
                  <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-4 md:p-6 shadow-sm border border-white mb-8 max-w-4xl mx-auto">
                    <div className="relative mb-4">
                      <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i className="fa-solid fa-magnifying-glass text-gray-400"></i></div>
                      <input type="text" placeholder="名前で検索..." value={idolSearchText} onChange={(e) => setIdolSearchText(e.target.value)} className="w-full pl-11 py-3 bg-white/50 border border-gray-200 rounded-full focus:outline-none ring-pink-300 font-medium shadow-sm" />
                    </div>
                    <div className="flex flex-wrap gap-2">
                       {['all', 'rookie', 'pref', 'style'].map(type => (
                         <button key={type} onClick={() => setIdolFilterType(type)} className={`px-4 py-2 rounded-full text-xs font-bold border transition-colors shadow-sm ${idolFilterType === type ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-gray-600 border-gray-200 hover:bg-pink-50'}`}>
                           {type === 'all' ? 'すべて' : type === 'rookie' ? '新人' : type === 'pref' ? '都道府県別' : '系統別'}
                         </button>
                       ))}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                    {filteredIdols.map((idol) => (
                      <div key={idol.id} onClick={() => openIdolDetail(idol)} className="group cursor-pointer">
                        <div className="relative overflow-hidden rounded-3xl mb-3 shadow-md bg-white/90 p-1 border border-white">
                          {idol.titleBadge && (
                            <div className="absolute top-2 right-2 bg-gradient-to-br from-yellow-300 to-amber-500 text-white text-[9px] font-bold px-2 py-1 rounded-full shadow-lg transform rotate-6 border border-white z-20"><i className="fa-solid fa-crown"></i></div>
                          )}
                          <img src={`./idol${idol.id}.png`} className="w-full aspect-[4/5] object-cover rounded-2xl transition-transform duration-500 group-hover:scale-105" onError={(e)=>e.target.src='https://via.placeholder.com/300x400/fdf2f8/db2777?text=IDOL'} />
                        </div>
                        <div className="px-2">
                          <h4 className="font-bold text-gray-800 text-lg group-hover:text-pink-500 transition-colors drop-shadow-sm">{idol.name}</h4>
                          <p className="text-xs text-gray-700 line-clamp-1 font-medium drop-shadow-sm italic">"{idol.catchphrase}"</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
                
                {/* PRODUCER RANKING */}
                <section id="producer-ranking" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="PRODUCER RANKING" subtitle="トッププロデューサーたち！" iconClass="fa-solid fa-user-tie" />
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {PRODUCERS.map((producer, index) => (
                      <div key={index} onClick={() => openProducerDetail(producer)} className="bg-white/90 backdrop-blur-sm rounded-3xl p-5 shadow-md border-2 border-white cursor-pointer group transition-transform hover:-translate-y-2 text-center">
                        <div className={`w-20 h-20 rounded-full mb-3 mx-auto shadow-inner flex items-center justify-center bg-gradient-to-br ${producer.iconColor} border-2 border-white transition-transform group-hover:scale-105`}><i className="fa-solid fa-user-tie text-3xl text-white opacity-80"></i></div>
                        <div className="bg-yellow-50 text-yellow-700 text-[10px] font-bold px-2 py-0.5 rounded-full mb-2">{producer.title}</div>
                        <h4 className="font-bold text-base group-hover:text-blue-500 transition-colors">{producer.name}</h4>
                        <p className="text-xs text-gray-500 font-mono font-bold">{producer.value}</p>
                      </div>
                    ))}
                  </div>
                </section>

                <section id="magazine" className="py-16 bg-white/40 backdrop-blur-md rounded-[3rem] p-4 md:p-10 border border-white shadow-xl my-10 relative overflow-hidden max-w-6xl mx-auto">
                  <SectionTitle title="MAGAZINE ARCHIVE" subtitle="あなたが主役の誌面体験。過去の表紙をチェック" iconClass="fa-solid fa-book-open" />
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 relative z-10">
                    {MAGAZINES.map((mag) => (
                      <div key={mag.id} className="flex flex-col items-center group">
                        <div className="relative w-4/5 md:w-full aspect-[3/4] bg-white/80 rounded-md shadow-lg border-l-4 border-white p-2 transition-transform group-hover:-translate-y-2">
                          <img src={`./mag${mag.id}.png`} alt={mag.title} className="w-full h-full object-cover rounded shadow-inner" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                          <div className="absolute top-4 left-0 bg-pink-500 text-white text-[10px] font-bold py-1 px-3 rounded-r-full shadow-md">{mag.issue}</div>
                        </div>
                        <div className="text-center mt-6 px-2">
                          <span className={`text-[10px] font-bold px-2 py-1 rounded-full shadow-sm border border-white ${mag.status === '発売中' ? 'bg-white text-gray-600' : 'bg-pink-100 text-pink-600'}`}>{mag.status}</span>
                          <h4 className="font-bold text-base mt-2 text-gray-800 line-clamp-1">{mag.title}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}
          </main>

          <footer className="bg-gray-900/90 backdrop-blur-md text-white pt-16 pb-32 md:pb-16 mt-20 rounded-t-[3rem] border-t border-white/20 shadow-2xl relative z-10 text-center md:text-left">
            <div className="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-10">
              <div>
                <img src="./logo.png" className="h-16 md:h-20 object-contain mb-4 mx-auto md:mx-0" onError={(e)=>e.target.style.display='none'} />
                <p className="text-gray-300 text-sm font-medium">もしも私が、アイドルになったら。<br />あなたのスマホから始まる、新しい物語。</p>
              </div>
            </div>
          </footer>

          {(activeTab === 'home' || activeTab === 'idolDetail') && (
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-transparent z-50 md:flex md:justify-center animate-fade-in-up">
              <div className="max-w-md w-full mx-auto md:mx-0 flex items-center gap-3 p-2">
                <div className="hidden md:block text-sm font-bold text-gray-700 ml-4 mr-2 drop-shadow-sm">次世代アイドル<br/>エントリー受付中！</div>
                <div className="flex-1 animate-float">
                  <a href="https://line.me" target="_blank" rel="noreferrer">
                    <img src="./line_btn.png" alt="LINEで無料エントリー！" className="w-full max-h-20 object-contain cursor-pointer transition-transform transform hover:scale-110 drop-shadow-xl mx-auto" />
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
