                  <div className="max-w-7xl mx-auto px-6">
                    <EditorialTitle title="NEW FACES" subtitle="あなただけの原石を見つけよう" englishText="Pick Up Idols" />
                    
                    <div className="flex gap-6 overflow-x-auto hide-scrollbar pb-12 pt-4 px-4 -mx-4">
                      {IDOLS.map((idol, i) => (
                        <div key={idol.id} onClick={() => openIdolDetail(idol)} className="w-[280px] shrink-0 group cursor-pointer">
                          <div className="relative bg-white p-3 md:p-4 pb-12 md:pb-16 shadow-[0_20px_50px_rgba(0,0,0,0.08)] transform transition-all duration-500 group-hover:-translate-y-4" style={{ transform: `rotate(${i % 2 === 0 ? '2deg' : '-2deg'})` }}>
                            {/* LIVE Badge */}
                            {idol.isStreaming && (
                              <div className="absolute -top-3 -right-3 z-30 bg-red-600 text-white font-timer font-bold tracking-widest px-4 py-1 animate-live shadow-lg text-xs">
                                LIVE NOW
                              </div>
                            )}
                            
                            <div className="aspect-[3/4] overflow-hidden bg-gray-100 relative filter grayscale-[20%] group-hover:grayscale-0 transition-all duration-700">
                              <img src={`./idol${idol.id}.png`} className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700" onError={(e)=>e.target.src='https://via.placeholder.com/300x400/fdf2f8/db2777?text=SNAP'} />
                            </div>
                            
                            <div className="absolute bottom-4 left-4 right-4 text-center">
                              <p className="font-editorial text-2xl font-bold text-gray-900 mb-1">{idol.name}</p>
                              <p className="font-serif text-[10px] text-gray-500 tracking-widest">"{idol.catchphrase}"</p>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                {/* MAGAZINE WARS (Event Dashboard) */}
                <section className="py-24 bg-gray-900 text-white relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-[50vw] h-full bg-pink-900/20 mix-blend-overlay"></div>
                  
                  <div className="max-w-6xl mx-auto px-6 relative z-10">
                    <EditorialTitle title="MAGAZINE WARS" subtitle="創刊号の表紙を決める頂上決戦" englishText="Ranking" />

                    <div className="bg-white/5 backdrop-blur-sm border border-white/10 p-1">
                      <CountdownTimer endDate={EVENTS_DATA[0].endDate} />
                      
                      <div className="mt-20 p-6 md:p-12">
                        <div className="text-center mb-16">
                          <p className="text-pink-400 font-bold tracking-widest text-sm mb-4">PRODUCER'S MISSION</p>
                          <h4 className="font-serif text-2xl md:text-4xl font-bold leading-tight">
                            君の1票が、<br className="md:hidden"/>彼女の明日の衣装を決める。
                          </h4>
                        </div>

                        {/* Ranking Podium */}
                        <div className="flex justify-center items-end gap-4 md:gap-8 mb-16">
                          {EVENTS_DATA[0].rankingData.overall.slice(0,3).map((item, idx) => {
                            let order = idx === 0 ? "order-2" : idx === 1 ? "order-1" : "order-3";
                            let h = idx === 0 ? "h-64 md:h-80" : "h-48 md:h-60";
                            return (
                              <div key={idx} className={`flex flex-col items-center ${order} w-1/3 max-w-[200px]`}>
                                <div className={`w-full ${h} relative group cursor-pointer`}>
                                  <img src={`./profile${item.rank}.png`} className="w-full h-full object-cover filter grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500" onError={(e)=>e.target.src=`https://via.placeholder.com/200x300/374151/9ca3af?text=NO.${item.rank}`} />
                                  <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                                  <div className="absolute bottom-4 left-0 w-full text-center">
                                    <p className="font-timer text-3xl md:text-5xl font-bold text-white mb-1 drop-shadow-md">{item.rank}</p>
                                    <p className="font-serif text-sm font-bold text-gray-200">{item.name}</p>
                                    <p className="font-timer text-pink-400 text-sm mt-1">{item.value}</p>
                                  </div>
                                </div>
                              </div>
                            )
                          })}
                        </div>
                        
                        <div className="text-center">
                          <button onClick={() => showToast('ランキング詳細へ移動します')} className="px-12 py-4 border border-white/30 text-white font-editorial tracking-[0.2em] hover:bg-white hover:text-gray-900 transition-colors">
                            VIEW FULL RANKING
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>

                {/* OFF-MELTY (Lookbook style) */}
                <section className="py-24 bg-white">
                  <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center gap-12">
                    <div className="w-full md:w-1/2 relative">
                      <div className="aspect-[3/4] bg-gray-100 overflow-hidden">
                         <img src="./off_melty_main.png" className="w-full h-full object-cover" onError={(e)=>e.target.src='https://via.placeholder.com/600x800/f3e8ff/9333ea?text=Off-Melty+Look'} />
                      </div>
                      <div className="absolute -bottom-8 -right-8 w-48 h-48 bg-pink-100 rounded-full mix-blend-multiply blur-2xl"></div>
                    </div>
                    
                    <div className="w-full md:w-1/2">
                      <p className="font-editorial text-pink-500 text-xl tracking-[0.3em] mb-4">SPONSORED BY</p>
                      <h3 className="font-editorial text-5xl md:text-6xl font-bold text-gray-900 mb-8">Off-Melty</h3>
                      <p className="font-serif text-gray-600 leading-loose mb-8">
                        ステージを降りた、一番かわいい私。<br/>
                        公式姉妹ブランド『Off-Melty』の新作ルックブック。<br/>
                        <br/>
                        プロデューサーの皆様は、カタログから衣装を選び、<br/>
                        推しにプレゼント（衣装提供）することで<br/>
                        彼女たちのオーディションを強力にバックアップできます。
                      </p>
                      <button onClick={() => showToast('Off-Meltyカタログを開きます')} className="group flex items-center gap-4 text-gray-900 font-bold tracking-widest pb-2 border-b-2 border-gray-900 hover:text-pink-500 hover:border-pink-500 transition-colors">
                        VIEW LOOKBOOK 
                        <i className="fa-solid fa-arrow-right transform group-hover:translate-x-2 transition-transform"></i>
                      </button>
                    </div>
                  </div>
                </section>

                {/* EMOTIONAL AUDITION CTA */}
                <section className="py-32 bg-pink-50 relative overflow-hidden text-center border-t border-pink-100">
                  <div className="max-w-3xl mx-auto px-6 relative z-10">
                    <h3 className="font-serif text-3xl md:text-5xl font-bold text-gray-900 leading-tight mb-8">
                      「かわいい」だけじゃ、<br/>終われない。
                    </h3>
                    <p className="text-gray-600 leading-loose font-serif mb-12">
                      普通の女の子だった私が、表紙を飾るまで。<br/>
                      次世代のシンデレラーストーリーは、<br/>
                      あなたのそのタップから始まります。
                    </p>
                    <a href="https://line.me" target="_blank" rel="noreferrer" className="inline-block bg-gray-900 text-white font-bold tracking-[0.2em] px-12 py-5 rounded-full shadow-2xl hover:bg-pink-600 hover:scale-105 transition-all duration-300">
                      LINEで無料エントリー
                    </a>
                  </div>
                </section>

              </div>
            )}
            
            {/* アイドル詳細画面 (Editorial Layout) */}
            {activeTab === 'idolDetail' && selectedIdol && (
              <div className="animate-fade-in pb-32 pt-20">
                <div className="max-w-5xl mx-auto px-6">
                  <button onClick={() => setActiveTab('home')} className="mb-12 text-gray-400 hover:text-gray-900 tracking-widest text-xs font-bold transition-colors flex items-center gap-2">
                    <i className="fa-solid fa-arrow-left"></i> BACK TO HOME
                  </button>

                  <div className="flex flex-col md:flex-row gap-12 md:gap-20">
                    {/* 左側：巨大な写真とステータス */}
                    <div className="w-full md:w-1/2">
                      <div className="relative aspect-[3/4] shadow-2xl mb-8 group">
                        <img src={`./idol${selectedIdol.id}.png`} className="w-full h-full object-cover filter contrast-125" onError={(e)=>e.target.src='https://via.placeholder.com/600x800/fdf2f8/db2777?text=PORTRAIT'} />
                        <div className="absolute inset-0 border border-white/40 m-4 pointer-events-none"></div>
                        {selectedIdol.isStreaming && (
                          <div className="absolute top-4 left-4 bg-red-600 text-white text-xs font-bold px-4 py-1 tracking-wider animate-live">
                            LIVE
                          </div>
                        )}
                      </div>
                      
                      {/* KPI */}
                      <div className="grid grid-cols-3 gap-px bg-gray-200 border border-gray-200">
                        <div className="bg-white p-4 text-center">
                          <p className="text-[10px] text-gray-400 font-bold tracking-widest mb-1">RANK</p>
                          <p className="font-timer text-3xl text-gray-900">12</p>
                        </div>
                        <div className="bg-white p-4 text-center">
                          <p className="text-[10px] text-gray-400 font-bold tracking-widest mb-1">POINT</p>
                          <p className="font-timer text-3xl text-pink-500">12.4K</p>
                        </div>
                        <div className="bg-white p-4 text-center">
                          <p className="text-[10px] text-gray-400 font-bold tracking-widest mb-1">FANS</p>
                          <p className="font-timer text-3xl text-gray-900">{selectedIdol.producerCount}</p>
                        </div>
                      </div>
                    </div>

                    {/* 右側：テキストとアクション */}
                    <div className="w-full md:w-1/2 flex flex-col justify-center">
                      <p className="text-pink-500 font-bold tracking-[0.2em] text-sm mb-4">ENTRY NO. {String(selectedIdol.id).padStart(3, '0')}</p>
                      <h1 className="font-serif text-5xl md:text-6xl font-bold text-gray-900 mb-6">{selectedIdol.name}</h1>
                      <p className="text-2xl font-editorial italic text-gray-400 mb-10">"{selectedIdol.catchphrase}"</p>
                      
                      <div className="prose prose-pink mb-12">
                        <p className="font-serif leading-loose text-gray-600 whitespace-pre-wrap text-sm md:text-base">
                          {selectedIdol.story}
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-y-4 gap-x-8 mb-12 border-t border-b border-gray-200 py-6">
                        <div><span className="text-[10px] text-gray-400 block tracking-widest">FROM</span><span className="font-bold text-gray-900">{selectedIdol.pref}</span></div>
                        <div><span className="text-[10px] text-gray-400 block tracking-widest">STYLE</span><span className="font-bold text-gray-900">{selectedIdol.style}</span></div>
                        <div><span className="text-[10px] text-gray-400 block tracking-widest">SKILL</span><span className="font-bold text-gray-900">{selectedIdol.specialSkill || 'N/A'}</span></div>
                      </div>

                      {/* プロデュースアクション */}
                      <div className="space-y-4">
                        <p className="text-[10px] text-pink-500 font-bold tracking-widest mb-2">PRODUCE ACTIONS</p>
                        <button onClick={() => { setSuccessModalData({ actionType: '投票', amount: 1, idolName: selectedIdol.name }); }} className="w-full py-4 bg-gray-900 text-white font-bold tracking-[0.2em] text-sm hover:bg-pink-600 transition-colors flex justify-center items-center gap-3">
                          <i className="fa-solid fa-heart"></i> VOTE (無料投票)
                        </button>
                        <button onClick={() => { setSuccessModalData({ actionType: '衣装提供', amount: 15000, idolName: selectedIdol.name }); }} className="w-full py-4 border border-gray-900 text-gray-900 font-bold tracking-[0.2em] text-sm hover:bg-gray-100 transition-colors flex justify-center items-center gap-3">
                          <i className="fa-solid fa-shirt"></i> OUTFIT (衣装提供)
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer className="bg-white border-t border-gray-100 py-24 text-center">
            <div className="max-w-4xl mx-auto px-6">
              <img src="./logo.png" className="h-12 mx-auto mb-10 filter grayscale" alt="もしアイ" onError={(e)=>e.target.style.display='none'} />
              <p className="font-editorial text-2xl tracking-[0.3em] mb-12 text-gray-900">SUBSCRIBE TO OUR NEWSLETTER</p>
              
              <div className="flex justify-center gap-8 mb-16">
                <a href="#" className="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:text-pink-500 hover:border-pink-500 transition-all"><i className="fa-brands fa-instagram text-xl"></i></a>
                <a href="#" className="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:text-gray-900 hover:border-gray-900 transition-all"><i className="fa-brands fa-x-twitter text-xl"></i></a>
              </div>
              
              <div className="text-[9px] tracking-[0.2em] text-gray-400 space-x-6 mb-6">
                <a href="#" className="hover:text-gray-900">TERMS</a>
                <a href="#" className="hover:text-gray-900">PRIVACY</a>
                <a href="#" className="hover:text-gray-900">CONTACT</a>
              </div>
              <p className="text-[9px] tracking-[0.2em] text-gray-300">&copy; 2026 MOSHI-AI PROJECT.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
