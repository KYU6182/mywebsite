                    <span className="text-[10px] text-gray-400 font-bold"><i className="fa-solid fa-location-dot mr-1"></i>{idol.pref}</span>
                    <span className="text-[10px] text-gray-400 font-bold"><i className="fa-solid fa-ribbon mr-1"></i>{idol.style}</span>

                </div>
                <i className="fa-solid fa-chevron-right text-pink-200 group-hover:text-pink-400 transition-colors pr-2"></i>
              </div>

    // --- 詳細表示用コンポーネント ---
    const IdolDetailView = ({ idol, onBack, onVoteClick, onOutfitClick, onMyOshiClick }) => {
      const [copySuccess, setCopySuccess] = useState(false);
      
      const relatedArticles = useMemo(() => {
        return TOPICS_DATA.filter(topic => topic.title.includes(idol.name));
      }, [idol.name]);

      const handleCopyTemplate = () => {
        const templateText = `私がプロデュースしている【${idol.name}】ちゃん！\n"${idol.catchphrase}"\n\n『もしも私が、アイドルになったら。』\nみんなもプロデューサーになって一緒に応援してね✨\n\n#もしアイ #アイドルオーディション #${idol.name}\nhttps://moshi-ai.example.com`;
        const textArea = document.createElement("textarea");
        textArea.value = templateText;
        document.body.appendChild(textArea);
        textArea.select();
        try { document.execCommand('copy'); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2500); } 
        catch (err) { console.error('コピーに失敗しました', err); }
        document.body.removeChild(textArea);
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-6 animate-fade-in-up pb-32">
          <button onClick={onBack} className="mb-6 text-pink-500 font-bold flex items-center gap-2 hover:bg-pink-50 px-4 py-2 rounded-full transition-colors bg-white/80 backdrop-blur-sm shadow-sm border border-pink-100">
            <i className="fa-solid fa-arrow-left"></i> 前の画面に戻る
          </button>
          
          <div className="bg-white/90 backdrop-blur-md rounded-[2.5rem] p-3 shadow-xl border border-pink-100 mb-8 relative text-center">
            <div className="relative rounded-[2rem] overflow-hidden border-8 border-pink-50 bg-gray-100 aspect-[3/4] sm:aspect-[4/5] mx-auto">
              {idol.titleBadge && (
                <div className="absolute top-3 right-3 bg-gradient-to-br from-yellow-300 to-amber-500 text-white text-[11px] md:text-xs font-bold px-3 py-1.5 rounded-full shadow-lg transform rotate-6 border-2 border-white z-20 flex items-center gap-1">
                  <i className="fa-solid fa-crown text-[10px]"></i> {idol.titleBadge}
                </div>
              )}
              {idol.videoUrl ? (
                <video src={idol.videoUrl} className="w-full h-full object-cover" autoPlay muted loop playsInline></video>
              ) : (
                <img src={`./idol${idol.id}.png`} className="w-full h-full object-cover" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='flex'; }} />
              )}
              <div style={{display: 'none'}} className="w-full h-full flex items-center justify-center bg-pink-100 text-pink-300"><i className="fa-solid fa-camera text-4xl"></i></div>
              <div className="absolute top-4 left-4 flex flex-col gap-1.5 z-10 text-left">
                <span className="bg-black/60 backdrop-blur-sm text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">{idol.type}</span>
              </div>
            </div>
            <div className="flex justify-around items-center mt-6 mb-2">
              <div className="text-center"><p className="text-[10px] text-gray-500 font-bold">順位</p><p className="text-xl md:text-2xl font-bold text-pink-500 font-serif">12位</p></div>
              <div className="text-center"><p className="text-[10px] text-gray-500 font-bold">ポイント</p><p className="text-xl md:text-2xl font-bold text-purple-500 font-serif">12,450pt</p></div>
              <div className="text-center"><p className="text-[10px] text-gray-500 font-bold">プロデューサー</p><p className="text-xl md:text-2xl font-bold text-blue-500 font-serif">{idol.producerCount}人</p></div>
            </div>
          </div>

          <div className="text-center mb-6 px-4">
            <h1 className="text-3xl font-bold text-gray-800 mb-2 font-serif">{idol.name}</h1>
            <p className="text-pink-600 font-bold text-sm bg-white/80 backdrop-blur-sm inline-block px-4 py-1.5 rounded-full mb-4 shadow-sm border border-pink-100">"{idol.catchphrase}"</p>
          </div>

          <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-6">
            <h3 className="text-lg font-bold text-gray-800 mb-4 border-l-4 border-pink-500 pl-3">Profile</h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="bg-pink-50/50 p-3 rounded-2xl flex flex-col items-center">
                <i className="fa-solid fa-cake-candles text-pink-400 mb-1"></i>
                <p className="text-[10px] text-gray-400 font-bold">生年月日</p>
                <p className="text-xs font-bold text-gray-700">{idol.birthday}</p>
              </div>
              <div className="bg-pink-50/50 p-3 rounded-2xl flex flex-col items-center">
                <i className="fa-solid fa-map-pin text-pink-400 mb-1"></i>
                <p className="text-[10px] text-gray-400 font-bold">出身地</p>
                <p className="text-xs font-bold text-gray-700">{idol.hometown}</p>
              </div>
              <div className="bg-pink-50/50 p-3 rounded-2xl flex flex-col items-center">
                <i className="fa-solid fa-star text-pink-400 mb-1"></i>
                <p className="text-[10px] text-gray-400 font-bold">特技</p>
                <p className="text-xs font-bold text-gray-700">{idol.specialSkill}</p>
              </div>
            </div>
          </div>

          <div className="mb-6 relative px-2">
            <button onClick={() => onMyOshiClick(idol)} className="w-full bg-gradient-to-r from-yellow-400 to-amber-500 text-white py-3.5 rounded-2xl shadow-md flex items-center justify-center gap-3 font-bold hover:opacity-90 transition-all transform hover:-translate-y-1 mb-3">
              <i className="fa-solid fa-star text-xl"></i>
              <span>MY担当に設定する</span>
            </button>
            <button onClick={handleCopyTemplate} className="w-full bg-gradient-to-r from-purple-600 via-pink-500 to-rose-400 text-white py-3.5 rounded-2xl shadow-md flex items-center justify-center gap-3 font-bold hover:opacity-90 transition-all transform hover:-translate-y-1">
              <div className="flex gap-1.5"><i className="fa-brands fa-instagram text-xl"></i><i className="fa-brands fa-tiktok text-xl"></i></div>
              <span>拡散用テンプレートをコピー</span>
            </button>
            {copySuccess && (
              <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs font-bold px-4 py-2 rounded-lg animate-fade-in shadow-xl whitespace-nowrap z-50 flex items-center gap-2">
                <i className="fa-solid fa-check text-green-400"></i> コピーしました！
              </div>
            )}
          </div>

          {/* 投票と衣装提供アクションボタン */}
          <div className="grid grid-cols-3 gap-2 mb-8 px-2">
            <button onClick={onVoteClick} className="flex-1 bg-pink-500 text-white py-3 rounded-2xl shadow-lg flex flex-col items-center hover:scale-105 active:scale-95 transition-transform">
              <i className="fa-solid fa-heart mb-1 text-lg"></i><span className="text-[10px] font-bold">投票する</span>
            </button>
            <button onClick={onOutfitClick} className="flex-1 bg-gradient-to-br from-purple-500 to-pink-500 text-white py-3 rounded-2xl shadow-lg flex flex-col items-center hover:scale-105 active:scale-95 transition-transform relative overflow-hidden group">
              <div className="absolute inset-0 bg-white/20 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
              <i className="fa-solid fa-shirt mb-1 text-lg"></i><span className="text-[10px] font-bold">衣装提供</span>
            </button>
            <button className="flex-1 bg-blue-400 text-white py-3 rounded-2xl shadow-lg flex flex-col items-center hover:scale-105 active:scale-95 transition-transform">
              <i className="fa-solid fa-share-nodes mb-1 text-lg"></i><span className="text-[10px] font-bold">シェア</span>
            </button>
          </div>

          <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-8">
            <h3 className="text-lg font-bold text-gray-800 mb-3 border-l-4 border-pink-500 pl-3">私の物語</h3>
            <p className="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap bg-pink-50/30 p-4 rounded-2xl border border-pink-50">{idol.story}</p>
          </div>

          {relatedArticles.length > 0 && (
            <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-8">
              <h3 className="text-lg font-bold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">{idol.name} の関連記事</h3>
              <div className="space-y-3">
                {relatedArticles.map(topic => (
                  <div key={topic.id} className="flex gap-3 items-center p-3 hover:bg-blue-50 rounded-2xl cursor-pointer transition-colors border border-transparent hover:border-blue-100 group">
                    <div className="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-blue-500 flex-shrink-0"><i className="fa-solid fa-newspaper text-xl"></i></div>
                    <div className="flex-1">
                      <p className="text-[10px] text-gray-400 font-bold mb-0.5">{topic.date} | <span className="text-blue-500">{topic.label}</span></p>
                      <h4 className="text-xs font-bold text-gray-800 group-hover:text-blue-600 transition-colors line-clamp-1">{topic.title}</h4>
                    </div>
                    <i className="fa-solid fa-chevron-right text-gray-200 group-hover:text-blue-400 text-xs"></i>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-gray-100 mb-10">
            <div className="flex justify-between items-end mb-4 border-b border-pink-100 pb-2">
              <h3 className="text-lg font-bold text-gray-800 border-l-4 border-amber-500 pl-3">プロデューサー陣</h3>
              <span className="text-xs font-bold bg-blue-50 text-blue-600 px-3 py-1 rounded-full border border-blue-200 shadow-sm">パトロン総数: {idol.producerCount} 人</span>
            </div>
            <div className="space-y-3">
              {idol.topProducers.map((p, index) => (
                <div key={index} className="flex items-center justify-between bg-gradient-to-r from-amber-50/30 to-transparent p-3 rounded-2xl border border-amber-50/50">
                  <div className="flex items-center gap-3">
                    <div className={`w-9 h-9 rounded-full flex items-center justify-center text-white shadow-sm font-bold text-sm border-2 border-white ${index === 0 ? 'bg-gradient-to-br from-yellow-300 to-yellow-500' : index === 1 ? 'bg-gradient-to-br from-gray-300 to-gray-500' : 'bg-gradient-to-br from-orange-300 to-orange-500'}`}>
                      {index === 0 ? <i className="fa-solid fa-crown text-xs"></i> : index + 1}
                    </div>
                    <div>
                      <p className="text-[9px] font-bold text-gray-500 leading-none mb-1">{index === 0 ? 'エグゼクティブ・プロデューサー' : 'トップ・プロデューサー'}</p>
                      <span className="font-bold text-gray-800 text-sm">{p.name}</span>
                    </div>
                  </div>
                  <span className="text-sm font-mono font-bold text-blue-600 bg-white px-2 py-1 rounded-lg shadow-sm border border-blue-100">{p.pt}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- プロデューサー詳細 ---
    const ProducerDetailView = ({ producer, onBack }) => (
      <div className="max-w-2xl mx-auto px-4 py-6 animate-fade-in-up">
        <button onClick={onBack} className="mb-6 text-pink-500 font-bold flex items-center gap-2 hover:bg-pink-50 px-4 py-2 rounded-full bg-white/80 shadow-sm"><i className="fa-solid fa-arrow-left"></i> 戻る</button>
        <div className="bg-white/90 rounded-3xl p-6 shadow-sm border text-center relative overflow-hidden">
          <div className="absolute top-0 left-0 w-full h-24 bg-gray-900"></div>
          <div className={`w-24 h-24 mx-auto rounded-full mb-4 shadow-inner flex items-center justify-center bg-gradient-to-br ${producer.iconColor} border-4 border-white relative z-10`}><i className="fa-solid fa-user-tie text-4xl text-white"></i></div>
          <div className="inline-block bg-yellow-50 border border-yellow-200 text-yellow-700 text-xs font-bold px-3 py-1 rounded-full mb-2">{producer.title}</div>
          <h2 className="text-2xl font-bold text-gray-800">{producer.name}</h2>
          <p className="text-gray-500 text-sm mb-4">推しメン: <span className="font-bold text-pink-500">{producer.oshi}</span></p>
          <div className="bg-gray-50/80 rounded-2xl p-4 inline-block min-w-[200px]"><p className="text-xs font-bold mb-1">累計応援ポイント</p><p className="text-2xl font-bold text-purple-500 font-serif">{producer.value}</p></div>
        </div>
      </div>
    );

    // --- 投票モーダル (無料票 / 有料枠(雑誌購入)) ---
    const VoteModal = ({ onClose, idol, user, userData, updateTickets, showToast, onLogin }) => {
      if (!user) {
        return (
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-fade-in-up border border-pink-100">
              <div className="w-16 h-16 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-user-plus text-2xl"></i></div>
              <h3 className="text-xl font-bold mb-3 text-gray-800">プロデューサー登録</h3>
              <p className="text-sm text-gray-600 mb-6 leading-relaxed">プロデューサー登録（無料）すると、<br/>毎日ログインするだけで<br/><span className="text-pink-600 font-bold text-base">「1日3票の無料投票券」</span>がもらえます！</p>
              <button onClick={onLogin} className="w-full py-3.5 bg-pink-500 text-white font-bold rounded-xl mb-3 shadow-md hover:bg-pink-600 transition-all flex items-center justify-center gap-2">
                <i className="fa-brands fa-google"></i> アカウント登録して投票券をGET
              </button>
              <button onClick={onClose} className="text-sm text-gray-400 font-bold hover:text-gray-600">今はやめておく</button>
            </div>
          </div>
        );
      }

      const handleVote = (type, amount) => {
        if (type === 'free' && userData.freeTickets >= amount) {
          updateTickets(-amount, 0);
          showToast(`${idol.name}に ${amount} 票 投票しました！`);
        } else if (type === 'paid' && userData.paidTickets >= amount) {
          updateTickets(0, -amount);
          showToast(`${idol.name}に ${amount} 票 投票しました！(有料枠)`);
        } else {
          showToast("投票券が不足しています。");
        }
      };

      const handleBuyMagazine = (qty, price, tickets) => {
        // 仮の決済処理：有料チケットを直接付与
        updateTickets(0, tickets);
        showToast(`「第3号 ${qty}冊」を購入しました！ 有料枠 ${tickets} 枚を獲得！`);
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-3xl overflow-hidden max-w-md w-full shadow-2xl">
            <div className="bg-gradient-to-r from-pink-500 to-rose-400 text-white p-4 text-center relative">
              <h3 className="font-bold text-lg">投票ルーム</h3>
              <button onClick={onClose} className="absolute right-4 top-4 text-white hover:text-pink-200"><i className="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div className="p-5 md:p-6 max-h-[80vh] overflow-y-auto hide-scrollbar">
              <div className="flex items-center gap-4 mb-6 bg-pink-50 p-3 rounded-2xl border border-pink-100 shadow-sm">
                <img src={`./idol${idol.id}.png`} className="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm" onError={(e)=>e.target.src='https://via.placeholder.com/100/fdf2f8/db2777'} />
                <div>
                  <p className="text-[10px] text-pink-500 font-bold mb-0.5">投票先</p>
                  <h4 className="font-bold text-lg text-gray-800 leading-none">{idol.name}</h4>
                </div>
              </div>

              <div className="mb-6">
                <h5 className="font-bold text-gray-700 border-l-4 border-pink-500 pl-2 mb-3">所持チケットから投票</h5>
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-gray-50 border border-gray-200 p-3 rounded-xl text-center shadow-sm">
                    <p className="text-[10px] text-gray-500 font-bold mb-1">無料投票券 <span className="text-pink-500">(毎日3枚)</span></p>
                    <div className="text-2xl font-bold font-mono text-gray-800">{userData.freeTickets}<span className="text-sm ml-1 font-sans">枚</span></div>
                    <button onClick={() => handleVote('free', 1)} disabled={userData.freeTickets < 1} className="mt-3 w-full py-2 bg-gray-800 text-white text-xs font-bold rounded-lg disabled:opacity-30 hover:bg-gray-700 transition-colors">1票使う</button>
                  </div>
                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center relative overflow-hidden shadow-sm">
                    <div className="absolute top-0 right-0 bg-amber-400 text-white text-[8px] font-bold px-2 py-0.5 rounded-bl-lg shadow-sm">有料枠</div>
                    <p className="text-[10px] text-amber-700 font-bold mb-1">雑誌特典 投票券</p>
                    <div className="text-2xl font-bold font-mono text-amber-600">{userData.paidTickets}<span className="text-sm ml-1 font-sans">枚</span></div>
                    <button onClick={() => handleVote('paid', 1)} disabled={userData.paidTickets < 1} className="mt-3 w-full py-2 bg-amber-500 text-white text-xs font-bold rounded-lg disabled:opacity-30 hover:bg-amber-400 transition-colors">1票使う</button>
                  </div>
                </div>
              </div>

              <div className="border-t border-gray-100 pt-6">
                <h5 className="font-bold text-gray-700 border-l-4 border-amber-500 pl-2 mb-2">有料枠：投票権付き雑誌の事前販売</h5>
                <p className="text-xs text-gray-500 mb-4 leading-relaxed bg-amber-50/50 p-2 rounded text-center">雑誌を事前予約・購入することで、推しへの大量投票が可能になります！</p>
                
                <div className="space-y-3">
                  <div className="flex items-center justify-between bg-white border border-gray-200 p-3 rounded-xl shadow-sm hover:border-pink-300 transition-colors">
                    <div className="flex gap-3 items-center">
                      <div className="w-12 h-16 bg-gray-100 rounded overflow-hidden border border-gray-200"><img src="./mag3.png" className="w-full h-full object-cover" onError={(e)=>e.target.src='https://via.placeholder.com/60x80/fdf2f8/db2777'}/></div>
                      <div>
                        <p className="font-bold text-sm text-gray-800">第3号 1冊</p>
                        <p className="text-[10px] text-amber-600 font-bold flex items-center gap-1"><i className="fa-solid fa-ticket"></i> 投票券 10枚付き</p>
                      </div>
                    </div>
                    <button onClick={() => handleBuyMagazine(1, 980, 10)} className="bg-gray-800 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-gray-700">¥980</button>
                  </div>

                  <div className="flex items-center justify-between bg-gradient-to-r from-amber-50 to-white border border-amber-200 p-3 rounded-xl shadow-sm hover:border-amber-400 transition-colors relative">
                    <div className="absolute -top-2 -left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm transform -rotate-12">お得!</div>

                      <div className="relative w-14 h-16">
                        <div className="absolute top-0 left-0 w-10 h-14 bg-gray-200 rounded border border-white"></div>
                        <div className="absolute top-1 left-2 w-10 h-14 bg-gray-300 rounded border border-white"></div>
                        <div className="absolute top-2 left-4 w-10 h-14 bg-gray-100 rounded border border-white overflow-hidden shadow-sm"><img src="./mag3.png" className="w-full h-full object-cover" onError={(e)=>e.target.src='https://via.placeholder.com/60x80/fdf2f8/db2777'}/></div>
                      </div>
                      <div>
                        <p className="font-bold text-sm text-gray-800">第3号 5冊セット</p>
                        <p className="text-[10px] text-amber-600 font-bold flex items-center gap-1"><i className="fa-solid fa-ticket"></i> 投票券 60枚付き</p>
                      </div>
                    </div>
                    <button onClick={() => handleBuyMagazine(5, 2490, 60)} className="bg-amber-500 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-sm hover:bg-amber-400">¥2,490</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- 衣装提供(Off-Melty連動)モーダル ---
    const OutfitModal = ({ onClose, idol, user, userData, updateTickets, showToast, onLogin }) => {
      if (!user) {
        return (
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-fade-in-up border border-purple-100">
              <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-shirt text-2xl"></i></div>
              <h3 className="text-xl font-bold mb-3 text-gray-800">衣装提供システム</h3>
              <p className="text-sm text-gray-600 mb-6 leading-relaxed">衣装を提供して推しをランキング上位に導くには、<br/>プロデューサー登録（無料）が必要です。</p>
              <button onClick={onLogin} className="w-full py-3.5 bg-purple-600 text-white font-bold rounded-xl mb-3 shadow-md hover:bg-purple-700 transition-all">
                アカウント登録へ進む
              </button>
              <button onClick={onClose} className="text-sm text-gray-400 font-bold hover:text-gray-600">今はやめておく</button>
            </div>
          </div>
        );
      }

      const handleProvideOutfit = (item) => {
        // 仮の決済・ポイント加算処理
        updateTickets(0, 0, item.pt);
        showToast(`${idol.name}に「${item.name}」をプレゼントしました！ 大幅ランクアップ（+${item.pt.toLocaleString()}pt）！！`);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-[#fcfafc] rounded-[2rem] overflow-hidden max-w-3xl w-full shadow-2xl relative border border-purple-100">
            <div className="bg-gradient-to-r from-purple-600 to-pink-500 p-5 text-center relative shadow-sm z-10">
              <img src="./off_melty_logo_white.png" className="h-6 mx-auto mb-1" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
              <h3 style={{display: 'none'}} className="font-serif font-bold text-white text-xl mb-1">Off-Melty</h3>
              <p className="text-white/90 text-xs font-bold tracking-widest">衣装提供システム - カタログセレクト</p>
              <button onClick={onClose} className="absolute right-4 top-4 text-white/80 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div className="p-4 md:p-6 max-h-[75vh] overflow-y-auto hide-scrollbar relative">
              <div className="text-center mb-6">
                 <p className="text-sm text-gray-600 leading-relaxed font-medium bg-white p-4 rounded-xl shadow-sm border border-gray-100 inline-block">
                   新作ルックブックの中から、推しに着せたい衣装を選んでプレゼント！<br/>
                   <span className="text-purple-600 font-bold bg-purple-50 px-2 py-0.5 rounded">高倍率のプロデューサーポイント</span>が獲得でき、ランキングに大きく貢献できます。
                 </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5">
                {OFF_MELTY_CATALOG.map(item => (
                  <div key={item.id} className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col group hover:shadow-lg hover:border-purple-300 transition-all">
                    <div className="aspect-[3/4] bg-gray-50 rounded-xl overflow-hidden relative mb-3">
                      <img src={item.img} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={(e)=>e.target.src='https://via.placeholder.com/300x400/f3e8ff/9333ea?text=OUTFIT'} />
                      <div className="absolute top-2 right-2 bg-gradient-to-br from-purple-500 to-pink-500 text-white text-[11px] font-bold px-2 py-1 rounded-full shadow-md animate-pulse">
                        +{item.pt.toLocaleString()} pt
                      </div>
                    </div>
                    <h4 className="font-bold text-sm text-gray-800 line-clamp-2 mb-2 leading-tight h-10">{item.name}</h4>
                    <div className="flex justify-between items-end mb-3 mt-auto border-t border-gray-50 pt-2">
                      <p className="text-xs text-gray-500 font-medium">¥{item.price} <span className="text-[9px]">+手数料</span></p>
                      <p className="text-[10px] font-bold text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded">大貢献!</p>
                    </div>
                    <button onClick={() => handleProvideOutfit(item)} className="w-full py-2.5 bg-gray-800 text-white text-xs font-bold rounded-xl shadow-sm hover:bg-purple-600 transition-colors flex items-center justify-center gap-1.5 group-hover:shadow-md">
                      <i className="fa-solid fa-gift"></i> この衣装を推しに着せる
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home'); 
      const [selectedIdol, setSelectedIdol] = useState(null);
      const [selectedProducer, setSelectedProducer] = useState(null);
      const [activeEventId, setActiveEventId] = useState('main'); 
      const [eventTab, setEventTab] = useState('ranking'); 
      const [activeRankingTab, setActiveRankingTab] = useState('overall');
      const [idolSearchText, setIdolSearchText] = useState('');
      const [idolFilterType, setIdolFilterType] = useState('all'); 
      
      // モーダル・トースト・Firebase系State
      const [showVoteModal, setShowVoteModal] = useState(false);
      const [showOutfitModal, setShowOutfitModal] = useState(false);
      const [toastMessage, setToastMessage] = useState("");
      
      const [firebaseLoaded, setFirebaseLoaded] = useState(false);
      const [user, setUser] = useState(null);
      const [userData, setUserData] = useState({ freeTickets: 0, paidTickets: 0, totalPts: 0 });
      const authRef = useRef(null);
      const dbRef = useRef(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 3500);
      };

      // Firebaseの初期化 (window.FirebaseHelper経由)
      useEffect(() => {
        const loadFirebase = () => {
          if (window.FirebaseHelper) {
            try {
              const { initializeApp, getAuth, getFirestore } = window.FirebaseHelper;
              const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
              if (Object.keys(firebaseConfig).length === 0) {
                console.warn("Firebase config is empty. Mock mode enabled.");
                return; 
              }
              
              const app = initializeApp(firebaseConfig);
              authRef.current = getAuth(app);
              dbRef.current = getFirestore(app);
              setFirebaseLoaded(true);
            } catch (e) {
              console.error("Firebase initialization failed:", e);
            }
          } else {
            setTimeout(loadFirebase, 50);
          }
        };
        loadFirebase();
      }, []);

      // ログイン状態とログインボーナス(1日3票)の監視
      useEffect(() => {
        if (!firebaseLoaded || !authRef.current) return;
        
        const { onAuthStateChanged, doc, getDoc, setDoc, updateDoc } = window.FirebaseHelper;
        const auth = authRef.current;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const unsubscribe = onAuthStateChanged(auth, async (u) => {
          setUser(u);
          if (u) {
            const docRef = doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
            try {
               const docSnap = await getDoc(docRef);
               const today = new Date().toISOString().split('T')[0];
               
               if (docSnap.exists()) {
                 const data = docSnap.data();
                 let updates = {};
                 let newFreeTickets = data.freeTickets || 0;
                 
                 // 1日1回の無料配布（ログインボーナス）
                 if (data.lastLoginDate !== today) {
                   newFreeTickets += 3;
                   updates.lastLoginDate = today;
                   updates.freeTickets = newFreeTickets;
                   showToast("ログインボーナス！「1日3票の無料投票券」を獲得しました！");
                 }
                 
                 if (Object.keys(updates).length > 0) {
                   await updateDoc(docRef, updates);
                   setUserData({ ...data, ...updates });
                 } else {
                   setUserData(data);
                 }
               } else {
                 // 新規登録
                 const initData = {
                   freeTickets: 3,
                   paidTickets: 0,
                   totalPts: 0,
                   lastLoginDate: today,
                   createdAt: new Date().toISOString()
                 };
                 await setDoc(docRef, initData);
                 setUserData(initData);
                 showToast("プロデューサー登録完了！ 最初の無料投票券(3枚)を獲得しました！");
               }
            } catch(e) {
               console.error("Firestore data fetch error:", e);
            }
          } else {
            setUserData({ freeTickets: 0, paidTickets: 0, totalPts: 0 });
          }
        });
        return () => unsubscribe();
      }, [firebaseLoaded]);

      const handleLogin = async () => {
        if (!firebaseLoaded) {
          // Firebaseが使えない環境（プレビュー等）用のモック動作
          setUser({ uid: 'mock-user-123' });
          setUserData({ freeTickets: 3, paidTickets: 0, totalPts: 0 });
          showToast("プロデューサー登録完了！(Mock) 無料投票券(3枚)を獲得しました！");
          return;
        }
        
        try {
          const { signInAnonymously, signInWithCustomToken } = window.FirebaseHelper;
          const auth = authRef.current;
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } catch (error) {
          console.error("Login failed:", error);
          showToast("登録(ログイン)に失敗しました。");
        }
      };

      const updateTickets = async (freeDelta, paidDelta, ptsDelta = 0) => {
        const newFree = Math.max(0, userData.freeTickets + freeDelta);
        const newPaid = Math.max(0, userData.paidTickets + paidDelta);
        const newPts = (userData.totalPts || 0) + ptsDelta;
        
        const newData = { ...userData, freeTickets: newFree, paidTickets: newPaid, totalPts: newPts };
        setUserData(newData);
        
        if (firebaseLoaded && user) {
          const { doc, updateDoc } = window.FirebaseHelper;
          const db = dbRef.current;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
          try {
             await updateDoc(docRef, { freeTickets: newFree, paidTickets: newPaid, totalPts: newPts });
          } catch(e) { console.error("Data update failed", e); }
        }
      };
      
      const filteredIdols = useMemo(() => {
        return IDOLS.filter(idol => {
          if (idolSearchText && !idol.name.includes(idolSearchText)) return false;
          if (idolFilterType === 'rookie' && !idol.isRookie) return false;
          return true;
        });
      }, [idolSearchText, idolFilterType]);

      const openIdolDetail = (idol) => { setSelectedIdol(idol); setActiveTab('idolDetail'); window.scrollTo(0,0); };
      const openProducerDetail = (producer) => { setSelectedProducer(producer); setActiveTab('producerDetail'); window.scrollTo(0,0); };
      const scrollToSection = (id) => { if(activeTab !== 'home') setActiveTab('home'); setTimeout(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); }, 100); };

      return (
        <div className="pb-24">
          <Toast message={toastMessage} />
          
          {showVoteModal && selectedIdol && (
            <VoteModal 
              onClose={() => setShowVoteModal(false)} 
              idol={selectedIdol} 
              user={user} 
              userData={userData} 
              updateTickets={updateTickets} 
              showToast={showToast} 
              onLogin={handleLogin}
            />
          )}

          {showOutfitModal && selectedIdol && (
            <OutfitModal 
              onClose={() => setShowOutfitModal(false)} 
              idol={selectedIdol} 
              user={user} 
              userData={userData} 
              updateTickets={updateTickets} 
              showToast={showToast} 
              onLogin={handleLogin}
            />
          )}

          <header className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md shadow-sm py-2">
            <div className="max-w-6xl mx-auto px-4 flex justify-between items-center">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => {setActiveTab('home'); window.scrollTo(0,0);}}>
                <img src="./logo.png" alt="もしアイ" className="h-14 md:h-20 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                <span style={{display: 'none'}} className="text-xl font-bold text-pink-500 font-serif">もしアイ</span>
              </div>
              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-gray-700">
                {['HOME', 'EVENT', 'IDOLS', 'MAGAZINE'].map((item) => (
                  <button key={item} onClick={() => {
                    const id = item === 'EVENT' ? 'ranking' : item === 'IDOLS' ? 'idol-list' : item.toLowerCase();
                    scrollToSection(id);
                  }} className="hover:text-pink-500 transition-colors uppercase font-bold tracking-wider">{item}</button>
                ))}
              </nav>
            </div>
          </header>

          <main className="pt-24">
            {activeTab === 'idolDetail' && selectedIdol ? (
              <IdolDetailView 
                idol={selectedIdol} 
                onBack={() => setActiveTab('home')} 
                onVoteClick={() => setShowVoteModal(true)}
                onOutfitClick={() => setShowOutfitModal(true)}
                onMyOshiClick={(idol) => showToast(`${idol.name}をMY担当に設定しました！`)}
              />
            ) : activeTab === 'allIdolsList' ? (
              <AllIdolsView 
                onBack={() => setActiveTab('home')} 
                onIdolSelect={openIdolDetail} 
                idols={filteredIdols}
                idolSearchText={idolSearchText}
                setIdolSearchText={setIdolSearchText}
                idolFilterType={idolFilterType}
                setIdolFilterType={setIdolFilterType}
              />
            ) : activeTab === 'producerDetail' && selectedProducer ? (
              <ProducerDetailView producer={selectedProducer} onBack={() => setActiveTab('home')} />
            ) : (
              <div className="animate-fade-in">
                
                {/* HERO SECTION */}
                <section id="home" className="py-8 md:py-12 max-w-6xl mx-auto px-4 text-center">
                  <div className="flex flex-col items-center">
                    <img src="./catchphrase.png" className="h-10 md:h-14 object-contain mb-4 drop-shadow-sm" onError={(e) => e.target.style.display='none'} />
                    <img src="./top.png" className="w-full max-w-2xl object-contain drop-shadow-md mb-10" onError={(e) => e.target.style.display='none'} />
                    <div className="w-full max-w-6xl overflow-hidden relative group">
                       <div className="flex gap-6 overflow-x-auto hide-scrollbar snap-x snap-mandatory px-4 pb-10">
                         {BANNERS.map(banner => (
                           <div key={banner.id} className="flex-shrink-0 w-[85%] md:w-[45%] snap-center cursor-pointer hover:opacity-90 transition-opacity">
                             <div className="relative aspect-[16/9] w-full rounded-[2rem] overflow-hidden shadow-lg border-4 border-white mb-4">
                               <img src={banner.image} className="w-full h-full object-cover" onError={(e) => { e.target.src = 'https://via.placeholder.com/800x450/fdf2f8/db2777?text=Banner+Image'; }} />
                               <div className="absolute top-4 left-4"><span className="bg-black/50 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase">{banner.label}</span></div>
                             </div>
                             <div className="text-left px-4">
                               <h3 className="text-lg md:text-xl font-bold text-gray-800 mb-1">{banner.title}</h3>
                               <p className="text-xs text-gray-500">{banner.subtitle}</p>
                             </div>
                           </div>
                         ))}
                       </div>
                    </div>
                  </div>
                </section>

                {/* IDOL CARD SLIDER */}
                <section id="idol-slider" className="py-8 bg-white/20 backdrop-blur-sm border-y border-white/50 mb-10">
                  <div className="max-w-6xl mx-auto">
                    <div className="flex items-center gap-2 px-6 mb-4">
                      <i className="fa-solid fa-wand-magic-sparkles text-pink-500"></i>
                      <h2 className="text-lg font-bold text-gray-800 font-serif uppercase tracking-widest">Pick Up Idols</h2>
                    </div>
                    <div className="flex gap-4 overflow-x-auto hide-scrollbar px-6 pb-4">
                      {IDOLS.map((idol, i) => (
                        <div key={idol.id} className="w-48 shrink-0 relative rounded-3xl overflow-hidden shadow-lg group bg-white border border-white">
                          {idol.titleBadge && (
                            <div className="absolute top-2 right-2 bg-gradient-to-br from-yellow-300 to-amber-500 text-white text-[8px] font-bold px-2 py-1 rounded-full shadow-lg transform rotate-6 border border-white z-20">
                              <i className="fa-solid fa-crown"></i>
                            </div>
                          )}
                          <div className="aspect-[2/3] overflow-hidden relative">
                            {idol.videoUrl ? (
                              <video src={idol.videoUrl} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" autoPlay muted loop playsInline></video>
                            ) : (
                              <img src={`./idol${idol.id}.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" onError={(e)=>e.target.src='https://via.placeholder.com/200x300/fdf2f8/db2777?text=IDOL'} />
                            )}
                          </div>
                          <div className="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
                            <h3 className="font-bold text-base mb-1">{idol.name}</h3>
                            <p className="text-[10px] opacity-90 line-clamp-1 mb-3">"{idol.catchphrase}"</p>
                            <button onClick={() => openIdolDetail(idol)} className="w-full py-1.5 bg-pink-500 rounded-full text-[10px] font-bold flex items-center justify-center gap-1 shadow-inner">
                              <i className="fa-solid fa-heart"></i> プロデュースする
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                {/* TOPICS SECTION */}
                <section id="topics" className="py-12 max-w-6xl mx-auto px-4">
                  <div className="text-center mb-10"><h2 className="text-4xl font-serif text-gray-800 uppercase tracking-widest drop-shadow-sm">Topics</h2></div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    {TOPICS_DATA.map((topic) => (
                      <div key={topic.id} className="group cursor-pointer">
                        <div className="relative overflow-hidden rounded-2xl mb-4 shadow-sm bg-white/80 aspect-[16/10] border border-white p-1">
                          <img src={`./topic${topic.id}.png`} className="w-full h-full object-cover rounded-xl transition-transform duration-500 group-hover:scale-105" onError={(e)=>e.target.src='https://via.placeholder.com/400x250/fdf2f8/db2777?text=NEWS'} />
                        </div>
                        <div className="px-1 text-[10px] font-bold text-gray-400 mb-1">{topic.date} | <span className="text-pink-500 font-bold">{topic.label}</span></div>
                        <h3 className="font-bold text-gray-800 text-sm md:text-base leading-tight group-hover:text-pink-500 transition-colors">{topic.title}</h3>
                      </div>
                    ))}
                  </div>
                </section>

                {/* EVENT DASHBOARD - SHOWROOM風ブラッシュアップ版 */}
                <section id="ranking" className="py-16 bg-white/30 backdrop-blur-sm border-y border-white/50 mb-10">
                  <div className="max-w-6xl mx-auto px-4">
                    <SectionTitle title="EVENT DASHBOARD" subtitle="開催中のイベントと現在の順位" iconClass="fa-solid fa-trophy" />
                    
                    {/* イベント切り替えボタン */}
                    <div className="flex flex-col md:flex-row gap-4 justify-center mb-10">
                      <button onClick={() => { setActiveEventId('main'); setEventTab('ranking'); }} className={`px-6 py-4 rounded-full font-bold shadow-md transition-all flex items-center justify-center gap-3 border-2 ${activeEventId === 'main' ? 'bg-pink-500 text-white border-pink-500 scale-105' : 'bg-white text-gray-500 border-pink-100 hover:bg-pink-50'}`}>
                        <i className="fa-solid fa-crown text-xl"></i> 表紙＆巻頭特集 争奪戦！
                      </button>
                      <button onClick={() => { setActiveEventId('off_melty'); setEventTab('ranking'); }} className={`px-6 py-4 rounded-full font-bold shadow-md transition-all flex items-center justify-center gap-3 border-2 ${activeEventId === 'off_melty' ? 'bg-purple-600 text-white border-purple-600 scale-105' : 'bg-white text-gray-500 border-purple-100 hover:bg-purple-50'}`}>
                        <i className="fa-solid fa-shirt text-xl"></i> Off-Melty アンバサダー
                      </button>
                    </div>

                    {(() => {
                      const ev = EVENTS_DATA.find(e => e.id === activeEventId);
                      const isMain = ev.id === 'main';
                      const themeBg = isMain ? 'bg-pink-500' : 'bg-purple-600';
                      const themeText = isMain ? 'text-pink-600' : 'text-purple-600';
                      const themeBorder = isMain ? 'border-pink-500' : 'border-purple-600';

                      return (
                        <div className="bg-white/80 backdrop-blur-md rounded-t-3xl md:rounded-[2.5rem] p-0 md:p-8 border border-white shadow-xl animate-fade-in relative overflow-hidden">
                          
                          {/* ヘッダーバナー */}
                          <div className="relative rounded-t-3xl md:rounded-3xl overflow-hidden mb-6 shadow-md aspect-[21/9] group">
                            <img src={ev.bannerImg} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onError={(e) => { e.target.src = isMain ? 'https://via.placeholder.com/1200x500/fdf2f8/db2777?text=MAIN+EVENT' : 'https://via.placeholder.com/1200x500/f3e8ff/9333ea?text=OFF-MELTY'; }} />
                          </div>

                          {/* タブメニュー (SHOWROOM風スッキリデザイン) */}
                          <div className="flex justify-center border-b-2 border-gray-200 mb-8 px-4">
                            {[
                              {id: 'ranking', label: 'ランキング'},
                              {id: 'about', label: 'イベント詳細'},
                              {id: 'benefits', label: '特典'}
                            ].map(t => (
                              <button 
                                key={t.id} 
                                onClick={() => setEventTab(t.id)} 
                                className={`px-6 md:px-10 py-4 text-sm md:text-base font-bold transition-colors relative ${eventTab === t.id ? `${themeText}` : 'text-gray-400 hover:text-gray-600'}`}
                              >
                                {t.label}
                                {eventTab === t.id && (
                                  <div className={`absolute bottom-[-2px] left-0 w-full h-1 ${themeBg} rounded-t-lg`}></div>
                                )}
                              </button>
                            ))}
                          </div>

                          <div className="px-4 md:px-0 pb-8 min-h-[400px]">
                            
                            {/* --- ランキング タブ --- */}
                            {eventTab === 'ranking' && (
                              <div className="animate-fade-in-up">
                                {/* サブタブ（総合、ファン数など） */}
                                <div className="flex gap-2 overflow-x-auto pb-6 hide-scrollbar justify-center">
                                  {RANKING_TABS.map(tab => (
                                    <button key={tab.id} onClick={() => setActiveRankingTab(tab.id)} className={`px-4 py-2 rounded-full font-bold text-xs whitespace-nowrap transition-all border ${activeRankingTab === tab.id ? `${themeBg} text-white border-transparent shadow-md` : `bg-white text-gray-500 border-gray-200 hover:bg-gray-50`}`}>
                                      {tab.label}
                                    </button>
                                  ))}
                                </div>

                                {/* ランキング表示エリア */}
                                {(() => {
                                  const currentRankingData = ev.rankingData[activeRankingTab] || [];
                                  const topThree = currentRankingData.slice(0, 3);
                                  const others = currentRankingData.slice(3);

                                  return (
                                    <div>
                                      {/* 1位〜3位 表彰台UI */}
                                      {topThree.length > 0 && (
                                        <div className="flex justify-center items-end gap-2 md:gap-6 mb-12 mt-8 pt-8">
                                          {topThree.map((item, index) => {
                                            // 2位, 1位, 3位の順で並べる
                                            let orderClass = index === 0 ? "order-2" : index === 1 ? "order-1" : "order-3";
                                            // 1位は少し大きい
                                            let sizeClass = index === 0 ? "w-32 md:w-48" : "w-28 md:w-40";
                                            let badgeColors = index === 0 ? "from-yellow-300 to-yellow-500 text-yellow-900 border-yellow-200" 
                                                            : index === 1 ? "from-gray-300 to-gray-400 text-gray-800 border-gray-200" 
                                                            : "from-orange-300 to-orange-500 text-orange-900 border-orange-200";
                                            let rankIcon = index === 0 ? <i className="fa-solid fa-crown text-xl"></i> : <span className="text-xl font-bold">{index + 1}</span>;
                                            
                                            // 対応するアイドルデータを探す（画像表示用）
                                            const idolData = IDOLS.find(i => i.id === item.idolId);

                                            return (
                                              <div key={index} onClick={() => { if(idolData) openIdolDetail(idolData) }} className={`flex flex-col items-center cursor-pointer group animate-podium ${orderClass} ${sizeClass}`} style={{animationDelay: `${index * 0.15}s`}}>
                                                
                                                {/* 順位バッジ */}
                                                <div className={`relative z-20 -mb-4 w-12 h-12 rounded-full flex items-center justify-center shadow-lg bg-gradient-to-br border-2 ${badgeColors}`}>
                                                  {rankIcon}
                                                </div>
                                                
                                                {/* 画像カード */}
                                                <div className={`relative w-full aspect-[3/4] rounded-2xl overflow-hidden shadow-xl border-4 ${index===0 ? themeBorder : 'border-white'} transition-transform group-hover:-translate-y-2 bg-white`}>
                                                  {idolData && (
                                                    <img src={`./profile${item.rank}.png`} className="w-full h-full object-cover" onError={(e)=>{
                                                       e.target.src = `https://via.placeholder.com/300x400/f3f4f6/9ca3af?text=Rank+${item.rank}`;
                                                    }} />
                                                  )}
                                                  {/* ポイント帯 */}
                                                  <div className="absolute bottom-0 w-full bg-gradient-to-t from-black/80 to-transparent pt-6 pb-2 text-center">
                                                    <p className={`text-sm md:text-base font-bold font-mono ${index===0 ? 'text-yellow-400' : 'text-white'}`}>{item.value}</p>
                                                  </div>
                                                </div>
                                                
                                                {/* 名前と差分 */}
                                                <div className="text-center mt-3 w-full">
                                                  <h4 className="font-bold text-gray-800 line-clamp-1">{item.name}</h4>
                                                  {item.diff && item.diff !== "-" && <p className="text-[10px] text-gray-500 mt-1">{item.diff}</p>}
                                                </div>
                                              </div>
                                            );
                                          })}
                                        </div>
                                      )}

                                      {/* 4位以降 リストUI */}
                                      {others.length > 0 && (
                                        <div className="max-w-2xl mx-auto space-y-3">
                                          {others.map((item, i) => {
                                            const idolData = IDOLS.find(idl => idl.id === item.idolId);
                                            return (
                                              <div key={item.rank} onClick={() => { if(idolData) openIdolDetail(idolData) }} className="flex items-center bg-white rounded-xl p-3 shadow-sm border border-gray-100 hover:border-gray-300 hover:shadow-md transition-all cursor-pointer group">
                                                <div className="w-10 text-center font-bold text-gray-400 text-lg group-hover:text-gray-700">{item.rank}</div>
                                                <div className="w-12 h-12 rounded-full overflow-hidden border-2 border-gray-100 ml-2 shrink-0">
                                                   <img src={`./idol${item.idolId}.png`} className="w-full h-full object-cover" onError={(e) => e.target.src='https://via.placeholder.com/100/f3f4f6/9ca3af?text='+item.rank} />
                                                </div>
                                                <div className="ml-4 flex-1">
                                                  <h4 className="font-bold text-gray-800 text-sm md:text-base">{item.name}</h4>
                                                  {item.diff && <p className="text-[10px] text-gray-400">{item.diff}</p>}
                                                </div>
                                                <div className="text-right pr-2">
                                                  <p className={`font-mono font-bold ${themeText}`}>{item.value}</p>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-gray-300 text-xs pl-2"></i>
                                              </div>
                                            );
                                          })}
                                        </div>
                                      )}
                                    </div>
                                  );
                                })()}
                              </div>
                            )}

                            {/* --- イベント詳細(概要) タブ --- */}
                            {eventTab === 'about' && (
                              <div className="max-w-3xl mx-auto space-y-10 animate-fade-in-up pt-4">
                                <div className="text-center mb-8">
                                  <h3 className="text-2xl md:text-3xl font-bold text-gray-800 font-serif border-b-2 border-gray-800 inline-block pb-2 px-4 mb-8">
                                    {ev.aboutTitle}
                                  </h3>
                                  
                                  {/* GitHub差し替え用画像エリア */}
                                  <div className="space-y-6">
                                    {ev.aboutImages.map((imgSrc, idx) => (
                                      <img 
                                        key={idx} 
                                        src={imgSrc} 
                                        alt={`イベント詳細 ${idx + 1}`} 
                                        className="w-full rounded-2xl shadow-md border border-gray-100"
                                        onError={(e) => { 
                                          e.target.src = `https://via.placeholder.com/800x1000/fdf2f8/db2777?text=EVENT+ABOUT+IMAGE+${idx + 1}`; 
                                        }} 
                                      />
                                    ))}
                                  </div>
                                </div>

                                <div className="bg-white/60 p-6 rounded-2xl border border-white shadow-sm">
                                  <p className="text-gray-700 leading-relaxed font-medium whitespace-pre-wrap">
                                    {ev.aboutText}
                                  </p>
                                </div>
                              </div>
                            )}

                            {/* --- 特典 タブ --- */}
                            {eventTab === 'benefits' && (
                              <div className="max-w-3xl mx-auto space-y-10 animate-fade-in-up pt-4">
                                
                                {/* 特典概要画像（GitHub差し替え用） */}
                                <div className="space-y-6">
                                  {ev.benefitImages.map((imgSrc, idx) => (
                                    <img 
                                      key={idx} 
                                      src={imgSrc} 
                                      alt={`特典詳細 ${idx + 1}`} 
                                      className="w-full rounded-2xl shadow-md border border-gray-100"
                                      onError={(e) => { 
                                        e.target.src = `https://via.placeholder.com/800x600/fffbeb/d97706?text=BENEFITS+IMAGE+${idx + 1}`; 
                                      }} 
                                    />
                                  ))}
                                </div>

                                {/* テキストによる詳細説明（画像の下に続く） */}
                                <div className="space-y-6 mt-10">
                                  <h4 className="text-xl font-bold text-center border-b pb-2">特典詳細</h4>
                                  {ev.benefits.map((benefit, idx) => (
                                    <div key={idx} className={`p-6 md:p-8 rounded-2xl border ${
                                      benefit.type === 'grand' ? 'bg-amber-50 border-amber-200 shadow-sm' : 
                                      benefit.type === 'producer' ? 'bg-gray-800 text-white border-gray-700 shadow-md' : 
                                      'bg-white border-gray-200 shadow-sm'
                                    }`}>
                                      <h3 className={`text-lg md:text-xl font-bold mb-4 ${benefit.type === 'producer' ? 'text-amber-400' : 'text-gray-800'}`}>
                                        {benefit.title}
                                      </h3>
                                      <ul className="space-y-3">
                                        {benefit.items.map((item, i) => (
                                          <li key={i} className="flex items-start gap-3">
                                            <i className={`fa-solid mt-1 text-sm ${benefit.type === 'producer' ? 'fa-check text-amber-400' : 'fa-check text-pink-500'}`}></i>
                                            <p className={`text-sm md:text-base leading-relaxed ${benefit.type === 'producer' ? 'text-gray-200' : 'text-gray-700'}`}>
                                              {item.includes('Supported by') || item.includes('Outfit Provided by') ? (
                                                <span dangerouslySetInnerHTML={{__html: item.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-500">$1</strong>')}} />
                                              ) : item}
                                            </p>
                                          </li>
                                        ))}
                                      </ul>
                                    </div>
                                  ))}
                                </div>

                              </div>
                            )}

                          </div>
                        </div>
                      );
                    })()}
                  </div>
                </section>

                {/* IDOL LIST */}
                <section id="idol-list" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="IDOLS" subtitle="あなただけの原石を見つけよう" iconClass="fa-solid fa-users" />
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                    {filteredIdols.slice(0, 8).map((idol) => (
                      <div key={idol.id} onClick={() => openIdolDetail(idol)} className="group cursor-pointer bg-white/90 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all border border-white">
                        <div className="aspect-[4/5] relative overflow-hidden">
                          <img src={`./idol${idol.id}.png`} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" onError={(e)=>e.target.src='https://via.placeholder.com/300x400/fdf2f8/db2777?text=IDOL'} />
                        </div>
                        <div className="p-3 text-center">
                          <h4 className="font-bold text-gray-800 text-sm md:text-base">{idol.name}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="text-center">
                    <button onClick={() => { setActiveTab('allIdolsList'); window.scrollTo(0,0); }} className="bg-white/80 backdrop-blur-sm border-2 border-pink-200 text-pink-500 px-10 py-4 rounded-full font-bold shadow-lg hover:bg-pink-500 hover:text-white hover:border-pink-500 transition-all inline-flex items-center gap-3 group">
                      <i className="fa-solid fa-users-viewfinder group-hover:scale-125 transition-transform"></i> すべてのアイドルを見る
                    </button>
                  </div>
                </section>

                {/* PRODUCER RANKING */}
                <section id="producer-ranking" className="py-16 max-w-6xl mx-auto px-4">
                  <SectionTitle title="PRODUCER RANKING" subtitle="トッププロデューサーたち！" iconClass="fa-solid fa-user-tie" />
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {PRODUCERS.map((producer, index) => (
                      <div key={index} onClick={() => openProducerDetail(producer)} className="bg-white/90 backdrop-blur-sm rounded-3xl p-5 shadow-md border-2 border-white cursor-pointer group transition-transform hover:-translate-y-2 text-center">
                        <div className={`w-20 h-20 rounded-full mb-3 mx-auto shadow-inner flex items-center justify-center bg-gradient-to-br ${producer.iconColor} border-2 border-white transition-transform group-hover:scale-105`}><i className="fa-solid fa-user-tie text-3xl text-white opacity-80"></i></div>
                        <div className="bg-yellow-50 text-yellow-700 text-[10px] font-bold px-2 py-0.5 rounded-full mb-2">{producer.title}</div>
                        <h4 className="font-bold text-base group-hover:text-blue-500 transition-colors">{producer.name}</h4>
                        <p className="text-xs text-gray-500 font-mono font-bold">{producer.value}</p>
                      </div>
                    ))}
                  </div>
                </section>

                {/* MAGAZINE ARCHIVE */}
                <section id="magazine" className="py-16 bg-white/40 backdrop-blur-md rounded-[3rem] p-4 md:p-10 border border-white shadow-xl my-10 relative overflow-hidden max-w-6xl mx-auto">
                  <SectionTitle title="MAGAZINE ARCHIVE" subtitle="あなたが主役の誌面体験。過去の表紙をチェック" iconClass="fa-solid fa-book-open" />
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 relative z-10">
                    {MAGAZINES.map((mag) => (
                      <div key={mag.id} className="flex flex-col items-center group">
                        <div className="relative w-4/5 md:w-full aspect-[3/4] bg-white/80 rounded-md shadow-lg border-l-4 border-white p-2 transition-transform group-hover:-translate-y-2">
                          <img src={`./mag${mag.id}.png`} alt={mag.title} className="w-full h-full object-cover rounded shadow-inner" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                          <div className="absolute top-4 left-0 bg-pink-500 text-white text-[10px] font-bold py-1 px-3 rounded-r-full shadow-md">{mag.issue}</div>
                        </div>
                        <div className="text-center mt-6 px-2">
                          <span className={`text-[10px] font-bold px-2 py-1 rounded-full shadow-sm border border-white ${mag.status === '発売中' ? 'bg-white text-gray-600' : 'bg-pink-100 text-pink-600'}`}>{mag.status}</span>
                          <h4 className="font-bold text-base mt-2 text-gray-800 line-clamp-1">{mag.title}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

              </div>
            )}
          </main>

          <footer className="mt-20 bg-gradient-to-b from-pink-50 to-white border-t border-pink-100 py-20 relative overflow-hidden">
            <div className="absolute top-0 left-1/4 w-96 h-96 bg-pink-200/20 blur-[100px] pointer-events-none rounded-full"></div>
            <div className="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-200/20 blur-[100px] pointer-events-none rounded-full"></div>
            <div className="max-w-4xl mx-auto px-6 flex flex-col items-center text-center space-y-12 relative z-10">
              <div className="flex flex-col md:flex-row items-center justify-center gap-10 md:gap-20 w-full animate-fade-in">
                <img src="./logo.png" className="h-28 md:h-44 object-contain drop-shadow-sm transition-transform hover:scale-105" alt="もしアイ ロゴ" onError={(e)=>e.target.style.display='none'} />
                <div className="h-16 w-px bg-pink-200 hidden md:block opacity-50"></div>
                <img src="./off_melty_logo.png" className="h-16 md:h-28 object-contain opacity-80 hover:opacity-100 transition-opacity" alt="Off-Melty ロゴ" onError={(e)=>e.target.src='https://via.placeholder.com/200x80/fdf2f8/db2777?text=Off-Melty'} />
              </div>
              <div className="space-y-6">
                <div className="relative inline-block">
                  <p className="text-xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-purple-600 font-serif tracking-widest px-4">もしアイの最新ニュースを配信中！</p>
                  <div className="absolute -bottom-3 left-0 w-full h-1 bg-gradient-to-r from-transparent via-pink-300 to-transparent rounded-full"></div>
                </div>
                <div className="pt-6">
                  <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="group relative inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 rounded-2xl p-0.5 shadow-lg transform transition-all hover:scale-110 active:scale-95">
                    <div className="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
                      <i className="fa-brands fa-instagram text-4xl bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 bg-clip-text text-transparent group-hover:scale-110 transition-transform"></i>
                    </div>
                  </a>
                  <p className="text-[10px] font-bold text-pink-400 mt-4 tracking-[0.2em] uppercase">Follow us on Instagram</p>
                </div>
              </div>
            </div>
            <div className="mt-20 bg-gray-900/95 backdrop-blur-sm text-white py-10">
              <div className="max-w-6xl mx-auto px-6 text-center">
                <div className="flex justify-center gap-8 text-xs mb-6 font-medium text-gray-400">
                  <a href="#" className="hover:text-pink-400 transition-colors">利用規約</a>
                  <a href="#" className="hover:text-pink-400 transition-colors">プライバシーポリシー</a>
                  <a href="#" className="hover:text-pink-400 transition-colors">お問い合わせ</a>
                </div>
                <p className="text-[10px] opacity-40 tracking-[0.15em]">&copy; 2026 もしも私が、アイドルになったら。 Project All Rights Reserved.</p>
              </div>
            </div>
          </footer>

          {(activeTab === 'home' || activeTab === 'idolDetail' || activeTab === 'allIdolsList') && (
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-transparent z-[100] md:flex md:justify-center animate-fade-in-up pointer-events-none">
              <div className="max-w-md w-full mx-auto md:mx-0 flex items-center gap-3 p-2 pointer-events-auto">
                <div className="hidden md:block text-sm font-bold text-gray-700 ml-4 mr-2 drop-shadow-sm">次世代アイドル<br/>エントリー受付中！</div>
                <div className="flex-1 animate-float">
                  <a href="https://line.me" target="_blank" rel="noreferrer">
                    <img src="./line_btn.png" alt="LINEで無料エントリー！" className="w-full max-h-20 object-contain cursor-pointer transition-transform transform hover:scale-110 drop-shadow-xl mx-auto" />
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
