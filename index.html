        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });

            <div className="text-center"><div className={`w-12 h-14 bg-white/50 flex items-center justify-center border-b border-slate-200 ${textColor}`}><span className="font-timer text-3xl font-light">{pad(timeLeft.minutes)}</span></div><p className="text-[9px] font-medium tracking-widest text-slate-400 mt-2">MIN</p></div><span className={`font-timer text-2xl font-light mb-5 text-slate-300`}>:</span>

      useEffect(() => {
        if (typeof confetti !== 'undefined') {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#f472b6', '#38bdf8', '#818cf8'] });
        }
      }, []);

      return (
        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[500] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-none p-10 max-w-sm w-full text-center shadow-[0_20px_50px_rgba(0,0,0,0.3)] relative overflow-hidden border border-pink-200">
            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400"></div>
            <div className="w-20 h-20 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
              <i className="fa-solid fa-bullhorn text-3xl text-pink-500 animate-pulse"></i>
            </div>

              <p className="text-5xl font-timer font-light text-slate-800">+{tickets}</p>

              受け取る
            </button>
          </div>
        </div>
      );

    const AuthModal = ({ onClose, onAuthSubmit, isAdminOnly = false }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        await onAuthSubmit(email, password, isLogin);
        setLoading(false);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[500] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-none overflow-hidden max-w-sm w-full shadow-2xl border border-slate-100 relative">
            <button onClick={onClose} disabled={loading} className="absolute right-4 top-4 text-slate-400 hover:text-slate-800 transition-colors z-10"><i className="fa-solid fa-xmark text-lg"></i></button>
            <div className="flex border-b border-slate-100">
              <button onClick={() => setIsLogin(true)} disabled={loading} className={`flex-1 py-4 text-xs font-medium tracking-widest uppercase transition-colors ${isLogin ? 'bg-white text-slate-800 border-b-2 border-slate-800' : 'bg-slate-50 text-slate-400'}`}>Log In</button>
              <button onClick={() => setIsLogin(false)} disabled={loading} className={`flex-1 py-4 text-xs font-medium tracking-widest uppercase transition-colors ${!isLogin ? 'bg-white text-slate-800 border-b-2 border-slate-800' : 'bg-slate-50 text-slate-400'}`}>Sign Up</button>
            </div>
            <div className="p-8">
              <h3 className="text-2xl font-light font-serif text-slate-800 mb-6 text-center">{isAdminOnly ? 'Admin Access' : (isLogin ? 'Welcome Back' : 'Create Account')}</h3>
              {isAdminOnly && <p className="text-[10px] text-center text-slate-400 mb-4">管理者用メールアドレスでログインしてください</p>}
              <form onSubmit={handleSubmit} className="space-y-6">
                <div>
                  <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Email Address</label>
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} disabled={loading} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-800 transition-colors font-light text-slate-800" placeholder="your@email.com" />
                </div>
                <div>
                  <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Password</label>
                  <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} disabled={loading} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-800 transition-colors font-light text-slate-800" placeholder="••••••••" />
                </div>
                <button type="submit" disabled={loading} className="w-full py-4 bg-slate-900 text-white text-xs tracking-widest font-light rounded-none hover:bg-slate-800 transition-colors mt-4 disabled:bg-slate-400 flex justify-center items-center gap-2">
                  {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isLogin ? 'LOGIN' : 'REGISTER')}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const AdminDashboard = ({ idolsData, showToast }) => {
      const [newIdol, setNewIdol] = useState({ name: '', loginEmail: '', profileImage: '', catchphrase: '', pref: '', style: '', birthday: '' });
      const [deleteId, setDeleteId] = useState(null);
      const [uploading, setUploading] = useState(false);

      const handleFileChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        try {
          const url = await uploadFile(file);
          setNewIdol({...newIdol, profileImage: url});
          showToast("画像がアップロードされました");
        } catch (err) {
          showToast("アップロードに失敗しました");
        }
        setUploading(false);
      };

      const handleAddIdol = async (e) => {
        e.preventDefault();
        if(!newIdol.name || !newIdol.loginEmail) return showToast("名前とログインEmailは必須です");
        const { collection, addDoc } = window.FirebaseHelper;
        const db = window.FirebaseDbRef;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'idols'), {
            ...newIdol, type: "新規エントリー", issue: "未掲載", isOffMelty: false, isRookie: true,
            story: "新しい物語がここから始まります。", titleBadge: "注目", producerCount: "0", totalVotes: 0, wishlist: [], receivedGifts: [], createdAt: new Date().toISOString()
          });
          showToast("アイドルを新規追加しました");
          setNewIdol({ name: '', loginEmail: '', profileImage: '', catchphrase: '', pref: '', style: '', birthday: '' });
        } catch(err) {
          showToast("追加エラー: " + err.message);
        }
      };

      const handleDelete = async (id) => {
        if (deleteId === id) {
          const { doc, deleteDoc } = window.FirebaseHelper;
          const db = window.FirebaseDbRef;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'idols', String(id)));
            showToast("アイドルを削除しました");
            setDeleteId(null);
          } catch(e) { showToast("削除エラー"); }
        } else {
          setDeleteId(id);
          setTimeout(() => setDeleteId(null), 3000);
        }
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 pt-32 animate-fade-in">
          <SectionTitle title="ADMIN" subtitle="管理者コントロールパネル" />
          <div className="bg-white p-8 shadow-sm border border-slate-200 mb-12">
            <h3 className="text-lg font-serif mb-6 text-slate-800">アイドルの新規追加</h3>
            <form onSubmit={handleAddIdol} className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div><label className="block text-[10px] text-slate-500 mb-1">名前 *</label><input required type="text" value={newIdol.name} onChange={e=>setNewIdol({...newIdol, name: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400" /></div>
              <div><label className="block text-[10px] text-slate-500 mb-1">ログイン用Email *</label><input required type="email" value={newIdol.loginEmail} onChange={e=>setNewIdol({...newIdol, loginEmail: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400" /></div>
              <div><label className="block text-[10px] text-slate-500 mb-1">プロフィール画像</label><input type="file" accept="image/*,video/mp4" onChange={handleFileChange} disabled={uploading} className="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-none file:border-0 file:text-[10px] file:font-medium file:bg-slate-100 file:text-slate-700 cursor-pointer" /></div>
              <div><label className="block text-[10px] text-slate-500 mb-1">キャッチフレーズ</label><input type="text" value={newIdol.catchphrase} onChange={e=>setNewIdol({...newIdol, catchphrase: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400" /></div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">出身地</label>
                <select value={newIdol.pref} onChange={e=>setNewIdol({...newIdol, pref: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400 bg-white">
                  <option value="">選択してください</option>{PREFECTURES.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">スタイル</label>
                <select value={newIdol.style} onChange={e=>setNewIdol({...newIdol, style: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400 bg-white">
                  <option value="">選択してください</option>{STYLES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div className="md:col-span-2 text-right mt-4"><button type="submit" disabled={uploading} className="bg-slate-900 text-white px-8 py-3 text-[10px] tracking-widest hover:bg-slate-800 transition-colors uppercase disabled:bg-slate-400">追加する</button></div>
            </form>
          </div>
          <div className="bg-white p-8 shadow-sm border border-slate-200">
            <h3 className="text-lg font-serif mb-6 text-slate-800">登録済みアイドル一覧</h3>
            <div className="space-y-4 max-h-[500px] overflow-y-auto pr-4">
              {idolsData.map(idol => (
                <div key={idol.id} className="flex items-center justify-between border-b border-slate-100 py-4">
                  <div className="flex items-center gap-4"><MediaDisplay src={idol.profileImage} fallbackSrc="./default_idol.png" className="w-12 h-12 object-cover rounded-full bg-slate-100" /><div><div className="font-medium text-slate-800">{idol.name}</div><div className="text-[10px] text-slate-400">{idol.loginEmail} | {idol.totalVotes || 0} 票</div></div></div>
                  <button onClick={() => handleDelete(idol.id)} className={`px-4 py-2 text-[10px] tracking-widest text-white transition-colors ${deleteId === idol.id ? 'bg-red-600' : 'bg-slate-300 hover:bg-red-500'}`}>{deleteId === idol.id ? '本当に削除？' : '削除'}</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const VoteModal = ({ onClose, idol, user, userData, updateTickets, showToast, onLogin, onSuccess }) => {
      if (!user || user.isAnonymous) {
        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-none p-10 max-w-sm w-full text-center shadow-2xl animate-fade-in-up border border-slate-100">
              <i className="fa-regular fa-user text-3xl text-slate-300 mb-6"></i>
              <h3 className="text-lg font-light tracking-widest font-serif mb-4 text-slate-800">MEMBERS ONLY</h3>
              <p className="text-xs text-slate-500 mb-8 leading-loose font-light">プロデューサー登録（無料）で、<br/>毎日<span className="text-pink-500 font-medium">「3票の無料投票券」</span>を進呈いたします。</p>
              <button onClick={onLogin} className="w-full py-4 bg-slate-900 text-white text-xs tracking-widest font-light rounded-none mb-4 shadow-md hover:bg-slate-800 transition-colors">REGISTER & VOTE</button>
              <button onClick={onClose} className="text-[10px] text-slate-400 font-medium tracking-widest hover:text-slate-600 border-b border-transparent hover:border-slate-300 transition-all pb-1">CANCEL</button>
            </div>
          </div>
        );
      }

      const handleVote = (amount) => {
        if (userData.freeTickets >= amount) { updateTickets(-amount, 0); onSuccess(amount, '無料投票'); onClose(); } 
        else { showToast("無料票が不足しています。"); }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-none overflow-hidden max-w-md w-full shadow-2xl border border-slate-100">
            <div className="bg-white border-b border-slate-100 p-6 text-center relative"><h3 className="font-light tracking-[0.3em] text-xs text-slate-800 uppercase">Voting Room</h3><button onClick={onClose} className="absolute right-6 top-6 text-slate-400 hover:text-slate-800 transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button></div>
            <div className="p-6 md:p-8 max-h-[80vh] overflow-y-auto hide-scrollbar bg-slate-50/30">
              <div className="flex items-center gap-5 mb-10 bg-white p-4 rounded-none border border-slate-100 shadow-sm">
                <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover border border-slate-100" />
                <div><p className="text-[9px] text-slate-400 font-medium tracking-widest mb-1 uppercase">Target</p><h4 className="font-light font-serif text-lg text-slate-800 leading-none">{idol.name}</h4></div>
              </div>
              <div className="mb-6">
                <div className="bg-white border border-slate-200 p-8 rounded-none text-center shadow-sm relative">
                  <p className="text-[10px] text-slate-400 font-medium tracking-widest mb-2 uppercase">Daily Free Votes <span className="text-pink-400 lowercase text-[9px] tracking-normal">(3/day)</span></p>
                  <div className="text-5xl font-light font-timer text-slate-800 mb-8">{userData.freeTickets}</div>
                  <button onClick={() => handleVote(1)} disabled={userData.freeTickets < 1} className="w-full py-4 bg-slate-800 text-white text-xs tracking-widest font-light rounded-none disabled:bg-slate-200 disabled:text-slate-400 transition-colors hover:bg-slate-900">VOTE NOW (1票)</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const GiftModal = ({ onClose, idol, user, updateTickets, showToast, onLogin, onSuccess }) => {
      if (!user || user.isAnonymous) {
        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-none p-10 max-w-sm w-full text-center shadow-2xl animate-fade-in-up border border-slate-100">
              <i className="fa-regular fa-user text-3xl text-slate-300 mb-6"></i>
              <h3 className="text-lg font-light tracking-widest font-serif mb-4 text-slate-800">MEMBERS ONLY</h3>
              <p className="text-xs text-slate-500 mb-8 leading-loose font-light">ギフト・雑誌を購入して応援するには、<br/>プロデューサー登録（無料）が必要です。</p>
              <button onClick={onLogin} className="w-full py-4 bg-slate-900 text-white text-xs tracking-widest font-light rounded-none mb-4 shadow-md hover:bg-slate-800 transition-colors">REGISTER</button>
              <button onClick={onClose} className="text-[10px] text-slate-400 font-medium tracking-widest hover:text-slate-600 border-b border-transparent hover:border-slate-300 transition-all pb-1">CANCEL</button>
            </div>
          </div>
        );
      }

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-none overflow-hidden max-w-md w-full shadow-2xl border border-slate-100">
            <div className="bg-white border-b border-slate-100 p-6 text-center relative z-10"><h3 className="font-light tracking-[0.3em] text-xs text-slate-800 uppercase">Gift & Magazine</h3><button onClick={onClose} className="absolute right-6 top-6 text-slate-400 hover:text-slate-800 transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button></div>
            <div className="p-6 md:p-8 max-h-[80vh] overflow-y-auto hide-scrollbar bg-slate-50/30">
              <div className="space-y-4">
                <div className="bg-white border border-slate-200 rounded-none p-5 flex items-center justify-between hover:border-slate-400 transition-colors shadow-sm group">
                  <div className="flex items-center gap-5"><div className="text-2xl opacity-80 grayscale group-hover:grayscale-0 transition-all">📣</div><div><h4 className="font-light text-sm text-slate-800 mb-1">応援メガホン</h4><p className="text-[10px] text-slate-400 font-medium tracking-wider">+120 票</p></div></div>
                  <button onClick={() => {onSuccess(120, 'ギフト購入(応援メガホン)'); onClose();}} className="text-xs font-light tracking-wider text-slate-500 group-hover:text-slate-900 transition-colors border-b border-transparent group-hover:border-slate-900 pb-0.5">¥100</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const OutfitModal = ({ onClose, idol, user, userData, updateTickets, showToast, onLogin, onSuccess }) => {
      if (!user || user.isAnonymous) {
        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-none p-10 max-w-sm w-full text-center shadow-2xl animate-fade-in-up border border-slate-100">
              <h3 className="text-lg font-light tracking-widest font-serif mb-4 text-slate-800">MEMBERS ONLY</h3>
              <p className="text-xs text-slate-500 mb-8 leading-loose font-light">衣装を提供して推しを支援するには、<br/>プロデューサー登録（無料）が必要です。</p>
              <button onClick={onLogin} className="w-full py-4 bg-slate-900 text-white text-xs tracking-widest font-light rounded-none mb-4 shadow-md hover:bg-slate-800 transition-colors">REGISTER</button>
              <button onClick={onClose} className="text-[10px] text-slate-400 font-medium tracking-widest hover:text-slate-600 border-b border-transparent hover:border-slate-300 transition-all pb-1">CANCEL</button>
            </div>
          </div>
        );
      }

      return (
        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-[#fafafa] rounded-none overflow-hidden max-w-4xl w-full shadow-2xl relative border border-slate-200">
            <div className="bg-white p-6 md:p-8 text-center relative border-b border-slate-100 z-10 flex flex-col items-center justify-center">
              <h3 className="font-serif font-light text-slate-800 text-xl mb-2 tracking-wide">Off-Melty</h3>
              <p className="text-slate-400 text-[9px] font-medium tracking-[0.3em] uppercase">Lookbook / Outfit Provision</p>
              <button onClick={onClose} className="absolute right-6 top-8 text-slate-400 hover:text-slate-800 transition-colors"><i className="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div className="p-6 md:p-10 max-h-[75vh] overflow-y-auto hide-scrollbar relative">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
                {OFF_MELTY_CATALOG.map(item => {
                  const isReceived = idol.receivedGifts?.find(g => g.itemId === item.id);
                  return (
                    <div key={item.id} className="bg-transparent flex flex-col group relative">
                      <div className="aspect-[3/4] bg-slate-100 overflow-hidden relative mb-4 border border-slate-200">

                          <div className="absolute inset-0 bg-white/0 group-hover:bg-white/20 transition-colors duration-300 flex items-center justify-center opacity-0 group-hover:opacity-100">
                            <button onClick={() => {onSuccess(item.votes, '衣装提供', item.id); onClose();}} className="bg-slate-900 text-white text-[10px] tracking-widest font-light px-6 py-3 hover:bg-pink-600 transition-colors transform translate-y-4 group-hover:translate-y-0 duration-300">SELECT</button>

                    </div>

                })}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const SuccessModal = ({ data, onClose, idol }) => {
      useEffect(() => {
        if (typeof confetti !== 'undefined') {
          confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#f472b6', '#ec4899', '#fbcfe8', '#cbd5e1', '#f1f5f9'], disableForReducedMotion: true });

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 animate-fade-in-up pb-32">

              <div><textarea value={timelineText} onChange={(e) => setTimelineText(e.target.value)} placeholder="今日はどんな一日でしたか？..." rows="4" className="w-full bg-slate-50 border border-slate-200 p-4 focus:outline-none focus:border-pink-300 transition-colors font-light text-sm resize-none"></textarea></div>
              <div className="flex items-center gap-2 bg-pink-50/50 p-3 border border-pink-100">
                <input type="checkbox" id="secretPost" checked={isSecretPost} onChange={(e) => setIsSecretPost(e.target.checked)} className="accent-pink-500 w-4 h-4" />
                <label htmlFor="secretPost" className="text-[10px] text-slate-600 font-medium cursor-pointer tracking-wider">シークレット投稿にする <span className="text-pink-500 font-light">（累計100票以上のプロデューサー限定公開）</span></label>
