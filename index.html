                <div className="space-y-8 animate-fade-in">
                  <div>
                    <h3 className="text-lg font-bold text-gray-800 mb-3 border-l-4 border-pink-500 pl-3">私の物語</h3>
                    <p className="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap bg-pink-50/50 p-4 rounded-2xl border border-pink-50">
                      {idol.story}
                    </p>
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-gray-800 mb-4 border-l-4 border-pink-500 pl-3">最近の日記</h3>
                    <div className="bg-gray-50/80 p-4 rounded-2xl mb-4">
                      <p className="text-xs text-pink-500 font-bold mb-1">2026.03.14</p>
                      <p className="text-gray-700 text-sm">今日は新しい衣装のフィッティングでした！すっごく可愛くて、早くみんなに見せたいな👗✨ 明日の配信で少しだけヒント出すね！</p>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="animate-fade-in space-y-6">
                  <div className="grid grid-cols-2 gap-y-4 gap-x-6 text-sm">
                    <div className="border-b border-gray-100 pb-2"><span className="text-gray-400 text-xs block mb-1">年齢</span><span className="font-bold text-gray-800">{idol.age}</span></div>
                    <div className="border-b border-gray-100 pb-2"><span className="text-gray-400 text-xs block mb-1">身長</span><span className="font-bold text-gray-800">{idol.height}</span></div>
                    <div className="border-b border-gray-100 pb-2"><span className="text-gray-400 text-xs block mb-1">出身地</span><span className="font-bold text-gray-800">{idol.pref}</span></div>
                    <div className="border-b border-gray-100 pb-2"><span className="text-gray-400 text-xs block mb-1">趣味</span><span className="font-bold text-gray-800">{idol.hobby}</span></div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // --- キャストマイページ ---
    const MyPageView = ({ currentUser }) => {
      const [loading, setLoading] = useState(true);
      const [isEditing, setIsEditing] = useState(false);
      const [profile, setProfile] = useState({ name: '白鳥 ゆな', catchphrase: 'いつも応援ありがとう！今日も1日がんばろう♡', photoUrl: '', entryNo: '084' });
      const [editForm, setEditForm] = useState(profile);
      const [userPoints, setUserPoints] = useState(4800);
      const [missions, setMissions] = useState([
        { id: 1, title: "今日の自撮りを1枚投稿する", points: 10, completed: false },
        { id: 2, title: "ファンからのコメントに3件返信", points: 30, completed: false },
        { id: 3, title: "Twitterでハッシュタグ投稿", points: 20, completed: false },
        { id: 4, title: "プロフィールを充実させる", points: 50, completed: true },
      ]);

      useEffect(() => {
        if (!currentUser) return;
        const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profileData', 'main');
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            setProfile(data);
            setEditForm(data);
          } else {
            setDoc(docRef, profile).catch(console.error);
          }
          setLoading(false);
        }, (error) => { console.error("Firestore Error:", error); setLoading(false); });
        return () => unsubscribe();
      }, [currentUser]);

      const handleSaveProfile = async () => {
        if (!currentUser) return;
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profileData', 'main');
          await setDoc(docRef, editForm, { merge: true });
          setIsEditing(false);
        } catch (error) { console.error("Error saving profile:", error); }
      };

      const handleToggleMission = (id, points) => {
        setMissions(missions.map(m => {
          if (m.id === id) {
            setUserPoints(prev => m.completed ? prev - points : prev + points);
            return { ...m, completed: !m.completed };
          }
          return m;
        }));
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-10 animate-fade-in">
          <div className="bg-white/90 backdrop-blur-sm rounded-3xl p-6 shadow-sm border border-pink-100 mb-8 flex flex-col md:flex-row items-center gap-6 relative overflow-hidden min-h-[160px]">
            <div className="absolute -right-10 -top-10 w-40 h-40 bg-pink-50 rounded-full mix-blend-multiply opacity-50"></div>
            <div className="absolute top-4 right-4 z-20">
              {!isEditing && !loading && (
                <button onClick={() => setIsEditing(true)} className="flex items-center gap-1 text-xs font-bold text-gray-500 hover:text-pink-500 transition-colors bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200">
                  <i className="fa-solid fa-pen text-xs"></i> 編集
                </button>
              )}
            </div>

            {loading ? (
              <div className="animate-pulse w-full flex items-center gap-6">
                <div className="w-24 h-24 bg-gray-200 rounded-full shrink-0"></div>
                <div className="flex-1 space-y-3"><div className="h-4 bg-gray-200 w-24 rounded"></div><div className="h-6 bg-gray-200 w-48 rounded"></div></div>
              </div>
            ) : isEditing ? (
              <div className="w-full flex flex-col md:flex-row gap-6 z-10 bg-white/90 p-2 md:p-4 rounded-2xl backdrop-blur-sm">
                <div className="flex flex-col items-center gap-3 shrink-0">
                   <div className="w-24 h-24 rounded-full border-4 border-pink-100 overflow-hidden bg-gray-50 flex items-center justify-center">
                      {editForm.photoUrl ? <img src={editForm.photoUrl} alt="Preview" className="w-full h-full object-cover" /> : <i className="fa-solid fa-camera text-3xl text-gray-300"></i>}
                   </div>
                   <input type="text" value={editForm.photoUrl || ''} onChange={(e) => setEditForm({...editForm, photoUrl: e.target.value})} placeholder="写真URL" className="w-full text-xs px-2 py-2 border border-gray-200 rounded-lg bg-gray-50" />
                </div>
                <div className="flex-1 flex flex-col gap-3">
                  <input type="text" value={editForm.name || ''} onChange={(e) => setEditForm({...editForm, name: e.target.value})} className="w-full md:w-1/2 font-bold px-3 py-2 border border-gray-200 rounded-lg" />
                  <textarea value={editForm.catchphrase || ''} onChange={(e) => setEditForm({...editForm, catchphrase: e.target.value})} rows="2" className="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg" />
                  <div className="flex justify-end gap-2 mt-2 pt-2 border-t">
                    <button onClick={() => {setEditForm(profile); setIsEditing(false);}} className="px-4 py-2 text-sm">キャンセル</button>
                    <button onClick={handleSaveProfile} className="px-6 py-2 text-sm font-bold text-white bg-pink-500 rounded-xl">保存</button>
                  </div>
                </div>
              </div>
            ) : (
              <>
                <div className="w-24 h-24 rounded-full border-4 border-pink-100 shadow-md overflow-hidden bg-gradient-to-tr from-pink-200 to-purple-200 flex items-center justify-center">
                  {profile.photoUrl ? <img src={profile.photoUrl} alt="Profile" className="w-full h-full object-cover" /> : <span className="text-[10px]">No Image</span>}
                </div>
                <div className="flex-1 text-center md:text-left z-10">
                  <div className="bg-pink-100 text-pink-600 text-[10px] font-bold px-3 py-1 rounded-full inline-block mb-2">No. {profile.entryNo}</div>
                  <h2 className="text-2xl font-bold text-gray-800">{profile.name} ちゃん</h2>
                  <p className="text-sm text-gray-500">{profile.catchphrase}</p>
                </div>
                <div className="bg-gray-50/80 p-4 rounded-2xl text-center border min-w-[120px]">
                  <p className="text-[10px] font-bold text-gray-500 mb-1">獲得ポイント</p>
                  <p className="text-2xl font-bold text-purple-500 font-serif">{userPoints.toLocaleString()}</p>
                </div>
              </>
            )}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div className="bg-white/90 backdrop-blur-sm rounded-3xl p-6 shadow-sm border border-pink-100">
              <h3 className="font-bold text-gray-800 mb-6 border-b pb-4"><i className="fa-solid fa-bullseye text-pink-500 mr-2"></i>今日のミッション</h3>
              <div className="space-y-3">
                {missions.map(mission => (
                  <div key={mission.id} onClick={() => handleToggleMission(mission.id, mission.points)} className={`flex items-center justify-between p-4 rounded-xl border-2 cursor-pointer ${mission.completed ? 'bg-gray-50/80 border-transparent opacity-60' : 'bg-white border-pink-100'}`}>
                    <span className={`text-sm font-medium ${mission.completed ? 'text-gray-500 line-through' : 'text-gray-800'}`}>{mission.title}</span>
                    <span className="text-xs font-bold text-pink-500">+{mission.points} pt</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-6 shadow-sm border border-pink-100 flex flex-col items-center justify-center">
               <i className="fa-solid fa-columns text-4xl text-purple-500 mb-4"></i>
               <h3 className="font-bold text-gray-800 mb-2">掲載シミュレーター</h3>
               <p className="text-sm text-gray-600">あなたは現在 <span className="font-bold text-pink-500">1/4ページ枠</span> です！</p>
            </div>
          </div>
        </div>
      );
    };


    // --- メインアプリケーション ---
    function App() {
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [activeTab, setActiveTab] = useState('home'); 
      const [selectedIdol, setSelectedIdol] = useState(null);
      const [selectedProducer, setSelectedProducer] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [scrolled, setScrolled] = useState(false);
      const [activeRankingTab, setActiveRankingTab] = useState('overall');
      const [idolSearchText, setIdolSearchText] = useState('');
      const [idolFilterType, setIdolFilterType] = useState('all'); 
      const [idolFilterPref, setIdolFilterPref] = useState('東京'); 
      const [idolFilterStyle, setIdolFilterStyle] = useState('王道キュート'); 

      const uniquePrefs = [...new Set(IDOLS.map(i => i.pref))];
      const uniqueStyles = [...new Set(IDOLS.map(i => i.style))];

      const filteredIdols = IDOLS.filter(idol => {
        if (idolSearchText && !idol.name.includes(idolSearchText)) return false;
        if (idolFilterType === 'rookie' && !idol.isRookie) return false;
        if (idolFilterType === 'pref' && idol.pref !== idolFilterPref) return false;
        if (idolFilterType === 'style' && idol.style !== idolFilterStyle) return false;
        return true;
      });

      useEffect(() => {
        const initAuth = async () => { try { await signInAnonymously(auth); } catch (e) { console.error(e); } };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setCurrentUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollTo = (id) => {
        if (activeTab !== 'home') { setActiveTab('home'); setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 100); }
        else { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
        setIsMenuOpen(false);
      };

      const openIdolDetail = (idol) => {
        if(!idol) return;
        setSelectedIdol(idol);
        setActiveTab('idolDetail');
        window.scrollTo(0, 0);
      };

      const openProducerDetail = (producer) => {
        if(!producer) return;
        setSelectedProducer(producer);
        setActiveTab('producerDetail');
        window.scrollTo(0, 0);
      };

      return (
        <div className="pb-24">
          
          <header className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-2' : 'bg-transparent py-4'}`}>
            <div className="max-w-6xl mx-auto px-4 flex justify-between items-center">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => {setActiveTab('home'); window.scrollTo(0,0);}}>
                <img src="./logo.png" alt="もしアイ" className="h-8 md:h-10 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                <span style={{display: 'none'}} className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-purple-500 font-serif drop-shadow-sm">もしアイ</span>
              </div>
              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-gray-700">
                {activeTab === 'home' && ['HOME', 'NEWS', 'RANKING', 'IDOL LIST', 'MAGAZINE'].map((item) => (
                  <button key={item} onClick={() => scrollTo(item.toLowerCase().replace(' ', '-'))} className="hover:text-pink-500 transition-colors drop-shadow-sm">{item}</button>
                ))}
                <button onClick={() => {setActiveTab(activeTab === 'mypage' ? 'home' : 'mypage'); window.scrollTo(0,0);}} className={`ml-4 px-4 py-2 rounded-full font-bold border ${activeTab === 'mypage' ? 'bg-gray-800 text-white' : 'bg-white/90 text-pink-500 border-pink-200 shadow-sm'}`}>
                  {activeTab === 'mypage' ? 'ファン向けへ' : 'キャストログイン'}
                </button>
              </nav>
              <button className="md:hidden text-gray-700 drop-shadow-sm p-2" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                {isMenuOpen ? <i className="fa-solid fa-xmark text-2xl"></i> : <i className="fa-solid fa-bars text-2xl"></i>}
              </button>
            </div>
          </header>

          {isMenuOpen && (
            <div className="fixed inset-0 z-40 bg-white/95 backdrop-blur-sm pt-24 px-6 flex flex-col gap-6 md:hidden">
                <button onClick={() => {setActiveTab(activeTab === 'mypage' ? 'home' : 'mypage'); setIsMenuOpen(false); window.scrollTo(0,0);}} className="w-full py-4 rounded-xl font-bold border border-pink-200">
                  {activeTab === 'mypage' ? 'ファン向けサイトへ戻る' : 'キャスト専用マイページへ'}
                </button>
                {activeTab === 'home' && ['HOME', 'NEWS', 'RANKING', 'IDOL LIST', 'MAGAZINE'].map((item) => (
                  <button key={item} onClick={() => scrollTo(item.toLowerCase().replace(' ', '-'))} className="text-xl font-bold text-gray-700 text-left border-b border-pink-100 pb-4 flex justify-between items-center">{item}<i className="fa-solid fa-chevron-right text-lg text-pink-300"></i></button>
                ))}
            </div>
          )}

          <main className="pt-16">
            {activeTab === 'mypage' ? (
              <MyPageView currentUser={currentUser} />
            ) : activeTab === 'idolDetail' && selectedIdol ? (
              <IdolDetailView idol={selectedIdol} onBack={() => setActiveTab('home')} />
            ) : activeTab === 'producerDetail' && selectedProducer ? (
              <ProducerDetailView producer={selectedProducer} onBack={() => setActiveTab('home')} />
            ) : (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 animate-fade-in">
                {/* HERO SECTION */}
                <section id="home" className="py-10 md:py-20 relative">
                  <div className="flex flex-col md:flex-row items-center gap-10">
                    <div className="flex-1 space-y-6 text-center md:text-left z-10">
                      <img src="./catchphrase.png" alt="あなたのスマホから始まる" className="h-auto w-4/5 max-w-[320px] md:max-w-none md:h-16 lg:h-20 object-contain mb-4 mx-auto md:mx-0 drop-shadow-sm" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='inline-block'; }} />
                      <span style={{display: 'none'}} className="inline-block py-1 px-3 rounded-full bg-pink-100 text-pink-600 text-sm font-bold tracking-widest mb-2 border border-pink-200 shadow-sm">あなたのスマホから始まる</span>
                      <img src="./top.png" alt="もしも私が、アイドルになったら。" className="w-full max-w-xl mx-auto md:mx-0 object-contain drop-shadow-md" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                      <div className="pt-4 flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                        <button onClick={() => scrollTo('ranking')} className="bg-pink-500 hover:bg-pink-600 text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-pink-500/30 transition-transform transform hover:scale-105">投票して応援する</button>
                        <button onClick={() => scrollTo('idol-list')} className="bg-white/90 backdrop-blur-sm text-pink-600 px-8 py-3 rounded-full font-bold shadow-md transition-transform transform hover:scale-105 border border-pink-100">アイドルを探す</button>
                      </div>
                    </div>
                    <div className="flex-1 w-full max-w-md mx-auto relative">
                      <div className="absolute inset-0 bg-gradient-to-tr from-pink-300 to-purple-300 rounded-[3rem] rotate-3 opacity-30 blur-lg"></div>
                      <div className="relative bg-white/80 backdrop-blur-sm p-2 rounded-[3rem] shadow-xl border border-white">
                          <img src="./hero.png" alt="初代グランプリ" className="w-full h-96 md:h-[32rem] object-cover rounded-[2.5rem]" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                          <div style={{display: 'none'}}><MockImage text="初代グランプリ" className="h-96 md:h-[32rem] rounded-[2.5rem] w-full" bgClass="bg-gradient-to-br from-pink-100 to-purple-100" /></div>
                          <div className="absolute bottom-6 left-6 right-6 bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-lg border border-white/50">
                            <p className="text-xs text-pink-500 font-bold">初代グランプリ</p>
                            <p className="font-bold text-gray-800 text-lg">星野 きらら</p>
                          </div>
                      </div>
                    </div>
                  </div>
                </section>

                {/* RANKING SECTION */}
                <section id="ranking" className="py-16">
                  <SectionTitle title="CURRENT RANKING" subtitle="多様な切り口で原石を発見！応援して表紙モデルを決めよう！" iconClass="fa-solid fa-trophy" />
                  <div className="flex flex-wrap justify-center gap-2 mb-6 px-2">
                    {RANKING_TABS.map(tab => (
                      <button key={tab.id} onClick={() => setActiveRankingTab(tab.id)} className={`px-4 py-2 rounded-full font-bold text-xs md:text-sm transition-all border-2 ${activeRankingTab === tab.id ? 'bg-pink-500 text-white border-pink-500 shadow-md transform scale-105' : 'bg-white/80 backdrop-blur-sm text-gray-600 border-white hover:border-pink-300 shadow-sm'}`}>
                        <i className={`fa-solid ${tab.icon} mr-2`}></i>{tab.label}
                      </button>
                    ))}
                  </div>
                  <div className="bg-white/60 backdrop-blur-sm rounded-2xl p-4 text-center mb-8 max-w-2xl mx-auto shadow-sm text-pink-700 font-medium text-xs border border-white mx-4">{RANKING_TABS.find(t=>t.id===activeRankingTab).desc}</div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto animate-fade-in-up" key={activeRankingTab}>
                    {(RANKING_DATA[activeRankingTab] || []).map((item, index) => {
                      const idol = IDOLS.find(i => i.id === item.idolId);
                      return (
                        <div key={index} onClick={() => idol && openIdolDetail(idol)} className={`relative cursor-pointer group transition-transform hover:-translate-y-2 flex flex-col items-center ${index === 0 ? 'md:-translate-y-4' : ''}`}>
                          <div className={`absolute -top-4 left-1/2 -translate-x-1/2 w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl text-white shadow-md z-30 ${index === 0 ? 'bg-gradient-to-b from-yellow-300 to-yellow-500' : index === 1 ? 'bg-gradient-to-b from-gray-300 to-gray-500' : 'bg-gradient-to-b from-orange-300 to-orange-500'}`}>{item.rank}</div>
                          
                          {/* 額縁と写真のレイアウト */}
                          <div className="relative w-4/5 md:w-full aspect-[3/4] rounded-lg overflow-hidden shadow-lg bg-white/30 backdrop-blur-sm p-1">
                            
                            {/* 1. フレーム画像を背面に配置（枠のベース） */}
                            <img 
                                src="./rank_frame.png" 
                                alt="frame" 
                                className="absolute inset-0 w-full h-full object-fill z-0 pointer-events-none" 
                                onError={(e) => { e.target.src = './rank_frame.jpg'; }}
                            />

                            {/* 2. 写真を「中」に配置（枠の縁より少し内側に収める） */}
                            <div className="absolute inset-[13.5%] overflow-hidden z-10 flex items-center justify-center bg-pink-50/50">
                                <img 
                                  src={`./profile${item.rank}.png`} 
                                  alt={item.name} 
                                  className="w-full h-full object-cover animate-slow-zoom" 
                                  onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='flex'; }} 
                                />
                                <div style={{display: 'none'}} className="w-full h-full flex items-center justify-center">
                                  <MockImage text={item.name} className="w-full h-full" bgClass={`bg-gradient-to-tr ${idol?.color || 'from-pink-100 to-pink-200'}`} />
                                </div>
                            </div>

                            {/* 3. キラキラエフェクト */}
                            {[...Array(6)].map((_, i) => (
                              <div key={i} className="sparkle" style={{
                                top: `${Math.random() * 50 + 25}%`,
                                left: `${Math.random() * 50 + 25}%`,
                                animation: `sparkle-anim ${2 + Math.random() * 2}s ease-in-out infinite ${Math.random() * 2}s`
                              }}></div>
                            ))}
                          </div>

                          <div className="text-center mt-4">
                            <h4 className="font-bold text-lg text-gray-800 mb-1 group-hover:text-pink-600 transition-colors drop-shadow-sm">{item.name}</h4>
                            <p className="text-pink-600 font-mono font-bold text-sm drop-shadow-sm">{item.value}</p>
                            <button className="mt-4 px-6 py-1.5 rounded-full bg-pink-500 text-white text-xs font-bold shadow-md hover:bg-pink-600 transition-colors">応援する</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* IDOL LIST SECTION */}
                <section id="idol-list" className="py-16">
                  <SectionTitle title="IDOL LIST" subtitle="あなただけの原石（推し）を見つけよう！" iconClass="fa-solid fa-users" />
                  <div className="bg-white/80 backdrop-blur-sm rounded-3xl p-4 md:p-6 shadow-sm border border-white mb-8 max-w-4xl mx-auto">
                    <input type="text" placeholder="名前で検索..." value={idolSearchText} onChange={(e) => setIdolSearchText(e.target.value)} className="w-full px-11 py-3 bg-white/50 border border-gray-200 rounded-full focus:outline-none ring-pink-300 font-medium shadow-sm mb-4" />
                    <div className="flex flex-wrap gap-2">
                       {['all', 'rookie', 'pref', 'style'].map(type => (
                         <button key={type} onClick={() => setIdolFilterType(type)} className={`px-4 py-2 rounded-full text-xs font-bold border transition-colors shadow-sm ${idolFilterType === type ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-gray-600 border-gray-200 hover:bg-pink-50'}`}>{type === 'all' ? 'すべて' : type === 'rookie' ? '新人' : type === 'pref' ? '都道府県別' : '系統別'}</button>
                       ))}
                    </div>
                    {idolFilterType === 'pref' && <div className="flex gap-2 overflow-x-auto pb-2 mt-3 hide-scrollbar">{uniquePrefs.map(p => <button key={p} onClick={() => setIdolFilterPref(p)} className={`px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border ${idolFilterPref === p ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-white text-gray-500'}`}>{p}</button>)}</div>}
                    {idolFilterType === 'style' && <div className="flex gap-2 overflow-x-auto pb-2 mt-3 hide-scrollbar">{uniqueStyles.map(s => <button key={s} onClick={() => setIdolFilterStyle(s)} className={`px-4 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border ${idolFilterStyle === s ? 'bg-purple-50 text-purple-600 border-purple-200' : 'bg-white text-gray-500'}`}>{s}</button>)}</div>}
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 animate-fade-in">
                    {filteredIdols.map((idol) => (
                      <div key={idol.id} onClick={() => openIdolDetail(idol)} className="group cursor-pointer">
                        <div className="relative overflow-hidden rounded-3xl mb-3 shadow-md bg-white/90 backdrop-blur-sm p-1 border border-white">
                          <img 
                            src={`./idol${idol.id}.png`} 
                            alt={idol.name} 
                            className="w-full aspect-[4/5] object-cover rounded-2xl transition-transform duration-500 group-hover:scale-105" 
                            onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} 
                          />
                          <div style={{display: 'none'}}><MockImage text={idol.name} className="w-full aspect-[4/5] rounded-2xl group-hover:scale-105" bgClass={`bg-gradient-to-br ${idol.color}`} /></div>
                          <div className="absolute top-3 left-3 flex flex-col gap-1 items-start">
                            <span className="bg-black/60 backdrop-blur-sm text-white text-[10px] font-bold px-2.5 py-1 rounded-full">{idol.type}</span>
                          </div>
                        </div>
                        <div className="px-2">
                          <div className="flex flex-wrap items-center gap-1.5 mb-2">
                            <span className="bg-white/80 text-blue-600 text-[9px] font-bold px-1.5 py-0.5 rounded border border-blue-100 shadow-sm"><i className="fa-solid fa-location-dot"></i>{idol.pref}</span>
                            <span className="bg-white/80 text-purple-600 text-[9px] font-bold px-1.5 py-0.5 rounded border border-purple-100 shadow-sm"><i className="fa-solid fa-ribbon"></i>{idol.style}</span>
                          </div>
                          <h4 className="font-bold text-gray-800 text-lg group-hover:text-pink-500 transition-colors">{idol.name}</h4>
                          <p className="text-xs text-gray-700 line-clamp-2 leading-relaxed font-medium">{idol.catchphrase}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
                
                {/* PRODUCER RANKING */}
                <section id="producer-ranking" className="py-16">
                  <SectionTitle title="PRODUCER RANKING" subtitle="トッププロデューサーたち！" iconClass="fa-solid fa-user-tie" />
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto px-4">
                    {PRODUCERS.map((producer, index) => (
                      <div key={index} onClick={() => openProducerDetail(producer)} className="bg-white/90 backdrop-blur-sm rounded-3xl p-5 shadow-md border-2 border-white cursor-pointer group transition-transform hover:-translate-y-2 text-center">
                        <div className={`w-20 h-20 rounded-full mb-3 mx-auto shadow-inner flex items-center justify-center bg-gradient-to-br ${producer.iconColor} border-2 border-white transition-transform group-hover:scale-105`}><i className="fa-solid fa-user-tie text-3xl text-white opacity-80"></i></div>
                        <div className="bg-yellow-50 text-yellow-700 text-[10px] font-bold px-2 py-0.5 rounded-full mb-2">{producer.title}</div>
                        <h4 className="font-bold text-base group-hover:text-blue-500 transition-colors">{producer.name}</h4>
                        <p className="text-xs text-gray-500 font-mono">{producer.value}</p>
                      </div>
                    ))}
                  </div>
                </section>

                {/* MAGAZINE SECTION */}
                <section id="magazine" className="py-16 bg-white/40 backdrop-blur-md rounded-[3rem] p-4 md:p-10 border border-white shadow-xl my-10 relative overflow-hidden">
                  <SectionTitle title="MAGAZINE ARCHIVE" subtitle="あなたが主役の誌面体験。" iconClass="fa-solid fa-book-open" />
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 relative z-10">
                    {MAGAZINES.map((mag) => (
                      <div key={mag.id} className="flex flex-col items-center group">
                        <div className="relative w-4/5 md:w-full aspect-[3/4] bg-white/80 rounded-md shadow-lg border-l-4 border-white p-2 transition-transform group-hover:-translate-y-2">
                          <img src={`./mag${mag.id}.png`} alt={mag.title} className="w-full h-full object-cover rounded shadow-inner" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                          <div style={{display: 'none'}} className="w-full h-full"><MockImage text={`[表紙: ${mag.title}]`} className="w-full h-full rounded shadow-inner" bgClass="bg-gradient-to-b from-gray-50 to-gray-200" /></div>
                          <div className="absolute top-4 left-0 bg-pink-500 text-white text-xs font-bold py-1 px-3 rounded-r-full shadow-md">{mag.issue}</div>
                        </div>
                        <div className="text-center mt-6">
                          <span className={`text-xs font-bold px-2 py-1 rounded-full shadow-sm border border-white ${mag.status === '発売中' ? 'bg-white text-gray-600' : 'bg-pink-100 text-pink-600'}`}>{mag.status}</span>
                          <h4 className="font-bold text-lg mt-2 text-gray-800">{mag.title}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}
          </main>

          <footer className="bg-gray-900/90 backdrop-blur-md text-white pt-16 pb-32 md:pb-16 mt-20 rounded-t-[3rem] border-t border-white/20 shadow-2xl relative z-10">
            <div className="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-10 text-center md:text-left">
              <div>
                <div className="flex items-center justify-center md:justify-start mb-4">
                  <img src="./logo.png" alt="もしアイ" className="h-14 md:h-20 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                  <span style={{display: 'none'}} className="text-2xl font-bold font-serif">もしアイ</span>
                </div>
                <p className="text-gray-300 text-sm font-medium">もしも私が、アイドルになったら。<br />あなたのスマホから始まる、新しい物語。</p>
              </div>
              <div><h4 className="font-bold border-b border-gray-700 pb-2 mb-4">CONTENTS</h4><ul className="space-y-2 text-sm text-gray-400"><li><button onClick={() => {setActiveTab('home'); setTimeout(()=>scrollTo('home'),100);}} className="hover:text-pink-400 transition-colors">ホーム</button></li></ul></div>
              <div><h4 className="font-bold border-b border-gray-700 pb-2 mb-4">ABOUT</h4><ul className="space-y-2 text-sm text-gray-400"><li><a href="#" className="hover:text-pink-400 transition-colors">よくある質問 (Q&A)</a></li></ul></div>
            </div>
            <div className="max-w-5xl mx-auto px-6 mt-12 pt-6 border-t border-gray-800 text-center text-xs text-gray-500 font-medium">
              &copy; 2026 もしも私が、アイドルになったら。運営事務局 All Rights Reserved.
            </div>
          </footer>

          {(activeTab === 'home' || activeTab === 'idolDetail' || activeTab === 'producerDetail') && (
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/40 backdrop-blur-md border-t border-white/50 z-50 md:flex md:justify-center animate-fade-in-up">
              <div className="max-w-md w-full mx-auto md:mx-0 flex items-center gap-3 p-2">
                <div className="hidden md:block text-sm font-bold text-gray-700 ml-4 mr-2 drop-shadow-sm">次世代アイドル<br/>エントリー受付中！</div>
                <div className="flex-1 animate-float">
                  <img src="./line_btn.png" alt="LINEで無料エントリー！" className="w-full max-h-20 object-contain cursor-pointer transition-transform transform hover:scale-110 drop-shadow-xl mx-auto" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='flex'; }} />
                  <button style={{display: 'none'}} className="w-full bg-[#06C755] text-white py-3 px-6 rounded-full font-bold">LINEで無料エントリー！</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
