    const uploadFile = (file) => {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve(null);
          return;
        }
        
        if (file.type.startsWith('video/')) {
          alert("【エラー】完全無料設定のため、動画のアップロードはできません。画像のみ選択してください。");
          reject(new Error("動画はアップロードできません"));
          return;
        }

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

                      <div className="sm:w-2/5 aspect-[21/9] sm:aspect-[4/3] overflow-hidden relative bg-slate-50">
                        <img src={ev.bannerImg} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 mix-blend-multiply" onError={handleImgError}/>
                      </div>
                      <div className="p-5 sm:w-3/5 flex flex-col justify-center">
                        <p className="text-[9px] font-medium text-pink-500 tracking-[0.2em] mb-2 uppercase">Event</p>
                        <h4 className="text-sm font-serif font-light text-slate-800 leading-relaxed mb-3 group-hover:text-pink-600 transition-colors">{ev.title}</h4>
                        <div className="mt-auto flex items-center gap-2 text-[10px] text-slate-400 font-light tracking-widest">
                           <i className="fa-regular fa-clock"></i> 開催中
                        </div>
                      </div>
                      <div className="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-200 group-hover:text-pink-300 transition-colors hidden sm:block">
                        <i className="fa-solid fa-chevron-right font-light"></i>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-8 text-center sm:text-left pl-0 sm:pl-2">
                   <button onClick={() => onNavigate('ranking')} className="text-xs text-slate-500 hover:text-slate-900 tracking-widest font-light transition-colors border-b border-slate-300 hover:border-slate-900 pb-1">
                      VIEW ALL CAMPAIGNS <i className="fa-solid fa-arrow-right-long ml-2"></i>
                   </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const EventDetailView = ({ event, onBack, idolsData, onIdolSelect, onQuickVote }) => {
      const [currentRankingTab, setCurrentRankingTab] = useState('overall');

      let currentRankingData = event.rankingData[currentRankingTab] || [];
      if (currentRankingTab === 'overall') {
         currentRankingData = [...idolsData].sort((a, b) => (b.totalVotes || 0) - (a.totalVotes || 0)).map((idol, index, array) => {
           const diff = index === 0 ? "-" : `1ランク上まで ${((array[index-1].totalVotes || 0) - (idol.totalVotes || 0)).toLocaleString()}票`;
           return {
             rank: index + 1,
             idolId: idol.id,
             name: idol.name,
             value: `${(idol.totalVotes || 0).toLocaleString()} 票`,
             diff: diff
           };
         });
      }
      const maxPt = currentRankingData.length > 0 ? parseVote(currentRankingData[0].value) : 1;

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 animate-fade-in-up">
          <button onClick={onBack} className="mb-12 text-slate-500 font-medium tracking-widest text-xs flex items-center gap-3 hover:text-pink-500 transition-colors bg-transparent border-none">
            <i className="fa-solid fa-arrow-left-long"></i> BACK TO TOP
          </button>
          
          <div className="text-center mb-12">
            <h2 className="text-3xl md:text-5xl font-serif text-slate-900 font-light mb-4">{event.title}</h2>
            <p className="text-slate-500 text-xs md:text-sm font-light tracking-widest leading-relaxed whitespace-pre-wrap">{event.subtitle}</p>
          </div>

          <div className="relative rounded-none overflow-hidden border border-slate-200 bg-white p-2 shadow-sm mb-16">
            <div className="aspect-[21/9] overflow-hidden relative bg-slate-50">
              <img src={event.bannerImg} className="w-full h-full object-cover opacity-90 mix-blend-multiply" onError={handleImgError} />
            </div>
          </div>
          
          <CountdownTimer endDate={event.endDate} themeColor={event.themeColor} />

          <div className="mt-20 max-w-4xl mx-auto">
             <div className="flex gap-4 overflow-x-auto pb-8 hide-scrollbar justify-center border-b border-slate-200 mb-10">
                {RANKING_TABS.map(tab => (
                  <button key={tab.id} onClick={() => setCurrentRankingTab(tab.id)} className={`px-5 py-2 rounded-none text-[10px] tracking-widest uppercase transition-all border ${currentRankingTab === tab.id ? `bg-slate-800 text-white border-transparent` : `bg-transparent text-slate-500 border-slate-200 hover:border-slate-400`}`}>{tab.label}</button>
                ))}
             </div>
             
             {currentRankingData.length === 0 ? <p className="text-center text-sm text-slate-500 font-light py-10">集計データがありません。</p> : (
                <div className="space-y-2 pb-20">
                  {currentRankingData.map((item, i) => {
                     const idolData = idolsData.find(idl => String(idl.id) === String(item.idolId));
                     const itemPt = parseVote(item.value);
                     const percentage = Math.min(100, Math.max(0, (itemPt / maxPt) * 100));
                     const isTop3 = i < 3;

                     return (
                       <div key={item.rank} onClick={() => { if(idolData) onIdolSelect(idolData) }} className={`flex items-center py-5 border-b border-slate-200 group cursor-pointer hover:bg-pink-50/30 transition-colors px-4 ${isTop3 ? 'bg-white shadow-sm mb-4 border' : ''}`}>
                          <div className={`w-12 font-serif text-xl md:text-2xl font-light ${i===0?'text-amber-500':i===1?'text-slate-400':i===2?'text-orange-400':'text-slate-400'} group-hover:text-slate-800 transition-colors`}>0{item.rank}</div>
                          <div className="w-12 h-12 md:w-16 md:h-16 rounded-full overflow-hidden border border-slate-100 mr-5 shrink-0 bg-slate-50">
                             <MediaDisplay src={idolData?.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover grayscale-[30%] group-hover:grayscale-0 transition-all mix-blend-multiply" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex justify-between items-baseline mb-2">
                              <h4 className="font-light text-slate-800 tracking-wide text-sm md:text-lg truncate pr-2">{item.name}</h4>
                              <p className={`font-timer font-light text-sm md:text-base text-slate-900 shrink-0`}>{item.value}</p>
                            </div>
                            <div className="w-full bg-slate-100 h-1.5 relative rounded-full overflow-hidden">
                              <div className={`absolute top-0 left-0 h-full transition-all duration-1000 ${i===0?'bg-amber-400':i===1?'bg-slate-400':i===2?'bg-orange-400':'bg-slate-800'}`} style={{ width: `${percentage}%` }}></div>
                            </div>
                          </div>
                          <div className="ml-4 sm:ml-8 flex items-center gap-4 w-24 sm:w-32 justify-end shrink-0">
                             {currentRankingTab !== 'producers' ? (
                                <div className="flex flex-col items-end gap-2">
                                  {item.diff && item.diff !== "-" && <span className="hidden sm:block text-[9px] font-medium tracking-widest text-pink-400 uppercase text-right">{item.diff}</span>}
                                  <button onClick={(e) => { e.stopPropagation(); if(idolData) onQuickVote(e, idolData); }} className="bg-slate-900 text-white hover:bg-pink-600 px-4 py-1.5 rounded-none text-[9px] tracking-widest font-light transition-colors shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                                    <i className="fa-solid fa-heart"></i> VOTE
                                  </button>
                                </div>
                             ) : (
                                <i className="fa-solid fa-arrow-right-long text-slate-300 group-hover:text-slate-800 transition-colors font-light"></i>
                             )}
                          </div>
                       </div>
                     );
                  })}
                </div>
             )}
          </div>
        </div>
      );
    };
    
    const AuthModal = ({ onClose, onAuthSubmit, isAdminOnly = false }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        await onAuthSubmit(email, password, isLogin);
        setLoading(false);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[500] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-none overflow-hidden max-w-sm w-full shadow-2xl border border-slate-100 relative">
            <button onClick={onClose} disabled={loading} className="absolute right-4 top-4 text-slate-400 hover:text-slate-800 transition-colors z-10"><i className="fa-solid fa-xmark text-lg"></i></button>
            
            <div className="flex border-b border-slate-100">
              <button onClick={() => setIsLogin(true)} disabled={loading} className={`flex-1 py-4 text-xs font-medium tracking-widest uppercase transition-colors ${isLogin ? 'bg-white text-slate-800 border-b-2 border-slate-800' : 'bg-slate-50 text-slate-400'}`}>Log In</button>
              <button onClick={() => setIsLogin(false)} disabled={loading} className={`flex-1 py-4 text-xs font-medium tracking-widest uppercase transition-colors ${!isLogin ? 'bg-white text-slate-800 border-b-2 border-slate-800' : 'bg-slate-50 text-slate-400'}`}>Sign Up</button>
            </div>

            <div className="p-8">
              <h3 className="text-2xl font-light font-serif text-slate-800 mb-6 text-center">{isAdminOnly ? 'Admin Access' : (isLogin ? 'Welcome Back' : 'Create Account')}</h3>
              {isAdminOnly && <p className="text-[10px] text-center text-slate-400 mb-4">管理者用メールアドレスでログインしてください</p>}
              <form onSubmit={handleSubmit} className="space-y-6">
                <div>
                  <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Email Address</label>
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} disabled={loading} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-800 transition-colors font-light text-slate-800" placeholder="your@email.com" />
                </div>
                <div>
                  <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Password</label>
                  <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} disabled={loading} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-800 transition-colors font-light text-slate-800" placeholder="••••••••" />
                </div>
                <button type="submit" disabled={loading} className="w-full py-4 bg-slate-900 text-white text-xs tracking-widest font-light rounded-none hover:bg-slate-800 transition-colors mt-4 disabled:bg-slate-400 flex justify-center items-center gap-2">
                  {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isLogin ? 'LOGIN' : 'REGISTER')}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const AdminDashboard = ({ idolsData, showToast }) => {
      const [newIdol, setNewIdol] = useState({ name: '', loginEmail: '', profileImage: '', catchphrase: '', pref: '', style: '', birthday: '' });
      const [deleteId, setDeleteId] = useState(null);
      const [uploading, setUploading] = useState(false);

      const handleFileChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        try {
          const url = await uploadFile(file);
          setNewIdol({...newIdol, profileImage: url});
          showToast("画像がアップロードされました");
        } catch (err) {
          showToast("アップロードに失敗しました");
        }
        setUploading(false);
      };

      const handleAddIdol = async (e) => {
        e.preventDefault();
        if(!newIdol.name || !newIdol.loginEmail) return showToast("名前とログインEmailは必須です");
        
        const { collection, addDoc } = window.FirebaseHelper;
        const db = window.FirebaseDbRef;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'idols'), {
            ...newIdol,
            type: "新規エントリー",
            issue: "未掲載",
            isOffMelty: false,
            isRookie: true,
            story: "新しい物語がここから始まります。",
            titleBadge: "注目",
            producerCount: "0",
            totalVotes: 0,
            wishlist: [],
            receivedGifts: [],
            createdAt: new Date().toISOString()
          });
          showToast("アイドルを新規追加しました");
          setNewIdol({ name: '', loginEmail: '', profileImage: '', catchphrase: '', pref: '', style: '', birthday: '' });
        } catch(err) {
          showToast("追加エラー: " + err.message);
        }
      };

      const handleDelete = async (id) => {
        if (deleteId === id) {
          const { doc, deleteDoc } = window.FirebaseHelper;
          const db = window.FirebaseDbRef;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'idols', String(id)));
            showToast("アイドルを削除しました");
            setDeleteId(null);
          } catch(e) {
            showToast("削除エラー");
          }
        } else {
          setDeleteId(id);
          setTimeout(() => setDeleteId(null), 3000);
        }
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 pt-32 animate-fade-in">
          <SectionTitle title="ADMIN" subtitle="管理者コントロールパネル" />
          
          <div className="bg-white p-8 shadow-sm border border-slate-200 mb-12">
            <h3 className="text-lg font-serif mb-6 text-slate-800">アイドルの新規追加</h3>
            <form onSubmit={handleAddIdol} className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">名前 *</label>
                <input required type="text" value={newIdol.name} onChange={e=>setNewIdol({...newIdol, name: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400" />
              </div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">ログイン用Email * (IdolログインID)</label>
                <input required type="email" value={newIdol.loginEmail} onChange={e=>setNewIdol({...newIdol, loginEmail: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400" />
              </div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">プロフィール画像 (写真/動画)</label>
                <input type="file" accept="image/*,video/mp4" onChange={handleFileChange} disabled={uploading} className="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-none file:border-0 file:text-[10px] file:font-medium file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 transition-colors cursor-pointer" />
                {uploading && <p className="text-[9px] text-pink-500 mt-1">アップロード中...</p>}
                {newIdol.profileImage && !uploading && <p className="text-[9px] text-green-500 mt-1">アップロード完了</p>}
              </div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">キャッチフレーズ</label>
                <input type="text" value={newIdol.catchphrase} onChange={e=>setNewIdol({...newIdol, catchphrase: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400" />
              </div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">出身地</label>
                <select value={newIdol.pref} onChange={e=>setNewIdol({...newIdol, pref: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400 bg-white">
                  <option value="">選択してください</option>
                  {PREFECTURES.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">スタイル</label>
                <select value={newIdol.style} onChange={e=>setNewIdol({...newIdol, style: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400 bg-white">
                  <option value="">選択してください</option>
                  {STYLES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[10px] text-slate-500 mb-1">生年月日</label>
                <input type="date" value={newIdol.birthday} onChange={e=>setNewIdol({...newIdol, birthday: e.target.value})} className="w-full border-b border-slate-300 py-2 text-sm focus:outline-none focus:border-pink-400 bg-white" />
              </div>
              <div className="md:col-span-2 text-right mt-4">
                <button type="submit" disabled={uploading} className="bg-slate-900 text-white px-8 py-3 text-[10px] tracking-widest hover:bg-slate-800 transition-colors uppercase disabled:bg-slate-400">追加する</button>
              </div>
            </form>
          </div>

          <div className="bg-white p-8 shadow-sm border border-slate-200">
            <h3 className="text-lg font-serif mb-6 text-slate-800">登録済みアイドル一覧</h3>
            <div className="space-y-4 max-h-[500px] overflow-y-auto pr-4">
              {idolsData.map(idol => (
                <div key={idol.id} className="flex items-center justify-between border-b border-slate-100 py-4">
                  <div className="flex items-center gap-4">
                    <MediaDisplay src={idol.profileImage} fallbackSrc="./default_idol.png" className="w-12 h-12 object-cover rounded-full bg-slate-100" />
                    <div>
                      <div className="font-medium text-slate-800">{idol.name}</div>
                      <div className="text-[10px] text-slate-400">{idol.loginEmail} | {idol.totalVotes || 0} 票</div>
                    </div>
                  </div>
                  <button onClick={() => handleDelete(idol.id)} className={`px-4 py-2 text-[10px] tracking-widest text-white transition-colors ${deleteId === idol.id ? 'bg-red-600' : 'bg-slate-300 hover:bg-red-500'}`}>
                    {deleteId === idol.id ? '本当に削除？' : '削除'}
                  </button>
                </div>
              ))}
              {idolsData.length === 0 && <p className="text-sm text-slate-500 py-8 text-center border border-dashed border-slate-300">現在登録されているアイドルはいません。</p>}
            </div>
          </div>
        </div>
      );
    }

    const VoteModal = ({ onClose, idol, user, userData, updateTickets, showToast, onLogin, onSuccess }) => {
      if (!user || user.isAnonymous) {
        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-none p-10 max-w-sm w-full text-center shadow-2xl animate-fade-in-up border border-slate-100">
              <i className="fa-regular fa-user text-3xl text-slate-300 mb-6"></i>
              <h3 className="text-lg font-light tracking-widest font-serif mb-4 text-slate-800">MEMBERS ONLY</h3>
              <p className="text-xs text-slate-500 mb-8 leading-loose font-light">プロデューサー登録（無料）で、<br/>毎日<span className="text-pink-500 font-medium">「3票の無料投票券」</span>を進呈いたします。</p>
              <button onClick={onLogin} className="w-full py-4 bg-slate-900 text-white text-xs tracking-widest font-light rounded-none mb-4 shadow-md hover:bg-slate-800 transition-colors">
                REGISTER & VOTE
              </button>
              <button onClick={onClose} className="text-[10px] text-slate-400 font-medium tracking-widest hover:text-slate-600 border-b border-transparent hover:border-slate-300 transition-all pb-1">CANCEL</button>
            </div>
          </div>
        );
      }

      const handleVote = (amount) => {
        if (userData.freeTickets >= amount) {
          updateTickets(-amount, 0); // consume tickets
          onSuccess(amount, '無料投票');
          onClose();
        } else {
          showToast("無料票が不足しています。");
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-none overflow-hidden max-w-md w-full shadow-2xl border border-slate-100">
            <div className="bg-white border-b border-slate-100 p-6 text-center relative">
              <h3 className="font-light tracking-[0.3em] text-xs text-slate-800 uppercase">Voting Room</h3>
              <button onClick={onClose} className="absolute right-6 top-6 text-slate-400 hover:text-slate-800 transition-colors"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div className="p-6 md:p-8 max-h-[80vh] overflow-y-auto hide-scrollbar bg-slate-50/30">
              <div className="flex items-center gap-5 mb-10 bg-white p-4 rounded-none border border-slate-100 shadow-sm">
                <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover border border-slate-100" />
                <div>
                  <p className="text-[9px] text-slate-400 font-medium tracking-widest mb-1 uppercase">Target</p>
                  <h4 className="font-light font-serif text-lg text-slate-800 leading-none">{idol.name}</h4>
                </div>
              </div>

              <div className="mb-6">
                <div className="bg-white border border-slate-200 p-8 rounded-none text-center shadow-sm relative">
                  <p className="text-[10px] text-slate-400 font-medium tracking-widest mb-2 uppercase">Daily Free Votes <span className="text-pink-400 lowercase text-[9px] tracking-normal">(3/day)</span></p>
                  <p className="text-xs text-slate-500 mb-6 font-light">毎日ログインして、推しに愛を届けましょう。</p>
                  <div className="text-5xl font-light font-timer text-slate-800 mb-8">{userData.freeTickets}</div>
                  <button onClick={() => handleVote(1)} disabled={userData.freeTickets < 1} className="w-full py-4 bg-slate-800 text-white text-xs tracking-widest font-light rounded-none disabled:bg-slate-200 disabled:text-slate-400 transition-colors hover:bg-slate-900">
                    VOTE NOW (1票)
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const GiftModal = ({ onClose, idol, user, updateTickets, showToast, onLogin, onSuccess }) => {
      if (!user || user.isAnonymous) {
        return (
          <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-none p-10 max-w-sm w-full text-center shadow-2xl animate-fade-in-up border border-slate-100">
              <i className="fa-regular fa-user text-3xl text-slate-300 mb-6"></i>
              <h3 className="text-lg font-light tracking-widest font-serif mb-4 text-slate-800">MEMBERS ONLY</h3>
              <p className="text-xs text-slate-500 mb-8 leading-loose font-light">ギフト・雑誌を購入して応援するには、<br/>プロデューサー登録（無料）が必要です。</p>
              <button onClick={onLogin} className="w-full py-4 bg-slate-900 text-white text-xs tracking-widest font-light rounded-none mb-4 shadow-md hover:bg-slate-800 transition-colors">
                REGISTER
              </button>
              <button onClick={onClose} className="text-[10px] text-slate-400 font-medium tracking-widest hover:text-slate-600 border-b border-transparent hover:border-slate-300 transition-all pb-1">CANCEL</button>
            </div>
          </div>
        );

                        <div className="aspect-[3/4] bg-slate-50 overflow-hidden relative">

                            <div className="absolute top-2 right-2 bg-pink-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md">

                  <h4 className="text-xs font-medium tracking-widest text-slate-500 uppercase mb-2 flex items-center gap-3"><span className="w-6 h-px bg-slate-300"></span> New Post</h4>

                </div>

                  <div>
                    <textarea value={timelineText} onChange={(e) => setTimelineText(e.target.value)} placeholder="今日はどんな一日でしたか？..." rows="4" className="w-full bg-slate-50 border border-slate-200 p-4 focus:outline-none focus:border-pink-300 transition-colors font-light text-sm resize-none"></textarea>

                    {timelineImg && !uploadingTimeline && <p className="text-[9px] text-green-500 mt-1">アップロード完了</p>}
                  </div>
                  <div className="text-right pt-2">
                    <button type="submit" disabled={!timelineText || uploadingTimeline} className="bg-pink-500 text-white text-[10px] tracking-widest font-light px-12 py-4 hover:bg-pink-600 transition-colors uppercase disabled:bg-slate-300">Post Now</button>

                </form>
              </div>

            </div>
          </div>
        </div>

                  </div>
                  <i className="fa-solid fa-chevron-right text-slate-200 group-hover:text-pink-300 transition-colors pr-2 font-light"></i>
                </div>
              ))}
            </div>
          )}
        </div>

    const IdolDetailView = ({ idol, onBack, onVoteClick, onOutfitClick, onGiftClick, idolsData, onIdolSelect, onNavigate, producersData, postsData, commentsData, onPostComment, onLikePost, onDirectGift, user }) => {
      const sortedIdols = [...idolsData].sort((a, b) => (b.totalVotes || 0) - (a.totalVotes || 0));
      const currentRank = sortedIdols.findIndex(i => String(i.id) === String(idol.id)) + 1;
      const currentVotes = (idol.totalVotes || 0).toLocaleString();

      const idolProducers = producersData.filter(p => p.votes && p.votes[idol.id]).sort((a,b) => b.votes[idol.id] - a.votes[idol.id]);
      const top3Producers = idolProducers.slice(0, 3);
      const top3Ids = top3Producers.map(p => p.id);

      const [commentText, setCommentText] = useState('');

      return (
        <div className="animate-fade-in-up pb-0">

                  {idol.titleBadge && !idol.isStreaming && (<div className="absolute top-6 left-6 bg-white/90 backdrop-blur-md text-slate-800 text-[10px] font-medium tracking-widest px-4 py-2 rounded-none shadow-sm z-10 border border-slate-100">{idol.titleBadge}</div>)}
                  <div className="absolute top-6 right-6 bg-slate-900/80 backdrop-blur-md text-white text-[9px] font-light tracking-[0.2em] px-3 py-1.5 rounded-none z-10 uppercase">{idol.type}</div>
                  <div className="w-full h-full relative overflow-hidden bg-slate-50">
                    <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />

                  <button onClick={onVoteClick} className="w-full bg-slate-900 text-white py-4 md:py-5 rounded-none shadow-[0_10px_20px_-10px_rgba(0,0,0,0.3)] flex items-center justify-center gap-3 hover:bg-slate-800 transition-colors group"><i className="fa-regular fa-heart text-pink-400 group-hover:scale-110 transition-transform"></i><span className="text-xs tracking-[0.2em] font-light">VOTE FOR HER</span></button>
                  <div className="grid grid-cols-2 gap-4">
                    <button onClick={onGiftClick} className="w-full bg-white border border-slate-200 text-slate-700 py-4 rounded-none shadow-sm flex items-center justify-center gap-2 hover:border-slate-400 transition-colors group"><i className="fa-solid fa-gift text-slate-300 group-hover:text-slate-500 transition-colors"></i><span className="text-[10px] tracking-widest font-medium">GIFT & MAG</span></button>
                    <button onClick={onOutfitClick} className="w-full bg-white border border-slate-200 text-slate-700 py-4 rounded-none shadow-sm flex items-center justify-center gap-2 hover:border-slate-400 transition-colors group"><i className="fa-solid fa-shirt text-slate-300 group-hover:text-slate-500 transition-colors"></i><span className="text-[10px] tracking-widest font-medium">OUTFIT CATALOG</span></button>
                  </div>
                </div>
              </div>
            </div>

            {/* 新機能: 欲しいものリスト(Wishlist) */}
            <div className="bg-white/80 backdrop-blur-xl p-8 mb-12 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] border border-slate-100">
              <h3 className="text-sm font-medium tracking-widest text-slate-400 mb-6 uppercase flex items-center gap-3"><span className="w-8 h-px bg-slate-300"></span> Her Wishlist</h3>
              {idol.wishlist && idol.wishlist.length > 0 ? (
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {idol.wishlist.map(itemId => {
                    const item = OFF_MELTY_CATALOG.find(c => c.id === itemId);
                    if(!item) return null;
                    const isReceived = idol.receivedGifts?.find(g => g.itemId === itemId);
                    
                    return (
                      <div key={itemId} className="border border-slate-100 p-2 bg-white relative">
                        <img src={item.img} className={`w-full aspect-[3/4] object-cover ${isReceived ? 'opacity-40 grayscale' : ''}`} onError={handleImgError}/>
                        <p className="text-[10px] mt-3 font-light text-slate-800 line-clamp-1">{item.name}</p>
                        
                        {isReceived ? (
                          <div className="mt-2 p-1.5 bg-slate-50 border border-slate-200 text-center">
                            <p className="text-[8px] text-pink-500 font-bold">🎁 {isReceived.producerName} P が提供</p>
                          </div>
                        ) : (
                          <button onClick={() => onDirectGift(item.id, item.votes, '衣装提供(Wishlist)')} className="w-full bg-slate-900 hover:bg-pink-600 transition-colors text-white text-[9px] tracking-widest py-2.5 mt-2 uppercase">
                            プレゼント (+{item.votes.toLocaleString()}票)
                          </button>
                        )}
                        {isReceived && (
                          <div className="absolute top-4 left-0 w-full flex justify-center pointer-events-none">
                             <div className="bg-pink-500 text-white text-[10px] font-bold px-3 py-1 shadow-md rotate-[-10deg]">獲得済</div>
                          </div>
                        )}
                      </div>
                    )
                  })}
                </div>
              ) : <p className="text-center text-xs text-slate-400 font-light py-4">まだ欲しいものリストが登録されていません。</p>}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-16">
              <div className="lg:col-span-2 space-y-8">
                
                {/* 新機能: 活動タイムライン (Posts) */}
                <div className="bg-white/80 backdrop-blur-xl rounded-none p-8 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] border border-slate-100">
                  <h3 className="text-sm font-medium tracking-widest text-slate-400 mb-6 uppercase flex items-center gap-3"><span className="w-8 h-px bg-slate-300"></span> Timeline</h3>
                  <div className="space-y-8 max-h-[600px] overflow-y-auto pr-4 hide-scrollbar">
                    {postsData.filter(p => p.idolId === String(idol.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(post => (
                      <div key={post.id} className="border-b border-slate-100 pb-8 last:border-0 last:pb-0">
                        <div className="flex items-center gap-3 mb-4">
                          <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-8 h-8 rounded-full object-cover" />
                          <div>
                            <p className="text-xs font-medium text-slate-800">{idol.name}</p>
                            <p className="text-[9px] text-slate-400">{new Date(post.createdAt).toLocaleString()}</p>
                          </div>
                        </div>
                        <p className="text-sm text-slate-600 mb-4 whitespace-pre-wrap leading-loose font-light">{post.text}</p>
                        {post.img && <img src={post.img} className="w-full max-h-80 object-cover mb-4 rounded-sm border border-slate-100" onError={handleImgError} />}
                        <div className="flex justify-end">
                           <button onClick={() => onLikePost(post.id)} className={`flex items-center gap-2 text-xs transition-colors ${post.likedBy?.includes(user?.uid) ? 'text-pink-500' : 'text-slate-400 hover:text-pink-400'}`}>
                             <i className={`${post.likedBy?.includes(user?.uid) ? 'fa-solid' : 'fa-regular'} fa-heart`}></i> {post.likes}
                           </button>
                        </div>
                      </div>
                    ))}
                    {postsData.filter(p => p.idolId === String(idol.id)).length === 0 && <p className="text-xs text-slate-400 font-light text-center py-4">まだ投稿がありません。</p>}
                  </div>
                </div>

                {/* Profile & Story */}
                <div className="bg-white/80 backdrop-blur-xl rounded-none p-8 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] border border-slate-100">
                  <h3 className="text-sm font-medium tracking-widest text-slate-400 mb-6 uppercase flex items-center gap-3"><span className="w-8 h-px bg-slate-300"></span> Profile & Story</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
                    <div className="p-4 border border-slate-100 bg-slate-50/50 flex flex-col items-start"><p className="text-[9px] text-slate-400 font-medium tracking-widest uppercase mb-1">Birthday</p><p className="text-sm font-light text-slate-800">{idol.birthday}</p></div>
                    <div className="p-4 border border-slate-100 bg-slate-50/50 flex flex-col items-start"><p className="text-[9px] text-slate-400 font-medium tracking-widest uppercase mb-1">Hometown</p><p className="text-sm font-light text-slate-800">{idol.hometown}</p></div>
                    <div className="p-4 border border-slate-100 bg-slate-50/50 flex flex-col items-start"><p className="text-[9px] text-slate-400 font-medium tracking-widest uppercase mb-1">Specialty</p><p className="text-sm font-light text-slate-800">{idol.specialSkill}</p></div>
                  </div>
                  <p className="text-slate-600 text-sm md:text-base leading-loose font-light whitespace-pre-wrap">{idol.story}</p>
                </div>
              </div>

              <div className="space-y-8">
                {/* 新機能: リアルタイム応援メッセージボード */}
                <div className="bg-white/80 backdrop-blur-xl rounded-none p-8 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] border border-slate-100">
                  <h3 className="text-sm font-medium tracking-widest text-slate-400 mb-6 uppercase flex items-center gap-3">
                    <span className="w-8 h-px bg-slate-300"></span> Messages
                  </h3>
                  
                  <form onSubmit={(e) => { e.preventDefault(); onPostComment(commentText); setCommentText(''); }} className="mb-6 flex gap-2">
                    <input type="text" value={commentText} onChange={e=>setCommentText(e.target.value)} placeholder="応援メッセージを送ろう！" className="flex-1 border-b border-slate-300 py-2 text-xs focus:outline-none focus:border-pink-400 bg-transparent font-light" />
                    <button type="submit" disabled={!commentText} className="bg-slate-900 text-white px-4 py-2 text-[10px] tracking-widest hover:bg-pink-600 disabled:bg-slate-300 transition-colors">SEND</button>
                  </form>

                  <div className="space-y-5 max-h-96 overflow-y-auto pr-2 hide-scrollbar">
                    {commentsData.filter(c => c.idolId === String(idol.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(comment => (
                      <div key={comment.id} className="flex gap-3 border-b border-slate-50 pb-4">
                        <MediaDisplay src={comment.userIcon} fallbackSrc="./default_idol.png" className="w-8 h-8 rounded-full object-cover bg-slate-100 shrink-0" />
                        <div>
                          <div className="flex items-center flex-wrap gap-2 mb-1">
                            <span className="text-[10px] font-medium text-slate-800">{comment.userName}</span>
                            {top3Ids.includes(comment.userId) && <span className="bg-gradient-to-r from-amber-200 to-yellow-400 text-white text-[8px] px-1.5 py-0.5 rounded-sm font-bold tracking-widest shadow-sm">OFFICIAL P</span>}
                          </div>
                          <p className="text-xs text-slate-600 font-light mb-1">{comment.text}</p>
                          <span className="text-[8px] text-slate-400">{new Date(comment.createdAt).toLocaleString()}</span>
                        </div>
                      </div>
                    ))}
                    {commentsData.filter(c => c.idolId === String(idol.id)).length === 0 && <p className="text-[10px] text-slate-400 text-center">最初の応援メッセージを送りましょう！</p>}
                  </div>
                </div>

                <div className="bg-white/80 backdrop-blur-xl rounded-none p-8 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] border border-slate-100">
                  <h3 className="text-sm font-medium tracking-widest text-slate-400 mb-6 uppercase flex items-center gap-3">
                    <span className="w-8 h-px bg-slate-300"></span> Official P
                  </h3>
                  <p className="text-[10px] text-slate-500 font-light mb-6 leading-relaxed">このアイドルに最も多く投票・支援をしているトッププロデューサーです。</p>
                  <div className="space-y-4">
                    {top3Producers.map((p, i) => (
                      <div key={i} className="flex items-center gap-4 p-4 border border-slate-100 bg-slate-50/50 relative overflow-hidden group">
                        <div className={`absolute top-0 left-0 w-1 h-full transition-all ${i===0?'bg-amber-400':i===1?'bg-slate-400':'bg-orange-400'}`}></div>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-timer text-sm font-light shrink-0 ${i===0?'bg-amber-100 text-amber-600':i===1?'bg-slate-200 text-slate-600':'bg-orange-100 text-orange-600'}`}>
                          {i+1}
                        </div>
                        <MediaDisplay src={p.profileImage} fallbackSrc="./default_idol.png" className="w-10 h-10 rounded-full object-cover bg-white border border-slate-200" />
                        <div className="overflow-hidden">
                          <p className="text-xs font-light text-slate-800 truncate mb-1">{p.name}</p>
                          <p className="text-[9px] text-pink-500 font-medium tracking-widest">{(p.votes[idol.id] || 0).toLocaleString()} 票</p>
                        </div>
                      </div>
                    ))}
                    {top3Producers.length === 0 && <p className="text-[10px] text-slate-400 text-center">まだプロデューサーがいません。</p>}
                  </div>
                </div>
              </div>
            </div>
          </div>
          <CrossNavSection idolsData={idolsData} currentIdolId={idol.id} onIdolSelect={onIdolSelect} onNavigate={onNavigate} />
        </div>
      );
    };

    const SuccessModal = ({ data, onClose, idol }) => {
      useEffect(() => {
        if (typeof confetti !== 'undefined') {
          confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#f472b6', '#ec4899', '#fbcfe8', '#cbd5e1', '#f1f5f9'], disableForReducedMotion: true });
          setTimeout(() => { confetti({ particleCount: 100, spread: 100, origin: { y: 0.7 }, colors: ['#fde68a', '#fbbf24', '#fffbeb'] }); }, 300);
        }
      }, []);

      const isOutfit = data.actionType.includes('衣装');
      const isGift = data.actionType.includes('ギフト') || data.actionType.includes('雑誌');
      const tweetText = encodeURIComponent(`私がプロデュースしている【${data.idolName}】ちゃんに ${data.amount.toLocaleString()}票 支援しました！✨\n現在の順位をチェックして一緒に応援しよう！\n\n#もしアイ #アイドルオーディション #${data.idolName}\nhttps://moshi-ai.example.com`);

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[400] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white/95 rounded-none p-8 max-w-md w-full text-center shadow-[0_30px_60px_rgba(0,0,0,0.15)] relative overflow-hidden border border-white/50">
            <div className="absolute -top-24 -right-24 w-48 h-48 bg-pink-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float"></div>
            <div className="absolute -bottom-24 -left-24 w-48 h-48 bg-rose-50 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-float" style={{animationDelay: '1s'}}></div>
            
            <div className="relative z-10">
              <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_10px_30px_rgba(0,0,0,0.08)] border border-slate-100 animate-pulse-glow">
                <i className={`fa-solid ${isOutfit ? 'fa-shirt' : isGift ? 'fa-gift' : 'fa-trophy'} text-3xl text-pink-400`}></i>
              </div>
              
              <h2 className="text-xl font-light font-serif text-slate-800 mb-2 tracking-[0.2em]">CERTIFICATE</h2>
              <p className="text-[10px] font-medium text-slate-400 tracking-[0.3em] mb-8 border-b border-slate-200 pb-3 inline-block">応援証明書</p>
              
              <div className="flex items-center justify-center gap-5 mb-8">
                <MediaDisplay src={idol?.profileImage} fallbackSrc={`./default_idol.png`} className="w-20 h-20 rounded-full object-cover border border-slate-100 shadow-sm" />
                <div className="text-left">
                  <p className="text-[9px] text-slate-400 font-medium tracking-widest mb-1 uppercase">Idol Produced</p>
                  <p className="text-xl font-light text-slate-800 font-serif">{data.idolName}</p>
                </div>
              </div>

              <div className="bg-slate-50/80 rounded-sm p-6 border border-slate-100 mb-8">
                <p className="text-xs font-medium text-slate-500 tracking-wider mb-2">{data.actionType}による投票</p>
                <p className="text-4xl font-timer font-light text-slate-800">
                  +{data.amount.toLocaleString()} <span className="text-sm font-sans text-slate-400">票</span>
                </p>
                <p className="text-[10px] text-pink-500/80 font-medium mt-3 tracking-wide">あなたの応援が彼女の夢に直結しました。</p>
              </div>

              <div className="space-y-4">
                <a href={`https://twitter.com/intent/tweet?text=${tweetText}`} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-3 bg-slate-900 text-white py-4 rounded-sm font-light tracking-widest text-xs hover:bg-slate-800 transition-colors group">
                  <i className="fa-brands fa-x-twitter text-lg group-hover:scale-110 transition-transform"></i>
                  この証明書をXでシェア
                </a>
                <button onClick={onClose} className="w-full py-4 bg-transparent text-slate-500 font-medium text-xs tracking-widest hover:text-slate-800 transition-colors border-b border-transparent hover:border-slate-300">
                  CLOSE
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ProducerDetailView = ({ producer, onBack }) => (
      <div className="max-w-2xl mx-auto px-4 py-16 animate-fade-in-up">
        <button onClick={onBack} className="mb-10 text-slate-400 font-medium tracking-widest text-xs flex items-center gap-3 hover:text-pink-500 transition-colors bg-transparent border-none"><i className="fa-solid fa-arrow-left-long"></i> BACK</button>
        <div className="bg-white/90 backdrop-blur-xl rounded-none p-10 shadow-[0_20px_50px_-15px_rgba(0,0,0,0.05)] border border-slate-100 text-center relative overflow-hidden">
          <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-slate-200 via-slate-300 to-slate-200"></div>
          <div className="text-[10px] tracking-[0.3em] text-slate-400 uppercase mb-8">Producer Profile</div>
          <div className={`w-24 h-24 mx-auto rounded-full mb-6 flex items-center justify-center bg-gradient-to-br ${producer.iconColor} shadow-[0_10px_20px_rgba(0,0,0,0.1)] relative z-10 overflow-hidden`}>
             {producer.profileImage ? <img src={producer.profileImage} className="w-full h-full object-cover"/> : <i className="fa-solid fa-user-tie text-3xl text-white/90"></i>}
          </div>
          <div className="inline-block border-b border-slate-300 text-slate-500 text-[10px] font-medium tracking-widest pb-1 mb-4 uppercase">{producer.title || "プロデューサー"}</div>
          <h2 className="text-3xl font-light text-slate-800 font-serif mb-6">{producer.name}</h2>
          <p className="text-slate-400 text-xs tracking-widest mb-10 uppercase">Oshi: <span className="font-serif text-slate-700 text-base normal-case">{producer.oshi}</span></p>
          <div className="border-t border-slate-100 pt-8 mt-2 inline-block min-w-[200px]">
            <p className="text-[9px] font-medium tracking-widest text-slate-400 mb-2 uppercase">Total Votes</p>
            <p className="text-3xl font-light text-slate-800 font-timer tracking-wide">{(producer.totalVotes||0).toLocaleString()}</p>
          </div>
        </div>
      </div>
    );

// --- 追加: タイムラインの1投稿カード ---
    const TimelinePostCard = ({ post, idol, user, comments, onLike, onComment, onLogin }) => {
      const [showCommentInput, setShowCommentInput] = useState(false);
      const [commentText, setCommentText] = useState("");
      
      // この投稿へのコメントを抽出
      const postComments = comments
        .filter(c => c.postId === post.id)
        .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));

      const handleCommentSubmit = (e) => {
        e.preventDefault();
        if (!user || user.isAnonymous) {
          onLogin();
          return;
        }
        if (!commentText.trim()) return;
        onComment(post.id, idol.id, commentText);
        setCommentText("");
      };

      if (!idol) return null;

      return (
        <div className="bg-white/80 backdrop-blur-md p-6 md:p-8 rounded-none border border-slate-100 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] hover:shadow-[0_10px_30px_-10px_rgba(0,0,0,0.1)] transition-all duration-300 group">
          <div className="flex items-center gap-4 mb-5">
            <MediaDisplay src={idol.profileImage} fallbackSrc="./default_idol.png" className="w-10 h-10 rounded-full object-cover border border-slate-100 shadow-sm" />
            <div>
              <p className="text-sm font-medium text-slate-800">{idol.name}</p>
              <p className="text-[9px] text-slate-400 tracking-widest">{new Date(post.createdAt).toLocaleString()}</p>
            </div>
            {idol.isStreaming && (
              <span className="ml-auto text-[8px] bg-red-50 text-red-500 border border-red-100 px-2 py-0.5 tracking-widest uppercase flex items-center gap-1"><span className="w-1 h-1 bg-red-500 rounded-full animate-pulse"></span>LIVE</span>
            )}
          </div>
          
          <p className="text-sm text-slate-600 mb-5 whitespace-pre-wrap leading-loose font-light">{post.text}</p>
          
          {post.img && (
            <div className="mb-5 overflow-hidden border border-slate-100 bg-slate-50">
              <img src={post.img} className="w-full max-h-96 object-cover hover:scale-105 transition-transform duration-700 mix-blend-multiply" onError={handleImgError} />
            </div>
          )}
          
          <div className="flex items-center gap-6 border-t border-slate-100 pt-4 mt-2">
            <button onClick={() => onLike(post.id)} className={`flex items-center gap-2 text-xs transition-colors tracking-widest font-light ${post.likedBy?.includes(user?.uid) ? 'text-pink-500' : 'text-slate-400 hover:text-pink-400'}`}>
              <i className={`${post.likedBy?.includes(user?.uid) ? 'fa-solid' : 'fa-regular'} fa-heart`}></i> {post.likes || 0}
            </button>
            <button onClick={() => setShowCommentInput(!showCommentInput)} className="flex items-center gap-2 text-xs text-slate-400 hover:text-slate-600 transition-colors tracking-widest font-light">
              <i className="fa-regular fa-comment"></i> {postComments.length}
            </button>
          </div>

          {/* コメントセクション展開 */}
          {showCommentInput && (
            <div className="mt-6 pt-4 border-t border-slate-50 animate-fade-in">
              <div className="space-y-4 mb-4 max-h-48 overflow-y-auto hide-scrollbar pr-2">
                {postComments.map(comment => (
                  <div key={comment.id} className="flex gap-3 bg-slate-50/50 p-3 border border-slate-50">
                    <MediaDisplay src={comment.userIcon} fallbackSrc="./default_idol.png" className="w-6 h-6 rounded-full object-cover shrink-0" />
                    <div>
                      <div className="flex items-baseline gap-2 mb-1">
                        <span className="text-[9px] font-medium text-slate-700">{comment.userName}</span>
                        <span className="text-[8px] text-slate-400">{new Date(comment.createdAt).toLocaleDateString()}</span>
                      </div>
                      <p className="text-[11px] text-slate-600 font-light leading-relaxed">{comment.text}</p>
                    </div>
                  </div>
                ))}
              </div>
              <form onSubmit={handleCommentSubmit} className="flex gap-2">
                <input 
                  type="text" 
                  value={commentText} 
                  onChange={e => setCommentText(e.target.value)} 
                  placeholder="エールを送る..." 
                  className="flex-1 bg-slate-50 border border-slate-200 py-2 px-3 text-xs focus:outline-none focus:border-pink-300 transition-colors font-light text-slate-700"
                />
                <button type="submit" disabled={!commentText.trim()} className="bg-slate-900 text-white px-4 py-2 text-[9px] tracking-widest hover:bg-pink-600 disabled:bg-slate-300 transition-colors uppercase">
                  Send
                </button>
              </form>
            </div>
          )}
        </div>
      );
    };

    // --- 追加: タイムラインセクション全体 ---
    const LiveTimelineSection = ({ posts, idols, user, comments, onLike, onComment, onLogin }) => {
      // 最新の投稿順にソートし、上位10件を表示
      const latestPosts = [...posts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 10);

      if (latestPosts.length === 0) return null;

      return (
        <section id="live-timeline" className="py-20 max-w-5xl mx-auto px-4 sm:px-6 mb-16 bg-slate-50/30 border-y border-slate-100">
          <SectionTitle title="Muses' Daily" subtitle="彼女たちの「今」をリアルタイムに共有" />
          <div className="max-w-3xl mx-auto space-y-8">
            {latestPosts.map(post => {
              const idol = idols.find(i => String(i.id) === String(post.idolId));
              return (
                <TimelinePostCard 
                  key={post.id} 
                  post={post} 
                  idol={idol} 
                  user={user} 
                  comments={comments} 
                  onLike={onLike} 
                  onComment={onComment}
                  onLogin={onLogin}
                />
              );

      // データ購読（全て）
      useEffect(() => {

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const unsubIdols = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'idols'), (snapshot) => {

          snapshot.forEach(doc => {

              id: doc.id, name: data.name || "名称未設定", type: data.type || "新規エントリー", issue: data.issue || "未掲載",

              titleBadge: data.titleBadge || "", producerCount: data.producerCount || "0", birthday: data.birthday || "未設定",
              hometown: data.hometown || "未設定", specialSkill: data.specialSkill || "未設定", topProducers: data.topProducers || [],
              isStreaming: data.isStreaming || false, timeline: data.timeline || [], totalVotes: data.totalVotes || 0,
              profileImage: data.profileImage || "", loginEmail: data.loginEmail || "", wishlist: data.wishlist || [], receivedGifts: data.receivedGifts || [],
              ...data
            });
          });
          setIdolsData(firestoreIdols);
        });

        const unsubPosts = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), (snapshot) => {

        const unsubComments = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'comments'), (snapshot) => {

      }, [user, firebaseLoaded]);

      useEffect(() => {

        const { doc, getDoc, setDoc, updateDoc } = window.FirebaseHelper;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const fetchUserProfile = async () => {
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
            try {
               const docSnap = await getDoc(docRef);
               const today = new Date().toISOString().split('T')[0];

               const isAdmin = user.email === ADMIN_EMAIL;
               const matchedIdol = idolsDataRef.current.find(idol => idol.loginEmail && idol.loginEmail === user.email);
               let currentRole = isAdmin ? 'admin' : (matchedIdol ? 'idol' : 'producer');
               const targetIdolId = matchedIdol ? matchedIdol.id : null;

               if (docSnap.exists()) {
                 const data = docSnap.data();
                 setUserRole(currentRole);
                 
                 if (currentRole === 'producer') {
                   let updates = {};
                   let newFreeTickets = data.freeTickets || 0;
                   if (data.lastLoginDate !== today) {
                     newFreeTickets += 3;
                     updates.lastLoginDate = today;
                     updates.freeTickets = newFreeTickets;
                     setTimeout(() => showToast("ログインボーナス。無料投票券(3票)を追加しました。"), 800);
                   }
                   if (Object.keys(updates).length > 0) {
                     await updateDoc(docRef, updates);
                     setUserData({ ...data, ...updates });
                   } else { setUserData(data); }
                 } else if (currentRole === 'idol') {
                   if (!data.idolId && targetIdolId) {
                       await updateDoc(docRef, { idolId: targetIdolId });
                       data.idolId = targetIdolId;
                   }
                   setUserData(data);
                 } else {
                   setUserData(data); // admin
                 }
               } else {
                 const initData = { 
                   role: currentRole, email: user.email || 'anonymous', freeTickets: 3, paidTickets: 0, totalPts: 0, 
                   lastLoginDate: today, createdAt: new Date().toISOString() 
                 };
                 if (targetIdolId) initData.idolId = targetIdolId; 
                 await setDoc(docRef, initData);
                 setUserRole(currentRole);
                 setUserData(initData);
               }
            } catch(e) { 
               console.error("Firestore Error:", e); 
            }
        };
        
        fetchUserProfile();
      }, [user, firebaseLoaded, activeTab]);

      const handleUpdateProfile = async (newProfile) => {
        const updatedData = { ...userData, ...newProfile };
        setUserData(updatedData);
        
        if (user && !user.isAnonymous && firebaseLoaded && dbRef.current) {
          const { doc, updateDoc, setDoc } = window.FirebaseHelper;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          const docRef = doc(dbRef.current, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
          try {
            await updateDoc(docRef, newProfile);
            return { success: true };
          } catch (e) {
            try {
              await setDoc(docRef, updatedData);
              return { success: true };
            } catch(e2) {
              return { success: false, error: e2 };
            }
          }
        }
        return { success: true };
      };

      const handleAuthSubmit = async (email, password, isLogin) => {
        if (!firebaseLoaded || !authRef.current) {
          showToast("【エラー】Firebaseの設定が行われていません。");
          return;
        }
        const { signInWithEmailAndPassword, createUserWithEmailAndPassword, doc, setDoc, sendEmailVerification } = window.FirebaseHelper;
        const auth = authRef.current;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        try {
          if (isLogin) {
            await signInWithEmailAndPassword(auth, email, password);
            setShowAuthModal(false);
            setShowAdminModal(false);
            
            setTimeout(() => {
                const isAdmin = email === ADMIN_EMAIL;
                const isIdol = idolsDataRef.current.find(idol => idol.loginEmail && idol.loginEmail === email);
                if(isAdmin) {
                   setActiveTab('adminDashboard');
                   showToast("管理者としてログインしました。");
                } else if(isIdol) {
                   setActiveTab('idolMyPage');
                   showToast("アイドルアカウントでログインしました。");
                } else {
                   showToast("ログインしました。");
                }
            }, 500);

          } else {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const newUser = userCredential.user;
            
            try { await sendEmailVerification(newUser); } catch(e) {}
            
            const docRef = doc(db, 'artifacts', appId, 'users', newUser.uid, 'profile', 'data');
            const today = new Date().toISOString().split('T')[0];
            
            const isAdmin = email === ADMIN_EMAIL;
            const matchedIdol = idolsDataRef.current.find(idol => idol.loginEmail && idol.loginEmail === email);
            const defaultRole = isAdmin ? 'admin' : (matchedIdol ? 'idol' : 'producer');
            const targetIdolId = matchedIdol ? matchedIdol.id : null;

            const initData = { 
              role: defaultRole, email: email, freeTickets: 3, paidTickets: 0, totalPts: 0, 
              lastLoginDate: today, createdAt: new Date().toISOString() 
            };
            if (targetIdolId) initData.idolId = targetIdolId;

            try { await setDoc(docRef, initData); } catch(e) {}
            
            setShowAuthModal(false);
            setShowAdminModal(false);

            if (defaultRole === 'admin') {
                setActiveTab('adminDashboard');
                showToast("管理者アカウントを作成・ログインしました。");
            } else if (defaultRole === 'idol') {
                setActiveTab('idolMyPage');
                showToast("アイドル用アカウントとして登録されました。");
            } else {
                showToast("プロデューサー登録が完了しました！登録メールに確認メールを送信しました。");
            }
          }
        } catch (error) {
          console.error(error);
          let msg = "エラーが発生しました。";
          if (error.code === 'auth/email-already-in-use') msg = "このメールアドレスは既に登録されています。";
          else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') msg = "メールアドレスまたはパスワードが間違っています。";
          else if (error.code === 'auth/weak-password') msg = "パスワードは6文字以上で設定してください。";
          showToast(msg);
        }
      };

      const handleLogout = async () => {
        if (firebaseLoaded && authRef.current) {
          const { signOut } = window.FirebaseHelper;
          await signOut(authRef.current);
        }
        setUser(null);
        setUserRole('guest');
        setUserData({ freeTickets: 0, paidTickets: 0, totalPts: 0 });
        setActiveTab('home');
        showToast("ログアウトしました。");
      };

      const handleUpdateIdolProfile = async (newProfile) => {
        if (!userData.idolId) return;
        const updatedIdols = idolsData.map(idol => 
          String(idol.id) === String(userData.idolId) ? { ...idol, ...newProfile } : idol
        );
        setIdolsData(updatedIdols);

        if (user && !user.isAnonymous && firebaseLoaded && dbRef.current) {
          const { doc, setDoc } = window.FirebaseHelper;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          const idolRef = doc(dbRef.current, 'artifacts', appId, 'public', 'data', 'idols', String(userData.idolId));
          try {
            await setDoc(idolRef, newProfile, { merge: true });
            return { success: true };
          } catch (e) {
            console.error("Idol profile update error:", e);
            return { success: false, error: e };
          }
        }
        return { success: true };
      };

      const updateTickets = async (freeDelta, paidDelta, ptsDelta = 0) => {
        const newFree = Math.max(0, userData.freeTickets + freeDelta);
        const newPaid = Math.max(0, userData.paidTickets + paidDelta);
        const newPts = (userData.totalPts || 0) + ptsDelta; 
        
        const updatedData = { ...userData, freeTickets: newFree, paidTickets: newPaid, totalPts: newPts };
        setUserData(updatedData);

        if (user && !user.isAnonymous && firebaseLoaded && dbRef.current) {
          const { doc, updateDoc } = window.FirebaseHelper;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            await updateDoc(docRef, {

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const producerRef = doc(db, 'artifacts', appId, 'public', 'data', 'producers', user.uid);
        const producerData = producersData.find(p => p.id === user.uid) || { votes: {}, totalVotes: 0 };
        const currentIdolVotes = producerData.votes[idolId] || 0;
        const iconColors = ["from-amber-200 to-amber-500", "from-slate-200 to-slate-400", "from-orange-200 to-orange-500", "from-pink-200 to-pink-500", "from-purple-200 to-purple-500"];
        const myColor = producerData.iconColor || iconColors[Math.floor(Math.random() * iconColors.length)];

        await setDoc(producerRef, {
          id: user.uid,
          name: userData.name || "名無しプロデューサー",
          iconColor: myColor,
          profileImage: userData.profileImage || "",
          votes: {
            ...producerData.votes,
            [idolId]: currentIdolVotes + amount
          },
          totalVotes: producerData.totalVotes + amount,
          updatedAt: new Date().toISOString()
        }, { merge: true });

        const idolRef = doc(db, 'artifacts', appId, 'public', 'data', 'idols', String(idolId));
        const idolUpdate = { totalVotes: increment(amount) };
        if (itemId) {
          idolUpdate.receivedGifts = arrayUnion({
            itemId: itemId,
            producerId: user.uid,
            producerName: userData.name || "名無しP",
            timestamp: new Date().toISOString()
          });
        }
        await setDoc(idolRef, idolUpdate, { merge: true });

        return true;
      };

      const handleVoteForIdol = async (idolId, amount, actionType = '投票', itemId = null) => {
        if (!user || user.isAnonymous) {
          setShowAuthModal(true);
          return;
        }
        await processVoteAndGift(idolId, amount, actionType, itemId);
