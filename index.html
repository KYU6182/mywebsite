    const uploadFile = (file) => {
      return new Promise((resolve, reject) => {

        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

            <div className="text-center"><div className={`w-14 h-14 bg-pink-50 rounded-2xl flex items-center justify-center border border-pink-100 text-pink-600`}><span className="font-timer text-3xl font-bold">{pad(timeLeft.seconds)}</span></div><p className="text-[10px] font-bold tracking-widest text-slate-400 mt-2">SEC</p></div>
          </div>
        </div>
      );
    };

    const CrossNavSection = ({ idolsData, currentIdolId, onIdolSelect, onNavigate }) => {
      const recommendIdols = useMemo(() => {
        let list = idolsData;
        if (currentIdolId) list = list.filter(i => String(i.id) !== String(currentIdolId));
        return list.slice(0, 4); 
      }, [idolsData, currentIdolId]);

      if (recommendIdols.length === 0) return null;

      return (
        <div className="w-full bg-white/60 backdrop-blur-md border-t border-pink-100 mt-16 pt-16 pb-20 rounded-t-[3rem]">
          <div className="max-w-6xl mx-auto px-6">
            <SectionTitle title="PICK UP MUSES" subtitle="注目のアイドルたち" isPink={true} />
            
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mt-8">
                {recommendIdols.map((idol) => (
                  <div key={idol.id} onClick={() => onIdolSelect(idol)} className="group cursor-pointer bg-white p-2 rounded-2xl shadow-sm border border-pink-50 hover:shadow-md transition-all">
                    <div className="aspect-[3/4] relative overflow-hidden rounded-xl mb-3">
                      <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                      {idol.isStreaming && (
                        <div className="absolute top-2 right-2 bg-red-500/90 text-white text-[8px] font-bold tracking-widest px-2 py-1 rounded-full uppercase shadow-sm animate-pulse">
                          LIVE
                        </div>
                      )}
                    </div>
                    <div className="text-center px-1 pb-1">
                      <h4 className="font-bold text-slate-700 text-sm group-hover:text-pink-500 transition-colors truncate">{idol.name}</h4>
                      <p className="text-[9px] bg-pink-50 text-pink-500 px-2 py-0.5 rounded-full inline-block mt-1 font-medium">{idol.style}</p>
                    </div>
                  </div>
                ))}
            </div>
            
            <div className="text-center mt-10">
              <button onClick={() => onNavigate('idol-list')} className="text-pink-500 border border-pink-200 bg-white hover:bg-pink-50 px-8 py-3 rounded-full text-xs font-bold shadow-sm transition-colors">
                すべて見る <i className="fa-solid fa-chevron-right ml-1"></i>
              </button>
            </div>
          </div>
        </div>
      );
    };

    const EventDetailView = ({ event, onBack, idolsData, onIdolSelect, onQuickVote }) => {
      const [currentRankingTab, setCurrentRankingTab] = useState('overall');

      let currentRankingData = event.rankingData[currentRankingTab] || [];
      if (currentRankingTab === 'overall') {
         currentRankingData = [...idolsData].sort((a, b) => (b.totalVotes || 0) - (a.totalVotes || 0)).map((idol, index, array) => {
           const diff = index === 0 ? "-" : `1ランク上まで ${((array[index-1].totalVotes || 0) - (idol.totalVotes || 0)).toLocaleString()}票`;
           return {
             rank: index + 1,
             idolId: idol.id,
             name: idol.name,
             value: `${(idol.totalVotes || 0).toLocaleString()} 票`,
             diff: diff
           };
         });
      }
      const maxPt = currentRankingData.length > 0 ? parseVote(currentRankingData[0].value) : 1;

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 animate-fade-in-up">
          <button onClick={onBack} className="mb-8 text-pink-400 font-bold tracking-widest text-xs flex items-center gap-3 hover:text-pink-500 transition-colors bg-white px-4 py-2 rounded-full shadow-sm border border-pink-100">
            <i className="fa-solid fa-arrow-left-long"></i> 戻る
          </button>
          
          <div className="text-center mb-12">
            <h2 className="text-2xl md:text-4xl font-serif text-slate-800 font-bold mb-4">{event.title}</h2>
            <p className="text-slate-500 text-xs md:text-sm font-medium tracking-widest leading-relaxed whitespace-pre-wrap">{event.subtitle}</p>
          </div>

          <div className="relative rounded-3xl overflow-hidden border border-pink-100 bg-white p-2 shadow-sm mb-16">
            <div className="aspect-[21/9] overflow-hidden relative bg-slate-50 rounded-2xl">
              <img src={event.bannerImg} className="w-full h-full object-cover opacity-90 mix-blend-multiply" onError={handleImgError} />
            </div>
          </div>
          
          <CountdownTimer endDate={event.endDate} themeColor={event.themeColor} />

          <div className="mt-20 max-w-4xl mx-auto bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-pink-50">
             <div className="flex gap-2 overflow-x-auto pb-6 hide-scrollbar justify-start md:justify-center border-b border-pink-100 mb-8">
                {RANKING_TABS.map(tab => (
                  <button key={tab.id} onClick={() => setCurrentRankingTab(tab.id)} className={`px-5 py-2.5 rounded-full text-[10px] md:text-xs font-bold tracking-widest transition-all shadow-sm shrink-0 ${currentRankingTab === tab.id ? `bg-gradient-to-r from-pink-400 to-pink-500 text-white border-transparent` : `bg-white text-slate-500 border border-slate-200 hover:border-pink-300 hover:text-pink-500`}`}>{tab.label}</button>
                ))}
             </div>
              
             {currentRankingData.length === 0 ? <p className="text-center text-sm text-slate-500 font-medium py-10">集計データがありません。</p> : (
                <div className="space-y-4 pb-10">
                  {currentRankingData.map((item, i) => {
                     const idolData = idolsData.find(idl => String(idl.id) === String(item.idolId));
                     const itemPt = parseVote(item.value);
                     const percentage = Math.min(100, Math.max(0, (itemPt / maxPt) * 100));
                     const isTop3 = i < 3;

                     return (
                       <div key={item.rank} onClick={() => { if(idolData) onIdolSelect(idolData) }} className={`flex items-center p-4 md:p-5 rounded-2xl border transition-all cursor-pointer ${isTop3 ? 'bg-gradient-to-r from-pink-50/50 to-white shadow-sm border-pink-200 hover:shadow-md' : 'bg-white border-slate-100 hover:border-pink-200 hover:bg-pink-50/30'}`}>
                          <div className={`w-10 md:w-12 font-serif text-xl md:text-3xl font-bold text-center shrink-0 ${i===0?'text-amber-400 drop-shadow-sm':i===1?'text-slate-400':i===2?'text-orange-400':'text-slate-300'}`}>{item.rank}</div>
                          <div className="w-12 h-12 md:w-16 md:h-16 rounded-full overflow-hidden border-2 border-white shadow-sm mx-3 md:mx-5 shrink-0 bg-slate-50">
                             <MediaDisplay src={idolData?.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform hover:scale-110" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex justify-between items-baseline mb-2">
                              <h4 className="font-bold text-slate-700 tracking-wide text-sm md:text-lg truncate pr-2">{item.name}</h4>
                              <p className={`font-timer font-bold text-sm md:text-base text-pink-500 shrink-0`}>{item.value}</p>
                            </div>
                            <div className="w-full bg-slate-100 h-2 md:h-2.5 relative rounded-full overflow-hidden">
                              <div className={`absolute top-0 left-0 h-full transition-all duration-1000 rounded-full ${i===0?'bg-gradient-to-r from-amber-300 to-amber-400':i===1?'bg-gradient-to-r from-slate-300 to-slate-400':i===2?'bg-gradient-to-r from-orange-300 to-orange-400':'bg-gradient-to-r from-pink-300 to-pink-400'}`} style={{ width: `${percentage}%` }}></div>
                            </div>
                          </div>
                          <div className="ml-4 md:ml-6 flex items-center justify-end shrink-0">
                             {currentRankingTab !== 'producers' ? (
                                <div className="flex flex-col items-end gap-2">
                                  {item.diff && item.diff !== "-" && <span className="hidden sm:block text-[9px] font-bold tracking-widest text-slate-400 text-right">{item.diff}</span>}
                                  <button onClick={(e) => { e.stopPropagation(); if(idolData) onQuickVote(e, idolData); }} className="bg-pink-50 border border-pink-100 text-pink-500 hover:bg-gradient-to-r hover:from-pink-400 hover:to-pink-500 hover:text-white px-4 md:px-5 py-2 rounded-full text-[10px] font-bold transition-all shadow-sm hover:shadow-md flex items-center gap-1.5 whitespace-nowrap">
                                    <i className="fa-solid fa-heart"></i> 投票
                                  </button>
                                </div>
                             ) : (
                                <i className="fa-solid fa-chevron-right text-pink-300"></i>
                             )}
                          </div>
                       </div>
                     );
                  })}
                </div>
             )}
          </div>
        </div>
      );
    };

    const AuthModal = ({ onClose, onAuthSubmit, isAdminOnly = false, openLegal }) => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [agreeTerms, setAgreeTerms] = useState(false);
      const [agreeAge, setAgreeAge] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!isLogin && (!agreeTerms || !agreeAge)) {
          alert("利用規約と年齢確認への同意が必要です。");
          return;
        }
        setLoading(true);
        await onAuthSubmit(email, password, isLogin);
        setLoading(false);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[500] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-3xl overflow-hidden max-w-sm w-full shadow-2xl border border-pink-100 relative">
            <button onClick={onClose} disabled={loading} className="absolute right-4 top-4 text-slate-400 hover:text-pink-500 transition-colors z-10 w-8 h-8 flex items-center justify-center bg-slate-50 rounded-full"><i className="fa-solid fa-xmark"></i></button>
            
            <div className="flex border-b border-pink-50 bg-pink-50/30">
              <button onClick={() => setIsLogin(true)} disabled={loading} className={`flex-1 py-4 text-xs font-bold tracking-widest uppercase transition-colors ${isLogin ? 'bg-white text-pink-500 border-b-2 border-pink-500' : 'text-slate-400'}`}>ログイン</button>
              <button onClick={() => setIsLogin(false)} disabled={loading} className={`flex-1 py-4 text-xs font-bold tracking-widest uppercase transition-colors ${!isLogin ? 'bg-white text-pink-500 border-b-2 border-pink-500' : 'text-slate-400'}`}>新規登録</button>
            </div>

            <div className="p-8">
              <h3 className="text-xl font-bold text-slate-800 mb-6 text-center">{isAdminOnly ? 'Admin Access' : (isLogin ? 'おかえりなさい🤍' : '新しく始める ✨')}</h3>
              
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-[10px] font-bold text-slate-500 mb-1">メールアドレス</label>
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} disabled={loading} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition-all text-sm" placeholder="your@email.com" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold text-slate-500 mb-1">パスワード</label>
                  <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} disabled={loading} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition-all text-sm" placeholder="••••••••" />
                </div>

                {!isLogin && (
                  <div className="space-y-2 pt-2 bg-pink-50/50 p-3 rounded-xl border border-pink-100">
                    <label className="flex items-start gap-2 cursor-pointer">
                      <input type="checkbox" required checked={agreeTerms} onChange={e=>setAgreeTerms(e.target.checked)} className="mt-1 accent-pink-500 w-4 h-4" />
                      <span className="text-[10px] text-slate-600 leading-tight">
                        <button type="button" onClick={(e) => {e.preventDefault(); onClose(); openLegal('terms');}} className="text-pink-500 font-bold underline">利用規約</button> と <button type="button" onClick={(e) => {e.preventDefault(); onClose(); openLegal('privacy');}} className="text-pink-500 font-bold underline">プライバシーポリシー</button> に同意します。
                      </span>
                    </label>
                    <label className="flex items-start gap-2 cursor-pointer">
                      <input type="checkbox" required checked={agreeAge} onChange={e=>setAgreeAge(e.target.checked)} className="mt-1 accent-pink-500 w-4 h-4" />
                      <span className="text-[10px] text-slate-600 leading-tight">
                        18歳以上です。（または保護者の同意を得ています）
                      </span>
                    </label>
                  </div>
                )}

                <button type="submit" disabled={loading || (!isLogin && (!agreeTerms || !agreeAge))} className="w-full py-4 mt-2 bg-gradient-to-r from-pink-400 to-pink-500 text-white text-sm font-bold rounded-full hover:scale-105 shadow-md shadow-pink-200 transition-all disabled:opacity-50 disabled:hover:scale-100 flex justify-center items-center gap-2">
                  {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isLogin ? 'ログイン' : '登録して始める')}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const AdminDashboard = ({ idolsData, showToast }) => {
      const [newIdol, setNewIdol] = useState({ name: '', loginEmail: '', profileImage: '', catchphrase: '', pref: '', style: '', birthday: '' });
      const [deleteId, setDeleteId] = useState(null);
      const [uploading, setUploading] = useState(false);

      const handleFileChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        try {
          const url = await uploadFile(file);
          setNewIdol({...newIdol, profileImage: url});
          showToast("画像がアップロードされました");
        } catch (err) {
          showToast("アップロードに失敗しました");
        }
        setUploading(false);
      };

      const handleAddIdol = async (e) => {
        e.preventDefault();
        if(!newIdol.name || !newIdol.loginEmail) return showToast("名前とログインEmailは必須です");
        
        const { collection, addDoc } = window.FirebaseHelper;
        const db = window.FirebaseDbRef;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'idols'), {
            ...newIdol,
            type: "新規エントリー", issue: "未掲載", isOffMelty: false, isRookie: true,
            story: "新しい物語がここから始まります。", titleBadge: "注目", producerCount: "0", totalVotes: 0, wishlist: [], receivedGifts: [], createdAt: new Date().toISOString()
          });
          showToast("アイドルを新規追加しました");
          setNewIdol({ name: '', loginEmail: '', profileImage: '', catchphrase: '', pref: '', style: '', birthday: '' });
        } catch(err) { showToast("追加エラー: " + err.message); }
      };

      const handleDelete = async (id) => {
        if (deleteId === id) {
          const { doc, deleteDoc } = window.FirebaseHelper;
          const db = window.FirebaseDbRef;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'idols', String(id)));
            showToast("アイドルを削除しました");
            setDeleteId(null);
          } catch(e) { showToast("削除エラー"); }
        } else {
          setDeleteId(id);
          setTimeout(() => setDeleteId(null), 3000);
        }
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 pt-32 animate-fade-in">
          <SectionTitle title="ADMIN" subtitle="管理者コントロールパネル" isPink={true} />
          
          <div className="bg-white p-8 rounded-3xl shadow-sm border border-pink-100 mb-12">
            <h3 className="text-lg font-bold mb-6 text-slate-800 border-b border-pink-50 pb-3">アイドルの新規追加</h3>
            <form onSubmit={handleAddIdol} className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div><label className="block text-xs font-bold text-slate-500 mb-1">名前 *</label><input required type="text" value={newIdol.name} onChange={e=>setNewIdol({...newIdol, name: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 focus:border-pink-400 outline-none" /></div>
              <div><label className="block text-xs font-bold text-slate-500 mb-1">ログインEmail *</label><input required type="email" value={newIdol.loginEmail} onChange={e=>setNewIdol({...newIdol, loginEmail: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 focus:border-pink-400 outline-none" /></div>
              <div><label className="block text-xs font-bold text-slate-500 mb-1">画像</label><input type="file" accept="image/*" onChange={handleFileChange} disabled={uploading} className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-pink-50 file:text-pink-600 hover:file:bg-pink-100" /></div>
              <div><label className="block text-xs font-bold text-slate-500 mb-1">キャッチフレーズ</label><input type="text" value={newIdol.catchphrase} onChange={e=>setNewIdol({...newIdol, catchphrase: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 focus:border-pink-400 outline-none" /></div>
              <div><label className="block text-xs font-bold text-slate-500 mb-1">出身地</label><select value={newIdol.pref} onChange={e=>setNewIdol({...newIdol, pref: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 focus:border-pink-400 outline-none"><option value="">選択</option>{PREFECTURES.map(p => <option key={p} value={p}>{p}</option>)}</select></div>
              <div><label className="block text-xs font-bold text-slate-500 mb-1">スタイル</label><select value={newIdol.style} onChange={e=>setNewIdol({...newIdol, style: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 focus:border-pink-400 outline-none"><option value="">選択</option>{STYLES.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
              <div className="md:col-span-2 text-right mt-4"><button type="submit" disabled={uploading} className="bg-gradient-to-r from-pink-400 to-pink-500 text-white px-8 py-3 rounded-full font-bold shadow-md hover:scale-105 transition-transform disabled:opacity-50">追加する</button></div>
            </form>
          </div>

          <div className="bg-white p-8 rounded-3xl shadow-sm border border-pink-100">
            <h3 className="text-lg font-bold mb-6 text-slate-800 border-b border-pink-50 pb-3">登録済みアイドル</h3>
            <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
              {idolsData.map(idol => (
                <div key={idol.id} className="flex items-center justify-between border border-slate-100 bg-slate-50 rounded-2xl p-4">
                  <div className="flex items-center gap-4">
                    <MediaDisplay src={idol.profileImage} fallbackSrc="./default_idol.png" className="w-12 h-12 object-cover rounded-full border-2 border-white shadow-sm" />
                    <div>
                      <div className="font-bold text-slate-800">{idol.name}</div>
                      <div className="text-[10px] text-slate-500">{idol.loginEmail} | {idol.totalVotes || 0} 票</div>
                    </div>
                  </div>
                  <button onClick={() => handleDelete(idol.id)} className={`px-4 py-2 rounded-full text-xs font-bold text-white transition-colors shadow-sm ${deleteId === idol.id ? 'bg-red-500' : 'bg-slate-300 hover:bg-red-400'}`}>{deleteId === idol.id ? '本当に削除？' : '削除'}</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const VoteModal = ({ onClose, idol, user, userData, updateTickets, showToast, onLogin, onSuccess }) => {
      if (!user || user.isAnonymous) {
        return (
          <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-xl border border-pink-100 relative">
              <button onClick={onClose} className="absolute right-4 top-4 text-slate-300 hover:text-pink-500 w-8 h-8 bg-slate-50 rounded-full flex justify-center items-center"><i className="fa-solid fa-xmark"></i></button>
              <div className="w-16 h-16 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i className="fa-solid fa-user-plus"></i></div>
              <h3 className="text-lg font-bold mb-3 text-slate-800">プロデューサー登録</h3>
              <p className="text-xs text-slate-500 mb-6 leading-relaxed">プロデューサー登録（無料）で、<br/>毎日<span className="text-pink-500 font-bold text-sm mx-1">「3票の無料投票券」</span>を進呈いたします！</p>
              <button onClick={onLogin} className="w-full py-3.5 bg-gradient-to-r from-pink-400 to-pink-500 text-white text-sm font-bold rounded-full mb-3 shadow-md hover:scale-105 transition-transform">登録して投票する ✨</button>
              <button onClick={onClose} className="text-[10px] text-slate-400 font-medium hover:text-slate-600 underline">キャンセル</button>
            </div>
          </div>
        );
      }

      const handleVote = (amount) => {
        if (userData.freeTickets >= amount) {
          updateTickets(-amount, 0); 
          onSuccess(amount, '無料投票');
          onClose();
        } else { showToast("無料票が不足しています。"); }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[200] flex items-center justify-center p-4 animate-fade-in">
          <div className="bg-white rounded-3xl overflow-hidden max-w-sm w-full shadow-2xl border border-pink-100">
            <div className="bg-pink-50 border-b border-pink-100 p-4 text-center relative">
              <h3 className="font-bold text-sm text-pink-500">投票ルーム</h3>
              <button onClick={onClose} className="absolute right-4 top-3 text-slate-400 hover:text-pink-500 bg-white w-8 h-8 rounded-full flex justify-center items-center shadow-sm"><i className="fa-solid fa-xmark"></i></button>
            </div>
            
            <div className="p-6 bg-white">
              <div className="flex items-center gap-4 mb-6 bg-pink-50/50 p-3 rounded-2xl border border-pink-50">

      if (!idolData) return <div className="text-center py-20 text-slate-500">Loading...</div>;

      const handleFileChange = async (e) => { const f=e.target.files[0]; if(!f)return; setUploading(true); try{ setProfileImage(await uploadFile(f)); showToast("アップロード完了"); }catch(err){} setUploading(false); };
      const handleTimelineFileChange = async (e) => { const f=e.target.files[0]; if(!f)return; setUploadingTimeline(true); try{ setTimelineImg(await uploadFile(f)); showToast("アップロード完了"); }catch(err){} setUploadingTimeline(false); };
      const handleSaveProfile = async (e) => { e.preventDefault(); const res = await onUpdateProfile({profileImage,catchphrase,story,isStreaming,wishlist,birthday,hometown,specialSkill}); if(res&&!res.success)showToast('エラー'); else showToast('保存しました'); };
      const handlePostTimelineSubmit = async (e) => { e.preventDefault(); if(!timelineText)return; await onPostTimeline({ idolId: idolData.id, text: timelineText, img: timelineImg, isSecret: isSecretPost }); showToast("投稿しました"); setTimelineText(""); setTimelineImg(""); setIsSecretPost(false); };
      const toggleWishlist = (itemId) => { setWishlist(prev => prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId]); };

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 pb-32 animate-fade-in-up">
          <SectionTitle title="STUDIO" subtitle="アイドル専用ダッシュボード" isPink={true} />
          
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div className="lg:col-span-1 space-y-6">
              <div className="bg-white p-6 rounded-3xl border border-pink-50 shadow-sm text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-pink-300 to-pink-500"></div>
                <div className="w-28 h-28 rounded-full mx-auto overflow-hidden mb-4 border-4 border-white shadow-md relative group bg-pink-50">
                  <MediaDisplay src={profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover" />
                </div>
                {isStreaming && <div className="inline-block bg-red-50 text-red-500 text-[10px] font-bold px-3 py-1 rounded-full mb-3"><span className="animate-pulse mr-1">●</span> ON AIR</div>}
                <h3 className="font-bold text-lg text-slate-800 mb-1">{idolData.name}</h3>
                <p className="text-[10px] text-pink-500 font-medium mb-3">"{catchphrase}"</p>
                <div className="bg-pink-50 rounded-xl p-3 mt-2">
                   <p className="text-[10px] text-pink-400 font-bold mb-1">現在の総得票</p>
                   <p className="text-xl font-timer font-bold text-pink-500">{idolData.totalVotes || 0}</p>
                </div>
              </div>
            </div>

            <div className="lg:col-span-3 space-y-8">
              <div className="bg-white p-8 rounded-3xl border border-pink-50 shadow-sm">
                <h4 className="text-sm font-bold text-slate-700 mb-6 flex items-center gap-2"><i className="fa-solid fa-pen text-pink-400"></i> プロフィール編集</h4>
                <form onSubmit={handleSaveProfile} className="space-y-5">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div><label className="block text-[10px] font-bold text-slate-500 mb-1">画像</label><input type="file" accept="image/*" onChange={handleFileChange} disabled={uploading} className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-pink-50 file:text-pink-500 hover:file:bg-pink-100" /></div>
                    <div><label className="block text-[10px] font-bold text-slate-500 mb-1">配信ステータス</label><button type="button" onClick={() => setIsStreaming(!isStreaming)} className={`w-full py-2.5 rounded-xl text-xs font-bold transition-all border ${isStreaming ? 'bg-red-50 text-red-500 border-red-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>{isStreaming ? '🔴 配信中' : '⚪️ オフライン'}</button></div>
                  </div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1">キャッチフレーズ</label><input type="text" value={catchphrase} onChange={(e) => setCatchphrase(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 focus:outline-none focus:border-pink-400 text-sm font-medium" /></div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div><label className="block text-[10px] font-bold text-slate-500 mb-1">誕生日</label><input type="text" value={birthday} onChange={(e) => setBirthday(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 focus:outline-none focus:border-pink-400 text-sm font-medium" /></div>
                    <div><label className="block text-[10px] font-bold text-slate-500 mb-1">出身地</label><input type="text" value={hometown} onChange={(e) => setHometown(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 focus:outline-none focus:border-pink-400 text-sm font-medium" /></div>
                    <div><label className="block text-[10px] font-bold text-slate-500 mb-1">特技</label><input type="text" value={specialSkill} onChange={(e) => setSpecialSkill(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 focus:outline-none focus:border-pink-400 text-sm font-medium" /></div>
                  </div>
                  <div><label className="block text-[10px] font-bold text-slate-500 mb-1">自己紹介</label><textarea value={story} onChange={(e) => setStory(e.target.value)} rows="4" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-pink-400 text-sm font-medium resize-none"></textarea></div>
                  <div className="text-right pt-2"><button type="submit" disabled={uploading} className="bg-gradient-to-r from-pink-400 to-pink-500 text-white text-sm font-bold px-8 py-3 rounded-full hover:scale-105 transition-transform shadow-md">更新する</button></div>
                </form>
              </div>

              <div className="bg-white p-8 rounded-3xl border border-pink-50 shadow-sm">
                <div className="flex justify-between items-center mb-6">
                  <h4 className="text-sm font-bold text-slate-700 flex items-center gap-2"><i className="fa-solid fa-shirt text-pink-400"></i> ウィッシュリスト設定</h4>
                  <button onClick={handleSaveProfile} className="text-xs bg-pink-50 text-pink-500 font-bold px-4 py-1.5 rounded-full hover:bg-pink-100 transition-colors">保存</button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {OFF_MELTY_CATALOG.map(item => {
                    const isSelected = wishlist.includes(item.id);
                    const isReceived = idolData.receivedGifts?.find(g => g.itemId === item.id);
                    return (
                      <div key={item.id} onClick={() => !isReceived && toggleWishlist(item.id)} className={`relative rounded-2xl overflow-hidden cursor-pointer border-2 transition-all p-1 ${isReceived ? 'opacity-50' : isSelected ? 'border-pink-400 bg-pink-50' : 'border-transparent bg-slate-50 hover:border-pink-200'}`}>
                        <img src={item.img} className="w-full aspect-[3/4] object-cover rounded-xl" onError={handleImgError} />
                        {isSelected && !isReceived && <div className="absolute top-2 right-2 bg-pink-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md"><i className="fa-solid fa-check text-xs"></i></div>}
                        {isReceived && <div className="absolute inset-0 flex items-center justify-center bg-white/50"><div className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-md">獲得済</div></div>}
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="bg-white p-8 rounded-3xl border border-pink-50 shadow-sm">
                <h4 className="text-sm font-bold text-slate-700 mb-6 flex items-center gap-2"><i className="fa-solid fa-paper-plane text-pink-400"></i> 新規投稿</h4>
                <form onSubmit={handlePostTimelineSubmit} className="space-y-5">
                  <textarea value={timelineText} onChange={(e) => setTimelineText(e.target.value)} placeholder="今日の出来事や感謝を伝えよう！" rows="4" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 focus:outline-none focus:border-pink-400 text-sm font-medium resize-none"></textarea>
                  <div className="flex flex-col md:flex-row md:items-center gap-4 md:justify-between bg-pink-50/50 p-3 rounded-xl border border-pink-50">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={isSecretPost} onChange={(e) => setIsSecretPost(e.target.checked)} className="accent-pink-500 w-4 h-4" />
                      <span className="text-xs font-bold text-slate-600">VIP限定公開にする <span className="text-pink-400 text-[10px] font-medium">(100票以上)</span></span>
                    </label>
                    <input type="file" accept="image/*" onChange={handleTimelineFileChange} disabled={uploadingTimeline} className="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-white file:text-pink-500 hover:file:bg-pink-100" />
                  </div>
                  <div className="text-right pt-2"><button type="submit" disabled={!timelineText || uploadingTimeline} className="bg-gradient-to-r from-pink-400 to-pink-500 text-white text-sm font-bold px-8 py-3 rounded-full hover:scale-105 transition-transform disabled:opacity-50 shadow-md">投稿する</button></div>
                </form>
              </div>

            </div>
          </div>
        </div>
      );
    };

    const IdolDetailView = ({ idol, onBack, onVoteClick, onOutfitClick, onGiftClick, idolsData, onIdolSelect, onNavigate, producersData, postsData, commentsData, onPostComment, onLikePost, onDirectGift, user }) => {
      const sortedIdols = [...idolsData].sort((a, b) => (b.totalVotes || 0) - (a.totalVotes || 0));
      const currentRank = sortedIdols.findIndex(i => String(i.id) === String(idol.id)) + 1;
      const currentVotes = (idol.totalVotes || 0).toLocaleString();

      const idolProducers = producersData.filter(p => p.votes && p.votes[idol.id]).sort((a,b) => b.votes[idol.id] - a.votes[idol.id]);
      const top3Producers = idolProducers.slice(0, 3);
      const top3Ids = top3Producers.map(p => p.id);

      const [commentText, setCommentText] = useState('');

      return (
        <div className="animate-fade-in-up pb-0 bg-white md:bg-transparent">
          <div className="max-w-5xl mx-auto md:px-4 py-6 md:py-10 pb-20">
            <button onClick={onBack} className="hidden md:flex mb-8 text-pink-400 font-bold tracking-widest text-xs items-center gap-2 hover:text-pink-500 transition-colors bg-white px-4 py-2 rounded-full shadow-sm border border-pink-100 w-max"><i className="fa-solid fa-arrow-left-long"></i> 一覧に戻る</button>
            
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12 mb-12">
              <div className="relative">
                <div className="relative rounded-b-[2rem] md:rounded-3xl overflow-hidden bg-white md:shadow-xl md:border border-pink-100 aspect-[3/4] p-0 md:p-3 mx-auto">
                  {idol.isStreaming && (<div className="absolute top-4 left-4 z-30 bg-red-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5 animate-pulse"><div className="w-1.5 h-1.5 bg-white rounded-full"></div> LIVE</div>)}
                  <div className="w-full h-full relative overflow-hidden md:rounded-2xl bg-pink-50">
                    <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover" />
                  </div>
                  {/* モバイル用戻るボタン */}
                  <button onClick={onBack} className="md:hidden absolute top-4 right-4 z-30 bg-white/80 backdrop-blur-md text-slate-600 w-10 h-10 rounded-full flex items-center justify-center shadow-sm"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>
              </div>

              <div className="flex flex-col justify-center px-6 md:px-4">
                <div className="mb-8 text-center md:text-left">
                  <div className="flex items-center justify-center md:justify-start gap-2 mb-3">
                    <span className="bg-pink-100 text-pink-500 text-[10px] font-bold px-3 py-1 rounded-full">{idol.style}</span>
                    <span className="bg-slate-100 text-slate-500 text-[10px] font-bold px-3 py-1 rounded-full"><i className="fa-solid fa-location-dot mr-1"></i>{idol.pref}</span>
                  </div>
                  <h1 className="text-3xl md:text-5xl font-bold text-slate-800 mb-4">{idol.name}</h1>
                  <p className="text-slate-500 font-medium text-sm leading-relaxed bg-pink-50/50 p-4 rounded-2xl border border-pink-50">"{idol.catchphrase}"</p>
                </div>
                
                <div className="flex justify-center md:justify-start gap-4 mb-8">
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-pink-50 text-center w-28">
                     <p className="text-[9px] text-slate-400 font-bold mb-1">現在の順位</p>
                     <p className="text-2xl font-bold text-slate-700 font-timer">{currentRank}<span className="text-xs">位</span></p>
                  </div>
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-pink-50 text-center w-36">
                     <p className="text-[9px] text-slate-400 font-bold mb-1">獲得票数</p>
                     <p className="text-2xl font-bold text-pink-500 font-timer">{currentVotes}</p>
                  </div>
                </div>

                <div className="space-y-3">
                  <button onClick={onGiftClick} className="w-full bg-gradient-to-r from-pink-400 to-pink-500 text-white py-4 rounded-full shadow-md shadow-pink-200 flex items-center justify-center gap-2 hover:scale-105 transition-transform font-bold">
                    <i className="fa-solid fa-gift text-lg"></i>
                    <span>投票・ギフトを贈る</span>
                  </button>
                  <button onClick={onOutfitClick} className="w-full bg-white border-2 border-pink-200 text-pink-500 py-3.5 rounded-full shadow-sm flex items-center justify-center gap-2 hover:bg-pink-50 transition-colors font-bold text-sm">
                    <i className="fa-solid fa-shirt"></i>
                    <span>衣装をプレゼントする</span>
                  </button>
                </div>
              </div>
            </div>

            <div className="px-4 md:px-0 space-y-6 md:space-y-10">
              {idol.wishlist && idol.wishlist.length > 0 && (
                <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-pink-100">
                  <h3 className="text-sm font-bold text-slate-700 mb-6 flex items-center gap-2"><i className="fa-solid fa-star text-pink-400"></i> ウィッシュリスト</h3>
                  <div className="flex overflow-x-auto gap-4 pb-4 hide-scrollbar">
                    {idol.wishlist.map(itemId => {
                      const item = OFF_MELTY_CATALOG.find(c => c.id === itemId);
                      if(!item) return null;
                      const isReceived = idol.receivedGifts?.find(g => g.itemId === itemId);
                      
                      return (
                        <div key={itemId} className="w-32 shrink-0 bg-pink-50 rounded-2xl p-2 relative">
                          <img src={item.img} className={`w-full aspect-[3/4] object-cover rounded-xl ${isReceived ? 'opacity-50 grayscale' : ''}`} onError={handleImgError}/>
                          {isReceived ? (
                            <div className="absolute inset-0 flex items-center justify-center"><div className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-md">獲得済</div></div>
                          ) : (
                            <button onClick={() => onDirectGift(item.id, item.votes, '衣装提供(Wishlist)')} className="absolute bottom-3 left-1/2 transform -translate-x-1/2 w-10/12 bg-pink-500 text-white text-[9px] font-bold py-1.5 rounded-full shadow-md hover:scale-105 transition-transform text-center">贈る</button>
                          )}
                        </div>
                      )
                    })}
                  </div>
                </div>
              )}

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
                <div className="lg:col-span-2 space-y-6 md:space-y-8">
                  <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-pink-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-6 flex items-center gap-2"><i className="fa-regular fa-clock text-pink-400"></i> タイムライン</h3>
                    <div className="space-y-6">
                      {postsData.filter(p => p.idolId === String(idol.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(post => (
                        <div key={post.id} className="border-b border-pink-50 pb-6 last:border-0 last:pb-0">
                          <div className="flex items-center gap-3 mb-3">
                            <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-10 h-10 rounded-full object-cover border border-pink-100 shadow-sm" />
                            <div>
                              <p className="text-sm font-bold text-slate-800">{idol.name}</p>
                              <p className="text-[9px] text-slate-400">{new Date(post.createdAt).toLocaleString()}</p>
                            </div>
                          </div>
                          <p className="text-sm text-slate-600 mb-3 leading-relaxed font-medium">{post.text}</p>
                          {post.img && <img src={post.img} className="w-full rounded-2xl object-cover mb-3 shadow-sm border border-slate-50" onError={handleImgError} />}
                          <div className="flex justify-end">
                            <button onClick={() => onLikePost(post.id)} className={`flex items-center gap-1.5 text-xs font-bold transition-colors ${post.likedBy?.includes(user?.uid) ? 'text-pink-500' : 'text-slate-400 hover:text-pink-400'}`}>
                              <i className={`${post.likedBy?.includes(user?.uid) ? 'fa-solid' : 'fa-regular'} fa-heart`}></i> {post.likes}
                            </button>
                          </div>
                        </div>
                      ))}
                      {postsData.filter(p => p.idolId === String(idol.id)).length === 0 && <p className="text-xs text-slate-400 text-center py-4">まだ投稿がありません。</p>}
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-pink-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-6 flex items-center gap-2"><i className="fa-regular fa-user text-pink-400"></i> プロフィール</h3>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                      <div className="bg-slate-50 rounded-2xl p-3 text-center"><p className="text-[9px] text-slate-400 font-bold mb-1">誕生日</p><p className="text-xs font-bold text-slate-700">{idol.birthday}</p></div>
                      <div className="bg-slate-50 rounded-2xl p-3 text-center"><p className="text-[9px] text-slate-400 font-bold mb-1">出身地</p><p className="text-xs font-bold text-slate-700">{idol.hometown}</p></div>
                      <div className="bg-slate-50 rounded-2xl p-3 text-center col-span-2 md:col-span-1"><p className="text-[9px] text-slate-400 font-bold mb-1">特技</p><p className="text-xs font-bold text-slate-700">{idol.specialSkill}</p></div>
                    </div>
                    <p className="text-slate-600 text-sm leading-relaxed font-medium whitespace-pre-wrap bg-pink-50/30 p-4 rounded-2xl">{idol.story}</p>
                  </div>
                </div>

                <div className="space-y-6 md:space-y-8">
                  <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-pink-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-6 flex items-center gap-2"><i className="fa-regular fa-comment-dots text-pink-400"></i> メッセージ</h3>
                    <form onSubmit={(e) => { e.preventDefault(); onPostComment(commentText); setCommentText(''); }} className="mb-6 flex gap-2">
                      <input type="text" value={commentText} onChange={e=>setCommentText(e.target.value)} placeholder="応援メッセージを送ろう！" className="flex-1 bg-slate-50 border border-slate-200 rounded-full px-4 py-2 text-xs focus:outline-none focus:border-pink-400 font-medium" />
                      <button type="submit" disabled={!commentText} className="bg-pink-500 text-white w-10 h-10 rounded-full flex items-center justify-center disabled:opacity-50 shadow-sm"><i className="fa-solid fa-paper-plane text-xs"></i></button>
                    </form>
                    <div className="space-y-4 max-h-80 overflow-y-auto pr-2 hide-scrollbar">
                      {commentsData.filter(c => c.idolId === String(idol.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(comment => (
                        <div key={comment.id} className="flex gap-3">
                          <MediaDisplay src={comment.userIcon} fallbackSrc="./default_idol.png" className="w-8 h-8 rounded-full object-cover border border-slate-100 shrink-0" />
                          <div className="bg-slate-50 rounded-2xl rounded-tl-none p-3 flex-1 border border-slate-100">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-[10px] font-bold text-slate-700">{comment.userName}</span>
                              {top3Ids.includes(comment.userId) && <span className="bg-pink-100 text-pink-500 text-[8px] px-1.5 py-0.5 rounded-full font-bold">OFFICIAL P</span>}
                            </div>
                            <p className="text-xs text-slate-600 font-medium">{comment.text}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-pink-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2"><i className="fa-solid fa-medal text-pink-400"></i> OFFICIAL PRODUCER</h3>
                    <p className="text-[9px] text-slate-500 mb-4">このアイドルを最も支援しているトップP</p>
                    <div className="space-y-3">
                      {top3Producers.map((p, i) => (
                        <div key={i} className="flex items-center gap-3 p-3 bg-white border border-pink-50 rounded-2xl shadow-sm">
                          <div className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${i===0?'bg-amber-100 text-amber-500':i===1?'bg-slate-100 text-slate-500':'bg-orange-100 text-orange-500'}`}>{i+1}</div>
                          <MediaDisplay src={p.profileImage} fallbackSrc="./default_idol.png" className="w-8 h-8 rounded-full object-cover border border-slate-100" />
                          <div className="min-w-0 flex-1">
                            <p className="text-xs font-bold text-slate-700 truncate">{p.name}</p>
                            <p className="text-[9px] text-pink-500 font-bold">{(p.votes[idol.id] || 0).toLocaleString()} 票</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <CrossNavSection idolsData={idolsData} currentIdolId={idol.id} onIdolSelect={onIdolSelect} onNavigate={onNavigate} />
        </div>
      );
    };

    const ArticleDetailView = ({ article, onBack }) => {
      const [content, setContent] = useState("<div class='text-center py-20 text-slate-400'>記事を読み込み中...</div>");
      useEffect(() => {
        const fetchArticle = async () => {
          try {
            const text = `## はじめに\n「もしアイ」のオーディションは、あなたの**「ありのままの魅力」**を伝える場所です。\n\n### 1. 写真選びのポイント\n* **自然光の下で撮る**: 窓際など、柔らかい光が入る場所がベストです。\n* **加工は控えめに**: プロデューサーは「原石」を探しています。\n\n> 「最初は自信がなくても大丈夫。あなたの勇気ある一歩が、誰かの心を動かします。」`;
            setContent(marked.parse(text));

                      <button onClick={handleLogout} className="text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
                    </>
                  ) : (
                    <button onClick={() => setShowAuthModal(true)} className="bg-gradient-to-r from-pink-400 to-pink-500 text-white px-5 py-2 rounded-full text-xs font-bold shadow-sm hover:scale-105 transition-transform">ログイン</button>
