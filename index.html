        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.onerror = (err) => reject(err);
        };

        const newPaid = Math.max(0, userData.paidTickets + paidDelta);
        const newPts = (userData.totalPts || 0) + ptsDelta; 
        
        const updatedData = { ...userData, freeTickets: newFree, paidTickets: newPaid, totalPts: newPts };
        setUserData(updatedData);

        if (user && !user.isAnonymous && firebaseLoaded && dbRef.current) {
          const { doc, updateDoc } = window.FirebaseHelper;
          const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          const docRef = doc(dbRef.current, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
          try {
            await updateDoc(docRef, {
              freeTickets: newFree, paidTickets: newPaid, totalPts: newPts
            });
          } catch (e) {
            console.error("Ticket update error:", e);
          }
        }
      };

      const processVoteAndGift = async (idolId, amount, actionType, itemId = null) => {
        const { doc, setDoc, increment, arrayUnion } = window.FirebaseHelper;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const producerRef = doc(db, 'artifacts', appId, 'public', 'data', 'producers', user.uid);
        const producerData = producersData.find(p => p.id === user.uid) || { votes: {}, totalVotes: 0 };
        const currentIdolVotes = producerData.votes[idolId] || 0;
        const iconColors = ["from-amber-200 to-amber-500", "from-slate-200 to-slate-400", "from-orange-200 to-orange-500", "from-pink-200 to-pink-500", "from-purple-200 to-purple-500"];
        const myColor = producerData.iconColor || iconColors[Math.floor(Math.random() * iconColors.length)];

        await setDoc(producerRef, {
          id: user.uid,
          name: userData.name || "名無しプロデューサー",
          iconColor: myColor,
          profileImage: userData.profileImage || "",
          votes: {
            ...producerData.votes,
            [idolId]: currentIdolVotes + amount
          },
          totalVotes: producerData.totalVotes + amount,
          updatedAt: new Date().toISOString()
        }, { merge: true });

        const idolRef = doc(db, 'artifacts', appId, 'public', 'data', 'idols', String(idolId));
        const idolUpdate = { totalVotes: increment(amount) };
        if (itemId) {
          idolUpdate.receivedGifts = arrayUnion({
            itemId: itemId,
            producerId: user.uid,
            producerName: userData.name || "名無しP",
            timestamp: new Date().toISOString()
          });
        }
        await setDoc(idolRef, idolUpdate, { merge: true });

        return true;
      };

      const handleVoteForIdol = async (idolId, amount, actionType = '投票', itemId = null) => {
        if (!user || user.isAnonymous) {
          setShowAuthModal(true);
          return;
        }
        await processVoteAndGift(idolId, amount, actionType, itemId);
      };

      const handleQuickVote = async (e, idol) => {
        e.stopPropagation(); 
        if (!user || user.isAnonymous) return setShowAuthModal(true);

        if (userData.freeTickets >= 1) {
          await updateTickets(-1, 0, 1);
          await handleVoteForIdol(idol.id, 1, '無料投票');
          showToast(`💝 ${idol.name} に1票投票しました！`);
          
          if (typeof confetti !== 'undefined') {
            const rect = e.target.getBoundingClientRect();
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;
            confetti({ particleCount: 40, spread: 50, origin: { x, y }, colors: ['#f472b6', '#ec4899', '#fbcfe8', '#fb7185'], disableForReducedMotion: true, zIndex: 9999 });
          }
        } else {
          showToast("無料票が不足しています。詳細からギフトを贈って応援しましょう！");
        }
      };

      const handleDirectGift = async (idol, itemId, votes, actionType) => {
        if (!user || user.isAnonymous) {
          setShowAuthModal(true);
          return;
        }
        await updateTickets(0, 0, votes);
        await processVoteAndGift(idol.id, votes, actionType, itemId);
        setSuccessModalData({ idolName: idol.name, amount: votes, actionType });
      };

      const handlePostComment = async (idolId, text) => {
        if (!user || user.isAnonymous) return setShowAuthModal(true);
        if (!text.trim()) return;

        const { collection, addDoc } = window.FirebaseHelper;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'comments'), {
          idolId: String(idolId),
          userId: user.uid,
          userName: userData.name || "名無しP",
          userIcon: userData.profileImage || "",
          text: text,
          createdAt: new Date().toISOString()
        });
        showToast("メッセージを送信しました。");
      };

      const handlePostTimeline = async (postData) => {
        const { collection, addDoc } = window.FirebaseHelper;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
          ...postData,
          likes: 0,
          likedBy: [],
          createdAt: new Date().toISOString()
        });
      };

      const handleLikePost = async (postId) => {
        if (!user || user.isAnonymous) return setShowAuthModal(true);
        const post = postsData.find(p => p.id === postId);
        if (!post) return;
        
        const isLiked = post.likedBy && post.likedBy.includes(user.uid);
        const { doc, setDoc } = window.FirebaseHelper;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let newLikedBy = post.likedBy || [];
        if (isLiked) {
          newLikedBy = newLikedBy.filter(id => id !== user.uid);
        } else {
          newLikedBy.push(user.uid);
        }

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId), {
          likes: newLikedBy.length,
          likedBy: newLikedBy
        }, { merge: true });
      };

      const handlePostTimelineComment = async (postId, idolId, text) => {
        if (!user || user.isAnonymous) return setShowAuthModal(true);
        if (!text.trim()) return;

        const { collection, addDoc } = window.FirebaseHelper;
        const db = dbRef.current;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'comments'), {
            postId: String(postId),
            idolId: String(idolId),
            userId: user.uid,
            userName: userData.name || "名無しP",
            userIcon: userData.profileImage || "",
            text: text,
            createdAt: new Date().toISOString()
          });
          showToast("コメントを送信しました！");
        } catch (e) {
          console.error("Comment error:", e);
          showToast("コメントの送信に失敗しました。");
        }
      };

      const filteredIdols = useMemo(() => {
        return idolsData.filter(idol => {
          if (idolSearchText && !idol.name.includes(idolSearchText)) return false;
          if (idolFilterType === 'rookie' && !idol.isRookie) return false;
          return true;
        });
      }, [idolsData, idolSearchText, idolFilterType]);

      const topProducersList = [...producersData].sort((a,b) => (b.totalVotes || 0) - (a.totalVotes || 0)).slice(0,3);

      const scrollPosRef = useRef(0);

      const openIdolDetail = (idol) => { 
        if (activeTab === 'home' || activeTab === 'allIdolsList') scrollPosRef.current = window.scrollY; 
        setSelectedIdol(idol); 
        setActiveTab('idolDetail'); 
        window.scrollTo(0,0); 
      };
      const openArticleDetail = (article) => {
        if (activeTab === 'home' || activeTab === 'allIdolsList') scrollPosRef.current = window.scrollY;
        setSelectedArticle(article);
        setActiveTab('articleDetail');
        window.scrollTo(0,0);
      };
      const openEventDetail = (event) => {
        if (activeTab === 'home' || activeTab === 'allIdolsList') scrollPosRef.current = window.scrollY;
        setSelectedEvent(event);
        setActiveTab('eventDetail');
        window.scrollTo(0,0);
      };
      
      const openIdolLP = () => {
        if (activeTab === 'home' || activeTab === 'allIdolsList') scrollPosRef.current = window.scrollY;
        setActiveTab('idolLP');
        window.scrollTo(0,0);
      };

      const openProducerDetail = (producer) => { 
        if (activeTab === 'home' || activeTab === 'allIdolsList') scrollPosRef.current = window.scrollY; 
        setSelectedProducer(producer); 
        setActiveTab('producerDetail'); 
        window.scrollTo(0,0); 
      };

      const handleBackToHome = () => {
        setActiveTab('home');
        setTimeout(() => {
          window.scrollTo({ top: scrollPosRef.current, behavior: 'instant' });
        }, 50);
      };

      const scrollToSection = (id) => { if(activeTab !== 'home') setActiveTab('home'); setTimeout(() => { const el = document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); }, 100); };

      return (
        <div className="pb-24">
          <Toast message={toastMessage} />

          <GlobalTelop event={globalEvent} />          

          {showAuthModal && <AuthModal onClose={() => setShowAuthModal(false)} onAuthSubmit={handleAuthSubmit} />}
          {showAdminModal && <AuthModal onClose={() => setShowAdminModal(false)} onAuthSubmit={handleAuthSubmit} isAdminOnly={true} />}
          {showVoteModal && selectedIdol && <VoteModal onClose={() => setShowVoteModal(false)} idol={selectedIdol} user={user} userData={userData} updateTickets={updateTickets} showToast={showToast} onLogin={() => {setShowVoteModal(false); setShowAuthModal(true);}} onSuccess={(amount, type) => { handleVoteForIdol(selectedIdol.id, amount, type); setSuccessModalData({ idolName: selectedIdol.name, amount, actionType: type }); }} />}
          {showOutfitModal && selectedIdol && <OutfitModal onClose={() => setShowOutfitModal(false)} idol={selectedIdol} user={user} userData={userData} updateTickets={updateTickets} showToast={showToast} onLogin={() => {setShowOutfitModal(false); setShowAuthModal(true);}} onSuccess={(amount, type, itemId) => { handleVoteForIdol(selectedIdol.id, amount, type, itemId); setSuccessModalData({ idolName: selectedIdol.name, amount, actionType: type }); }} />}
          {showGiftModal && selectedIdol && <GiftModal onClose={() => setShowGiftModal(false)} idol={selectedIdol} user={user} updateTickets={updateTickets} showToast={showToast} onLogin={() => {setShowGiftModal(false); setShowAuthModal(true);}} onSuccess={(amount, type) => { handleVoteForIdol(selectedIdol.id, amount, type); setSuccessModalData({ idolName: selectedIdol.name, amount, actionType: type }); }} />}
          {successModalData && <SuccessModal data={successModalData} onClose={() => setSuccessModalData(null)} idol={idolsData.find(i => i.name === successModalData.idolName)} />}

          {/* ▼▼▼ 法務・規約モーダル群 ▼▼▼ */}
          {showSCTLModal && <SCTLModal onClose={() => setShowSCTLModal(false)} />}
          {showTermsModal && <TermsModal onClose={() => setShowTermsModal(false)} />}
          {showPrivacyModal && <PrivacyPolicyModal onClose={() => setShowPrivacyModal(false)} />}
          {showAboutModal && <AboutServiceModal onClose={() => setShowAboutModal(false)} />}
          {showContactModal && <ContactForm onClose={() => setShowContactModal(false)} showToast={showToast} />}
          {/* ▲▲▲ 法務・規約モーダル群 ここまで ▲▲▲ */}

          <header className="absolute top-0 w-full z-50 py-8 pointer-events-none">
            <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-start md:items-center">
              <div className="flex items-center gap-2 cursor-pointer pointer-events-auto w-[45%] md:w-auto max-w-[240px]" onClick={() => {setActiveTab('home'); window.scrollTo(0,0);}}>
                <img src="./logo.png" alt="もしアイ" className="w-full h-auto object-contain transition-opacity duration-300 hover:opacity-80 drop-shadow-sm" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                <span style={{display: 'none'}} className="text-2xl font-light text-slate-800 font-serif tracking-widest">Moshi-Ai</span>
              </div>
              <div className="flex flex-col items-end gap-4 pointer-events-auto mt-4 md:mt-0">
                <div className="flex items-center gap-4">
                  {user && !user.isAnonymous ? (
                    <div className="flex items-center gap-2 md:gap-4">
                      {userRole === 'admin' ? (
                        <button onClick={() => { setActiveTab('adminDashboard'); window.scrollTo(0,0); }} className="text-[10px] tracking-widest font-medium text-white bg-slate-800 border border-slate-700 px-3 py-1.5 md:px-4 hover:bg-slate-700 transition-colors uppercase flex items-center gap-2 shadow-sm">
                          <i className="fa-solid fa-gear"></i> Admin Panel
                        </button>
                      ) : (
                        <button onClick={() => { setActiveTab(userRole === 'idol' ? 'idolMyPage' : 'producerMyPage'); window.scrollTo(0,0); }} className="text-[10px] tracking-widest font-medium text-slate-800 bg-white border border-slate-200 px-3 py-1.5 md:px-4 hover:bg-slate-50 transition-colors uppercase flex items-center gap-2 shadow-sm">
                          <i className="fa-regular fa-user"></i> My Page
                        </button>
                      )}
                      <button onClick={handleLogout} className="text-[10px] tracking-widest font-medium text-white bg-slate-900 px-3 py-1.5 md:px-4 hover:bg-slate-800 transition-colors uppercase flex items-center gap-2 shadow-sm">
                        <i className="fa-solid fa-arrow-right-from-bracket"></i> Logout
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => setShowAuthModal(true)} className="text-[10px] tracking-widest font-medium text-slate-800 border border-slate-800 px-4 py-1.5 hover:bg-slate-800 hover:text-white transition-colors uppercase">
                      Login / Join
                    </button>
                  )}
                </div>
                
                <nav className="hidden md:flex items-center gap-10 text-[10px] tracking-[0.2em] font-medium text-slate-600">
                  {['HOME', 'EVENT', 'IDOLS', 'MAGAZINE'].map((item) => (
                    <button key={item} onClick={() => {
                      const id = item === 'EVENT' ? 'ranking' : item === 'IDOLS' ? 'idol-list' : item.toLowerCase();
                      scrollToSection(id);
                    }} className="hover:text-pink-500 transition-colors uppercase relative group">
                      {item}
                      <span className="absolute -bottom-2 left-0 w-0 h-px bg-pink-300 transition-all duration-300 group-hover:w-full"></span>
                    </button>
                  ))}
                </nav>
              </div>
            </div>
          </header>

          <main className="pt-40 min-h-[80vh]">
            {activeTab === 'adminDashboard' && userRole === 'admin' ? (
              <AdminDashboard idolsData={idolsData} showToast={showToast} />
            ) : activeTab === 'producerMyPage' && userRole !== 'admin' && user && !user.isAnonymous ? (
              <ProducerMyPage user={user} userData={userData} idolsData={idolsData} producersData={producersData} onUpdateProfile={handleUpdateProfile} showToast={showToast} onIdolSelect={openIdolDetail} onNavigate={scrollToSection} />
            ) : activeTab === 'idolMyPage' && userRole !== 'admin' && user && !user.isAnonymous ? (
              <IdolMyPage idolData={idolsData.find(i => String(i.id) === String(userData.idolId))} onUpdateProfile={handleUpdateIdolProfile} showToast={showToast} onPostTimeline={handlePostTimeline} />
            ) : activeTab === 'idolDetail' && selectedIdol ? (
              <IdolDetailView idol={selectedIdol} onBack={handleBackToHome} onVoteClick={() => setShowVoteModal(true)} onOutfitClick={() => setShowOutfitModal(true)} onGiftClick={() => setShowGiftModal(true)} idolsData={idolsData} onIdolSelect={openIdolDetail} onNavigate={scrollToSection} producersData={producersData} postsData={postsData} commentsData={commentsData} onPostComment={(text) => handlePostComment(selectedIdol.id, text)} onLikePost={handleLikePost} onDirectGift={(itemId, votes, actionType) => handleDirectGift(selectedIdol, itemId, votes, actionType)} user={user} />
            ) : activeTab === 'eventDetail' && selectedEvent ? (
              <EventDetailView event={selectedEvent} onBack={handleBackToHome} idolsData={idolsData} onIdolSelect={openIdolDetail} onQuickVote={handleQuickVote} />
            ) : activeTab === 'producerDetail' && selectedProducer ? (
              <ProducerDetailView producer={selectedProducer} onBack={handleBackToHome} />
            ) : activeTab === 'articleDetail' && selectedArticle ? (
              <ArticleDetailView article={selectedArticle} onBack={handleBackToHome} />
            ) : activeTab === 'idolLP' ? (
              <IdolRecruitLP onBack={handleBackToHome} />
            ) : activeTab === 'allIdolsList' ? (
              <AllIdolsView onBack={handleBackToHome} onIdolSelect={openIdolDetail} idols={filteredIdols} idolSearchText={idolSearchText} setIdolSearchText={setIdolSearchText} idolFilterType={idolFilterType} setIdolFilterType={setIdolFilterType} />
            ) : (
              <div className="animate-fade-in">
                
                {/* HERO SECTION */}
                <section id="home" className="pb-16 md:pb-24 max-w-7xl mx-auto px-4 text-center">
                  <div className="flex flex-col items-center relative">
                    <div className="relative w-full max-w-4xl flex flex-col items-center mb-4">
                      <img src="./top.png" className="w-full object-contain relative z-10" onError={(e) => e.target.style.display='none'} />
                      <a href="https://moshiailp.pages.dev/" target="_blank" rel="noopener noreferrer" className="w-[85%] sm:w-[70%] max-w-lg -mt-12 sm:-mt-20 md:-mt-24 relative z-20 hover:-translate-y-2 transition-transform duration-500 drop-shadow-[0_20px_40px_rgba(0,0,0,0.15)] bg-transparent border-none p-0 cursor-pointer outline-none block">
                        <img src="./line_entry_banner.png" alt="アイドルエントリー詳細へ" className="w-full h-auto object-contain" onError={(e) => e.target.style.display='none'} />
                      </a>
                    </div>
                  </div>
                </section>

                {/* PICK UP IDOLS */}
                <section id="idol-slider" className="py-16 bg-white/40 backdrop-blur-md border-y border-white/60 mb-20 relative">
                  <div className="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>
                  <div className="max-w-7xl mx-auto">
                    <div className="flex items-center gap-3 px-8 mb-8">
                      <span className="w-10 h-px bg-slate-400"></span>
                      <h2 className="text-sm font-light text-slate-500 tracking-[0.3em] uppercase">Featured</h2>
                    </div>
                    {idolsData.length === 0 ? (
                      <p className="px-8 text-sm text-slate-500 font-light">現在エントリー中のアイドルはいません。</p>
                    ) : (
                      <div className="flex gap-6 overflow-x-auto hide-scrollbar px-8 pb-8">
                        {idolsData.map((idol, i) => (
                          <div key={idol.id} className="w-56 shrink-0 relative rounded-none overflow-hidden group bg-white border border-slate-100 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] hover:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] transition-all duration-500">
                            <div className="aspect-[3/4] overflow-hidden relative bg-slate-50">
                              <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />
                              <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/20 to-transparent opacity-80 group-hover:opacity-90 transition-opacity"></div>
                            </div>

                                <div className="space-y-8 mt-16 border-t border-slate-200 pt-16">
                                  {ev.benefits.map((benefit, idx) => (
                                    <div key={idx} className={`p-8 md:p-10 border shadow-sm ${benefit.type === 'producer' ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200'}`}>
                                      <h3 className={`text-lg md:text-xl font-light font-serif mb-6 tracking-wide ${benefit.type === 'producer' ? 'text-white' : 'text-slate-800'}`}>{benefit.title}</h3>
                                      <ul className="space-y-4">
                                        {benefit.items.map((item, i) => (
                                          <li key={i} className="flex items-start gap-4">
                                            <span className={`mt-1.5 w-1.5 h-1.5 rounded-full shrink-0 ${benefit.type === 'producer' ? 'bg-pink-400' : 'bg-slate-300'}`}></span>
                                            <p className={`text-sm md:text-base leading-loose font-light ${benefit.type === 'producer' ? 'text-slate-300' : 'text-slate-600'}`}>
                                              {item.includes('Supported by') || item.includes('Outfit Provided by') ? (<span dangerouslySetInnerHTML={{__html: item.replace(/\*\*(.*?)\*\*/g, '<strong class="font-medium text-white">$1</strong>')}} />) : item}
                                            </p>
                                          </li>
                                        ))}
                                      </ul>
                                    </div>
                                  ))}
                                </div>
                                <div className="text-center pt-8">
                                  <button onClick={() => openEventDetail(ev)} className="bg-transparent border border-slate-300 text-slate-600 px-8 py-3 text-[10px] tracking-[0.2em] font-light hover:bg-slate-900 hover:text-white hover:border-slate-900 transition-all duration-300 inline-flex items-center justify-center gap-3 rounded-none shadow-sm hover:shadow-md">
                                    SEE ALL EVENTS DATA <i className="fa-solid fa-arrow-right-long font-light"></i>
                                  </button>
                                </div>
                              </div>
                            )}

                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* IDOL LIST */}
                <section id="idol-list" className="py-20 max-w-7xl mx-auto px-6 mb-16">
                  <SectionTitle title="The Muses" subtitle="あなただけのミューズを見つける" />
                  {filteredIdols.length === 0 ? <p className="text-center text-sm text-slate-500 font-light">現在エントリー中のアイドルはいません。</p> : (
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-10 mb-16">
                      {filteredIdols.slice(0, 8).map((idol) => (
                        <div key={idol.id} onClick={() => openIdolDetail(idol)} className="group cursor-pointer">
                          <div className="aspect-[3/4] relative overflow-hidden bg-slate-100 mb-4 border border-slate-200/50 shadow-[0_4px_15px_-5px_rgba(0,0,0,0.05)]">
                            <MediaDisplay src={idol.profileImage} fallbackSrc={`./default_idol.png`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 mix-blend-multiply" />
                            {idol.isStreaming && (
                              <div className="absolute top-3 right-3 bg-red-500/90 text-white text-[8px] font-medium tracking-widest px-2 py-1 uppercase shadow-sm animate-pulse">
                                On Air
                              </div>
                            )}
                          </div>
                          <div className="text-center px-2">
                            <h4 className="font-light text-slate-800 tracking-wide text-sm md:text-base group-hover:text-pink-600 transition-colors truncate">{idol.name}</h4>
                            <p className="text-[9px] text-slate-400 tracking-widest mt-1 uppercase">{idol.style}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="text-center mt-10">
                    <button onClick={() => { if(activeTab === 'home') scrollPosRef.current = window.scrollY; setActiveTab('allIdolsList'); window.scrollTo(0,0); }} className="bg-transparent border border-slate-300 text-slate-600 px-12 py-4 text-xs tracking-[0.2em] font-light hover:bg-slate-900 hover:text-white hover:border-slate-900 transition-all duration-300 inline-flex items-center justify-center gap-4">
                      VIEW ALL MUSES <i className="fa-solid fa-arrow-right-long font-light"></i>
                    </button>
                  </div>
                </section>

                {/* LIVE TIMELINE */}
                <LiveTimelineSection 
                  posts={postsData} 
                  idols={idolsData} 
                  user={user} 
                  comments={commentsData} 
                  onLike={handleLikePost} 
                  onComment={handlePostTimelineComment} 
                  onLogin={() => setShowAuthModal(true)} 
                  producersData={producersData}
                  userRole={userRole}
                />

                {/* PRODUCER RANKING */}
                <section id="producer-ranking" className="py-20 bg-slate-50 border-y border-slate-200 mb-20">
                  <div className="max-w-6xl mx-auto px-6">
                    <SectionTitle title="Top Patrons" subtitle="彼女たちを支えるトッププロデューサー" />
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                      {topProducersList.map((producer, index) => {
                        let oshiName = "未設定";
                        if (producer.votes) {
                          const topOshiId = Object.keys(producer.votes).sort((a,b) => producer.votes[b] - producer.votes[a])[0];
                          const oshiIdol = idolsData.find(i => String(i.id) === topOshiId);
                          if (oshiIdol) oshiName = oshiIdol.name;
                        }
                        const titles = ["👑 筆頭プロデューサー", "✨ 敏腕プロデューサー", "🌟 敏腕プロデューサー"];

                        return (
                          <div key={producer.id} onClick={() => openProducerDetail(producer)} className="bg-white p-8 border border-slate-100 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] cursor-pointer group transition-all duration-300 hover:shadow-[0_15px_30px_-10px_rgba(0,0,0,0.1)] text-center">
                            <p className="text-[9px] text-slate-400 font-medium tracking-widest mb-6 uppercase">Rank 0{index + 1}</p>
                            <div className={`w-16 h-16 rounded-full mb-6 mx-auto flex items-center justify-center bg-gradient-to-tr ${producer.iconColor || 'from-slate-200 to-slate-400'} shadow-inner transition-transform duration-500 group-hover:scale-110 overflow-hidden`}>
                              {producer.profileImage ? <img src={producer.profileImage} className="w-full h-full object-cover"/> : <i className="fa-solid fa-user-tie text-xl text-white/90"></i>}
                            </div>
                            <div className="border-b border-slate-200 text-slate-500 text-[9px] font-medium tracking-widest pb-1 inline-block mb-4 uppercase">{titles[index] || "プロデューサー"}</div>
                            <h4 className="font-light text-slate-800 text-lg tracking-wide mb-1 group-hover:text-amber-600 transition-colors">{producer.name}</h4>
                            <p className="text-xs text-slate-400 font-light mb-4">Oshi: <span className="font-serif text-slate-700 text-sm normal-case">{oshiName}</span></p>
                            <p className="text-xl font-timer font-light text-slate-800">{(producer.totalVotes || 0).toLocaleString()} <span className="text-[10px] text-slate-400 font-sans">票</span></p>
                          </div>
                        );
                      })}
                      {topProducersList.length === 0 && <p className="col-span-3 text-center text-sm text-slate-400 font-light py-10">まだプロデューサーのランキングデータがありません。</p>}
                    </div>
                  </div>
                </section>

                {/* MAGAZINE ARCHIVE */}
                <section id="magazine" className="py-24 relative overflow-hidden max-w-7xl mx-auto px-6 mb-20">
                  <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-3xl h-full bg-slate-50/50 blur-3xl -z-10 rounded-full"></div>
                  <SectionTitle title="Archive" subtitle="過去の誌面コレクション" />
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-12 md:gap-16 relative z-10">
                    {MAGAZINES.map((mag) => (
                      <div key={mag.id} className="flex flex-col items-center group cursor-pointer">
                        <div className="relative w-full aspect-[3/4] bg-white border border-slate-100 p-3 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] transition-all duration-500 group-hover:-translate-y-3 group-hover:shadow-[0_30px_50px_-15px_rgba(0,0,0,0.15)]">
                          <img src={`./mag${mag.id}.png`} alt={mag.title} className="w-full h-full object-cover mix-blend-multiply" onError={handleImgError} />
                          <div className="absolute -left-3 top-6 bg-slate-900 text-white text-[9px] font-medium tracking-widest py-1.5 px-4 shadow-md uppercase writing-vertical-lr transform rotate-180" style={{ writingMode: 'vertical-lr' }}>Vol. {mag.id}</div>
                        </div>
                        <div className="text-center mt-8">
                          <span className={`text-[9px] font-medium tracking-widest uppercase border-b pb-1 ${mag.status === '発売中' ? 'text-slate-400 border-slate-300' : 'text-pink-400 border-pink-200'}`}>{mag.status}</span>
                          <h4 className="font-serif font-light text-slate-800 mt-4 leading-relaxed">{mag.title}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* OFF-MELTY CATALOG */}
                <OffMeltyCatalogSection 
                  catalog={OFF_MELTY_CATALOG} 
                  idols={idolsData} 
                />

                {/* MOSHI-AI WEB MAGAZINE */}
                <MoshiAiMagazineSection 
                  articles={WEB_MAGAZINE_ARTICLES}
                  categories={MAG_CATEGORIES}
                  onArticleSelect={openArticleDetail}
                />
              </div>
            )}
          </main>

          <footer className="mt-32 pt-24 border-t border-slate-200 relative overflow-hidden bg-white">
            <div className="absolute top-0 right-0 w-1/3 h-full bg-slate-50/50 pointer-events-none"></div>
            <div className="max-w-6xl mx-auto px-6 flex flex-col items-center text-center space-y-16 relative z-10 pb-20">
              <div className="flex flex-col md:flex-row items-center justify-center gap-12 md:gap-20 w-full animate-fade-in">
                <img src="./logo.png" className="h-16 md:h-20 object-contain opacity-80 transition-opacity hover:opacity-100" alt="もしアイ ロゴ" onError={(e)=>e.target.style.display='none'} />
                <div className="h-px w-20 md:w-px md:h-16 bg-slate-200"></div>
                <img src="./off_melty_logo.png" className="h-8 md:h-10 object-contain opacity-60 hover:opacity-100 transition-opacity" alt="Off-Melty ロゴ" onError={handleImgError} />
              </div>
              
              <div className="space-y-10 w-full max-w-md mx-auto">
                <p className="text-xs font-light text-slate-500 tracking-widest uppercase mb-4">Newsletter</p>
                <div className="relative">
                  <input type="email" placeholder="Email Address" className="w-full bg-transparent border-b border-slate-300 py-3 px-2 text-center text-sm font-light focus:outline-none focus:border-slate-800 transition-colors placeholder-slate-300" />
                  <button className="absolute right-0 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-800 transition-colors">
                    <i className="fa-solid fa-arrow-right-long"></i>
                  </button>
                </div>
                
                <div className="pt-8">
                  <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="inline-block text-slate-400 hover:text-slate-800 transition-colors">
                    <i className="fa-brands fa-instagram text-2xl"></i>
                  </a>
                  <p className="text-[8px] font-medium text-slate-400 mt-3 tracking-[0.3em] uppercase">Follow us</p>
                </div>
              </div>
            </div>
            
            <div className="bg-slate-900 text-white/50 pt-8 pb-4">
              <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left mb-6">
                <p className="text-[9px] tracking-[0.2em] uppercase">&copy; 2026 Moshi-Ai Project. All Rights Reserved.</p>
                <div className="flex justify-center gap-8 text-[9px] tracking-widest uppercase">
                  <button onClick={() => setShowTermsModal(true)} className="hover:text-white transition-colors border-none bg-transparent">Terms</button>
                  <button onClick={() => setShowPrivacyModal(true)} className="hover:text-white transition-colors border-none bg-transparent">Privacy</button>
                  <button onClick={() => setShowSCTLModal(true)} className="hover:text-white transition-colors border-none bg-transparent">SCTL</button>
                  <button onClick={() => setShowAboutModal(true)} className="hover:text-white transition-colors border-none bg-transparent">About</button>
                  <button onClick={() => setShowContactModal(true)} className="hover:text-white transition-colors border-none bg-transparent">Contact</button>
                </div>
              </div>
              <div className="text-center pb-2">
                <button onClick={() => setShowAdminModal(true)} className="text-[9px] text-slate-600 hover:text-slate-400 tracking-[0.3em] uppercase transition-colors">Admin Login</button>
              </div>
            </div>
          </footer>

          {(activeTab === 'home' || activeTab === 'allIdolsList') && (
            <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-white/90 via-white/50 to-transparent z-[100] md:flex md:justify-end animate-fade-in-up pointer-events-none pb-8 pr-8">
              <div className="max-w-xs w-full ml-auto flex flex-col items-end gap-2 pointer-events-auto">
                <div className="bg-slate-900 text-white text-[9px] tracking-widest py-1.5 px-4 uppercase shadow-lg">New Audition</div>
                <a href="https://moshiailp.pages.dev/" target="_blank" rel="noopener noreferrer" className="block hover:-translate-y-2 transition-transform duration-300 shadow-[0_10px_20px_rgba(0,0,0,0.15)] bg-white p-1">
                  <img src="./line_btn.png" alt="LINEで無料エントリー！" className="w-full max-h-16 object-contain" onError={(e) => e.target.style.display='none'} />
                </a>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
