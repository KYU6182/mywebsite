              <div className="md:col-span-2 space-y-10">
                <div className="bg-white p-8 border border-slate-100 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)]">
                  <h4 className="text-xs font-medium tracking-widest text-slate-500 uppercase mb-8 flex items-center gap-3"><span className="w-6 h-px bg-slate-300"></span> Dashboard</h4>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div className="bg-slate-50 p-6 text-center border border-slate-100">
                      <p className="text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-3">Daily Free Votes</p>
                      <p className="text-4xl font-timer font-light text-slate-800">{userData.freeTickets} <span className="text-sm font-sans font-light text-slate-400">票</span></p>
                    </div>
                    <div className="bg-pink-50/50 p-6 text-center border border-pink-100">
                      <p className="text-[9px] font-medium tracking-widest text-pink-400 uppercase mb-3">Total Votes</p>
                      <p className="text-4xl font-timer font-light text-pink-600">{userData.totalPts?.toLocaleString() || 0} <span className="text-sm font-sans font-light text-pink-400/70">票</span></p>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-8 border border-slate-100 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)]">
                  <h4 className="text-xs font-medium tracking-widest text-slate-500 uppercase mb-8 flex items-center gap-3"><span className="w-6 h-px bg-slate-300"></span> Edit Profile</h4>
                  
                  <form onSubmit={handleSave} className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                        <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Nickname (プロデューサー名)</label>
                        <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-800 transition-colors font-light text-slate-800 text-sm" placeholder="名無しプロデューサー" />
                      </div>
                      <div>
                        <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Profile Image URL (写真)</label>
                        <input type="text" value={profileImage} onChange={(e) => setProfileImage(e.target.value)} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-800 transition-colors font-light text-slate-800 text-sm" placeholder="https://..." />
                      </div>
                    </div>
                    
                    <div>
                      <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">My Oshi (推しメン設定)</label>
                      <select value={oshiId} onChange={(e) => setOshiId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 py-3 px-3 focus:outline-none focus:border-slate-400 transition-colors font-light text-slate-800 text-sm appearance-none">
                        <option value="">-- 選択してください --</option>
                        {idolsData.map(idol => (
                          <option key={idol.id} value={idol.id}>{idol.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Short Message (一言メッセージ)</label>
                      <textarea value={message} onChange={(e) => setMessage(e.target.value)} rows="3" className="w-full bg-slate-50 border border-slate-200 p-3 focus:outline-none focus:border-slate-400 transition-colors font-light text-sm resize-none" placeholder="推しへの想いや意気込みを..."></textarea>
                    </div>

                    <div className="pt-4 text-right">
                      <button type="submit" className="bg-slate-900 text-white text-[10px] tracking-widest font-light px-10 py-4 hover:bg-slate-800 transition-colors uppercase">Save Changes</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
          <CrossNavSection idolsData={idolsData} currentIdolId={null} onIdolSelect={onIdolSelect} onNavigate={onNavigate} />
        </div>
      );
    };

    const IdolMyPage = ({ idolData, onLogout, onUpdateProfile, showToast }) => {
      const [profileImage, setProfileImage] = useState(idolData?.profileImage || ""); 
      const [catchphrase, setCatchphrase] = useState(idolData?.catchphrase || "");
      const [story, setStory] = useState(idolData?.story || "");
      const [isStreaming, setIsStreaming] = useState(idolData?.isStreaming || false);
      const [wishlist, setWishlist] = useState([]);
      
      const [timelineText, setTimelineText] = useState("");
      const [timelineImg, setTimelineImg] = useState("");

      useEffect(() => {
        setProfileImage(idolData?.profileImage || "");
        setCatchphrase(idolData?.catchphrase || "");
        setStory(idolData?.story || "");
        setIsStreaming(idolData?.isStreaming || false);
      }, [idolData]);

      if (!idolData) return <div className="text-center py-20">Loading...</div>;

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        const result = await onUpdateProfile({ 
          profileImage,
          catchphrase, 
          story, 
          isStreaming,
        });
        
        if (result && !result.success) {
          showToast(`保存エラー: 権限(ルール)の設定を確認してください。`);
        } else {
          showToast("プロフィール設定を更新しました。");
        }
      };

      const handlePostTimeline = (e) => {
        e.preventDefault();
        if(!timelineText) return;
        showToast("活動報告をタイムラインに投稿しました！");
        setTimelineText("");
        setTimelineImg("");
      };

      const toggleWishlist = (itemId) => {
        setWishlist(prev => 
          prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId]
        );
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-12 animate-fade-in-up pb-32">
          <SectionTitle title="STUDIO" subtitle="アイドル専用ダッシュボード" />
          
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div className="lg:col-span-1 space-y-6">
              <div className="bg-white p-6 border border-slate-100 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)] text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-pink-400"></div>
                
                <div className="w-32 h-32 rounded-full mx-auto overflow-hidden mb-6 border border-slate-100 shadow-inner relative group bg-slate-50">
                  <MediaDisplay src={profileImage} fallbackSrc={`./idol${idolData.id}.png`} className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i className="fa-solid fa-camera text-white"></i>
                  </div>
                </div>
                
                {isStreaming && (
                  <div className="inline-flex items-center gap-1.5 bg-red-50 text-red-500 border border-red-100 text-[9px] font-bold px-3 py-1 tracking-widest uppercase mb-4 shadow-sm">
                    <span className="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span> ON AIR
                  </div>
                )}

                <h3 className="font-serif text-xl font-light text-slate-800 mb-2">{idolData.name}</h3>
                <p className="text-xs text-pink-500 font-light italic mb-2 px-2 leading-tight">"{catchphrase}"</p>
                <p className="text-[9px] text-slate-400 tracking-widest uppercase mt-4 border-t border-slate-100 pt-4">Moshi-Ai IDOL ACCOUNT</p>
              </div>
            </div>

            <div className="lg:col-span-3 space-y-10">
              
              <div className="bg-white p-8 border border-slate-100 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)]">
                <h4 className="text-xs font-medium tracking-widest text-slate-500 uppercase mb-8 flex items-center gap-3"><span className="w-6 h-px bg-slate-300"></span> Profile Settings</h4>
                <form onSubmit={handleSaveProfile} className="space-y-6">
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                      <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Profile Media URL (写真/動画の変更)</label>
                      <input type="text" value={profileImage} onChange={(e) => setProfileImage(e.target.value)} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-pink-400 transition-colors font-light text-sm" placeholder="https://... (mp4も可)" />
                    </div>
                    <div>
                      <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Live Status (配信中ステータス)</label>
                      <button type="button" onClick={() => setIsStreaming(!isStreaming)} className={`w-full py-2.5 text-xs tracking-widest font-light transition-all border ${isStreaming ? 'bg-red-50 text-red-600 border-red-200 shadow-inner' : 'bg-transparent text-slate-500 border-slate-300 hover:border-slate-400'}`}>
                        {isStreaming ? '🔴 配信中 (ON AIR)' : '⚪️ オフライン (OFF)'}
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Catchphrase (キャッチフレーズ)</label>
                    <input type="text" value={catchphrase} onChange={(e) => setCatchphrase(e.target.value)} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-pink-400 transition-colors font-light text-sm" />
                  </div>
                  
                  <div>
                    <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Her Story (私の物語 / 自己紹介)</label>
                    <textarea value={story} onChange={(e) => setStory(e.target.value)} rows="5" className="w-full bg-slate-50 border border-slate-200 p-4 focus:outline-none focus:border-pink-300 transition-colors font-light text-sm resize-none leading-loose"></textarea>
                  </div>
                  
                  <div className="text-right pt-4">
                    <button type="submit" className="bg-slate-900 text-white text-[10px] tracking-widest font-light px-10 py-4 hover:bg-pink-600 transition-colors uppercase">Update Profile</button>
                  </div>
                </form>
              </div>

              <div className="bg-white p-8 border border-slate-100 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)]">
                <div className="mb-8">
                  <h4 className="text-xs font-medium tracking-widest text-slate-500 uppercase mb-2 flex items-center gap-3"><span className="w-6 h-px bg-slate-300"></span> Outfit Wishlist</h4>
                  <p className="text-[10px] text-slate-400 font-light">カタログから「欲しい衣装」を選んでアピールしましょう。ファンがプレゼントしやすくなります。</p>
                </div>
                
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {OFF_MELTY_CATALOG.map(item => {
                    const isSelected = wishlist.includes(item.id);
                    return (
                      <div key={item.id} onClick={() => toggleWishlist(item.id)} className={`relative cursor-pointer group border transition-all ${isSelected ? 'border-pink-400 shadow-md ring-1 ring-pink-100' : 'border-slate-100 hover:border-slate-300'}`}>
                        <div className="aspect-[3/4] bg-slate-50 overflow-hidden relative">
                          <img src={item.img} className={`w-full h-full object-cover transition-transform duration-500 ${isSelected ? '' : 'grayscale-[20%] group-hover:grayscale-0'} mix-blend-multiply`} onError={handleImgError} />
                          {isSelected && (
                            <div className="absolute top-2 right-2 bg-pink-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md">
                              <i className="fa-solid fa-check text-xs"></i>
                            </div>
                          )}
                        </div>
                        <div className="p-2 text-center bg-white">
                          <h5 className="font-light text-[10px] text-slate-700 line-clamp-1">{item.name}</h5>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="bg-white p-8 border border-slate-100 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)]">
                <div className="mb-8">
                  <h4 className="text-xs font-medium tracking-widest text-slate-500 uppercase mb-2 flex items-center gap-3"><span className="w-6 h-px bg-slate-300"></span> New Post</h4>
                  <p className="text-[10px] text-slate-400 font-light">プロデューサーへ向けて、日々の活動や感謝を投稿しましょう。</p>
                </div>

                <form onSubmit={handlePostTimeline} className="space-y-6">
                  <div>
                    <textarea value={timelineText} onChange={(e) => setTimelineText(e.target.value)} placeholder="今日はどんな一日でしたか？..." rows="4" className="w-full bg-slate-50 border border-slate-200 p-4 focus:outline-none focus:border-pink-300 transition-colors font-light text-sm resize-none"></textarea>
                  </div>
                  <div>
                    <label className="block text-[9px] font-medium tracking-widest text-slate-400 uppercase mb-2">Image URL (写真添付)</label>
                    <input type="text" value={timelineImg} onChange={(e) => setTimelineImg(e.target.value)} className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-pink-400 transition-colors font-light text-sm" placeholder="https://..." />
                  </div>
                  <div className="text-right pt-2">
                    <button type="submit" disabled={!timelineText} className="bg-pink-500 text-white text-[10px] tracking-widest font-light px-12 py-4 hover:bg-pink-600 transition-colors uppercase disabled:bg-slate-300">Post Now</button>
                  </div>
                </form>
              </div>

            </div>
          </div>
        </div>
      );
    };

    const AllIdolsView = ({ onBack, onIdolSelect, idols, idolSearchText, setIdolSearchText, idolFilterType, setIdolFilterType }) => {
      return (
        <div className="max-w-6xl mx-auto px-4 py-12 animate-fade-in">
          <button onClick={onBack} className="mb-12 text-slate-500 font-medium tracking-widest text-xs flex items-center gap-3 hover:text-pink-500 transition-colors bg-transparent border-none">
            <i className="fa-solid fa-arrow-left-long"></i> BACK TO TOP
          </button>
          <SectionTitle title="ALL IDOLS" subtitle="あいうえお順で見つける、あなたの推し" />

          <div className="bg-white/60 backdrop-blur-xl rounded-sm p-6 md:p-8 shadow-sm border border-slate-100 mb-12 max-w-4xl mx-auto">
            <div className="relative mb-8">
              <div className="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none"><i className="fa-solid fa-magnifying-glass text-slate-300"></i></div>
              <input type="text" placeholder="Search by name..." value={idolSearchText} onChange={(e) => setIdolSearchText(e.target.value)} className="w-full pl-14 py-4 bg-transparent border-b border-slate-300 focus:border-pink-300 rounded-none focus:outline-none font-light text-slate-700 placeholder-slate-300 transition-colors" />
            </div>
            <div className="flex flex-wrap gap-3 justify-center">
               {['all', 'rookie', 'pref', 'style'].map(type => (
                 <button 
                   key={type} 
                   onClick={() => setIdolFilterType(type)} 
                   className={`px-6 py-2 rounded-full text-[10px] tracking-widest font-medium transition-all ${idolFilterType === type ? 'bg-slate-800 text-white shadow-md' : 'bg-transparent text-slate-500 border border-slate-200 hover:border-slate-400'}`}
                 >
                   {type === 'all' ? 'ALL' : type === 'rookie' ? 'ROOKIE' : type === 'pref' ? 'AREA' : 'STYLE'}
                 </button>
               ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {idols.map((idol) => (
              <div key={idol.id} onClick={() => onIdolSelect(idol)} className="bg-white/80 backdrop-blur-md p-5 rounded-none border border-slate-100 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] flex items-center gap-5 cursor-pointer hover:shadow-[0_10px_30px_-10px_rgba(244,114,182,0.15)] hover:border-pink-100 transition-all duration-300 group">
                <div className="w-24 h-24 rounded-full overflow-hidden border border-slate-50 flex-shrink-0 shadow-inner bg-slate-50">
                  <MediaDisplay src={idol.profileImage} fallbackSrc={`./idol${idol.id}.png`} className="w-full h-full object-cover group-hover:scale-110 group-hover:rotate-1 transition-all duration-700" />
                </div>
                <div className="flex-1">
                  <div className="flex items-center gap-3 mb-2">
                    <h3 className="font-serif font-light text-slate-800 text-lg tracking-wide">{idol.name}</h3>
                  </div>
                  <span className="text-[9px] text-slate-400 tracking-widest uppercase border border-slate-200 px-2 py-0.5 rounded-sm inline-block mb-2">{idol.type}</span>
                  <p className="text-xs text-slate-500 line-clamp-1 italic font-light">"{idol.catchphrase}"</p>
                  <div className="flex gap-3 mt-3">
                    <span className="text-[9px] text-slate-400 tracking-wider"><i className="fa-solid fa-location-dot mr-1 text-slate-300"></i>{idol.pref}</span>
                    <span className="text-[9px] text-slate-400 tracking-wider"><i className="fa-solid fa-ribbon mr-1 text-slate-300"></i>{idol.style}</span>
                  </div>
                </div>
                <i className="fa-solid fa-chevron-right text-slate-200 group-hover:text-pink-300 transition-colors pr-2 font-light"></i>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const IdolDetailView = ({ idol, onBack, onVoteClick, onOutfitClick, onGiftClick, idolsData, onIdolSelect, onNavigate }) => {
      
      const sortedIdols = [...idolsData].sort((a, b) => (b.totalVotes || 0) - (a.totalVotes || 0));
      const currentRank = sortedIdols.findIndex(i => i.id === idol.id) + 1;
      const currentVotes = (idol.totalVotes || 0).toLocaleString();

      return (
        <div className="animate-fade-in-up pb-0">
          <div className="max-w-4xl mx-auto px-4 py-10 pb-20">
            <button onClick={onBack} className="mb-10 text-slate-400 font-medium tracking-widest text-xs flex items-center gap-3 hover:text-pink-500 transition-colors bg-transparent border-none"><i className="fa-solid fa-arrow-left-long"></i> BACK</button>
            
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-16">
              <div className="relative">
                <div className="relative rounded-none overflow-hidden bg-white shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] aspect-[3/4] p-3 md:p-4 mx-auto group border border-slate-100">
                  {idol.isStreaming && (<a href="#" className="absolute top-6 left-6 z-30 bg-white/90 backdrop-blur-md text-red-500 text-[10px] font-bold tracking-widest px-4 py-2 rounded-none shadow-lg flex items-center gap-2 animate-live border border-red-100 cursor-pointer hover:bg-red-50 transition-colors"><div className="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></div> ON AIR</a>)}
                  {idol.titleBadge && !idol.isStreaming && (<div className="absolute top-6 left-6 bg-white/90 backdrop-blur-md text-slate-800 text-[10px] font-medium tracking-widest px-4 py-2 rounded-none shadow-sm z-10 border border-slate-100">{idol.titleBadge}</div>)}
                  <div className="absolute top-6 right-6 bg-slate-900/80 backdrop-blur-md text-white text-[9px] font-light tracking-[0.2em] px-3 py-1.5 rounded-none z-10 uppercase">{idol.type}</div>
                  <div className="w-full h-full relative overflow-hidden bg-slate-50">
                    <MediaDisplay src={idol.profileImage} fallbackSrc={`./idol${idol.id}.png`} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />
                  </div>
                </div>
              </div>

              <div className="flex flex-col justify-center px-4 md:px-0">
                <div className="mb-10">
                  <p className="text-[10px] text-pink-500 tracking-[0.3em] font-medium mb-4 uppercase">{idol.style} | {idol.pref}</p>
                  <h1 className="text-4xl md:text-5xl font-light text-slate-900 mb-6 font-serif tracking-wide">{idol.name}</h1>
                  <p className="text-slate-500 font-light text-sm md:text-base leading-relaxed italic border-l border-slate-300 pl-4">"{idol.catchphrase}"</p>
                </div>
                <div className="grid grid-cols-3 gap-4 mb-10 border-y border-slate-200 py-8">
                  <div className="text-center border-r border-slate-200"><p className="text-[9px] text-slate-400 font-medium tracking-widest mb-2 uppercase">Rank</p><p className="text-2xl md:text-3xl font-light text-slate-800 font-timer">{currentRank}<span className="text-sm">th</span></p></div>
                  <div className="text-center border-r border-slate-200"><p className="text-[9px] text-slate-400 font-medium tracking-widest mb-2 uppercase">Votes</p><p className="text-2xl md:text-3xl font-light text-slate-800 font-timer">{currentVotes}</p></div>
                  <div className="text-center"><p className="text-[9px] text-slate-400 font-medium tracking-widest mb-2 uppercase">Producers</p><p className="text-2xl md:text-3xl font-light text-slate-800 font-timer">{idol.producerCount}</p></div>
                </div>
                <div className="space-y-4">
                  <button onClick={onVoteClick} className="w-full bg-slate-900 text-white py-4 md:py-5 rounded-none shadow-[0_10px_20px_-10px_rgba(0,0,0,0.3)] flex items-center justify-center gap-3 hover:bg-slate-800 transition-colors group"><i className="fa-regular fa-heart text-pink-400 group-hover:scale-110 transition-transform"></i><span className="text-xs tracking-[0.2em] font-light">VOTE FOR HER</span></button>
                  <div className="grid grid-cols-2 gap-4">
                    <button onClick={onGiftClick} className="w-full bg-white border border-slate-200 text-slate-700 py-4 rounded-none shadow-sm flex items-center justify-center gap-2 hover:border-slate-400 transition-colors group"><i className="fa-solid fa-gift text-slate-300 group-hover:text-slate-500 transition-colors"></i><span className="text-[10px] tracking-widest font-medium">GIFT & MAG</span></button>
                    <button onClick={onOutfitClick} className="w-full bg-white border border-slate-200 text-slate-700 py-4 rounded-none shadow-sm flex items-center justify-center gap-2 hover:border-slate-400 transition-colors group"><i className="fa-solid fa-shirt text-slate-300 group-hover:text-slate-500 transition-colors"></i><span className="text-[10px] tracking-widest font-medium">OUTFIT</span></button>
                  </div>
                </div>
              </div>
            </div>
            
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-16">
              <div className="lg:col-span-2 space-y-8">
                <div className="bg-white/80 backdrop-blur-xl rounded-none p-8 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)] border border-slate-100">
                  <h3 className="text-sm font-medium tracking-widest text-slate-400 mb-6 uppercase flex items-center gap-3"><span className="w-8 h-px bg-slate-300"></span> Profile</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
