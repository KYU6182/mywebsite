<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もしも私が、アイドルになったら。 | 公式ポータルサイト</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome (アイコン用) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (ブラウザ内でJSXを変換) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap');
    
    body { font-family: sans-serif; }
    .font-serif { font-family: 'Noto Serif JP', serif; }
    
    /* アニメーション設定 */
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.5s ease-out; }
    .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
  </style>
</head>
<body class="antialiased bg-pink-50 selection:bg-pink-200 selection:text-pink-900 text-gray-800">

  <!-- Reactアプリのマウントポイント -->
  <div id="root"></div>

  <!-- アプリケーションのコード -->
  <script type="text/babel" data-type="module">
    // --- Firebase 連携 (ES Modules) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const { useState, useEffect } = React;

    // あなたのFirebaseプロジェクト設定
    const firebaseConfig = {
      apiKey: "AIzaSyB0xE7nrbyOgLxpSWskTaT0G5FDyVWSDQc",
      authDomain: "moshiai-5735b.firebaseapp.com",
      projectId: "moshiai-5735b",
      storageBucket: "moshiai-5735b.firebasestorage.app",
      messagingSenderId: "347806317602",
      appId: "1:347806317602:web:d25481c7dd1376aa20de7b"
    };

    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'moshiai-default-app'; // DBのパス用

    // --- モックデータ ---
    const IDOLS = [
      { id: 1, name: "星野 きらら", type: "初代グランプリ", issue: "第1号掲載", isOffMelty: true, catchphrase: "笑顔でみんなを照らしたい！", color: "from-pink-300 to-rose-300" },
      { id: 2, name: "月見 結衣", type: "レギュラーモデル", issue: "第1号・第2号", isOffMelty: false, catchphrase: "月明かりのような癒やしを。", color: "from-purple-300 to-indigo-300" },
      { id: 3, name: "桜井 ひな", type: "第2号グランプリ", issue: "第2号掲載", isOffMelty: true, catchphrase: "満開の笑顔をお届けします🌸", color: "from-rose-300 to-orange-300" },
      { id: 4, name: "水瀬 あい", type: "読者特別賞", issue: "第1号掲載", isOffMelty: false, catchphrase: "水のように透明な心を大切に。", color: "from-cyan-300 to-blue-300" },
      { id: 5, name: "天音 くるみ", type: "期待の新人", issue: "第3号掲載予定", isOffMelty: false, catchphrase: "音楽の魔法でみんなをハッピーに♪", color: "from-emerald-300 to-teal-300" },
      { id: 6, name: "姫宮 りあ", type: "注目株", issue: "第3号掲載予定", isOffMelty: true, catchphrase: "お姫様になりたいな👑", color: "from-fuchsia-300 to-pink-300" },
    ];

    const MAGAZINES = [
      { id: 3, issue: "第3号 (最新号)", title: "夏色アイドル宣言！", coverModel: "投票で決定！", status: "投票受付中" },
      { id: 2, issue: "第2号", title: "キラキラ輝く、私の原石", coverModel: "桜井 ひな", status: "発売中" },
      { id: 1, issue: "第1号", title: "あなたの新しい物語のスタート", coverModel: "星野 きらら", status: "発売中" },
    ];

    const RANKING = [
      { rank: 1, idolId: 5, name: "天音 くるみ", votes: "12,450" },
      { rank: 2, idolId: 6, name: "姫宮 りあ", votes: "11,200" },
      { rank: 3, idolId: 4, name: "水瀬 あい", votes: "10,800" },
    ];

    // --- 共通コンポーネント ---
    const SectionTitle = ({ title, subtitle, iconClass }) => (
      <div className="text-center mb-10">
        <div className="flex justify-center items-center gap-2 mb-2 text-pink-500">
          <i className="fa-solid fa-wand-magic-sparkles text-lg"></i>
          {iconClass && <i className={`${iconClass} text-2xl`}></i>}
          <i className="fa-solid fa-wand-magic-sparkles text-lg"></i>
        </div>
        <h2 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-purple-500 font-serif tracking-wide">
          {title}
        </h2>
        {subtitle && <p className="text-gray-500 mt-2 text-sm md:text-base">{subtitle}</p>}
      </div>
    );

    const MockImage = ({ text, className, bgClass = "bg-gray-100", iconClass }) => (
      <div className={`flex flex-col items-center justify-center text-gray-400 overflow-hidden relative ${bgClass} ${className}`}>
        <div className="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
        <i className={`${iconClass || 'fa-solid fa-camera'} text-4xl mb-2 drop-shadow-sm`}></i>
        <span className="text-xs md:text-sm font-medium z-10 px-4 text-center text-gray-600 drop-shadow-sm">{text}</span>
      </div>
    );

    // --- キャストマイページ コンポーネント ---
    const MyPageView = ({ currentUser }) => {
      const [loading, setLoading] = useState(true);
      const [isEditing, setIsEditing] = useState(false);
      
      const [profile, setProfile] = useState({
        name: '白鳥 ゆな',
        catchphrase: 'いつも応援ありがとう！今日も1日がんばろう♡',
        photoUrl: '',
        entryNo: '084'
      });
      
      const [editForm, setEditForm] = useState(profile);
      const [userPoints, setUserPoints] = useState(4800);
      const [missions, setMissions] = useState([
        { id: 1, title: "今日の自撮りを1枚投稿する", points: 10, completed: false },
        { id: 2, title: "ファンからのコメントに3件返信", points: 30, completed: false },
        { id: 3, title: "Twitterでハッシュタグ投稿", points: 20, completed: false },
        { id: 4, title: "プロフィールを充実させる", points: 50, completed: true },
      ]);

      // Firebaseデータ取得
      useEffect(() => {
        if (!currentUser) return;
        const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profileData', 'main');
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            setProfile(data);
            setEditForm(data);
          } else {
            setDoc(docRef, profile).catch(console.error);
          }
          setLoading(false);
        }, (error) => {
          console.error("Firestore Error:", error);
          setLoading(false);
        });
        return () => unsubscribe();
      }, [currentUser]);

      const handleSaveProfile = async () => {
        if (!currentUser) return;
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profileData', 'main');
          await setDoc(docRef, editForm, { merge: true });
          setIsEditing(false);
        } catch (error) {
          console.error("Error saving profile:", error);
        }
      };

      const handleToggleMission = (id, points) => {
        setMissions(missions.map(m => {
          if (m.id === id) {
            setUserPoints(prev => m.completed ? prev - points : prev + points);
            return { ...m, completed: !m.completed };
          }
          return m;
        }));
      };

      const currentRank = 12;
      const pointsToNextRank = 1200;

      return (
        <div className="max-w-4xl mx-auto px-4 py-10 animate-fade-in">
          
          {/* プロフィールヘッダー */}
          <div className="bg-white rounded-3xl p-6 shadow-sm border border-pink-100 mb-8 flex flex-col md:flex-row items-center gap-6 relative overflow-hidden min-h-[160px]">
            <div className="absolute -right-10 -top-10 w-40 h-40 bg-pink-50 rounded-full mix-blend-multiply opacity-50"></div>
            
            <div className="absolute top-4 right-4 z-20">
              {!isEditing && !loading && (
                <button onClick={() => setIsEditing(true)} className="flex items-center gap-1 text-xs font-bold text-gray-500 hover:text-pink-500 transition-colors bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200">
                  <i className="fa-solid fa-pen text-xs"></i> プロフィール編集
                </button>
              )}
            </div>

            {loading ? (
              <div className="animate-pulse w-full flex items-center gap-6">
                <div className="w-24 h-24 bg-gray-200 rounded-full shrink-0"></div>
                <div className="flex-1 space-y-3">
                   <div className="h-4 bg-gray-200 w-24 rounded"></div>
                   <div className="h-6 bg-gray-200 w-48 rounded"></div>
                   <div className="h-4 bg-gray-200 w-full max-w-sm rounded"></div>
                </div>
              </div>
            ) : isEditing ? (
              <div className="w-full flex flex-col md:flex-row gap-6 z-10 bg-white/90 p-2 md:p-4 rounded-2xl backdrop-blur-sm">
                <div className="flex flex-col items-center gap-3 shrink-0">
                   <div className="w-24 h-24 rounded-full border-4 border-pink-100 overflow-hidden relative bg-gray-50 flex items-center justify-center shadow-inner">
                      {editForm.photoUrl ? (
                        <img src={editForm.photoUrl} alt="Preview" className="w-full h-full object-cover" />
                      ) : (
                        <i className="fa-solid fa-camera text-3xl text-gray-300"></i>
                      )}
                   </div>
                   <div className="w-full max-w-[180px] relative">
                     <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                       <i className="fa-solid fa-image text-sm text-gray-400"></i>
                     </div>
                     <input type="text" value={editForm.photoUrl || ''} onChange={(e) => setEditForm({...editForm, photoUrl: e.target.value})} placeholder="画像のURLを入力..." className="w-full text-xs pl-8 pr-2 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-gray-50 hover:bg-white" />
                   </div>
                </div>

                <div className="flex-1 flex flex-col gap-3">
                  <div>
                    <label className="text-xs font-bold text-gray-500 mb-1 block">お名前 (ニックネーム)</label>
                    <input type="text" value={editForm.name || ''} onChange={(e) => setEditForm({...editForm, name: e.target.value})} className="w-full md:w-1/2 font-bold text-gray-800 px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-gray-50 hover:bg-white" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-500 mb-1 block">キャッチフレーズ・ひとこと</label>
                    <textarea value={editForm.catchphrase || ''} onChange={(e) => setEditForm({...editForm, catchphrase: e.target.value})} rows="2" className="w-full text-sm text-gray-700 px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 resize-none bg-gray-50 hover:bg-white" />
                  </div>
                  <div className="flex justify-end gap-2 mt-2 pt-2 border-t border-gray-100">
                    <button onClick={() => {setEditForm(profile); setIsEditing(false);}} className="px-4 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-100 rounded-xl">キャンセル</button>
                    <button onClick={handleSaveProfile} className="px-6 py-2.5 text-sm font-bold text-white bg-pink-500 hover:bg-pink-600 rounded-xl flex items-center gap-1.5 shadow-md shadow-pink-200">
                      <i className="fa-solid fa-floppy-disk text-sm"></i> 保存する
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <>
                <div className="w-24 h-24 rounded-full border-4 border-pink-100 shadow-md shrink-0 overflow-hidden bg-gradient-to-tr from-pink-200 to-purple-200 flex items-center justify-center">
                  {profile.photoUrl ? (
                    <img src={profile.photoUrl} alt="Profile" className="w-full h-full object-cover" />
                  ) : (
                    <span className="text-xs font-medium px-2 text-center text-gray-600 drop-shadow-sm">[自撮り未設定]</span>
                  )}
                </div>
                <div className="flex-1 text-center md:text-left z-10">
                  <div className="inline-block bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full mb-2">エントリーNo. {profile.entryNo}</div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-1">{profile.name} <span className="text-lg font-normal text-gray-500">ちゃん</span></h2>
                  <p className="text-sm text-gray-500 whitespace-pre-wrap">{profile.catchphrase}</p>
                </div>
                
                <div className="flex gap-4 w-full md:w-auto z-10">
                  <div className="flex-1 md:w-32 bg-gray-50 p-4 rounded-2xl text-center border border-gray-100">
                    <p className="text-xs text-gray-500 font-bold mb-1">現在の順位</p>
                    <p className="text-3xl font-bold text-pink-500">{currentRank}<span className="text-sm text-gray-500 ml-1">位</span></p>
                  </div>
                  <div className="flex-1 md:w-32 bg-gray-50 p-4 rounded-2xl text-center border border-gray-100">
                    <p className="text-xs text-gray-500 font-bold mb-1">獲得ポイント</p>
                    <p className="text-2xl font-bold text-purple-500 mt-1">{userPoints.toLocaleString()}<span className="text-xs text-gray-500 ml-1">pt</span></p>
                  </div>
                </div>
              </>
            )}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {/* ミッション機能 */}
            <div className="space-y-6">
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-pink-100 h-full">
                <div className="flex items-center gap-2 mb-6 border-b border-gray-100 pb-4">
                  <i className="fa-solid fa-bullseye text-xl text-pink-500"></i>
                  <h3 className="text-lg font-bold text-gray-800">今日のミッション</h3>
                  <span className="ml-auto text-xs bg-pink-50 text-pink-500 px-2 py-1 rounded-md font-bold">毎日24時リセット</span>
                </div>
                <div className="space-y-3">
                  {missions.map(mission => (
                    <div key={mission.id} onClick={() => handleToggleMission(mission.id, mission.points)} className={`flex items-center justify-between p-4 rounded-xl border-2 transition-all cursor-pointer select-none group ${mission.completed ? 'bg-gray-50 border-transparent opacity-60' : 'bg-white border-pink-100 hover:border-pink-300 shadow-sm'}`}>
                      <div className="flex items-center gap-3">
                        <button className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors ${mission.completed ? 'bg-pink-500 border-pink-500' : 'border-gray-300 group-hover:border-pink-400'}`}>
                           {mission.completed && <i className="fa-solid fa-check text-sm text-white"></i>}
                        </button>
                        <span className={`font-medium text-sm md:text-base ${mission.completed ? 'text-gray-500 line-through' : 'text-gray-800'}`}>{mission.title}</span>
                      </div>
                      <div className={`flex items-center gap-1 font-bold shrink-0 ${mission.completed ? 'text-gray-400' : 'text-pink-500'}`}>
                        <span className="text-xs border px-2 py-0.5 rounded-full border-current">+{mission.points} pt</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* 掲載シミュレーター */}
            <div className="space-y-6">
              <div className="bg-gradient-to-br from-gray-50 to-pink-50 rounded-3xl p-6 shadow-sm border border-pink-100 relative overflow-hidden h-full">
                <div className="flex items-center justify-between mb-6 relative z-10">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-columns text-xl text-purple-500"></i>
                    <h3 className="text-lg font-bold text-gray-800">掲載シミュレーター</h3>
                  </div>
                </div>

                <p className="text-sm text-gray-600 mb-4 z-10 relative">
                  もし今、雑誌が発売されたら…<br/>あなたは<span className="font-bold text-pink-500 px-1">1/4ページサイズ</span>で掲載されます！
                </p>

                <div className="overflow-x-auto pb-4 -mx-2 px-2">
                  <div className="flex gap-4 min-w-max mx-auto justify-center bg-gray-200/50 p-6 rounded-2xl">
                    <div className="w-40 h-56 bg-white shadow-md flex flex-col p-1.5 gap-1.5 relative">
                      <div className="absolute -left-2 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]" style={{writingMode: 'vertical-rl'}}>左ページ</div>
                      <div className="flex-1 bg-gray-50 border border-gray-100 rounded flex items-center justify-center text-[10px] text-gray-400">10位 (1/4P)</div>
                      <div className="flex-1 bg-gray-50 border border-gray-100 rounded flex items-center justify-center text-[10px] text-gray-400">11位 (1/4P)</div>
                      <div className="flex-1 bg-pink-50 border-2 border-pink-400 rounded flex flex-col items-center justify-center text-[10px] text-pink-600 font-bold relative shadow-inner overflow-hidden">
                        <div className="absolute inset-0 bg-pink-400 opacity-10 animate-pulse"></div>
                        <i className="fa-solid fa-wand-magic-sparkles text-sm text-pink-500 mb-0.5"></i> 現在のあなた
                        <span className="font-normal text-[9px] mt-0.5">12位 (1/4P)</span>
                      </div>
                      <div className="flex-1 bg-gray-50 border border-gray-100 rounded flex items-center justify-center text-[10px] text-gray-400">13位 (1/4P)</div>
                    </div>
                    <div className="w-40 h-56 bg-white shadow-md flex flex-col p-1.5 gap-1.5 relative">
                      <div className="absolute -right-2 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]" style={{writingMode: 'vertical-rl'}}>右ページ</div>
                      <div className="flex-1 bg-gradient-to-br from-yellow-50 to-orange-50 border border-yellow-200 rounded flex flex-col items-center justify-center text-xs text-yellow-600 font-bold shadow-sm relative overflow-hidden group cursor-pointer hover:shadow-md transition-shadow">
                        <i className="fa-solid fa-arrow-trend-up text-lg mb-1 group-hover:-translate-y-1 transition-transform"></i> 次の目標枠！
                        <span className="font-normal text-[10px] mt-1 text-yellow-700">8位・9位 (1/2P)</span>
                      </div>
                      <div className="flex-1 bg-gray-50 border border-gray-100 rounded flex items-center justify-center text-[10px] text-gray-400">6位・7位 (1/2P)</div>
                    </div>
                  </div>
                </div>

                <div className="mt-4 bg-white p-4 rounded-2xl shadow-sm border border-pink-50 relative z-10">
                  <div className="flex justify-between text-xs font-bold mb-2">
                    <span className="text-gray-500">現在: 1/4ページ枠</span>
                    <span className="text-yellow-600 flex items-center gap-1"><i className="fa-solid fa-crown text-xs"></i> 目標: 1/2ページ枠</span>
                  </div>
                  <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden mb-2">
                    <div className="h-full bg-gradient-to-r from-pink-400 to-purple-500 w-[70%] rounded-full relative">
                      <div className="absolute right-0 top-0 bottom-0 w-4 bg-white/30 animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
                    </div>
                  </div>
                  <p className="text-center text-xs text-gray-500">
                    ランクアップ圏内まであと <span className="text-pink-500 font-bold text-base">{pointsToNextRank.toLocaleString()}</span> pt！
                  </p>
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    };


    // --- メインアプリケーション ---
    function App() {
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [activeTab, setActiveTab] = useState('home'); 
      const [currentUser, setCurrentUser] = useState(null);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (error) {
            console.error("Authentication Error:", error);
          }
        };
        initAuth();
        
        const unsubscribe = onAuthStateChanged(auth, setCurrentUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollTo = (id) => {
        setIsMenuOpen(false);
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const toggleMode = () => {
        setActiveTab(prev => prev === 'home' ? 'mypage' : 'home');
        setIsMenuOpen(false);
        window.scrollTo(0, 0);
      };

      return (
        <div className="pb-24">
          
          <header className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-2' : 'bg-transparent py-4'}`}>
            <div className="max-w-6xl mx-auto px-4 flex justify-between items-center">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => {setActiveTab('home'); window.scrollTo(0,0);}}>
                <img src="./logo.png" alt="もしアイ" className="h-8 md:h-10 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                <span style={{display: 'none'}} className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-purple-500 font-serif">
                  <i className="fa-solid fa-heart text-2xl text-pink-500 animate-pulse mr-2"></i>もしアイ
                </span>
              </div>

              <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-gray-600">
                {activeTab === 'home' && ['HOME', 'NEWS', 'RANKING', 'IDOL LIST', 'MAGAZINE'].map((item) => (
                  <button key={item} onClick={() => scrollTo(item.toLowerCase().replace(' ', '-'))} className="hover:text-pink-500 transition-colors relative group">
                    {item}
                    <span className="absolute -bottom-1 left-0 w-0 h-0.5 bg-pink-400 transition-all group-hover:w-full"></span>
                  </button>
                ))}
                
                <button onClick={toggleMode} className={`ml-4 px-4 py-2 rounded-full font-bold flex items-center gap-2 transition-transform transform hover:scale-105 border ${activeTab === 'home' ? 'bg-white text-pink-500 border-pink-200 shadow-sm' : 'bg-gray-800 text-white border-gray-800 shadow-md'}`}>
                  {activeTab === 'home' ? <><i className="fa-solid fa-user text-sm"></i> キャストログイン</> : <><i className="fa-solid fa-arrow-up-right-from-square text-sm"></i> ファン向けサイトへ</>}
                </button>
              </nav>

              <button className="md:hidden text-gray-600 p-2" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                {isMenuOpen ? <i className="fa-solid fa-xmark text-2xl"></i> : <i className="fa-solid fa-bars text-2xl"></i>}
              </button>
            </div>
          </header>

          {isMenuOpen && (
            <div className="fixed inset-0 z-40 bg-white/95 backdrop-blur-sm pt-24 px-6 flex flex-col gap-6 md:hidden">
                <button onClick={toggleMode} className={`w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 mb-4 border ${activeTab === 'home' ? 'bg-pink-50 text-pink-600 border-pink-200' : 'bg-gray-900 text-white border-gray-800'}`}>
                  {activeTab === 'home' ? <><i className="fa-solid fa-user text-lg"></i> キャスト専用マイページへ</> : <><i className="fa-solid fa-arrow-up-right-from-square text-lg"></i> ファン向けサイトへ戻る</>}
                </button>

                {activeTab === 'home' && ['HOME', 'NEWS', 'RANKING', 'IDOL LIST', 'MAGAZINE'].map((item) => (
                  <button key={item} onClick={() => scrollTo(item.toLowerCase().replace(' ', '-'))} className="text-xl font-bold text-gray-700 text-left border-b border-pink-100 pb-4 flex justify-between items-center">
                    {item}
                    <i className="fa-solid fa-chevron-right text-lg text-pink-300"></i>
                  </button>
                ))}
            </div>
          )}

          <main className="pt-16">
            {activeTab === 'mypage' ? (
              <MyPageView currentUser={currentUser} />
            ) : (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                {/* HERO SECTION */}
                <section id="home" className="py-10 md:py-20 relative">
                  <div className="absolute top-10 left-10 text-pink-300/50 animate-bounce"><i className="fa-solid fa-star text-4xl"></i></div>
                  <div className="absolute bottom-10 right-10 text-purple-300/50 animate-pulse"><i className="fa-solid fa-wand-magic-sparkles text-4xl"></i></div>
                  
                  <div className="flex flex-col md:flex-row items-center gap-10">
                    <div className="flex-1 space-y-6 text-center md:text-left z-10">
                      <span className="inline-block py-1 px-3 rounded-full bg-pink-100 text-pink-600 text-sm font-bold tracking-widest mb-2 border border-pink-200 shadow-sm">あなたのスマホから始まる</span>
                      
                      {/* --- 画像・テキスト切り替え部分 --- */}
                      <img src="./top.png" alt="もしも私が、アイドルになったら。" className="w-full max-w-xl mx-auto md:mx-0 object-contain drop-shadow-md" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                      <div style={{display: 'none'}} className="space-y-6">
                        <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold font-serif leading-tight">
                          もしも私が、<br /><span className="bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">アイドルになったら。</span>
                        </h1>
                        <p className="text-gray-600 text-lg md:text-xl leading-relaxed">
                          自撮り1枚から始まった物語。<br className="hidden md:block"/>普通の女の子だった彼女たちが、今、ここで輝いています。<br/>次は、あなたの推しを見つける番。
                        </p>
                      </div>

                      <div className="pt-4 flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                        <button onClick={() => scrollTo('ranking')} className="bg-pink-500 hover:bg-pink-600 text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-pink-500/30 transition-transform transform hover:scale-105 flex items-center justify-center gap-2">
                          <i className="fa-solid fa-crown text-xl"></i> 投票して応援する
                        </button>
                        <button onClick={() => scrollTo('idol-list')} className="bg-white hover:bg-gray-50 text-pink-600 px-8 py-3 rounded-full font-bold shadow-md transition-transform transform hover:scale-105 flex items-center justify-center gap-2 border border-pink-100">
                          <i className="fa-solid fa-users text-xl"></i> アイドルを探す
                        </button>
                      </div>
                    </div>
                    
                    <div className="flex-1 w-full max-w-md mx-auto relative">
                      <div className="absolute inset-0 bg-gradient-to-tr from-pink-300 to-purple-300 rounded-[3rem] rotate-3 opacity-30 blur-lg"></div>
                      <div className="relative bg-white p-2 rounded-[3rem] shadow-xl border border-pink-100">
                          <MockImage text="[初代グランプリの笑顔のポートレート]" className="h-96 md:h-[32rem] rounded-[2.5rem]" bgClass="bg-gradient-to-br from-pink-100 to-purple-100" iconClass="fa-solid fa-heart text-pink-300" />
                          <div className="absolute bottom-6 left-6 right-6 bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-lg">
                            <div className="flex items-center gap-3">
                              <div className="w-12 h-12 rounded-full bg-pink-200 flex items-center justify-center text-pink-600 font-bold">1st</div>
                              <div>
                                <p className="text-xs text-pink-500 font-bold">初代グランプリ</p>
                                <p className="font-bold text-gray-800 text-lg">星野 きらら</p>
                              </div>
                            </div>
                          </div>
                      </div>
                    </div>
                  </div>
                </section>

                {/* NEWS SECTION */}
                <section id="news" className="py-12">
                  <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-pink-100">
                    <h3 className="flex items-center gap-2 font-bold text-xl text-gray-800 mb-6 border-b border-pink-50 pb-4">
                      <i className="fa-solid fa-tower-broadcast text-xl text-pink-500"></i> NEWS & TOPICS
                    </h3>
                    <ul className="space-y-4">
                      {[
                        { date: "2026.03.01", label: "MAGAZINE", text: "第3号の表紙モデル投票がスタートしました！" },
                        { date: "2026.02.25", label: "OFF-MELTY", text: "公式モデルによる春の新作スナップを公開しました。" },
                        { date: "2026.02.10", label: "INFO", text: "次世代アイドルの新規エントリー受付を再開しました！" }
                      ].map((news, i) => (
                        <li key={i} className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 hover:bg-pink-50 p-2 rounded-lg transition-colors cursor-pointer group">
                          <div className="flex items-center gap-3 w-48 shrink-0">
                            <span className="text-sm text-gray-400 font-mono">{news.date}</span>
                            <span className="text-xs font-bold px-2 py-1 bg-pink-100 text-pink-600 rounded-md">{news.label}</span>
                          </div>
                          <p className="text-gray-700 text-sm md:text-base group-hover:text-pink-600 transition-colors">{news.text}</p>
                        </li>
                      ))}
                    </ul>
                  </div>
                </section>

                {/* RANKING SECTION */}
                <section id="ranking" className="py-16">
                  <SectionTitle title="CURRENT RANKING" subtitle="応援して表紙モデルを決めよう！第3号表紙争奪戦" iconClass="fa-solid fa-trophy" />
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto">
                    {RANKING.map((item, index) => (
                      <div key={index} className={`relative bg-white rounded-3xl p-1 shadow-lg border-2 ${index === 0 ? 'border-yellow-300 md:-translate-y-4' : index === 1 ? 'border-gray-300' : 'border-orange-200'}`}>
                        <div className={`absolute -top-5 left-1/2 -translate-x-1/2 w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl text-white shadow-md z-10 ${index === 0 ? 'bg-gradient-to-b from-yellow-300 to-yellow-500' : index === 1 ? 'bg-gradient-to-b from-gray-300 to-gray-500' : 'bg-gradient-to-b from-orange-300 to-orange-500'}`}>
                          {item.rank}
                        </div>
                        <div className="bg-white rounded-[1.3rem] overflow-hidden p-4 pt-8 h-full flex flex-col items-center text-center">
                          <MockImage text={`[${item.name}]`} className="w-24 h-24 rounded-full mb-4 shadow-inner" bgClass={`bg-gradient-to-tr ${IDOLS.find(i => i.id === item.idolId)?.color}`} />
                          <h4 className="font-bold text-lg mb-1">{item.name}</h4>
                          <p className="text-sm text-gray-500 mb-4 font-mono font-medium">{item.votes} pt</p>
                          <button className={`mt-auto w-full py-2 rounded-xl font-bold text-sm transition-colors ${index === 0 ? 'bg-yellow-50 text-yellow-700 hover:bg-yellow-100' : 'bg-pink-50 text-pink-600 hover:bg-pink-100'}`}>投票する</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* IDOL LIST SECTION */}
                <section id="idol-list" className="py-16">
                  <SectionTitle title="IDOL LIST" subtitle="雑誌デビューから表紙まで、夢を叶えたアイドルたち" iconClass="fa-solid fa-users" />
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8">
                    {IDOLS.map((idol) => (
                      <div key={idol.id} className="group cursor-pointer">
                        <div className="relative overflow-hidden rounded-3xl mb-3 shadow-sm group-hover:shadow-xl transition-all duration-300">
                          <MockImage text={`[${idol.name}]`} className="w-full aspect-[4/5] transition-transform duration-500 group-hover:scale-105" bgClass={`bg-gradient-to-br ${idol.color}`} />
                          <div className="absolute top-2 left-2 flex flex-col gap-1 items-start">
                            <span className="bg-black/50 backdrop-blur-sm text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded-full border border-white/20">{idol.type}</span>
                            {idol.isOffMelty && <span className="bg-pink-500/80 backdrop-blur-sm text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded-full border border-pink-300/50">Off-Melty公式</span>}
                          </div>
                        </div>
                        <div className="px-1">
                          <p className="text-xs text-pink-500 font-bold mb-0.5">{idol.issue}</p>
                          <h4 className="font-bold text-gray-800 text-lg md:text-xl mb-1">{idol.name}</h4>
                          <p className="text-xs text-gray-500 line-clamp-1">{idol.catchphrase}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* MAGAZINE SECTION */}
                <section id="magazine" className="py-16 bg-white/50 rounded-[3rem] p-4 md:p-10 border border-white shadow-xl my-10 relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-64 h-64 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
                  <div className="absolute bottom-0 left-0 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
                  
                  <SectionTitle title="MAGAZINE ARCHIVE" subtitle="あなたが主役の誌面体験。これまでに発売された雑誌たち" iconClass="fa-solid fa-book-open" />
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 relative z-10">
                    {MAGAZINES.map((mag) => (
                      <div key={mag.id} className="flex flex-col items-center group">
                        <div className="relative w-4/5 md:w-full aspect-[3/4] bg-white rounded-md shadow-lg border-l-4 border-gray-100 p-2 transform transition-transform duration-300 group-hover:-translate-y-2 group-hover:rotate-1">
                          <MockImage text={`[表紙: ${mag.title}]`} className="w-full h-full rounded shadow-inner" bgClass="bg-gradient-to-b from-gray-50 to-gray-200" />
                          <div className="absolute top-4 left-0 bg-pink-500 text-white text-xs font-bold py-1 px-3 rounded-r-full shadow-md">{mag.issue}</div>
                        </div>
                        <div className="text-center mt-6">
                          <span className={`text-xs font-bold px-2 py-1 rounded-full ${mag.status === '発売中' ? 'bg-gray-100 text-gray-600' : 'bg-pink-100 text-pink-600'}`}>{mag.status}</span>
                          <h4 className="font-bold text-lg mt-2 text-gray-800">{mag.title}</h4>
                          <p className="text-sm text-gray-500 mt-1">表紙: {mag.coverModel}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}
          </main>

          <footer className="bg-gray-900 text-white pt-16 pb-32 md:pb-16 mt-20 rounded-t-[3rem]">
            <div className="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-10 text-center md:text-left">
              <div>
                <div className="flex items-center justify-center md:justify-start gap-2 mb-4">
                  <img src="./logo.png" alt="もしアイ" className="h-8 md:h-10 object-contain bg-white/80 p-1 rounded-lg" onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='block'; }} />
                  <span style={{display: 'none'}} className="text-2xl font-bold font-serif">
                    <i className="fa-solid fa-heart text-2xl text-pink-400 mr-2"></i>もしアイ
                  </span>
                </div>
                <p className="text-gray-400 text-sm leading-relaxed mb-6">
                  もしも私が、アイドルになったら。<br />あなたのスマホから始まる、新しい物語。
                </p>
              </div>
              <div>
                <h4 className="font-bold text-lg mb-4 border-b border-gray-800 pb-2">CONTENTS</h4>
                <ul className="space-y-2 text-sm text-gray-400">
                  <li><button onClick={() => {setActiveTab('home'); setTimeout(()=>scrollTo('home'),100);}} className="hover:text-pink-400">ホーム</button></li>
                  <li><button onClick={toggleMode} className="text-pink-400 hover:text-pink-300 font-bold">▶ キャスト用マイページ</button></li>
                </ul>
              </div>
              <div>
                <h4 className="font-bold text-lg mb-4 border-b border-gray-800 pb-2">ABOUT</h4>
                <ul className="space-y-2 text-sm text-gray-400">
                  <li><a href="#" className="hover:text-pink-400">よくある質問 (Q&A)</a></li>
                  <li><a href="#" className="hover:text-pink-400">運営事務局・お問い合わせ</a></li>
                </ul>
              </div>
            </div>
            <div className="max-w-5xl mx-auto px-6 mt-12 pt-6 border-t border-gray-800 text-center text-xs text-gray-500">
              &copy; 2026 もしも私が、アイドルになったら。運営事務局 All Rights Reserved.
            </div>
          </footer>

          {activeTab === 'home' && (
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t border-gray-100 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-50 md:flex md:justify-center animate-fade-in-up">
              <div className="max-w-md w-full mx-auto md:mx-0 flex items-center gap-3">
                <div className="hidden md:block text-sm font-bold text-gray-600 mr-4">次世代アイドル<br/>エントリー受付中！</div>
                <button className="flex-1 bg-[#06C755] hover:bg-[#05b34c] text-white py-3.5 px-6 rounded-full font-bold text-lg shadow-lg shadow-[#06C755]/30 transition-transform transform hover:scale-[1.02] flex items-center justify-center gap-2 relative overflow-hidden group">
                  <span className="absolute inset-0 w-full h-full bg-white/20 group-hover:scale-x-100 origin-left scale-x-0 transition-transform duration-300 ease-out"></span>
                  <i className="fa-brands fa-line text-2xl"></i> LINEで無料エントリー！
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Reactのマウント ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
